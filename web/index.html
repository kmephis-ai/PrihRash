<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f4">
  <meta name="description" content="PrihRash — семейные финансы">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>PrihRash</title>
</head>
<body>
  <header class="app-header"><div><span class="eyebrow">PrihRash</span><h1>Операции</h1></div><button class="add" disabled aria-label="Добавить операцию">＋</button></header>
  <main><section class="panel">
    <div class="section-head"><h2>Последние операции</h2><span>Только чтение</span></div>
    <div class="filters" aria-label="Фильтры операций">
      <label class="filter-field"><span>Тип</span><select data-filter-type><option value="">Все типы</option><option value="EXPENSE">Расход</option><option value="INCOME">Доход</option><option value="TRANSFER">Перевод</option></select></label>
      <label class="filter-field"><span>Статус</span><select data-filter-status><option value="">Все статусы</option><option value="POSTED">Проведено</option><option value="VOIDED">Аннулировано</option></select></label>
      <button class="filter-reset" type="button" data-reset-filters hidden>Сбросить</button>
    </div>
    <p data-sync-state class="sync-state" aria-live="polite"></p><p data-state class="state">Загрузка…</p><div data-operations class="operations"></div><div class="pagination"><button class="load-more" type="button" data-load-more hidden>Загрузить ещё</button><span class="page-state" data-page-state aria-live="polite"></span></div>
  </section></main>
  <nav class="bottom-nav" aria-label="Основная навигация"><a href="#home">Главная</a><a class="active" href="#operations">Операции</a><a href="#analytics">Аналитика</a><a href="#more">Ещё</a></nav>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
