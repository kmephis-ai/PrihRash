<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f4">
  <meta name="description" content="PrihRash — семейные финансы">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <title>PrihRash</title>
</head>
<body>
  <header class="app-header"><div><span class="eyebrow">PrihRash</span><h1>Операции</h1></div></header>
  <main><section class="panel">
    <div class="section-head"><h2>Последние операции</h2><div class="section-actions"><span>Только чтение</span><button class="refresh-reader" type="button" data-refresh-reader>Обновить</button></div></div>
    <div class="filters" aria-label="Фильтры операций">
      <label class="filter-field"><span>Тип</span><select data-filter-type><option value="">Все типы</option><option value="EXPENSE">Расход</option><option value="INCOME">Доход</option><option value="TRANSFER">Перевод</option></select></label>
      <label class="filter-field"><span>Статус</span><select data-filter-status><option value="">Все статусы</option><option value="POSTED">Проведено</option><option value="VOIDED">Аннулировано</option></select></label>
      <label class="filter-field"><span>Счёт</span><select data-filter-account disabled><option value="">Все счета</option></select></label>
      <label class="filter-field"><span>Категория</span><select data-filter-category disabled><option value="">Все категории</option></select></label>
      <button class="filter-reset" type="button" data-reset-filters hidden>Сбросить</button>
      <span class="filter-options-state" data-filter-options-state aria-live="polite"></span>
    </div>
    <p data-shadow-sync-status class="shadow-sync-status" aria-live="polite">Синхронизация: проверяем…</p><p data-sync-state class="sync-state" aria-live="polite"></p><p data-state class="state">Загрузка…</p>
    <div data-operations-cards class="operations operations--cards"></div>
    <div class="operations-table-wrap">
      <table class="operations-table">
        <caption class="visually-hidden">Последние операции</caption>
        <thead><tr><th scope="col">Дата</th><th scope="col">Операция</th><th scope="col">Тип</th><th scope="col">Контекст</th><th scope="col">Сумма</th><th scope="col">Качество</th></tr></thead>
        <tbody data-operations-table></tbody>
      </table>
    </div>
    <div class="pagination"><button class="load-more" type="button" data-load-more hidden>Загрузить ещё</button><span class="page-state" data-page-state aria-live="polite"></span></div>
  </section></main>
  <nav class="bottom-nav" aria-label="Основная навигация"><span class="nav-item nav-item--future" aria-disabled="true" aria-label="Главная — скоро">Главная</span><a class="nav-item active" href="#operations" aria-current="page">Операции</a><span class="nav-item nav-item--future" aria-disabled="true" aria-label="Аналитика — скоро">Аналитика</span><span class="nav-item nav-item--future" aria-disabled="true" aria-label="Ещё — скоро">Ещё</span></nav>
  <script type="module" src="/app.mjs"></script>
</body>
</html>
