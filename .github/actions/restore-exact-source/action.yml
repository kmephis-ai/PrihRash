name: Restore exact-source artifact
description: Restore verified R1 provider packages built by successful canonical CI for the exact source SHA.

inputs:
  source-sha:
    description: Exact Git commit SHA to restore.
    required: true
  github-token:
    description: Token with read access to Actions artifacts.
    required: true
  ci-run-id:
    description: Optional exact successful canonical CI run ID for this source SHA.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve successful canonical CI run for exact SHA
      id: ci-run
      shell: bash
      env:
        GH_API_TOKEN: ${{ inputs.github-token }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        CI_RUN_ID: ${{ inputs.ci-run-id }}
      run: |
        set -euo pipefail
        test "$GITHUB_REPOSITORY" = 'kmephis-ai/PrihRash'
        test "$GITHUB_SHA" = "$SOURCE_SHA"
        test "$GITHUB_REF" = 'refs/heads/main'
        test "$SOURCE_SHA" = "$(git rev-parse HEAD)"

        tmp="$RUNNER_TEMP/exact-source-artifact"
        mkdir -p "$tmp"
        api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
        auth_header="Authorization: Bearer ${GH_API_TOKEN}"
        if [ -n "$CI_RUN_ID" ]; then
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'R1_EXACT_SOURCE_CI_RUN_ID_INVALID'
            exit 1
          }
          curl --fail --silent --show-error \
            --header "$auth_header" \
            --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs/$CI_RUN_ID" \
            --output "$tmp/ci-run.json" || {
              echo 'R1_EXACT_SOURCE_CI_RUN_READ_FAILED'
              exit 1
            }
          ci_run_class="$(node scripts/classify-github-ci-run.mjs \
            "$tmp/ci-run.json" "$CI_RUN_ID" "$SOURCE_SHA")"
          case "$ci_run_class" in
            CI_RUN_EXACT_SUCCESS) ;;
            CI_RUN_INPUT_INVALID|CI_RUN_NOT_EXACT_SUCCESS|CI_RUN_METADATA_INVALID)
              echo "R1_EXACT_SOURCE_${ci_run_class}"
              exit 1
              ;;
            *)
              echo 'R1_EXACT_SOURCE_CI_RUN_CLASSIFICATION_INVALID'
              exit 1
              ;;
          esac
          run_id="$CI_RUN_ID"
        else
          curl --fail --silent --show-error \
            --header "$auth_header" \
            --header 'Accept: application/vnd.github+json' \
            "$api/actions/workflows/ci.yml/runs?branch=main&per_page=100" \
            --output "$tmp/ci-runs.json" || {
              echo 'R1_EXACT_SOURCE_CI_READ_FAILED'
              exit 1
            }

          run_id="$(jq -er --arg sha "$SOURCE_SHA" '
            [.workflow_runs[]
              | select(
                  .name == "CI"
                  and .head_sha == $sha
                  and .head_branch == "main"
                  and (.event == "push" or .event == "workflow_dispatch")
                  and .conclusion == "success"
                )]
            | if length == 1 then .[0].id else error("exact CI run count mismatch") end
          ' "$tmp/ci-runs.json")" || {
            echo 'R1_EXACT_SOURCE_CI_NOT_UNIQUE'
            exit 1
          }
        fi
        echo "run-id=$run_id" >> "$GITHUB_OUTPUT"

    - name: Download exact-source artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: r1-exact-source-${{ inputs.source-sha }}
        path: .artifacts
        github-token: ${{ inputs.github-token }}
        repository: ${{ github.repository }}
        run-id: ${{ steps.ci-run.outputs.run-id }}

    - name: Verify exact-source artifact
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        set -euo pipefail
        node scripts/exact-source-artifact.mjs verify "$SOURCE_SHA"
