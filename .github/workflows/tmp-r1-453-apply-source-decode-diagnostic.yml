name: Temporary R1 source decode diagnostic patch

on:
  push:
    branches:
      - fix/r1-453-source-decode-diagnostic

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'kmephis-ai/PrihRash' && github.ref == 'refs/heads/fix/r1-453-source-decode-diagnostic'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Apply bounded patch and retire temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/patch.gz.b64" <<'PATCH'
          
          PATCH
          tr -d '[:space:]' < "$RUNNER_TEMP/patch.gz.b64" | base64 -d | gzip -d > "$RUNNER_TEMP/patch.diff"
          git apply --check "$RUNNER_TEMP/patch.diff"
          git apply "$RUNNER_TEMP/patch.diff"
          git rm .github/workflows/tmp-r1-453-apply-source-decode-diagnostic.yml
          git config user.name 'PrihRash AI Engineering'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/invoke-yandex-initial-bootstrap-recovery.mjs src/runtime/initialBootstrapRecoveryJob.ts src/runtime/yandexCloudInitialBootstrapRecoveryFunction.ts tests/migration-simulation/initial-bootstrap-recovery-insertions-transport.test.mjs tests/migration-simulation/initial-bootstrap-recovery-job.test.mjs tests/migration-simulation/initial-bootstrap-recovery-probe.test.mjs tests/tooling/initial-bootstrap-recovery-insertions-invoker.test.mjs tests/tooling/initial-bootstrap-recovery-invoker-diagnostic.test.mjs
          git commit -m 'R1 #453: expose safe source decode evidence'
          git push origin HEAD:fix/r1-453-source-decode-diagnostic
