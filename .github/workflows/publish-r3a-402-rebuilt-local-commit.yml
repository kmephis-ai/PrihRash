name: Publish rebuilt exact local R3A 402 commit

on:
  push:
    branches:
      - transport/r3a-402-publish-rebuild-20260910-1005

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Reproduce and publish exact rebuilt local commit
        env:
          SOURCE_SHA: afe3a9563e3816b4d03a2535d66cfabae801aae4
          TARGET_BRANCH: r3a/402-idempotent-income-create
          EXPECTED_HEAD: 7dea2cfce0f8e5f0d14dd376c739a38f62964d7c
          EXPECTED_TREE: e70e100b328ced8d81f3c4ae14fb517ea9916278
          EXPECTED_PARENT: afe3a9563e3816b4d03a2535d66cfabae801aae4
          B64_SHA256: 247399ee6043cbed14a91b87dab587107298eb7c41bde7ea26b79bd5d731ae9a
          GZ_SHA256: aa5000097096d9adcb774eddacfe58cb9a826d3cad88e7a9487d9c80dc284339
          PATCH_SHA256: 804eb5f83a3adea03407033e0286cf7d0957c784d84ec86f61e1a2ba1b8ff182
        run: |
          set -euo pipefail
          cat .transport/r3a402-rebuild.gz.b64.part.* > /tmp/r3a402.patch.gz.b64
          echo "$B64_SHA256  /tmp/r3a402.patch.gz.b64" | sha256sum -c -
          base64 -d /tmp/r3a402.patch.gz.b64 > /tmp/r3a402.patch.gz
          echo "$GZ_SHA256  /tmp/r3a402.patch.gz" | sha256sum -c -
          gzip -dc /tmp/r3a402.patch.gz > /tmp/r3a402.patch
          echo "$PATCH_SHA256  /tmp/r3a402.patch" | sha256sum -c -

          git fetch origin main
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$SOURCE_SHA"

          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git switch --detach "$SOURCE_SHA"
          git am --committer-date-is-author-date /tmp/r3a402.patch

          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"

          expected_files=$(printf '%s\n' \
            docs/R3A_WRITER_API.md \
            src/writer/idempotentIncomeCreate.ts \
            tests/domain/idempotent-income-create.test.mjs)
          actual_files=$(git diff --name-only "$SOURCE_SHA" HEAD)
          test "$actual_files" = "$expected_files"

          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
