name: R1 630 late post 35467368196 recovery

on:
  push:
    branches:
      - transport/r1-630-late-post-35467368196

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch recovery only after controlled Function max lifetime
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: e8bd13dc643584bee9ddaf302adb8dc43b3399b0
          FAILED_RUN_ID: '35467368196'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GH_API_TOKEN}"
          accept='Accept: application/vnd.github+json'

          failed_run="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/runs/$FAILED_RUN_ID")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .head_sha == $sha
            and .name == "R1 initial controlled rebuild"
            and .status == "completed"
            and .conclusion == "failure"
          ' <<<"$failed_run" >/dev/null

          safe_after="$(date -u -d "$(jq -er '.updated_at' <<<"$failed_run") + 6 minutes" +%s)"
          now="$(date -u +%s)"
          if [ "$now" -lt "$safe_after" ]; then
            sleep "$((safe_after - now))"
          fi

          main="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/branches/main")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' <<<"$main" >/dev/null
          test "$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/issues/630" | jq -er '.state')" = 'open'

          all="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/runs?per_page=100")"
          if jq -e '
            .workflow_runs | any(
              (.status == "queued" or .status == "in_progress")
              and (.name == "R1 initial shadow bootstrap"
                   or .name == "R1 initial bootstrap orchestrator"
                   or .name == "R1 initial controlled rebuild")
            )
          ' <<<"$all" >/dev/null; then
            echo 'R1_630_LATE_RECOVERY_WRITER_ACTIVE'
            exit 1
          fi

          existing="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          failed_updated="$(jq -er '.updated_at' <<<"$failed_run")"
          if jq -e --arg sha "$EXPECTED_MAIN_SHA" --arg after "$failed_updated" '
            [.workflow_runs[] | select(.head_sha == $sha and .created_at > $after)] | length >= 2
          ' <<<"$existing" >/dev/null; then
            echo 'R1_630_LATE_RECOVERY_ALREADY_PRESENT'
            exit 0
          fi

          curl --fail --silent --show-error --request POST             --header "$auth"             --header "$accept"             --header 'X-GitHub-Api-Version: 2022-11-28'             "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/dispatches"             --data '{"ref":"main"}'
          echo 'R1_630_LATE_RECOVERY_DISPATCHED'
