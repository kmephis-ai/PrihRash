name: R1 630 late recovery 8521335

on:
  push:
    branches:
      - transport/r1-630-late-recovery-8521335

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dispatch read-only recovery only after max function lifetime
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 8521335ac3f7dfa466cdb61078e7ea40d8bf6964
          FAILED_RUN_ID: '35461379117'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'

          test "$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/branches/main" | jq -er '.commit.sha')" = "$EXPECTED_MAIN_SHA"
          test "$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/issues/630" | jq -er '.state')" = 'open'

          failed="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/runs/$FAILED_RUN_ID")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .head_sha == $sha
            and .name == "R1 initial controlled rebuild"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "failure"
          ' <<<"$failed" >/dev/null

          safe_after="$(date -u -d "$(jq -er '.updated_at' <<<"$failed") + 6 minutes" +%s)"
          now="$(date -u +%s)"
          if [ "$now" -lt "$safe_after" ]; then
            sleep "$((safe_after - now))"
          fi

          test "$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/branches/main" | jq -er '.commit.sha')" = "$EXPECTED_MAIN_SHA"

          writers="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/runs?per_page=100")"
          if jq -e '
            .workflow_runs | any(
              (.status == "queued" or .status == "in_progress")
              and (.name == "R1 initial shadow bootstrap"
                   or .name == "R1 initial bootstrap orchestrator"
                   or .name == "R1 initial controlled rebuild")
            )
          ' <<<"$writers" >/dev/null; then
            echo 'R1_630_LATE_RECOVERY_WRITER_ACTIVE'
            exit 1
          fi

          existing="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$EXPECTED_MAIN_SHA" --arg after "$(jq -er '.updated_at' <<<"$failed")" '
            .workflow_runs | any(.head_sha == $sha and .created_at > $after and .created_at > "2026-09-19T18:40:00Z")
          ' <<<"$existing" >/dev/null; then
            echo 'R1_630_LATE_RECOVERY_ALREADY_PRESENT'
            exit 0
          fi

          curl --fail --silent --show-error --request POST             --header "$auth_header"             --header "$accept_header"             --header 'X-GitHub-Api-Version: 2022-11-28'             "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/dispatches"             --data '{"ref":"main"}'
          echo 'R1_630_LATE_RECOVERY_DISPATCHED'
