name: R1 630 readiness dispatch 9ad3435

on:
  push:
    branches:
      - transport/local-git-mirror-r1-630-9ad3435

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-main readiness once
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 9ad343523cb2158dea8a2ebb663f097827ca95cc
          RECOVERY_RUN_ID: '35457330085'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'

          main_sha="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/branches/main" | jq -er '.commit.sha')"
          test "$main_sha" = "$EXPECTED_MAIN_SHA"
          test "$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/issues/630" | jq -er '.state')" = 'open'

          recovery="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/runs/$RECOVERY_RUN_ID")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .head_sha == $sha
            and .name == "R1 initial bootstrap recovery"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "success"
          ' <<<"$recovery" >/dev/null

          for workflow in r1-initial-controlled-rebuild.yml r1-initial-shadow-bootstrap.yml r1-initial-bootstrap-orchestrator.yml; do
            active="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/workflows/$workflow/runs?branch=main&per_page=100")"
            if jq -e --arg sha "$EXPECTED_MAIN_SHA" '.workflow_runs | any(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))' <<<"$active" >/dev/null; then
              echo 'R1_630_READINESS_DISPATCH_WRITER_ACTIVE'
              exit 1
            fi
          done

          existing="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/workflows/r1-yandex-readiness.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$EXPECTED_MAIN_SHA" '.workflow_runs | any(.head_sha == $sha)' <<<"$existing" >/dev/null; then
            echo 'R1_630_READINESS_ALREADY_DISPATCHED'
            exit 0
          fi

          curl --fail --silent --show-error --request POST             --header "$auth_header"             --header "$accept_header"             --header 'X-GitHub-Api-Version: 2022-11-28'             "$api/actions/workflows/r1-yandex-readiness.yml/dispatches"             --data '{"ref":"main"}'
          echo 'R1_630_READINESS_DISPATCHED'
