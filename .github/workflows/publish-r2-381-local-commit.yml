name: Publish exact local R2 commit

on:
  push:
    branches:
      - transport/r2-381-publish-20260909-1400

permissions:
  contents: write

env:
  SOURCE_SHA: 0ec41ebb9e00bf2ca338cfc0a4a6d546c1e795ce
  TARGET_BRANCH: r2/381-flow-kind
  EXPECTED_TREE: a5a9dd9ec679d63b15bb1d2e5788adc6a3826137
  EXPECTED_COMMIT: 64cada276bfa41b3c6627e3fbaf5ae28ff15a4d1

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply and verify exact local commit
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git checkout -B "${TARGET_BRANCH}" "${SOURCE_SHA}"
          cat > /tmp/r2-381.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/r2-381.patch.gz.b64 | gzip -d > /tmp/r2-381.patch
          git am --committer-date-is-author-date /tmp/r2-381.patch
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          git diff --exit-code "${SOURCE_SHA}" "${EXPECTED_COMMIT}" --check
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
