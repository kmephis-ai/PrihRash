name: transport-r1-453-stale-cause

on:
  push:
    branches:
      - transport/r1-453-stale-cause-20260917

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/r1-453-stale-retirement-cause
          fetch-depth: 0
          persist-credentials: true
      - name: Apply bounded non-workflow patch
        shell: bash
        env:
          EXPECTED_HEAD: 1e6831c09d3709e77c27ed2fe9514894e5cc7dab
          TARGET_BRANCH: fix/r1-453-stale-retirement-cause
          CHUNK1: 
          CHUNK2: 
          CHUNK3: ...TRUNCATED_CHUNK3... 
          CHUNK4: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          printf '%s%s%s%s' "$CHUNK1" "$CHUNK2" "$CHUNK3" "$CHUNK4" | base64 -d > /tmp/remaining.patch
          git apply --check /tmp/remaining.patch
          git apply /tmp/remaining.patch
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          expected=(
            scripts/invoke-yandex-initial-bootstrap.mjs
            src/runtime/initialBootstrapReferenceAwareJob.ts
            tests/integration/yandex-initial-bootstrap-invoker.test.mjs
            tests/integration/yandex-initial-bootstrap-stale-retirement.test.mjs
          )
          printf '%s\n' "${changed[@]}" | sort > /tmp/changed
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          diff -u /tmp/expected /tmp/changed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${expected[@]}"
          git commit -m 'R1 #453: carry stale retirement semantic cause'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
