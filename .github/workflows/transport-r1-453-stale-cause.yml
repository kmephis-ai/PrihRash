name: transport-r1-453-stale-cause

on:
  push:
    branches:
      - transport/r1-453-stale-cause-20260917

permissions:
  contents: write

jobs:
  materialize:
    if: "${{ github.event.head_commit.message != 'R1 #453: materialize workflow blob' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize updated workflow as ordinary blob
        shell: bash
        env:
          EXPECTED_HEAD: 0421a7cee5a78aa1bed42f99f14defe3f4682d30
          TARGET_BRANCH: fix/r1-453-stale-retirement-cause
          TRANSPORT_BRANCH: transport/r1-453-stale-cause-20260917
        run: |
          set -euo pipefail
          cp .transport/r1_453_workflow.patch /tmp/workflow.patch
          git fetch origin "$TARGET_BRANCH" "$TRANSPORT_BRANCH"
          git checkout --detach "origin/$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git apply --check /tmp/workflow.patch
          git apply /tmp/workflow.patch
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/r1-initial-shadow-bootstrap.yml"
          cp .github/workflows/r1-initial-shadow-bootstrap.yml /tmp/updated.yml
          git reset --hard HEAD
          git checkout -B "$TRANSPORT_BRANCH" "origin/$TRANSPORT_BRANCH"
          cp /tmp/updated.yml .transport/r1-initial-shadow-bootstrap.updated.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .transport/r1-initial-shadow-bootstrap.updated.yml
          git commit -m 'R1 #453: materialize workflow blob'
          git push origin "HEAD:refs/heads/$TRANSPORT_BRANCH"
