name: Publish R1 cutoff-aware fixture fix
on:
  push:
    branches:
      - transport/r1-630-cutoff-resume-fixture-fix
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact fixture fix
        shell: bash
        env:
          PATCH_B64: ''
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" > "$RUNNER_TEMP/payload.b64"
          test "$(sha256sum "$RUNNER_TEMP/payload.b64" | awk '{print $1}')" = '0090f4cc9210b0379f537852e3ba7409f7029ca2d8d6a29f117f44d22e5ef596'
          base64 --decode "$RUNNER_TEMP/payload.b64" | gzip --decompress > "$RUNNER_TEMP/fix.patch"
          test "$(sha256sum "$RUNNER_TEMP/fix.patch" | awk '{print $1}')" = 'f6e2a919c2899aae0f6d18e6c2abd63cdf182e1409c200b340ae4b95ba07f627'
          git checkout --detach 6fb649dc2aeafe6701a21f234ab2f5af347f85c3
          git apply --index "$RUNNER_TEMP/fix.patch"
          git diff --cached --check
          git config user.name 'kmephis-ai'
          git config user.email 'kmephis@gmail.com'
          git commit -m 'test(r1): use canonical digest in cutoff resume fixture'
          test "$(git rev-parse HEAD^{tree})" = 'fbf2b59c62564ce0f6857e2d2768941398df4daf'
          git push origin "HEAD:refs/heads/agent/r1-630-cutoff-aware-resume"
