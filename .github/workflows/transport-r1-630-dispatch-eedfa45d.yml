name: R1 630 Dispatch Readiness eedfa45d

on:
  push:
    branches:
      - transport/r1-630-dispatch-eedfa45d

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-main readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: eedfa45dae4b75b1f2c8bbe71d9648080e58d662
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GH_TOKEN}"
          accept="Accept: application/vnd.github+json"
          current="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/commits/main" | jq -er '.sha')"
          test "$current" = "$EXPECTED_MAIN_SHA"
          curl --fail --silent --show-error --request POST             --header "$auth" --header "$accept" --header 'X-GitHub-Api-Version: 2022-11-28'             "$api/actions/workflows/r1-yandex-readiness.yml/dispatches"             --data '{"ref":"main"}'
          echo R1_630_READINESS_DISPATCHED
