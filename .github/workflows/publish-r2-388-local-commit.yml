name: Publish exact local R2 388 commit

on:
  push:
    branches:
      - transport/r2-388-publish-20260909-1456

permissions:
  contents: write

env:
  SOURCE_SHA: e62a65ea61c9029fd4474319e2dc6c93354fd83e
  TARGET_BRANCH: r2/388-lexical-evidence
  EXPECTED_TREE: 5a3f651e87e49be096d19a8b2c76c982c6cfd2b1
  EXPECTED_COMMIT: a7c90cbd82adf71d02e4296e8ede0f1fbce7e663

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply and verify exact local commit
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${SOURCE_SHA}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${SOURCE_SHA}"
          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git checkout -B "${TARGET_BRANCH}" "${SOURCE_SHA}"
          cat > /tmp/r2-388.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/r2-388.patch.gz.b64 | gzip -d > /tmp/r2-388.patch
          git am --committer-date-is-author-date /tmp/r2-388.patch
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          git diff --check "${SOURCE_SHA}" "${EXPECTED_COMMIT}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
