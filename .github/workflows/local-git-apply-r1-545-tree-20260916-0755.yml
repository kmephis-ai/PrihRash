name: Local Git Apply R1 545 Tree

on:
  push:
    branches:
      - local-git-mirror/r1-545-20260916-0430

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r1-545-provider-attempt-hardening
          fetch-depth: 0
      - name: Apply exact non-workflow tree
        shell: bash
        env:
          EXPECTED_BASE: d428fe04bb2bdfe355c4c6dcbfe844a121d8becf
          EXPECTED_TREE: ade4547b92e5106fe21cc1ef9736d5e1d90640f9
          MIRROR_BRANCH: local-git-mirror/r1-545-20260916-0430
          PAYLOAD_WORKFLOW: .github/workflows/local-git-apply-r1-545-20260916-0740.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          git fetch origin "refs/heads/$MIRROR_BRANCH:refs/remotes/origin/$MIRROR_BRANCH"
          payload="$(git show "origin/$MIRROR_BRANCH:$PAYLOAD_WORKFLOW" | sed -n 's/^          PATCH_GZ_B64: //p')"
          test -n "$payload"
          printf '%s' "$payload" | base64 --decode | gzip -d > "$RUNNER_TEMP/r1-545.patch"
          git apply --index "$RUNNER_TEMP/r1-545.patch"
          git config user.name 'OpenAI'
          git config user.email 'openai@example.invalid'
          git commit -m 'R1 #545: harden provider attempt evidence boundary'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/r1-545-provider-attempt-hardening"
