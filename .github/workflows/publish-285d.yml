name: Transport publish 285d

on:
  push:
    branches:
      - transport/publish-285d

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply byte-exact create diagnostics patch
        shell: bash
        env:
          BASE_SHA: 2b9bbd7fc2c3b0d3aff8bc51668a25523d3a1a07
          TARGET_BRANCH: fix/r1-test-private-create-operation-diagnostics
          PATCH_BASE64: 
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          printf '%s' "${PATCH_BASE64}" | base64 --decode > /tmp/create-diagnostics.patch
          git apply --check /tmp/create-diagnostics.patch
          git apply /tmp/create-diagnostics.patch
          git diff --check
          git config user.name 'kmephis-ai'
          git config user.email 'kmephis@gmail.com'
          git add scripts/test-private-controlled-rebuild-smoke.mjs
          git commit -m 'R1: localize TEST_PRIVATE create overload'
          git push origin "HEAD:${TARGET_BRANCH}"
