name: R1 initial controlled rebuild deploy recovery

on:
  workflow_dispatch:
    inputs:
      tracking_issue:
        description: Open R1 WU7 authority Issue number
        required: true
        type: string
      expected_main_sha:
        description: Exact main SHA of the failed controlled rebuild attempt
        required: true
        type: string
      failed_run_sha:
        description: Exact main SHA on which the controlled rebuild deploy failed
        required: true
        type: string
      failed_run_id:
        description: Exact failed R1 initial controlled rebuild run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  id-token: write

concurrency:
  group: r1-initial-controlled-rebuild-deploy-recovery
  cancel-in-progress: false

jobs:
  deploy-recovery:
    if: github.repository == 'kmephis-ai/PrihRash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FUNCTION_NAME: prihrash-r1-initial-bootstrap
      TARGET_TAG: r1-initial-controlled-rebuild
      TARGET_RUNTIME: nodejs22
      TARGET_ENTRYPOINT: index.initialControlledRebuildHandler
      OIDC_AUDIENCE: https://github.com/kmephis-ai
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      OIDC_SUBJECT: repo:kmephis-ai@310519475/PrihRash@1359286840:ref:refs/heads/main
      YC_FOLDER_ID: ${{ secrets.YC_R1_FOLDER_ID }}
      YC_WIF_SERVICE_ACCOUNT_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_WIF_SERVICE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify immutable read-only recovery boundary
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          FAILED_RUN_SHA: ${{ inputs.failed_run_sha }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'kmephis-ai/PrihRash'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test -n "$YC_FOLDER_ID"
          test -n "$YC_WIF_SERVICE_ACCOUNT_ID"
          [[ "$TRACKING_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_AUTHORITY_ISSUE_INVALID'; exit 1; }
          [[ "$FAILED_RUN_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_RUN_SHA_INVALID'; exit 1; }
          [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_RUN_ID_INVALID'; exit 1; }

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-deploy-recovery-gates"
          mkdir -p "$tmp"

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' "$api/branches/main" --output "$tmp/main.json"
          jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha and .protected == true' "$tmp/main.json" >/dev/null || {
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_MAIN_GATE_NOT_READY'
            exit 1
          }

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' "$api/issues/${TRACKING_ISSUE}" --output "$tmp/authority.json"
          jq -e '
            .state == "open"
            and (.title | startswith("R1 WU7:"))
            and (.body | contains("Provider-Authority: WU7_CONTROLLED_REBUILD"))
            and (.body | contains("Authority-Scope: PRODUCTION_YDB_INITIAL_SHADOW_ONLY"))
            and (.body | contains("Google-Authority: PRESERVED"))
            and (.body | contains("Cap-Increase: FORBIDDEN"))
            and (.body | contains("Timer-Cutover: FORBIDDEN"))
            and (.body | contains("Blind-Replay: FORBIDDEN"))
          ' "$tmp/authority.json" >/dev/null || {
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_AUTHORITY_MISSING'
            exit 1
          }

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' "$api/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" --output "$tmp/ci.json"
          jq -e --arg sha "$GITHUB_SHA" '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' "$tmp/ci.json" >/dev/null || {
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_EXACT_SHA_CI_MISSING'
            exit 1
          }

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' "$api/actions/runs/${FAILED_RUN_ID}" --output "$tmp/failed-run.json"
          jq -e --argjson id "$FAILED_RUN_ID" --arg failed_sha "$FAILED_RUN_SHA" '
            .id == $id
            and .name == "R1 initial controlled rebuild"
            and .head_sha == $failed_sha
            and .head_branch == "main"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "failure"
          ' "$tmp/failed-run.json" >/dev/null || {
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_FAILED_RUN_NOT_EXACT'
            exit 1
          }

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' "$api/actions/runs/${FAILED_RUN_ID}/jobs?filter=latest&per_page=100" --output "$tmp/failed-jobs.json"
          jq -e '
            [.jobs[] | select(.name == "initial-controlled-rebuild")] as $jobs
            | ($jobs | length) == 1
            and (
              (
                ([$jobs[0].steps[]? | select(.name == "Deploy initial-controlled-rebuild-only Function version" and .conclusion == "failure")] | length) == 1
              )
              or
              (
                ([$jobs[0].steps[]? | select(.name == "Deploy initial-controlled-rebuild-only Function version" and (.conclusion == "success" or .conclusion == "skipped"))] | length) == 1
                and ([$jobs[0].steps[]? | select(.name == "Re-verify private trigger-free boundary" and .conclusion == "failure")] | length) == 1
              )
            )
            and ([$jobs[0].steps[]? | select(.name == "Start exact controlled rebuild tag asynchronously once" and .conclusion == "skipped")] | length) == 1
          ' "$tmp/failed-jobs.json" >/dev/null || {
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_FAILURE_PHASE_NOT_PROVEN'
            exit 1
          }

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' "$api/actions/runs?per_page=100" --output "$tmp/runs.json"
          jq -e --argjson self "$GITHUB_RUN_ID" '
            [.workflow_runs[]
              | select(.id != $self)
              | select(.status == "queued" or .status == "in_progress")
              | select(
                  .name == "R1 initial shadow bootstrap"
                  or .name == "R1 initial bootstrap orchestrator"
                  or .name == "R1 initial controlled rebuild"
                )
            ] | length == 0
          ' "$tmp/runs.json" >/dev/null || {
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_WRITER_CONFLICT'
            exit 1
          }

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/yc"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz --output "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$install_dir"
          yc_bin="$(find "$install_dir" -type f -name yc -perm -u+x -print -quit)"
          test -n "$yc_bin"
          echo "$(dirname "$yc_bin")" >> "$GITHUB_PATH"
          "$yc_bin" version >/dev/null

      - name: Exchange GitHub OIDC token for short-lived Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-deploy-recovery-auth"
          mkdir -p "$tmp"
          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value | @uri')"

          if ! oidc_status="$(curl --silent --show-error --output "$tmp/oidc.json" --write-out '%{http_code}' --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" 2>"$tmp/oidc.err")"; then
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_OIDC_REQUEST_FAILED'
            exit 1
          fi
          case "$oidc_status" in 2??) ;; *) echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_OIDC_REQUEST_FAILED'; exit 1 ;; esac
          oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' "$tmp/oidc.json")"
          echo "::add-mask::${oidc_token}"

          token_payload="${oidc_token#*.}"
          token_payload="${token_payload%%.*}"
          token_payload="${token_payload//-/+}"
          token_payload="${token_payload//_/\/}"
          case "$((${#token_payload} % 4))" in
            0) ;;
            2) token_payload="${token_payload}==" ;;
            3) token_payload="${token_payload}=" ;;
            *) echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_OIDC_CLAIMS_INVALID'; exit 1 ;;
          esac
          printf '%s' "$token_payload" | base64 --decode >"$tmp/claims.json"
          jq -e --arg iss "$OIDC_ISSUER" --arg aud "$OIDC_AUDIENCE" --arg sub "$OIDC_SUBJECT" '
            .iss == $iss
            and ((.aud == $aud) or ((.aud | type) == "array" and (.aud | length) == 1 and .aud[0] == $aud))
            and .sub == $sub
          ' "$tmp/claims.json" >/dev/null || {
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_OIDC_CLAIMS_INVALID'
            exit 1
          }

          if ! iam_status="$(curl --silent --show-error --output "$tmp/iam.json" --write-out '%{http_code}' --request POST https://auth.yandex.cloud/oauth/token --header 'Content-Type: application/x-www-form-urlencoded' --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' --data-urlencode "audience=${YC_WIF_SERVICE_ACCOUNT_ID}" --data-urlencode "subject_token=${oidc_token}" --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' 2>"$tmp/iam.err")"; then
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_WIF_EXCHANGE_FAILED'
            exit 1
          fi
          case "$iam_status" in 2??) ;; *) echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_WIF_EXCHANGE_FAILED'; exit 1 ;; esac
          iam_token="$(jq -er '.access_token | select(type == "string" and length > 0)' "$tmp/iam.json")"
          echo "::add-mask::${iam_token}"
          echo "YC_IAM_TOKEN=${iam_token}" >> "$GITHUB_ENV"

      - name: Classify Function-version create outcome read-only
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/r1-initial-controlled-rebuild-deploy-recovery-evidence"
          candidate="$evidence_dir/classification.tmp"
          evidence="$evidence_dir/classification.json"
          tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-deploy-recovery-provider"
          mkdir -p "$evidence_dir" "$tmp"

          if ! yc serverless function get --name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" --format json --retry 0 --no-user-output >"$tmp/function.json" 2>"$tmp/function.err"; then
            jq -cn '{status:"PASS",code:"INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_CLASSIFIED",verdict:"RECOVERY_REQUIRED",reason:"FUNCTION_READ_FAILED"}' >"$candidate"
          else
            function_id="$(jq -er '.id | select(type == "string" and length > 0)' "$tmp/function.json")"
            echo "::add-mask::${function_id}"
            if ! yc serverless function version list --function-id "$function_id" --format json --retry 0 --no-user-output >"$tmp/versions.json" 2>"$tmp/versions.err"; then
              jq -cn '{status:"PASS",code:"INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_CLASSIFIED",verdict:"RECOVERY_REQUIRED",reason:"VERSION_LIST_FAILED"}' >"$candidate"
            else
              matching="$(jq --arg tag "$TARGET_TAG" '[.[]? | select((.tags | type) == "array" and (.tags | index($tag)) != null)] | length' "$tmp/versions.json")"
              case "$matching" in
                0)
                  jq -cn '{status:"PASS",code:"INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_CLASSIFIED",verdict:"NOT_APPLIED",reason:"TAG_ABSENT"}' >"$candidate"
                  ;;
                1)
                  if ! yc serverless function version get-by-tag --function-id "$function_id" --tag "$TARGET_TAG"                     --format json-rest --retry 0 --no-user-output >"$tmp/tag.json" 2>"$tmp/tag.err"; then
                    jq -cn '{status:"PASS",code:"INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_CLASSIFIED",verdict:"RECOVERY_REQUIRED",reason:"TAG_READ_FAILED"}' >"$candidate"
                  else
                    metadata_reason="$(jq -r                       --arg runtime "$TARGET_RUNTIME"                       --arg entrypoint "$TARGET_ENTRYPOINT"                       --arg async_sa "$YC_WIF_SERVICE_ACCOUNT_ID" '
                      if (.runtime != $runtime or .entrypoint != $entrypoint or .status != "ACTIVE") then
                        "TAG_METADATA_NOT_EXACT_ACTIVE"
                      elif ((.asyncInvocationConfig | type) != "object") then
                        "TAG_ASYNC_CONFIG_MISSING"
                      elif (((.asyncInvocationConfig.retriesCount // "") | tostring) != "0") then
                        "TAG_ASYNC_RETRIES_NOT_ZERO"
                      elif ((.asyncInvocationConfig.serviceAccountId // "") != $async_sa) then
                        "TAG_ASYNC_SERVICE_ACCOUNT_NOT_EXACT"
                      elif ((.asyncInvocationConfig.successTarget.ymqTarget // null) != null) then
                        "TAG_ASYNC_SUCCESS_TARGET_PRESENT"
                      elif ((.asyncInvocationConfig.failureTarget.ymqTarget // null) != null) then
                        "TAG_ASYNC_FAILURE_TARGET_PRESENT"
                      else
                        "EXACT_ACTIVE_TAG"
                      end
                    ' "$tmp/tag.json")"
                    if [ "$metadata_reason" = "EXACT_ACTIVE_TAG" ]; then
                      jq -cn '{status:"PASS",code:"INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_CLASSIFIED",verdict:"APPLIED",reason:"EXACT_ACTIVE_TAG"}' >"$candidate"
                    else
                      jq -cn --arg reason "$metadata_reason" '{status:"PASS",code:"INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_CLASSIFIED",verdict:"RECOVERY_REQUIRED",reason:$reason}' >"$candidate"
                    fi
                  fi
                  ;;
                *)
                  jq -cn '{status:"PASS",code:"INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_CLASSIFIED",verdict:"RECOVERY_REQUIRED",reason:"TAG_MATCH_AMBIGUOUS"}' >"$candidate"
                  ;;
              esac
            fi
          fi

          jq -e '
            type == "object"
            and (keys | sort) == ["code","reason","status","verdict"]
            and .status == "PASS"
            and .code == "INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_CLASSIFIED"
            and (.verdict | IN("APPLIED","NOT_APPLIED","RECOVERY_REQUIRED"))
            and (.reason | IN("EXACT_ACTIVE_TAG","TAG_ABSENT","FUNCTION_READ_FAILED","VERSION_LIST_FAILED","TAG_READ_FAILED","TAG_METADATA_NOT_EXACT_ACTIVE","TAG_ASYNC_CONFIG_MISSING","TAG_ASYNC_RETRIES_NOT_ZERO","TAG_ASYNC_SERVICE_ACCOUNT_NOT_EXACT","TAG_ASYNC_SUCCESS_TARGET_PRESENT","TAG_ASYNC_FAILURE_TARGET_PRESENT","TAG_MATCH_AMBIGUOUS"))
          ' "$candidate" >/dev/null
          mv "$candidate" "$evidence"
          cat "$evidence"

      - name: Classify provider prerequisites and failed create operation read-only
        shell: bash
        env:
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
        run: |
          set -euo pipefail
          evidence_dir="$RUNNER_TEMP/r1-initial-controlled-rebuild-deploy-recovery-evidence"
          diagnostic="$evidence_dir/provider-diagnostic.json"
          provider_tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-provider-diagnostic"
          gate_tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-deploy-recovery-gates"
          mkdir -p "$evidence_dir" "$provider_tmp"

          function_invoker='READ_FAILED'
          self_use='READ_FAILED'
          create_operation='READ_FAILED'

          if yc serverless function get --name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" \
              --format json --retry 0 --no-user-output >"$provider_tmp/function.json" 2>"$provider_tmp/function.err"; then
            function_id="$(jq -r '.id // empty' "$provider_tmp/function.json")"
            if [ -n "$function_id" ]; then
              echo "::add-mask::${function_id}"
              if yc serverless function list-access-bindings --id "$function_id" \
                  --format json --retry 0 --no-user-output >"$provider_tmp/function-bindings.json" 2>"$provider_tmp/function-bindings.err"; then
                invoker_count="$(jq --arg id "$YC_WIF_SERVICE_ACCOUNT_ID" '[.[]? | select((.role_id // .roleId // "") == "functions.functionInvoker" and (.subject.id // "") == $id and (.subject.type // "serviceAccount") == "serviceAccount")] | length' "$provider_tmp/function-bindings.json")"
                case "$invoker_count" in
                  1) function_invoker='PROVEN' ;;
                  0) function_invoker='MISSING' ;;
                  *) function_invoker='AMBIGUOUS' ;;
                esac
              fi

              if yc serverless function list-operations --id "$function_id" --limit 50 \
                  --format json --retry 0 --no-user-output >"$provider_tmp/operations.json" 2>"$provider_tmp/operations.err"; then
                failed_run="$gate_tmp/failed-run.json"
                if [ -f "$failed_run" ]; then
                  started="$(jq -r '.created_at // empty' "$failed_run")"
                  finished="$(jq -r '.updated_at // empty' "$failed_run")"
                  if [ -n "$started" ] && [ -n "$finished" ]; then
                    start_epoch="$(( $(date -u -d "$started" +%s) - 15 ))"
                    end_epoch="$(( $(date -u -d "$finished" +%s) + 15 ))"
                    jq --arg creator "$YC_WIF_SERVICE_ACCOUNT_ID" --argjson start "$start_epoch" --argjson end "$end_epoch" '
                      def epoch:
                        sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
                      [.[]?
                        | . as $op
                        | (($op.created_by // $op.createdBy // "") == $creator) as $same_creator
                        | (($op.created_at // $op.createdAt // "") | try epoch catch null) as $ts
                        | select($same_creator and $ts != null and $ts >= $start and $ts <= $end)
                      ]
                    ' "$provider_tmp/operations.json" >"$provider_tmp/matching-operations.json"
                    operation_count="$(jq 'length' "$provider_tmp/matching-operations.json")"
                    case "$operation_count" in
                      0) create_operation='NO_MATCHING_OPERATION' ;;
                      1)
                        raw_code="$(jq -r '.[0].error.code // empty | tostring' "$provider_tmp/matching-operations.json")"
                        if [ -n "$raw_code" ]; then
                          case "$raw_code" in
                            3|INVALID_ARGUMENT) create_operation='INVALID_ARGUMENT' ;;
                            5|NOT_FOUND) create_operation='NOT_FOUND' ;;
                            6|ALREADY_EXISTS) create_operation='ALREADY_EXISTS' ;;
                            7|PERMISSION_DENIED) create_operation='PERMISSION_DENIED' ;;
                            8|RESOURCE_EXHAUSTED) create_operation='RESOURCE_EXHAUSTED' ;;
                            9|FAILED_PRECONDITION) create_operation='FAILED_PRECONDITION' ;;
                            13|INTERNAL) create_operation='INTERNAL' ;;
                            14|UNAVAILABLE) create_operation='UNAVAILABLE' ;;
                            16|UNAUTHENTICATED) create_operation='UNAUTHENTICATED' ;;
                            *) create_operation='OTHER_ERROR' ;;
                          esac
                        elif jq -e '.[0].done == false' "$provider_tmp/matching-operations.json" >/dev/null 2>&1; then
                          create_operation='IN_PROGRESS'
                        elif jq -e '.[0].done == true and (.[0].response != null)' "$provider_tmp/matching-operations.json" >/dev/null 2>&1; then
                          create_operation='SUCCEEDED'
                        else
                          create_operation='COMPLETED_UNKNOWN'
                        fi
                        ;;
                      *) create_operation='AMBIGUOUS' ;;
                    esac
                  fi
                fi
              fi
            fi
          fi

          if yc iam service-account list-access-bindings --id "$YC_WIF_SERVICE_ACCOUNT_ID" \
              --format json --retry 0 --no-user-output >"$provider_tmp/self-bindings.json" 2>"$provider_tmp/self-bindings.err"; then
            self_count="$(jq --arg id "$YC_WIF_SERVICE_ACCOUNT_ID" '[.[]? | select((.role_id // .roleId // "") == "iam.serviceAccounts.user" and (.subject.id // "") == $id and (.subject.type // "serviceAccount") == "serviceAccount")] | length' "$provider_tmp/self-bindings.json")"
            case "$self_count" in
              1) self_use='PROVEN' ;;
              0) self_use='MISSING' ;;
              *) self_use='AMBIGUOUS' ;;
            esac
          else
            self_use='NOT_READABLE'
          fi

          jq -cn \
            --arg functionInvoker "$function_invoker" \
            --arg selfUse "$self_use" \
            --arg createOperation "$create_operation" \
            '{status:"PASS",code:"INITIAL_CONTROLLED_REBUILD_PROVIDER_DIAGNOSTIC",functionInvoker:$functionInvoker,selfUse:$selfUse,createOperation:$createOperation}' \
            >"$diagnostic"

          jq -e '
            type == "object"
            and (keys | sort) == ["code","createOperation","functionInvoker","selfUse","status"]
            and .status == "PASS"
            and .code == "INITIAL_CONTROLLED_REBUILD_PROVIDER_DIAGNOSTIC"
            and (.functionInvoker | IN("PROVEN","MISSING","AMBIGUOUS","READ_FAILED"))
            and (.selfUse | IN("PROVEN","MISSING","AMBIGUOUS","NOT_READABLE","READ_FAILED"))
            and (.createOperation | IN("NO_MATCHING_OPERATION","INVALID_ARGUMENT","NOT_FOUND","ALREADY_EXISTS","PERMISSION_DENIED","RESOURCE_EXHAUSTED","FAILED_PRECONDITION","INTERNAL","UNAVAILABLE","UNAUTHENTICATED","OTHER_ERROR","IN_PROGRESS","SUCCEEDED","COMPLETED_UNKNOWN","AMBIGUOUS","READ_FAILED"))
          ' "$diagnostic" >/dev/null
          cat "$diagnostic"

      - name: Publish enum-only provider diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-initial-controlled-rebuild-provider-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/r1-initial-controlled-rebuild-deploy-recovery-evidence/provider-diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish enum-only deploy recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-initial-controlled-rebuild-deploy-recovery-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/r1-initial-controlled-rebuild-deploy-recovery-evidence/classification.json
          if-no-files-found: error
          retention-days: 30

      - name: Require bounded classification evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/r1-initial-controlled-rebuild-deploy-recovery-evidence/classification.json"
          jq -e '
            type == "object"
            and (keys | sort) == ["code","reason","status","verdict"]
            and .status == "PASS"
            and .code == "INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_CLASSIFIED"
            and (.verdict | IN("APPLIED","NOT_APPLIED","RECOVERY_REQUIRED"))
          ' "$evidence" >/dev/null || {
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_EVIDENCE_INVALID'
            exit 1
          }
