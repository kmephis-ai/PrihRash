name: R1 723 Local Git Publish Transport

on:
  push:
    branches:
      - 'transport/r1-723-publish-20260921-1802'

permissions:
  contents: write
  issues: read

env:
  SOURCE_SHA: af3a468fb3081777a2c4e05468b3a84b797db085
  EXPECTED_TREE: 788016a97567d183a4467c213bf929732f26a0b1
  TARGET_BRANCH: agent/r1-723-phase-diagnostic-20260921
  PATCH_B64: >-
    

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish exact locally verified tree
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GH_TOKEN"
          accept="Accept: application/vnd.github+json"

          main_sha="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/branches/main" | jq -er '.commit.sha')"
          test "$main_sha" = "$SOURCE_SHA"
          issue_state="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/issues/723" | jq -er '.state')"
          test "$issue_state" = "open"

          status="$(curl --silent --output "$RUNNER_TEMP/target.json" --write-out '%{http_code}' --header "$auth" --header "$accept" "$api/branches/$TARGET_BRANCH")"
          test "$status" = "404"

          git checkout --detach "$SOURCE_SHA"
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > "$RUNNER_TEMP/change.patch"
          git apply --check "$RUNNER_TEMP/change.patch"
          git apply "$RUNNER_TEMP/change.patch"
          test "$(git status --short | wc -l | tr -d ' ')" = "9"
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"

          git config user.name "kmephis-ai"
          git config user.email "kmephis@gmail.com"
          git commit -m "R1 #723: expose controlled preparation phase evidence"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

          credentials="$RUNNER_TEMP/git-credentials"
          printf 'https://x-access-token:%s@github.com\\n' "$GH_TOKEN" > "$credentials"
          chmod 600 "$credentials"
          git -c credential.helper="store --file=$credentials" push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$TARGET_BRANCH"
          rm -f "$credentials" "$RUNNER_TEMP/change.patch"
          echo "R1_723_LOCAL_TREE_PUBLISHED=$EXPECTED_TREE"
