name: transport publish 284
on:
  push:
    branches:
      - transport/publish-284
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d1f385077b162e56403e96258f104b17ad9f3ac
          fetch-depth: 0
      - name: Apply exact local patch and publish target branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c fix/r1-reader-committed-admission
          cat > /tmp/r1-284.patch.gz.b64 <<'B64'
          
          B64
          base64 -d /tmp/r1-284.patch.gz.b64 > /tmp/r1-284.patch.gz
          echo '226e8173110d70e34d80b2f299b8bf9b2cd7a8db5d2a7e64d5824c85802e981b  /tmp/r1-284.patch.gz' | sha256sum -c -
          gunzip -c /tmp/r1-284.patch.gz > /tmp/r1-284.patch
          echo 'be3f95c205a6a2f39fbfbc28909f1ae1aa9f5d3b50d220437a6b760b3c1ac95c  /tmp/r1-284.patch' | sha256sum -c -
          git apply --index --whitespace=error /tmp/r1-284.patch
          git config user.name 'kmephis-ai'
          git config user.email 'kmephis@gmail.com'
          git commit -m 'R1: guard Reader on durable committed shadow'
          test "$(git rev-parse HEAD^{tree})" = '35480a0ba818af2033d8e18cac44562faa6ca891'
          git push origin HEAD:refs/heads/fix/r1-reader-committed-admission
