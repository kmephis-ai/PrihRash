name: Transport publish 285c

on:
  push:
    branches:
      - transport/publish-285c

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply byte-exact script patch and publish target branch
        shell: bash
        env:
          BASE_SHA: de928a7e4c85919ddffbc5c286f69b41fe36a8df
          TARGET_BRANCH: fix/r1-test-private-provider-diagnostics
          PATCH_BASE64: 
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          printf '%s' "${PATCH_BASE64}" | base64 --decode > /tmp/diagnostics.patch
          git apply --check /tmp/diagnostics.patch
          git apply /tmp/diagnostics.patch
          git diff --check
          git config user.name 'kmephis-ai'
          git config user.email 'kmephis@gmail.com'
          git add scripts/test-private-controlled-rebuild-smoke.mjs
          git commit -m 'R1: expose safe TEST_PRIVATE provider stage'
          git push origin "HEAD:${TARGET_BRANCH}"
