name: R1 630 controlled dispatch 8521335

on:
  push:
    branches:
      - transport/r1-630-8521335

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-main controlled continuation once
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 8521335ac3f7dfa466cdb61078e7ea40d8bf6964
          RECOVERY_RUN_ID: '35460924990'
          READINESS_RUN_ID: '35461257227'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'

          main_json="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/branches/main")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' <<<"$main_json" >/dev/null

          authority="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/issues/630")"
          jq -e '
            .state == "open"
            and (.title | startswith("R1 WU7:"))
            and (.body | contains("Provider-Authority: WU7_CONTROLLED_REBUILD"))
            and (.body | contains("Authority-Scope: PRODUCTION_YDB_INITIAL_SHADOW_ONLY"))
            and (.body | contains("Google-Authority: PRESERVED"))
            and (.body | contains("Cap-Increase: FORBIDDEN"))
            and (.body | contains("Timer-Cutover: FORBIDDEN"))
            and (.body | contains("Blind-Replay: FORBIDDEN"))
          ' <<<"$authority" >/dev/null

          for tuple in "$RECOVERY_RUN_ID:R1 initial bootstrap recovery" "$READINESS_RUN_ID:R1 Yandex readiness"; do
            IFS=: read -r run_id expected_name <<<"$tuple"
            run="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/runs/$run_id")"
            jq -e --arg sha "$EXPECTED_MAIN_SHA" --arg name "$expected_name" '
              .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch"
              and .status == "completed" and .conclusion == "success" and .name == $name
            ' <<<"$run" >/dev/null
          done

          existing="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/workflows/r1-initial-controlled-rebuild.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$EXPECTED_MAIN_SHA" '.workflow_runs | any(.head_sha == $sha)' <<<"$existing" >/dev/null; then
            echo 'R1_630_CONTROLLED_ALREADY_DISPATCHED'
            exit 0
          fi

          all_runs="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/runs?per_page=100")"
          if jq -e '
            .workflow_runs | any(
              (.status == "queued" or .status == "in_progress")
              and (.name == "R1 initial shadow bootstrap"
                   or .name == "R1 initial bootstrap orchestrator"
                   or .name == "R1 initial controlled rebuild")
            )
          ' <<<"$all_runs" >/dev/null; then
            echo 'R1_630_CONTROLLED_WRITER_ACTIVE'
            exit 1
          fi

          payload="$(jq -cn             --arg issue '630'             --arg sha "$EXPECTED_MAIN_SHA"             --arg recovery "$RECOVERY_RUN_ID"             --arg readiness "$READINESS_RUN_ID"             '{ref:"main",inputs:{
              tracking_issue:$issue,
              expected_main_sha:$sha,
              recovery_run_id:$recovery,
              readiness_run_id:$readiness
            }}')"

          curl --fail --silent --show-error --request POST             --header "$auth_header"             --header "$accept_header"             --header 'X-GitHub-Api-Version: 2022-11-28'             --header 'Content-Type: application/json'             "$api/actions/workflows/r1-initial-controlled-rebuild.yml/dispatches"             --data "$payload"
          echo 'R1_630_CONTROLLED_DISPATCHED'
