name: R1 447 CI Diagnostic

on:
  push:
    branches:
      - ai/r1-447-ci-diagnostic-20260911-2114

permissions:
  contents: read

jobs:
  diagnose-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run synthetic test suite
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          printf 'test_exit=%s\n' "$code" > test-status.txt
          exit 0
      - name: Upload synthetic test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: r1-447-test-output
          path: |
            test-status.txt
            test-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Fail if tests failed
        shell: bash
        run: grep -q '^test_exit=0$' test-status.txt
