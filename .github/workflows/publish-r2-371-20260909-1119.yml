name: Publish R2 #371 exact tree

on:
  push:
    branches:
      - transport/r2-publish-371-20260909-1119

permissions:
  contents: write

env:
  SOURCE_SHA: a4583f186cb71f589ecb3789be273692f02ba635
  EXPECTED_TREE: 7d76151b070adddc5ad750cdf61b2ad01d62979e
  FEATURE_BRANCH: r2/371-excluded-label
  PATCH_GZ_SHA256: 8a6139fe3b3b58c7c4ef8704df990a9e1f2df9ddb9e6d91355a3bfc20399e29b
  PATCH_GZ_B64: 

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Publish exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "${SOURCE_SHA}"
          git checkout --detach "${SOURCE_SHA}"

          printf '%s' "${PATCH_GZ_B64}" | base64 -d > /tmp/r2-371.patch.gz
          echo "${PATCH_GZ_SHA256}  /tmp/r2-371.patch.gz" | sha256sum -c -
          gzip -dc /tmp/r2-371.patch.gz > /tmp/r2-371.patch
          git apply --index /tmp/r2-371.patch

          ACTUAL_TREE="$(git write-tree)"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"

          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git commit -m 'R2: surface analytics exclusion in Reader' -m 'Closes #371.'
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"

          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
