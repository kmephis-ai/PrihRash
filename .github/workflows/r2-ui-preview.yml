name: R2 UI Preview

on:
  pull_request:
    paths:
      - '.github/workflows/r2-ui-preview.yml'
      - 'web/**'
      - 'scripts/build-r2-ui-preview.mjs'
      - 'tests/integration/r2-safe-ui-preview.test.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify synthetic preview boundary
        run: node --test tests/integration/r2-safe-ui-preview.test.mjs
      - name: Build static preview
        run: npm run preview:build
      - name: Privacy smoke
        run: npm run privacy
      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: r2-ui-preview
          path: .artifacts/r2-ui-preview/
          if-no-files-found: error
          retention-days: 7
