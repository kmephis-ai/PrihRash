name: R1 630 6f890cb swap diagnostic dispatch

on:
  push:
    branches:
      - transport/r1-630-6f890cb-swap-diagnostic

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-main read-only swap diagnostic
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 6f890cb209755ce450562552afc3e8ff104805f7
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GH_API_TOKEN}"
          accept='Accept: application/vnd.github+json'
          main="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/branches/main")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' <<<"$main" >/dev/null
          issue="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/issues/630")"
          jq -e '.state == "open" and (.title | startswith("R1 WU7:"))' <<<"$issue" >/dev/null
          all="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/runs?per_page=100")"
          jq -e '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress")|select(.name=="R1 initial shadow bootstrap" or .name=="R1 initial bootstrap orchestrator" or .name=="R1 initial controlled rebuild")]|length==0' <<<"$all" >/dev/null
          payload="$(jq -cn             --arg issue '630'             --arg sha "$EXPECTED_MAIN_SHA"             --arg controlled '35469651936'             --arg recovery '35494270267'             --arg readiness '35494346947'             '{ref:"main",inputs:{tracking_issue:$issue,expected_main_sha:$sha,controlled_run_id:$controlled,recovery_run_id:$recovery,readiness_run_id:$readiness}}')"
          curl --fail --silent --show-error --request POST             --header "$auth" --header "$accept" --header 'X-GitHub-Api-Version: 2022-11-28'             --header 'Content-Type: application/json'             "$api/actions/workflows/r1-initial-controlled-rebuild-swap-recovery.yml/dispatches"             --data "$payload"
          echo R1_630_SWAP_DIAGNOSTIC_DISPATCHED
