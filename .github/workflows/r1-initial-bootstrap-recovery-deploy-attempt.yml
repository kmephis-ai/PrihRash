name: R1 initial bootstrap recovery deploy-only attempt
run-name: R1 recovery-only deploy attempt for failed run ${{ inputs.failed_run_id }}

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Exact latest failed recovery run with deploy failed and invoke skipped
        required: true
        type: string
      ci_run_id:
        description: Exact successful push-CI run for this main SHA
        required: true
        type: string
      source_pr_number:
        description: Exact merged R1 PR carrying the one-shot deploy-only marker
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read
  id-token: write

concurrency:
  group: r1-initial-bootstrap-writer
  cancel-in-progress: false

jobs:
  deploy-only-attempt:
    if: github.repository == 'kmephis-ai/PrihRash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUNCTION_NAME: prihrash-r1-initial-bootstrap
      RUNTIME_SERVICE_ACCOUNT_NAME: prihrash-initial-bootstrap
      LOCKBOX_SECRET_NAME: prihrash-r1-initial-bootstrap
      TARGET_TAG: r1-initial-bootstrap-recovery
      OIDC_AUDIENCE: https://github.com/kmephis-ai
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      OIDC_SUBJECT: repo:kmephis-ai@310519475/PrihRash@1359286840:ref:refs/heads/main
      YC_FOLDER_ID: ${{ secrets.YC_R1_FOLDER_ID }}
      YC_WIF_SERVICE_ACCOUNT_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_WIF_SERVICE_ACCOUNT_ID }}
      YC_LOCKBOX_SECRET_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_LOCKBOX_SECRET_ID }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Prove exact merged authorization, CI and failed deploy boundary
        id: authorization
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'kmephis-ai/PrihRash'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = '1'
          [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'RECOVERY_DEPLOY_ATTEMPT_RUN_ID_INVALID'; exit 1; }
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'RECOVERY_DEPLOY_ATTEMPT_CI_RUN_ID_INVALID'; exit 1; }
          [[ "$SOURCE_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'RECOVERY_DEPLOY_ATTEMPT_PR_NUMBER_INVALID'; exit 1; }
          test -n "$YC_FOLDER_ID"; test -n "$YC_WIF_SERVICE_ACCOUNT_ID"; test -n "$YC_LOCKBOX_SECRET_ID"

          tmp="$RUNNER_TEMP/r1-recovery-deploy-attempt-gates"
          mkdir -p "$tmp"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'

          prior_attempts="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
            "$api/actions/workflows/r1-initial-bootstrap-recovery-deploy-attempt.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          printf '%s\n' "$prior_attempts" > "$tmp/prior-attempts.json"
          printf '{"jobsByRun":[]}\n' > "$tmp/prior-attempt-jobs.json"
          prior_count="$(jq --arg expected "R1 recovery-only deploy attempt for failed run ${FAILED_RUN_ID}" \
            --argjson self_id "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $self_id
              and .name == "R1 initial bootstrap recovery deploy-only attempt"
              and .display_title == $expected)] | length' <<<"$prior_attempts")"
          if [ "$prior_count" -gt 0 ]; then
            prior_run_ids="$(jq -er --arg expected "R1 recovery-only deploy attempt for failed run ${FAILED_RUN_ID}" \
              --argjson self_id "$GITHUB_RUN_ID" '[.workflow_runs[] | select(.id != $self_id
                and .name == "R1 initial bootstrap recovery deploy-only attempt"
                and .display_title == $expected)] | sort_by(.created_at,.id) | .[].id' <<<"$prior_attempts")"
            while IFS= read -r prior_run_id; do
              [ -n "$prior_run_id" ] || continue
              prior_jobs_path="$tmp/prior-attempt-${prior_run_id}-jobs.json"
              curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
                "$api/actions/runs/${prior_run_id}/jobs?filter=latest&per_page=100" \
                --output "$prior_jobs_path" || { echo 'RECOVERY_DEPLOY_ATTEMPT_HISTORY_READ_FAILED'; exit 1; }
              jq --argjson run_id "$prior_run_id" --slurpfile run_jobs "$prior_jobs_path" \
                '.jobsByRun += [{runId:$run_id,jobs:$run_jobs[0]}]' \
                "$tmp/prior-attempt-jobs.json" > "$tmp/prior-attempt-jobs-next.json"
              mv "$tmp/prior-attempt-jobs-next.json" "$tmp/prior-attempt-jobs.json"
            done <<<"$prior_run_ids"
          fi
          prior_attempt_state="$(node scripts/classify-r1-recovery-deploy-attempt-history.mjs \
            "$tmp/prior-attempts.json" "$tmp/prior-attempt-jobs.json" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$FAILED_RUN_ID")"
          case "$prior_attempt_state" in
            NO_PRIOR_ATTEMPT|PRIOR_PREWRITE_STOP_ONLY) ;;
            ATTEMPT_HISTORY_INCOMPLETE|ATTEMPT_HISTORY_INVALID|ATTEMPT_HISTORY_AMBIGUOUS|ATTEMPT_HISTORY_UNCLASSIFIED)
              echo 'RECOVERY_DEPLOY_ATTEMPT_HISTORY_UNCLASSIFIED'; exit 1 ;;
            SAME_SHA_PREWRITE_STOP_FORBIDDEN|PRIOR_ATTEMPT_ACTIVE|PRIOR_ATTEMPT_CONSUMED)
              echo 'RECOVERY_DEPLOY_ATTEMPT_ALREADY_CONSUMED_FOR_FAILED_RUN'; exit 1 ;;
            *) echo 'RECOVERY_DEPLOY_ATTEMPT_HISTORY_UNCLASSIFIED'; exit 1 ;;
          esac

          curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
            "$api/branches/main" --output "$tmp/main.json"
          jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha and .protected == true' \
            "$tmp/main.json" >/dev/null || { echo 'RECOVERY_DEPLOY_ATTEMPT_MAIN_GATE_NOT_READY'; exit 1; }

          curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
            "$api/actions/runs/${CI_RUN_ID}" --output "$tmp/ci-run.json"
          ci_state="$(node scripts/classify-github-ci-run.mjs "$tmp/ci-run.json" "$CI_RUN_ID" "$GITHUB_SHA")"
          [ "$ci_state" = 'CI_RUN_EXACT_SUCCESS' ] || { echo 'RECOVERY_DEPLOY_ATTEMPT_EXACT_CI_NOT_PROVEN'; exit 1; }

          curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
            "$api/pulls/${SOURCE_PR_NUMBER}" --output "$tmp/source-pr.json"
          jq -e --argjson number "$SOURCE_PR_NUMBER" --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .number == $number and .base.ref == "main" and .head.repo.full_name == $repo
            and .merged_at != null and .merge_commit_sha == $sha and (.title | startswith("R1 #453:"))
          ' "$tmp/source-pr.json" >/dev/null || { echo 'RECOVERY_DEPLOY_ATTEMPT_SOURCE_PR_NOT_EXACT'; exit 1; }
          issue_630_state="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
            "$api/issues/630" | jq -er '.state')"
          [ "$issue_630_state" = 'open' ] || { echo 'RECOVERY_DEPLOY_ATTEMPT_TRACKING_ISSUE_INACTIVE'; exit 1; }
          source_body="$(jq -r '.body // ""' "$tmp/source-pr.json")"
          jq -Rn --arg body "$source_body" '
            def exact_line($prefix): ($body | split("\n") | map(select(startswith($prefix))));
            (exact_line("Provider-Attempt: ")) as $attempt
            | (exact_line("Observed-Signature: ")) as $observed
            | (exact_line("Expected-Transition: ")) as $expected
            | (exact_line("Recovery-State: ")) as $state
            | (exact_line("Circuit-Rearm: ")) as $rearm
            | (exact_line("Recovery-Run-ID: ")) as $run
            | (exact_line("Regression-Test: ")) as $test
            | ($attempt == ["Provider-Attempt: READY"]
              and $observed == ["Observed-Signature: INITIAL_BOOTSTRAP_RECOVERY_DEPLOY_FAILED"]
              and $expected == ["Expected-Transition: RECOVERY_ONLY_FUNCTION_VERSION_CREATE_CLASSIFIED"]
              and $state == ["Recovery-State: DEPLOYMENT_OUTCOME_UNCLASSIFIED"]
              and $rearm == ["Circuit-Rearm: OWNER_AUTHORIZED_SINGLE_RECOVERY_DEPLOY"]
              and $run == ["Recovery-Run-ID: 36341844854"]
              and $test == ["Regression-Test: tests/tooling/initial-bootstrap-recovery-deploy-attempt-workflow.test.mjs"])
          ' <<<"$source_body" | jq -e . >/dev/null || { echo 'RECOVERY_DEPLOY_ATTEMPT_OWNER_MARKER_INVALID'; exit 1; }

          failed_runs="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
            "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&status=failure&per_page=100")"
          latest_failed_id="$(jq -er '
            [.workflow_runs[] | select(.name == "R1 initial bootstrap recovery" and .head_branch == "main"
              and .event == "workflow_dispatch" and .conclusion == "failure" and (.id | type == "number"))]
            | sort_by(.created_at,.id) | reverse | .[0].id // empty
          ' <<<"$failed_runs")"
          [ "$FAILED_RUN_ID" = "$latest_failed_id" ] || { echo 'RECOVERY_DEPLOY_ATTEMPT_FAILED_RUN_NOT_LATEST'; exit 1; }
          curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
            "$api/actions/runs/${FAILED_RUN_ID}" --output "$tmp/failed-run.json"
          jq -e --argjson id "$FAILED_RUN_ID" '
            .id == $id and .name == "R1 initial bootstrap recovery" and .head_branch == "main"
            and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "failure"
          ' "$tmp/failed-run.json" >/dev/null || { echo 'RECOVERY_DEPLOY_ATTEMPT_FAILED_RUN_NOT_EXACT'; exit 1; }
          curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
            "$api/actions/runs/${FAILED_RUN_ID}/jobs?filter=latest&per_page=100" --output "$tmp/failed-jobs.json"
          jq -e '
            [.jobs[] | select(.name == "initial-bootstrap-recovery")] as $jobs
            | ($jobs | length) == 1
            and ([$jobs[0].steps[]? | select(.name == "Deploy recovery-only Function version" and .conclusion == "failure")] | length) == 1
            and ([$jobs[0].steps[]? | select(.name == "Invoke exact read-only recovery tag once" and .conclusion == "skipped")] | length) == 1
          ' "$tmp/failed-jobs.json" >/dev/null || { echo 'RECOVERY_DEPLOY_ATTEMPT_FAILURE_PHASE_NOT_PROVEN'; exit 1; }

          curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
            "$api/actions/workflows/r1-initial-bootstrap-recovery-deploy-attempt.yml/runs?branch=main&event=workflow_dispatch&per_page=100" \
            --output "$tmp/prior-attempts.json"
          if jq -e --arg sha "$GITHUB_SHA" '.workflow_runs | any(.head_sha == $sha)' \
            "$tmp/prior-attempts.json" >/dev/null; then
            echo 'RECOVERY_DEPLOY_ATTEMPT_ALREADY_USED_FOR_SHA'; exit 1
          fi
          active_runs="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" \
            "$api/actions/runs?per_page=100")"
          if jq -e --arg self "$GITHUB_RUN_ID" '
            .workflow_runs | any(.id != ($self | tonumber) and (.status == "queued" or .status == "in_progress")
              and (.name == "R1 initial bootstrap orchestrator" or .name == "R1 initial shadow bootstrap"
                or .name == "R1 initial bootstrap recovery" or .name == "R1 initial bootstrap recovery deploy-only attempt"))
          ' <<<"$active_runs" >/dev/null; then
            echo 'RECOVERY_DEPLOY_ATTEMPT_WRITER_CONFLICT'; exit 1
          fi

          printf 'failed_run_id=%s\nci_run_id=%s\n' "$FAILED_RUN_ID" "$CI_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact-source deployment dependencies
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore exact-main provider artifact
        uses: ./.github/actions/restore-exact-source
        with:
          source-sha: ${{ github.sha }}
          github-token: ${{ github.token }}

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/yc"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$install_dir"
          yc_bin="$(find "$install_dir" -type f -name yc -perm -u+x -print -quit)"
          test -n "$yc_bin"
          echo "$(dirname "$yc_bin")" >> "$GITHUB_PATH"
          "$yc_bin" version >/dev/null

      - name: Exchange exact GitHub OIDC identity for short-lived Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-recovery-deploy-attempt-auth"
          mkdir -p "$tmp"
          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value | @uri')"
          curl --fail --silent --show-error \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" --output "$tmp/oidc.json"
          oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' "$tmp/oidc.json")"
          echo "::add-mask::${oidc_token}"
          token_payload="${oidc_token#*.}"; token_payload="${token_payload%%.*}"
          token_payload="${token_payload//-/+}"; token_payload="${token_payload//_/\/}"
          case "$((${#token_payload} % 4))" in
            0) ;;
            2) token_payload="${token_payload}==" ;;
            3) token_payload="${token_payload}=" ;;
            *) echo 'RECOVERY_DEPLOY_ATTEMPT_OIDC_CLAIMS_INVALID'; exit 1 ;;
          esac
          printf '%s' "$token_payload" | base64 --decode >"$tmp/claims.json"
          jq -e --arg issuer "$OIDC_ISSUER" --arg audience "$OIDC_AUDIENCE" --arg subject "$OIDC_SUBJECT" '
            .iss == $issuer
            and ((.aud == $audience) or ((.aud | type) == "array" and (.aud | length) == 1 and .aud[0] == $audience))
            and .sub == $subject
          ' "$tmp/claims.json" >/dev/null || { echo 'RECOVERY_DEPLOY_ATTEMPT_OIDC_CLAIMS_INVALID'; exit 1; }
          curl --fail --silent --show-error --request POST https://auth.yandex.cloud/oauth/token \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_WIF_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${oidc_token}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --output "$tmp/iam.json"
          iam_token="$(jq -er '.access_token | select(type == "string" and length > 0)' "$tmp/iam.json")"
          echo "::add-mask::${iam_token}"
          printf 'YC_IAM_TOKEN=%s\n' "$iam_token" >> "$GITHUB_ENV"

      - name: Prove private exact Function and deployment references
        id: preflight
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-recovery-deploy-attempt-preflight"
          mkdir -p "$tmp"
          current_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -er '.commit.sha')"
          test "$current_sha" = "$GITHUB_SHA" || { echo 'RECOVERY_DEPLOY_ATTEMPT_MAIN_MOVED_BEFORE_PREFLIGHT'; exit 1; }

          yc serverless function get --name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/function.json" 2>"$tmp/function.err" || {
              echo 'RECOVERY_DEPLOY_ATTEMPT_FUNCTION_READ_FAILED'; exit 1;
            }
          function_id="$(jq -er '.id | select(type == "string" and length > 0)' "$tmp/function.json")"
          echo "::add-mask::${function_id}"
          jq -e '.status == "ACTIVE"' "$tmp/function.json" >/dev/null || {
            echo 'RECOVERY_DEPLOY_ATTEMPT_FUNCTION_NOT_ACTIVE'; exit 1;
          }
          yc serverless function list-access-bindings --id "$function_id" --format json --retry 0 --no-user-output \
            >"$tmp/function-bindings.json" 2>"$tmp/function-bindings.err" || {
              echo 'RECOVERY_DEPLOY_ATTEMPT_BINDINGS_READ_FAILED'; exit 1;
            }
          jq -e '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject.id]
            | any(. == "allUsers" or . == "allAuthenticatedUsers") | not' \
            "$tmp/function-bindings.json" >/dev/null || { echo 'RECOVERY_DEPLOY_ATTEMPT_FUNCTION_PUBLIC'; exit 1; }
          jq -e --arg wif "$YC_WIF_SERVICE_ACCOUNT_ID" '
            [.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject]
            | any(.type == "serviceAccount" and .id == $wif)
          ' "$tmp/function-bindings.json" >/dev/null || { echo 'RECOVERY_DEPLOY_ATTEMPT_INVOKER_BINDING_MISSING'; exit 1; }
          jq -e --arg wif "$YC_WIF_SERVICE_ACCOUNT_ID" '
            [.[]? | select((.role_id // .roleId) == "functions.editor") | .subject]
            | any(.type == "serviceAccount" and .id == $wif)
          ' "$tmp/function-bindings.json" >/dev/null || { echo 'RECOVERY_DEPLOY_ATTEMPT_EDITOR_BINDING_MISSING'; exit 1; }

          yc serverless trigger list --folder-id "$YC_FOLDER_ID" --format json --retry 0 --no-user-output \
            >"$tmp/triggers.json" 2>"$tmp/triggers.err" || { echo 'RECOVERY_DEPLOY_ATTEMPT_TRIGGER_LIST_FAILED'; exit 1; }
          if jq -e --arg function_id "$function_id" '.. | strings | select(. == $function_id)' \
            "$tmp/triggers.json" >/dev/null; then
            echo 'RECOVERY_DEPLOY_ATTEMPT_TRIGGER_PRESENT'; exit 1
          fi

          runtime_sa="$(yc iam service-account get --name "$RUNTIME_SERVICE_ACCOUNT_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output 2>"$tmp/runtime-sa.err" | jq -er '.id | select(type == "string" and length > 0)')"
          echo "::add-mask::${runtime_sa}"
          echo "::add-mask::${YC_LOCKBOX_SECRET_ID}"
          secret_status="$(curl --silent --show-error --output "$tmp/lockbox-secret.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            "https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${YC_LOCKBOX_SECRET_ID}" 2>"$tmp/lockbox-secret.err")" || {
              echo 'RECOVERY_DEPLOY_ATTEMPT_LOCKBOX_READ_FAILED'; exit 1;
            }
          case "$secret_status" in
            2??) ;;
            401) echo 'RECOVERY_DEPLOY_ATTEMPT_LOCKBOX_AUTH_FAILED'; exit 1 ;;
            403) echo 'RECOVERY_DEPLOY_ATTEMPT_LOCKBOX_PERMISSION_DENIED'; exit 1 ;;
            404) echo 'RECOVERY_DEPLOY_ATTEMPT_LOCKBOX_NOT_FOUND'; exit 1 ;;
            *) echo 'RECOVERY_DEPLOY_ATTEMPT_LOCKBOX_UNEXPECTED_STATUS'; exit 1 ;;
          esac
          jq -e --arg id "$YC_LOCKBOX_SECRET_ID" --arg name "$LOCKBOX_SECRET_NAME" --arg folder "$YC_FOLDER_ID" '
            .id == $id and .name == $name and .folderId == $folder and .status == "ACTIVE"
            and (.currentVersion.id | type == "string" and length > 0)
          ' "$tmp/lockbox-secret.json" >/dev/null || { echo 'RECOVERY_DEPLOY_ATTEMPT_LOCKBOX_METADATA_INVALID'; exit 1; }

          secret_version_id="$(jq -er '.currentVersion.id' "$tmp/lockbox-secret.json")"
          echo "::add-mask::${secret_version_id}"
          printf 'function_id=%s\nruntime_sa=%s\nsecret_version_id=%s\n' \
            "$function_id" "$runtime_sa" "$secret_version_id" >> "$GITHUB_OUTPUT"

      - name: Re-assert exact main before the one-shot recovery-only version create
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -er '.commit.sha')"
          test "$current_sha" = "$GITHUB_SHA" || { echo 'RECOVERY_DEPLOY_ATTEMPT_MAIN_MOVED_BEFORE_CREATE'; exit 1; }

      - name: Create exactly one read-only recovery Function version without invoking it
        id: deploy
        shell: bash
        env:
          FUNCTION_ID: ${{ steps.preflight.outputs.function_id }}
          RUNTIME_SA_ID: ${{ steps.preflight.outputs.runtime_sa }}
          LOCKBOX_VERSION_ID: ${{ steps.preflight.outputs.secret_version_id }}
          RECOVERY_FUNCTION_ID: ${{ steps.preflight.outputs.function_id }}
          RECOVERY_RUNTIME_SERVICE_ACCOUNT_ID: ${{ steps.preflight.outputs.runtime_sa }}
          RECOVERY_WIF_SERVICE_ACCOUNT_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_WIF_SERVICE_ACCOUNT_ID }}
          RECOVERY_LOCKBOX_SECRET_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_LOCKBOX_SECRET_ID }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-recovery-deploy-attempt-result"
          evidence_dir="$RUNNER_TEMP/r1-recovery-deploy-attempt-evidence"
          mkdir -p "$tmp" "$evidence_dir"
          echo "::add-mask::${FUNCTION_ID}"
          echo "::add-mask::${RUNTIME_SA_ID}"
          echo "::add-mask::${LOCKBOX_VERSION_ID}"
          if yc serverless function version create \
            --function-id "$FUNCTION_ID" \
            --runtime nodejs22 \
            --entrypoint index.initialBootstrapRecoveryHandler \
            --memory 1g \
            --execution-timeout 150s \
            --environment 'PRIHRASH_R1_RECOVERY_SURFACE_ONLY=0' \
            --environment 'PRIHRASH_R1_RECOVERY_CONTROLLED_PREPARATION_ONLY=0' \
            --environment 'PRIHRASH_R1_RECOVERY_REVISION_CARDINALITY_ONLY=0' \
            --source-path .artifacts/yandex-initial-bootstrap-recovery-function \
            --service-account-id "$RUNTIME_SA_ID" \
            --tags "$TARGET_TAG" \
            --metadata-options gce-http-endpoint=enabled,aws-v1-http-endpoint=disabled \
            --no-logging \
            --secret "environment-variable=PRIHRASH_GOOGLE_SPREADSHEET_ID,id=${YC_LOCKBOX_SECRET_ID},version-id=${LOCKBOX_VERSION_ID},key=google_spreadsheet_id" \
            --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_EMAIL,id=${YC_LOCKBOX_SECRET_ID},version-id=${LOCKBOX_VERSION_ID},key=google_service_account_email" \
            --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY,id=${YC_LOCKBOX_SECRET_ID},version-id=${LOCKBOX_VERSION_ID},key=google_service_account_private_key" \
            --secret "environment-variable=PRIHRASH_YDB_CONNECTION_STRING,id=${YC_LOCKBOX_SECRET_ID},version-id=${LOCKBOX_VERSION_ID},key=ydb_connection_string" \
            --secret "environment-variable=PRIHRASH_INITIAL_BOOTSTRAP_PRIVATE_HISTORICAL_EVIDENCE,id=${YC_LOCKBOX_SECRET_ID},version-id=${LOCKBOX_VERSION_ID},key=initial_bootstrap_private_historical_evidence" \
            --format json --retry 0 --no-user-output >"$tmp/version.json" 2>"$tmp/version.err"; then
            node scripts/classify-yandex-initial-bootstrap-recovery-deploy-attempt.mjs --success \
              >"$evidence_dir/recovery-deploy-attempt.json"
            printf 'result=accepted\n' >> "$GITHUB_OUTPUT"
          else
            node scripts/classify-yandex-initial-bootstrap-recovery-deploy-attempt.mjs \
              --error "$tmp/version.err" >"$evidence_dir/recovery-deploy-attempt.json"
            printf 'result=failed\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$evidence_dir/recovery-deploy-attempt.json"

      - name: Re-assert exact main after the one-shot deploy-only result
        if: always()
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -er '.commit.sha')"
          test "$current_sha" = "$GITHUB_SHA" || { echo 'RECOVERY_DEPLOY_ATTEMPT_MAIN_MOVED_AFTER_CREATE'; exit 1; }

      - name: Publish enum-only recovery deploy attempt result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-initial-bootstrap-recovery-deploy-attempt-${{ github.run_id }}
          path: ${{ runner.temp }}/r1-recovery-deploy-attempt-evidence/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Preserve failed create as the consumed terminal outcome
        if: steps.deploy.outputs.result == 'failed'
        shell: bash
        run: |
          echo 'RECOVERY_DEPLOY_ATTEMPT_CLASSIFIED_FAILED_NO_RETRY'
          exit 1
