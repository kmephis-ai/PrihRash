name: Publish R2 #336 exact local commit

on:
  push:
    branches:
      - transport/r2-table-20260908-2140
    paths:
      - .github/workflows/publish-r2-336.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 008d75de4537a8bc11316536e96aa72f45ab4d2c
          fetch-depth: 0
      - name: Verify base, apply exact patch and publish branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse FETCH_HEAD)" = "008d75de4537a8bc11316536e96aa72f45ab4d2c"
          cat > /tmp/r2-336.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/r2-336.patch.gz.b64 | gzip -d > /tmp/r2-336.patch
          git apply --index --whitespace=error-all /tmp/r2-336.patch
          test "$(git write-tree)" = "a5e04c961d6ad6a6138606d01185e4a5a1dbaa06"
          git config user.name 'kmephis-ai'
          git config user.email 'kmephis@gmail.com'
          git commit -m 'R2: desktop table mode for operations' -m 'Closes #336.'
          test "$(git rev-parse HEAD^{tree})" = "a5e04c961d6ad6a6138606d01185e4a5a1dbaa06"
          git push origin HEAD:refs/heads/r2/336-desktop-table
