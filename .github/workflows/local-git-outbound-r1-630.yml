name: R1 WU7 Refresh Readiness Control

on:
  push:
    branches:
      - transport/r1-630-publish-16c2948
    paths:
      - .github/workflows/local-git-outbound-r1-630.yml

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: r1-wu7-refresh-readiness-control
  cancel-in-progress: false

jobs:
  dispatch-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fresh exact-main readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: d55abbaf7c194df6d482975cfaf71c88e4fa34ee
          RECOVERY_RUN_ID: "35384665962"
          TRACKING_ISSUE: "630"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail --silent --show-error "${auth[@]}" "$api/branches/main" -o /tmp/main.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' /tmp/main.json >/dev/null
          curl --fail --silent --show-error "${auth[@]}" "$api/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" -o /tmp/ci.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' /tmp/ci.json >/dev/null
          curl --fail --silent --show-error "${auth[@]}" "$api/issues/$TRACKING_ISSUE" -o /tmp/issue.json
          jq -e '.state=="open" and (.body|contains("Provider-Authority: WU7_CONTROLLED_REBUILD")) and (.body|contains("Blind-Replay: FORBIDDEN"))' /tmp/issue.json >/dev/null
          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$RECOVERY_RUN_ID" -o /tmp/recovery.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.name=="R1 initial bootstrap recovery" and .head_sha==$sha and .event=="workflow_dispatch" and .conclusion=="success"' /tmp/recovery.json >/dev/null
          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs?per_page=100" -o /tmp/runs.json
          jq -e --argjson self "$GITHUB_RUN_ID" '
            [.workflow_runs[] | select(.id != $self) | select(.status=="queued" or .status=="in_progress")
             | select(.name=="R1 initial shadow bootstrap" or .name=="R1 initial bootstrap orchestrator" or .name=="R1 initial controlled rebuild")] | length == 0
          ' /tmp/runs.json >/dev/null
          code="$(curl --silent --show-error -o /tmp/dispatch.out -w '%{http_code}' -X POST "${auth[@]}" "$api/actions/workflows/r1-yandex-readiness.yml/dispatches" -H 'Content-Type: application/json' -d '{"ref":"main"}')"
          test "$code" = "204"
          echo "R1_WU7_REFRESH_READINESS_DISPATCHED"
