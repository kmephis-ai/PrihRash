name: R1 WU7 Cancel Duplicate Recovery

on:
  push:
    branches:
      - transport/r1-630-publish-16c2948
    paths:
      - .github/workflows/local-git-outbound-r1-630.yml

permissions:
  contents: read
  actions: write

jobs:
  cancel-duplicate:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel exact duplicate pending recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DUPLICATE_RUN_ID: "35389111224"
          EXPECTED_MAIN_SHA: eaa789c7cdd4ea07ac90d577726af431458d059d
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$DUPLICATE_RUN_ID" -o /tmp/run.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .name == "R1 initial bootstrap recovery"
            and .head_sha == $sha
            and .event == "workflow_dispatch"
            and (.status == "queued" or .status == "pending" or .status == "in_progress")
          ' /tmp/run.json >/dev/null

          code="$(curl --silent --show-error -o /tmp/cancel.out -w '%{http_code}' -X POST "${auth[@]}" "$api/actions/runs/$DUPLICATE_RUN_ID/cancel")"
          test "$code" = "202"
          echo "R1_WU7_DUPLICATE_RECOVERY_CANCEL_REQUESTED"
