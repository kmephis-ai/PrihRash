name: R1 WU7 Controlled Rebuild Control

on:
  push:
    branches:
      - transport/r1-630-publish-16c2948
    paths:
      - .github/workflows/local-git-outbound-r1-630.yml

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: r1-wu7-controlled-rebuild-control
  cancel-in-progress: false

jobs:
  dispatch-controlled-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exactly one authorized controlled rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 002639d0d1365588aefb913a6faaf581153b9084
          TRACKING_ISSUE: "630"
          RECOVERY_RUN_ID: "35378945869"
          READINESS_RUN_ID: "35380903652"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail --silent --show-error "${auth[@]}" "$api/branches/main" -o /tmp/main.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' /tmp/main.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" -o /tmp/ci.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' /tmp/ci.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/issues/$TRACKING_ISSUE" -o /tmp/issue.json
          jq -e '
            .state == "open"
            and (.title | startswith("R1 WU7:"))
            and (.body | contains("Provider-Authority: WU7_CONTROLLED_REBUILD"))
            and (.body | contains("Authority-Scope: PRODUCTION_YDB_INITIAL_SHADOW_ONLY"))
            and (.body | contains("Google-Authority: PRESERVED"))
            and (.body | contains("Cap-Increase: FORBIDDEN"))
            and (.body | contains("Timer-Cutover: FORBIDDEN"))
            and (.body | contains("Blind-Replay: FORBIDDEN"))
          ' /tmp/issue.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$RECOVERY_RUN_ID" -o /tmp/recovery.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .name == "R1 initial bootstrap recovery"
            and .head_sha == $sha
            and .head_branch == "main"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "success"
          ' /tmp/recovery.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$READINESS_RUN_ID" -o /tmp/readiness.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .name == "R1 Yandex readiness"
            and .head_sha == $sha
            and .head_branch == "main"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "success"
          ' /tmp/readiness.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs?per_page=100" -o /tmp/runs.json
          jq -e --argjson self "$GITHUB_RUN_ID" '
            [.workflow_runs[]
              | select(.id != $self)
              | select(.status == "queued" or .status == "in_progress")
              | select(
                  .name == "R1 initial shadow bootstrap"
                  or .name == "R1 initial bootstrap orchestrator"
                  or .name == "R1 initial controlled rebuild"
                )
            ] | length == 0
          ' /tmp/runs.json >/dev/null

          payload="$(jq -n             --arg ref "main"             --arg issue "$TRACKING_ISSUE"             --arg sha "$EXPECTED_MAIN_SHA"             --arg recovery "$RECOVERY_RUN_ID"             --arg readiness "$READINESS_RUN_ID"             '{ref:$ref,inputs:{tracking_issue:$issue,expected_main_sha:$sha,recovery_run_id:$recovery,readiness_run_id:$readiness}}')"

          code="$(curl --silent --show-error -o /tmp/dispatch.out -w '%{http_code}' -X POST "${auth[@]}"             "$api/actions/workflows/r1-initial-controlled-rebuild.yml/dispatches"             -H 'Content-Type: application/json' -d "$payload")"
          test "$code" = "204"
          echo "R1_WU7_CONTROLLED_REBUILD_DISPATCHED"
