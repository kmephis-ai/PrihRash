name: R1 WU7 3a0f Readiness Control

on:
  push:
    branches:
      - transport/r1-630-publish-16c2948
    paths:
      - .github/workflows/local-git-outbound-r1-630.yml

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: r1-wu7-3a0f-readiness-control
  cancel-in-progress: false

jobs:
  dispatch-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fresh exact-main readiness
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 3a0faca4b0c14bc7f6f855b377de61aaac675016
          RECOVERY_RUN_ID: "35395880982"
          DEPLOY_RECOVERY_RUN_ID: "35395755112"
          TRACKING_ISSUE: "630"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail --silent --show-error "${auth[@]}" "$api/branches/main" -o /tmp/main.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' /tmp/main.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/issues/$TRACKING_ISSUE" -o /tmp/issue.json
          jq -e '
            .state == "open"
            and (.title | startswith("R1 WU7:"))
            and (.body | contains("Provider-Authority: WU7_CONTROLLED_REBUILD"))
            and (.body | contains("Google-Authority: PRESERVED"))
            and (.body | contains("Blind-Replay: FORBIDDEN"))
          ' /tmp/issue.json >/dev/null

          for tuple in             "recovery:$RECOVERY_RUN_ID:R1 initial bootstrap recovery"             "deploy:$DEPLOY_RECOVERY_RUN_ID:R1 initial controlled rebuild deploy recovery"; do
            IFS=: read -r kind run_id expected_name <<<"$tuple"
            curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$run_id" -o "/tmp/$kind.json"
            jq -e --arg sha "$EXPECTED_MAIN_SHA" --arg name "$expected_name" '
              .head_sha == $sha
              and .head_branch == "main"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .name == $name
            ' "/tmp/$kind.json" >/dev/null
          done

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs?per_page=100" -o /tmp/runs.json
          jq -e --argjson self "$GITHUB_RUN_ID" '
            [.workflow_runs[]
              | select(.id != $self)
              | select(.status == "queued" or .status == "in_progress")
              | select(
                  .name == "R1 initial shadow bootstrap"
                  or .name == "R1 initial bootstrap orchestrator"
                  or .name == "R1 initial controlled rebuild"
                )
            ] | length == 0
          ' /tmp/runs.json >/dev/null

          code="$(curl --silent --show-error -o /tmp/dispatch.out -w '%{http_code}' -X POST "${auth[@]}"             "$api/actions/workflows/r1-yandex-readiness.yml/dispatches"             -H 'Content-Type: application/json' -d '{"ref":"main"}')"
          test "$code" = "204"
          echo "R1_WU7_3A0F_READINESS_DISPATCHED"
