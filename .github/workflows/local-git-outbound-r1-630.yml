name: Local Git Outbound R1 630

on:
  push:
    branches:
      - transport/r1-630-publish-16c2948
    paths:
      - .github/workflows/local-git-outbound-r1-630.yml

permissions:
  contents: write

concurrency:
  group: local-git-outbound-r1-630
  cancel-in-progress: false

jobs:
  stage-helper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          ref: transport/r1-630-publish-16c2948
          fetch-depth: 0

      - name: Reconstruct and prove exact immutable patch
        shell: bash
        env:
          BASE_SHA: 16c2948cbdac8f2210722f2050425127101940d6
          PATCH_GZ_SHA256: e5e929fd665cfd4db785629f0a9013374a1ad90e4c9f4028b0b3318dfbe29c39
          PATCH_SHA256: 9deeacbc88e5ddecbf99553993846bc6db6a4d01624de6532f0a649967b79cae
          EXPECTED_TREE: 629e8247d3f24922e6bebea65e73239cb4b530ff
          TARGET_PARENT: f6f32fe24f6dacfe31f0e398c4b92fc32b7995e7
          TARGET_BRANCH: fix/r1-630-controlled-rebuild-runtime
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_main" = "$BASE_SHA"
          target="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$target" = "$TARGET_PARENT"

          cat \
            tools/local-git-mirror/outbound/r1-630.00.b64 \
            tools/local-git-mirror/outbound/r1-630.01.b64 \
            tools/local-git-mirror/outbound/r1-630.02.b64 \
            tools/local-git-mirror/outbound/r1-630.03.b64 \
            tools/local-git-mirror/outbound/r1-630.04.b64 \
            > /tmp/r1-630.patch.gz.b64
          base64 --decode /tmp/r1-630.patch.gz.b64 > /tmp/r1-630.patch.gz
          echo "$PATCH_GZ_SHA256  /tmp/r1-630.patch.gz" | sha256sum --check -
          gzip -dc /tmp/r1-630.patch.gz > /tmp/r1-630.patch
          echo "$PATCH_SHA256  /tmp/r1-630.patch" | sha256sum --check -

          git checkout --detach "$BASE_SHA"
          git apply --index --whitespace=error-all /tmp/r1-630.patch
          test "$(git write-tree)" = "$EXPECTED_TREE"
          base64 -w 0 .github/workflows/r1-initial-controlled-rebuild.yml > /tmp/r1-630.workflow.b64
          test "$(wc -c < /tmp/r1-630.workflow.b64)" = "36180"

          git checkout -B "$TARGET_BRANCH" "$TARGET_PARENT"
          mkdir -p tools/local-git-mirror/outbound
          cp /tmp/r1-630.workflow.b64 tools/local-git-mirror/outbound/r1-630.workflow.b64
          git add tools/local-git-mirror/outbound/r1-630.workflow.b64
          git config user.name "PrihRash AI Transport"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "transport: stage exact R1 #630 workflow payload"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

          echo "HELPER_COMMIT_SHA=$(git rev-parse HEAD)"
