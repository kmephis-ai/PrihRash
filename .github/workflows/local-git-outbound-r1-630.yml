name: R1 WU7 Post-Invoke Recovery Control

on:
  push:
    branches:
      - transport/r1-630-publish-16c2948
    paths:
      - .github/workflows/local-git-outbound-r1-630.yml

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: r1-wu7-post-invoke-recovery-control
  cancel-in-progress: false

jobs:
  dispatch-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch post-invoke read-only recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: eaa789c7cdd4ea07ac90d577726af431458d059d
          TRACKING_ISSUE: "630"
          FAILED_CONTROLLED_RUN_ID: "35388032148"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail --silent --show-error "${auth[@]}" "$api/branches/main" -o /tmp/main.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' /tmp/main.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/issues/$TRACKING_ISSUE" -o /tmp/issue.json
          jq -e '
            .state == "open"
            and (.body | contains("Provider-Authority: WU7_CONTROLLED_REBUILD"))
            and (.body | contains("Blind-Replay: FORBIDDEN"))
          ' /tmp/issue.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$FAILED_CONTROLLED_RUN_ID" -o /tmp/failed.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .name == "R1 initial controlled rebuild"
            and .head_sha == $sha
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "failure"
          ' /tmp/failed.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs?per_page=100" -o /tmp/runs.json
          jq -e --argjson self "$GITHUB_RUN_ID" '
            [.workflow_runs[]
              | select(.id != $self)
              | select(.status == "queued" or .status == "in_progress")
              | select(
                  .name == "R1 initial shadow bootstrap"
                  or .name == "R1 initial bootstrap orchestrator"
                  or .name == "R1 initial controlled rebuild"
                )
            ] | length == 0
          ' /tmp/runs.json >/dev/null

          code="$(curl --silent --show-error -o /tmp/dispatch.out -w '%{http_code}' -X POST "${auth[@]}"             "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/dispatches"             -H 'Content-Type: application/json' -d '{"ref":"main","inputs":{"surface_only":"false"}}')"
          test "$code" = "204"
          echo "R1_WU7_POST_INVOKE_RECOVERY_DISPATCHED"
