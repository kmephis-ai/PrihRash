name: R1 WU7 826a Provider Repair Control

on:
  push:
    branches:
      - transport/r1-630-publish-16c2948
    paths:
      - .github/workflows/local-git-outbound-r1-630.yml

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: r1-wu7-826a-provider-repair-control
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one exact-main provider repair-only run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 826aee87547965ec05dea33f7727af88ec7d42fc
          DEPLOY_RECOVERY_RUN_ID: "35425639286"
          RECOVERY_RUN_ID: "35425698309"
          READINESS_RUN_ID: "35425777009"
          TRACKING_ISSUE: "630"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail --silent --show-error "${auth[@]}" "$api/branches/main" -o /tmp/main.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' /tmp/main.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/issues/$TRACKING_ISSUE" -o /tmp/issue.json
          jq -e '.state == "open" and (.body | contains("Provider-Authority: WU7_CONTROLLED_REBUILD")) and (.body | contains("Blind-Replay: FORBIDDEN"))' /tmp/issue.json >/dev/null

          for tuple in "deploy:$DEPLOY_RECOVERY_RUN_ID:R1 initial controlled rebuild deploy recovery" "recovery:$RECOVERY_RUN_ID:R1 initial bootstrap recovery" "readiness:$READINESS_RUN_ID:R1 Yandex readiness"; do
            IFS=: read -r kind run_id expected_name <<<"$tuple"
            curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$run_id" -o "/tmp/$kind.json"
            jq -e --arg sha "$EXPECTED_MAIN_SHA" --arg name "$expected_name" '
              .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch"
              and .status == "completed" and .conclusion == "success" and .name == $name
            ' "/tmp/$kind.json" >/dev/null
          done

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs?per_page=100" -o /tmp/runs.json
          jq -e --argjson self "$GITHUB_RUN_ID" '
            [.workflow_runs[]
             | select(.id != $self)
             | select(.status == "queued" or .status == "in_progress")
             | select(.name == "R1 initial shadow bootstrap"
                   or .name == "R1 initial bootstrap orchestrator"
                   or .name == "R1 initial controlled rebuild")]
            | length == 0
          ' /tmp/runs.json >/dev/null

          payload="$(jq -nc             --arg issue "$TRACKING_ISSUE"             --arg sha "$EXPECTED_MAIN_SHA"             --arg recovery "$RECOVERY_RUN_ID"             --arg readiness "$READINESS_RUN_ID"             --arg deploy "$DEPLOY_RECOVERY_RUN_ID"             '{ref:"main",inputs:{tracking_issue:$issue,expected_main_sha:$sha,recovery_run_id:$recovery,readiness_run_id:$readiness,deploy_recovery_run_id:$deploy}}')"

          code="$(curl --silent --show-error -o /tmp/dispatch.out -w '%{http_code}' -X POST "${auth[@]}"             "$api/actions/workflows/r1-initial-controlled-rebuild.yml/dispatches" -H 'Content-Type: application/json' -d "$payload")"
          test "$code" = "204"
          echo "R1_WU7_826A_PROVIDER_REPAIR_DISPATCHED_ONCE"
