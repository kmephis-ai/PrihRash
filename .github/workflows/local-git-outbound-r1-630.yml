name: R1 WU7 3a0f Readiness Retry Control

on:
  push:
    branches:
      - transport/r1-630-publish-16c2948
    paths:
      - .github/workflows/local-git-outbound-r1-630.yml

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: r1-wu7-3a0f-readiness-retry-control
  cancel-in-progress: false

jobs:
  dispatch-readiness-retry:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one fresh exact-main readiness retry after DEADLINE
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 3a0faca4b0c14bc7f6f855b377de61aaac675016
          FAILED_READINESS_RUN_ID: "35422534179"
          TRACKING_ISSUE: "630"
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          curl --fail --silent --show-error "${auth[@]}" "$api/branches/main" -o /tmp/main.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' /tmp/main.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/issues/$TRACKING_ISSUE" -o /tmp/issue.json
          jq -e '.state == "open" and (.body | contains("Blind-Replay: FORBIDDEN"))' /tmp/issue.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs/$FAILED_READINESS_RUN_ID" -o /tmp/failed-readiness.json
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .name == "R1 Yandex readiness"
            and .head_sha == $sha
            and .head_branch == "main"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "failure"
          ' /tmp/failed-readiness.json >/dev/null

          curl --fail --silent --show-error "${auth[@]}" "$api/actions/runs?per_page=100" -o /tmp/runs.json
          jq -e --argjson self "$GITHUB_RUN_ID" '
            [.workflow_runs[]
              | select(.id != $self)
              | select(.status == "queued" or .status == "in_progress")
              | select(
                  .name == "R1 initial shadow bootstrap"
                  or .name == "R1 initial bootstrap orchestrator"
                  or .name == "R1 initial controlled rebuild"
                )
            ] | length == 0
          ' /tmp/runs.json >/dev/null

          code="$(curl --silent --show-error -o /tmp/dispatch.out -w '%{http_code}' -X POST "${auth[@]}"             "$api/actions/workflows/r1-yandex-readiness.yml/dispatches"             -H 'Content-Type: application/json' -d '{"ref":"main"}')"
          test "$code" = "204"
          echo "R1_WU7_3A0F_READINESS_RETRY_DISPATCHED_ONCE"
