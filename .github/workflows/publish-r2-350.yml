name: Publish R2

on:
  push:
    branches:
      - transport/r2-nav-20260909-0730

permissions:
  contents: write

env:
  SOURCE_SHA: e6ea724a49b9bc52dccc4c13aae9b18bbcaefe33
  EXPECTED_TREE: 8ec402b139346b7b06a244cc545d7a357d89096e
  TARGET_BRANCH: r2/350-honest-navigation

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Verify base and publish exact tree
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${REMOTE_MAIN}" = "${SOURCE_SHA}"
          git checkout --detach "${SOURCE_SHA}"
          printf '%s' '' | base64 -d | gzip -d > /tmp/r2.patch
          git apply --check /tmp/r2.patch
          git apply /tmp/r2.patch
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"
          git config user.name kmephis-ai
          git config user.email kmephis@gmail.com
          git commit -m 'R2: honest disabled navigation state' -m 'Closes #350.'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
