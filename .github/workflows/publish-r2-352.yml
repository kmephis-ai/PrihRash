name: Publish R2

on:
  push:
    branches:
      - transport/r2-empty-20260909-0739

permissions:
  contents: write

env:
  SOURCE_SHA: d3ee9f41b8a365a51d29e5685ffd81f88fae0864
  EXPECTED_TREE: 57186bc3dba7bdeed0c4ae2534341486c1d14a69
  TARGET_BRANCH: r2/352-contextual-empty-state

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Verify base and publish exact tree
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${REMOTE_MAIN}" = "${SOURCE_SHA}"
          git checkout --detach "${SOURCE_SHA}"
          printf '%s' '' | base64 -d | gzip -d > /tmp/r2.patch
          git apply --check /tmp/r2.patch
          git apply /tmp/r2.patch
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"
          git config user.name kmephis-ai
          git config user.email kmephis@gmail.com
          git commit -m 'R2: contextual empty state for filters' -m 'Closes #352.'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
