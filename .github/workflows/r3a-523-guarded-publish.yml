name: R3A 523 Guarded Publish

on:
  push:
    branches:
      - transport/r3a-523-publish-20260915

permissions:
  contents: write

env:
  SOURCE_SHA: 79509060ba27b14ba9e2c779fadab73f631ed8ae
  PATCH_SHA256: ca6bf0860771df8e33f9d3bd4d7ab652d968ff40e51b809852b0543e2756f368
  EXPECTED_TREE: f5c9d18c18571ccceddf363077ac1c745ddf00d0
  FEATURE_BRANCH: r3a/523-browser-void

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Reconstruct exact patch and guard base
        shell: bash
        run: |
          set -euo pipefail
          cat .github/r3a-523/part-00 \
              .github/r3a-523/part-01 \
              .github/r3a-523/part-02 \
              .github/r3a-523/part-03 \
              .github/r3a-523/part-04 > /tmp/r3a523.patch
          printf '%s  %s\n' "$PATCH_SHA256" /tmp/r3a523.patch | sha256sum -c -
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          test "$actual_main" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"

      - name: Apply exact bounded patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --index /tmp/r3a523.patch
          cat > /tmp/expected-files <<'EOF'
          docs/R3A_PREVIEW_WRITER.md
          scripts/build-r2-ui-preview.mjs
          tests/browser/critical-flows.spec.mjs
          tests/integration/r2-safe-ui-preview.test.mjs
          tests/integration/r3a-preview-transaction-void-browser.test.mjs
          web/preview-bootstrap.mjs
          web/preview-transaction-void.mjs
          web/preview-writer.css
          EOF
          git diff --cached --name-only | sort > /tmp/actual-files
          sort /tmp/expected-files > /tmp/expected-files.sorted
          diff -u /tmp/expected-files.sorted /tmp/actual-files
          git diff --cached --check
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$EXPECTED_TREE"

      - name: Canonical verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test \
            tests/integration/r2-safe-ui-preview.test.mjs \
            tests/integration/r3a-preview-expense-edit-conflict.test.mjs \
            tests/integration/r3a-preview-transaction-void-browser.test.mjs
          npm run check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          actual_main="$(git rev-parse origin/main)"
          test "$actual_main" = "$SOURCE_SHA"
          if git ls-remote --exit-code --heads origin "refs/heads/$FEATURE_BRANCH" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing feature branch $FEATURE_BRANCH" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R3A: add preview VOID confirmation and conflict UX'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"
