name: R1 630 6f890cb readiness dispatch

on:
  push:
    branches:
      - transport/r1-630-6f890cb-readiness

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch fresh exact-main readiness
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 6f890cb209755ce450562552afc3e8ff104805f7
          RECOVERY_RUN_ID: '35494270267'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GH_API_TOKEN}"
          accept='Accept: application/vnd.github+json'
          main="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/branches/main")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' <<<"$main" >/dev/null
          issue="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/issues/630")"
          jq -e '.state == "open" and (.title | startswith("R1 WU7:"))' <<<"$issue" >/dev/null
          recovery="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/runs/$RECOVERY_RUN_ID")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.head_sha==$sha and .head_branch=="main" and .name=="R1 initial bootstrap recovery" and .event=="workflow_dispatch" and .status=="completed" and .conclusion=="success"' <<<"$recovery" >/dev/null
          all="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/runs?per_page=100")"
          jq -e '[.workflow_runs[]|select(.status=="queued" or .status=="in_progress")|select(.name=="R1 initial shadow bootstrap" or .name=="R1 initial bootstrap orchestrator" or .name=="R1 initial controlled rebuild")]|length==0' <<<"$all" >/dev/null
          curl --fail --silent --show-error --request POST --header "$auth" --header "$accept" --header 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/workflows/r1-yandex-readiness.yml/dispatches" --data '{"ref":"main"}'
          echo R1_630_READINESS_DISPATCHED
