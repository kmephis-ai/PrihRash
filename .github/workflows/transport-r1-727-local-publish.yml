name: R1 727 Local Git Publish Transport

on:
  push:
    branches:
      - transport/r1-727-local-publish-20260921-1931

permissions:
  contents: write
  issues: read

env:
  SOURCE_SHA: d22e07d59a9ee81e4cae8193a1aed20953a769fc
  EXPECTED_TREE: 26684561103a5e7e16bf6b7ae488cc99cd48e48f
  TARGET_BRANCH: agent/r1-727-runtime-resource-limits

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: d22e07d59a9ee81e4cae8193a1aed20953a769fc
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact local patch and publish branch
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          PATCH_B64: 
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GH_API_TOKEN"
          accept="Accept: application/vnd.github+json"

          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          main_sha="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/branches/main" | jq -er '.commit.sha')"
          test "$main_sha" = "$SOURCE_SHA" || { echo R1_727_PUBLISH_MAIN_MOVED; exit 1; }

          issue_state="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/issues/727" | jq -er '.state')"
          test "$issue_state" = open || { echo R1_727_PUBLISH_ISSUE_INACTIVE; exit 1; }

          ref_status="$(curl --silent --show-error --output "$RUNNER_TEMP/ref.json" --write-out '%{http_code}'             --header "$auth" --header "$accept" "$api/git/ref/heads/$TARGET_BRANCH")"
          test "$ref_status" = 404 || { echo R1_727_PUBLISH_TARGET_EXISTS; exit 1; }

          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > "$RUNNER_TEMP/change.patch"
          git apply --check "$RUNNER_TEMP/change.patch"
          git apply "$RUNNER_TEMP/change.patch"
          git diff --check
          git add -A
          tree="$(git write-tree)"
          test "$tree" = "$EXPECTED_TREE" || { echo R1_727_PUBLISH_TREE_MISMATCH; exit 1; }

          git config user.name "prihrash-r1-transport"
          git config user.email "noreply@github.com"
          git commit -m "R1 #727: read YDB limits via runtime service account"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo R1_727_PUBLISH_OK
