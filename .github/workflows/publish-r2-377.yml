name: Publish R2

on:
  push:
    branches:
      - transport/r2-publish-377

permissions:
  contents: write

env:
  EXPECTED_BASE: a9777449b8daf486ee9b2576a23c47c68f6df9eb
  EXPECTED_TREE: 1961bccdeaa47cb72960ffacec5849b542a417aa
  TARGET_BRANCH: r2/377-period-quality
  PATCH_GZIP_SHA256: 7f68abaafdcfd4202491f968d1c63542606f0b301582958c1269422a6b913617
  PATCH_B64: 

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Publish exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${REMOTE_BASE}" = "${EXPECTED_BASE}"
          if git ls-remote --exit-code --heads origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "Target branch already exists" >&2
            exit 1
          fi
          printf '%s' "${PATCH_B64}" | base64 -d > /tmp/r2.patch.gz
          printf '%s  %s\n' "${PATCH_GZIP_SHA256}" /tmp/r2.patch.gz | sha256sum -c -
          gzip -dc /tmp/r2.patch.gz > /tmp/r2.patch
          git checkout --detach "${EXPECTED_BASE}"
          git apply --index /tmp/r2.patch
          ACTUAL_TREE="$(git write-tree)"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"
          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git commit -m 'R2: show ambiguous financial period quality' -m 'Closes #377.'
          git branch "${TARGET_BRANCH}" HEAD
          git push origin "refs/heads/${TARGET_BRANCH}"
