name: R1 630 readiness dispatch 000eb38

on:
  push:
    branches:
      - transport/r1-630-000eb38

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-main readiness once
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 000eb38ebbf767ae11971ac62aed15562ac6c74f
          RECOVERY_RUN_ID: '35463119747'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'

          main="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/branches/main")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' <<<"$main" >/dev/null
          issue="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/issues/630")"
          jq -e '.state == "open" and (.title | startswith("R1 WU7:"))' <<<"$issue" >/dev/null

          recovery="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/runs/$RECOVERY_RUN_ID")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .head_sha == $sha
            and .name == "R1 initial bootstrap recovery"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "success"
          ' <<<"$recovery" >/dev/null

          all_runs="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/runs?per_page=100")"
          if jq -e '
            .workflow_runs | any(
              (.status == "queued" or .status == "in_progress")
              and (.name == "R1 initial shadow bootstrap"
                   or .name == "R1 initial bootstrap orchestrator"
                   or .name == "R1 initial controlled rebuild")
            )
          ' <<<"$all_runs" >/dev/null; then
            echo 'R1_630_READINESS_WRITER_ACTIVE'
            exit 1
          fi

          existing="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/workflows/r1-yandex-readiness.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$EXPECTED_MAIN_SHA" '.workflow_runs | any(.head_sha == $sha)' <<<"$existing" >/dev/null; then
            echo 'R1_630_READINESS_ALREADY_DISPATCHED'
            exit 0
          fi

          curl --fail --silent --show-error --request POST             --header "$auth_header"             --header "$accept_header"             --header 'X-GitHub-Api-Version: 2022-11-28'             "$api/actions/workflows/r1-yandex-readiness.yml/dispatches"             --data '{"ref":"main"}'
          echo 'R1_630_READINESS_DISPATCHED'
