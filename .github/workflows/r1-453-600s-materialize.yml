name: R1 453 600s materializer

on:
  push:
    branches:
      - transport/r1-453-600s-materialize-20260917

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message != 'chore: materialize R1 #453 600s patch blobs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize exact four-file patch as ordinary blobs
        shell: bash
        run: |
          set -euo pipefail
          source_sha='6728b1ffacdc1c9ef692b56d80edf4653aa6e476'
          paths=(
            '.github/workflows/r1-initial-shadow-bootstrap.yml'
            'docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md'
            'scripts/invoke-yandex-initial-bootstrap.mjs'
            'tests/tooling/r1-initial-shadow-bootstrap-workflow.test.mjs'
          )

          for path in "${paths[@]}"; do
            test "$(git rev-parse "${source_sha}:${path}")" = "$(git rev-parse "HEAD:${path}")"
          done

          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} exact matches, found {actual}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_exact(
              '.github/workflows/r1-initial-shadow-bootstrap.yml',
              '--execution-timeout 300s',
              '--execution-timeout 600s',
          )
          replace_exact(
              'scripts/invoke-yandex-initial-bootstrap.mjs',
              'const INVOKE_TIMEOUT_MS = 330_000;',
              'const INVOKE_TIMEOUT_MS = 630_000;',
          )
          replace_exact(
              'tests/tooling/r1-initial-shadow-bootstrap-workflow.test.mjs',
              '--execution-timeout 300s',
              '--execution-timeout 600s',
              2,
          )
          replace_exact(
              'tests/tooling/r1-initial-shadow-bootstrap-workflow.test.mjs',
              'INVOKE_TIMEOUT_MS = 330_000',
              'INVOKE_TIMEOUT_MS = 630_000',
          )
          anchor = '`INITIAL_BOOTSTRAP_INVOKE_FUNCTION_TIMEOUT` означает только exact privacy-safe classification provider envelope `Function execution timeout (504)`. `INITIAL_BOOTSTRAP_INVOKE_NONZERO_UNCLASSIFIED` означает numeric non-zero provider exit без доказанного allowlisted non-success result/marker. Оба кода являются non-success diagnostic evidence и сами по себе **не** разрешают retry/replay bootstrap.\n'
          addition = '\nПосле bootstrap #59 (`35260379450`) exact provider evidence доказал HTTP 504 практически на 300-секундной границе ранее configured Function timeout. Поэтому initial-bootstrap Function использует bounded execution timeout `600s`, а HTTPS invoker — `630s`: provider deadline остаётся раньше client transport deadline. Это исправление только доказанного execution-envelope blocker; retries, atomic cap, write predicates и authority не расширяются.\n'
          replace_exact(
              'docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md',
              anchor,
              anchor + addition,
          )
          PY

          printf '%s  %s\n' \
            '4eb5f33087a00cb26665a8df0bd0427a599a25156566956cdbb03df3afa0f45e' '.github/workflows/r1-initial-shadow-bootstrap.yml' \
            '2f4fa3c68a54c9093222915b103feac608c73ca23b8371edb2f3dfc0108bb6ba' 'docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md' \
            '57f6c55cf752637cdc99e19f1173cd75bfd9a1905fe09c11b88e46cc214bc264' 'scripts/invoke-yandex-initial-bootstrap.mjs' \
            '31e41e87556486eff284ab37b81f41d8888f14d5927d1f6d6e0c83ea4d3cf738' 'tests/tooling/r1-initial-shadow-bootstrap-workflow.test.mjs' \
            | sha256sum --check --strict

          mkdir -p .transport/materialized
          cp .github/workflows/r1-initial-shadow-bootstrap.yml .transport/materialized/r1-initial-shadow-bootstrap.yml
          cp docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md .transport/materialized/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md
          cp scripts/invoke-yandex-initial-bootstrap.mjs .transport/materialized/invoke-yandex-initial-bootstrap.mjs
          cp tests/tooling/r1-initial-shadow-bootstrap-workflow.test.mjs .transport/materialized/r1-initial-shadow-bootstrap-workflow.test.mjs

          git restore --source="$source_sha" -- "${paths[@]}"
          git diff --check
          test "$(find .transport/materialized -maxdepth 1 -type f | wc -l)" -eq 4
          test -f .transport/materialized/r1-initial-shadow-bootstrap.yml
          test -f .transport/materialized/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md
          test -f .transport/materialized/invoke-yandex-initial-bootstrap.mjs
          test -f .transport/materialized/r1-initial-shadow-bootstrap-workflow.test.mjs

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .transport/materialized
          git commit -m 'chore: materialize R1 #453 600s patch blobs'
          git push origin HEAD:transport/r1-453-600s-materialize-20260917
