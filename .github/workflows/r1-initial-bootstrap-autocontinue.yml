name: R1 initial bootstrap autocontinue

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: r1-initial-bootstrap-autocontinue
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'kmephis-ai/PrihRash'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact CI source for bounded evidence classifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Dispatch guarded exact-main orchestrator only for active R1 tracking Issue source
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'
          [[ "$SOURCE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'R1_BOOTSTRAP_AUTOCONTINUE_CI_RUN_ID_INVALID'
            exit 0
          }

          main_sha="$(curl --fail --silent --show-error \
            --header "$auth_header" \
            --header "$accept_header" \
            "$api/branches/main" | jq -er '.commit.sha')"
          if [ "$main_sha" != "$SOURCE_SHA" ]; then
            echo 'R1_BOOTSTRAP_AUTOCONTINUE_MAIN_MOVED'
            exit 0
          fi

          associated_prs="$(curl --fail --silent --show-error \
            --header "$auth_header" \
            --header "$accept_header" \
            "$api/commits/$SOURCE_SHA/pulls")"
          source_pr="$(jq -cer \
            --arg sha "$SOURCE_SHA" \
            --arg repo "$GITHUB_REPOSITORY" \
            '[.[] | select(
              .merged_at != null
              and .merge_commit_sha == $sha
              and .base.ref == "main"
              and .head.repo.full_name == $repo
            )] | if length == 1 then .[0] else empty end' \
            <<<"$associated_prs" || true)"
          if [ -z "$source_pr" ]; then
            echo 'R1_BOOTSTRAP_AUTOCONTINUE_NOT_SINGLE_MERGED_MAIN_PR'
            exit 0
          fi
          active_r1_issues="$(curl --fail --silent --show-error \
            --header "$auth_header" \
            --header "$accept_header" \
            "$api/issues?state=open&per_page=100")" || {
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_TRACKING_ISSUES_READ_FAILED'
              exit 0
            }
          if [ "$(jq 'length' <<<"$active_r1_issues")" -ge 100 ]; then
            echo 'R1_BOOTSTRAP_AUTOCONTINUE_TRACKING_ISSUES_UNBOUNDED'
            exit 0
          fi
          tracking_issue_number="$(jq -er '
            [.[] | select(
              (has("pull_request") | not)
              and .state == "open"
              and .title == "R1 completion sprint: пробить первый COMMITTED shadow baseline"
              and (.number | type == "number")
            )]
            | if length == 1 then .[0].number else empty end
          ' <<<"$active_r1_issues" 2>/dev/null || true)"
          if [ -z "$tracking_issue_number" ]; then
            echo 'R1_BOOTSTRAP_AUTOCONTINUE_TRACKING_ISSUE_NOT_EXACT'
            exit 0
          fi
          r1_title_prefix="R1 #${tracking_issue_number}:"
          source_is_r1="$(jq -r --arg prefix "$r1_title_prefix" '.title | startswith($prefix)' <<<"$source_pr")"
          allow_staging_resume='false'
          allow_stale_staging_retirement='false'
          orchestrator_preflight='false'
          preflight_recovery_run_id=''

          if [ "$source_is_r1" = 'true' ]; then
            source_pr_number="$(jq -er '.number' <<<"$source_pr")"
            source_pr_body="$(jq -r '.body // ""' <<<"$source_pr")"

            preflight_marker="$(jq -Rn --arg body "$source_pr_body" '
              def exact_line($prefix):
                ($body | split("\n") | map(select(startswith($prefix))));
              (exact_line("Provider-Attempt: ")) as $attempt
              | (exact_line("Orchestrator-Preflight: ")) as $preflight
              | (exact_line("Observed-Recovery: ")) as $observed_recovery
              | (exact_line("Observed-Signature: ")) as $observed_signature
              | (exact_line("Expected-Transition: ")) as $expected
              | (exact_line("Recovery-State: ")) as $recovery
              | (exact_line("Recovery-Run-ID: ")) as $recovery_run
              | (exact_line("Circuit-Rearm: ")) as $rearm
              | (exact_line("Regression-Test: ")) as $test
              | {
                  valid: (
                    $attempt == ["Provider-Attempt: NOT_AUTHORIZED"]
                    and $preflight == ["Orchestrator-Preflight: READY"]
                    and $observed_recovery == ["Observed-Recovery: INITIAL_BOOTSTRAP_RECOVERY_CLASSIFIED/RECOVERY_REQUIRED/STAGING_RUN_PRESENT"]
                    and ($observed_signature | length) == 0
                    and $expected == ["Expected-Transition: R1_BOOTSTRAP_ORCHESTRATOR_RECOVERY_BLOCKED/RECOVERY_REQUIRED/STAGING_RUN_PRESENT"]
                    and $recovery == ["Recovery-State: STAGING_PRESENT_UNCLASSIFIED"]
                    and ($recovery_run | length) == 1
                    and ($recovery_run[0] | test("^Recovery-Run-ID: [1-9][0-9]*$"))
                    and ($rearm | length) == 0
                    and $test == ["Regression-Test: tests/tooling/r1-initial-bootstrap-autocontinue-workflow.test.mjs"]
                  ),
                  recoveryRunId: (
                    if ($recovery_run | length) == 1
                    then ($recovery_run[0] | sub("^Recovery-Run-ID: "; ""))
                    else null
                    end
                  ),
                  regressionTest: (
                    if ($test | length) == 1
                    then ($test[0] | sub("^Regression-Test: "; ""))
                    else null
                    end
                  )
                }
            ')"

            if [ "$(jq -r '.valid' <<<"$preflight_marker")" = 'true' ]; then
              orchestrator_preflight='true'
              marker="$preflight_marker"
              preflight_recovery_run_id="$(jq -er '.recoveryRunId' <<<"$marker")"
            else
              marker="$(jq -Rn --arg body "$source_pr_body" '
                def exact_line($prefix):
                  ($body | split("\n") | map(select(startswith($prefix))));
                (exact_line("Provider-Attempt: ")) as $attempt
                | (exact_line("Observed-Signature: ")) as $observed
                | (exact_line("Expected-Transition: ")) as $expected
                | (exact_line("Recovery-State: ")) as $recovery
                | (exact_line("Circuit-Rearm: ")) as $rearm
                | (exact_line("Regression-Test: ")) as $test
                | {
                    valid: (
                      $attempt == ["Provider-Attempt: READY"]
                      and ($observed | length) == 1
                      and ($observed[0] | test("^Observed-Signature: [A-Z0-9_]+(?:/[A-Z0-9_]+){1,3}$"))
                      and ($expected | length) == 1
                      and ($expected[0] | test("^Expected-Transition: [A-Z0-9_]+(?:/[A-Z0-9_]+){0,3}$"))
                      and ($recovery | length) == 1
                      and ($recovery[0] | IN(
                        "Recovery-State: EMPTY_DURABLE_STATE",
                        "Recovery-State: RESIDUAL_REFERENCE_STATE_MATCHES_AUTHORITATIVE",
                        "Recovery-State: STAGING_RESUMABLE",
                        "Recovery-State: STAGING_STALE_RETIREABLE",
                        "Recovery-State: STALE_STAGING_RETIRED"
                      ))
                      and (
                        $rearm == ["Circuit-Rearm: ROOT_CAUSE_FIX"]
                        or (
                          $rearm == ["Circuit-Rearm: SOURCE_DRIFT_REBASE"]
                          and $observed == ["Observed-Signature: R1_BOOTSTRAP_ORCHESTRATOR_RECOVERY_BLOCKED/RECOVERY_REQUIRED/STAGING_RUN_PRESENT"]
                          and $recovery == ["Recovery-State: STAGING_STALE_RETIREABLE"]
                          and $test == ["Regression-Test: tests/tooling/r1-initial-bootstrap-autocontinue-workflow.test.mjs"]
                        )
                      )
                      and ($test | length) == 1
                      and ($test[0] | test("^Regression-Test: tests/[A-Za-z0-9_./-]+\\.test\\.mjs$"))
                    ),
                    observedSignature: (if ($observed | length) == 1 then ($observed[0] | sub("^Observed-Signature: "; "")) else null end),
                    recovery: (if ($recovery | length) == 1 then ($recovery[0] | sub("^Recovery-State: "; "")) else null end),
                    rearm: (if ($rearm | length) == 1 then ($rearm[0] | sub("^Circuit-Rearm: "; "")) else null end),
                    regressionTest: (if ($test | length) == 1 then ($test[0] | sub("^Regression-Test: "; "")) else null end)
                  }
              ')"
              if [ "$(jq -r '.valid' <<<"$marker")" != 'true' ]; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_ATTEMPT_MARKER_INVALID'
                exit 0
              fi
            fi

            source_files="$(curl --fail --silent --show-error \
              --header "$auth_header" \
              --header "$accept_header" \
              "$api/pulls/$source_pr_number/files?per_page=100")"
            if [ "$(jq 'length' <<<"$source_files")" -ge 100 ]; then
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_CHANGESET_UNBOUNDED'
              exit 0
            fi
            regression_test="$(jq -r '.regressionTest' <<<"$marker")"

            if [ "$orchestrator_preflight" = 'true' ]; then
              if ! jq -e --arg test "$regression_test" '
                $test == "tests/tooling/r1-initial-bootstrap-autocontinue-workflow.test.mjs"
                and any(.[]; .filename == ".github/workflows/r1-initial-bootstrap-autocontinue.yml" and .status != "removed")
                and any(.[]; .filename == "tests/tooling/r1-initial-bootstrap-autocontinue-workflow.test.mjs" and .status != "removed")
                and any(.[]; .filename == "AGENTS.md" and .status != "removed")
                and any(.[]; .filename == "docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md" and .status != "removed")
                and all(.[]; .filename | IN(
                  ".github/workflows/r1-initial-bootstrap-autocontinue.yml",
                  "tests/tooling/r1-initial-bootstrap-autocontinue-workflow.test.mjs",
                  "AGENTS.md",
                  "docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md"
                ))
              ' <<<"$source_files" >/dev/null; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_CHANGESET_INVALID'
                exit 0
              fi

              preflight_recovery="$(curl --fail --silent --show-error \
                --header "$auth_header" --header "$accept_header" \
                "$api/actions/runs/$preflight_recovery_run_id")" || {
                  echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_RECOVERY_READ_FAILED'; exit 0;
                }
              if ! jq -e --argjson run_id "$preflight_recovery_run_id" '
                .id == $run_id
                and .name == "R1 initial bootstrap recovery"
                and .head_branch == "main"
                and .event == "workflow_dispatch"
                and .status == "completed"
                and .conclusion == "success"
                and (.head_sha | type) == "string"
              ' <<<"$preflight_recovery" >/dev/null; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_RECOVERY_INVALID'
                exit 0
              fi
              preflight_recovery_sha="$(jq -er '.head_sha' <<<"$preflight_recovery")"
              if [ "$preflight_recovery_sha" = "$SOURCE_SHA" ]; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_RECOVERY_SAME_SHA'
                exit 0
              fi
              preflight_compare="$(curl --fail --silent --show-error \
                --header "$auth_header" --header "$accept_header" \
                "$api/compare/$preflight_recovery_sha...$SOURCE_SHA")" || {
                  echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_LINEAGE_READ_FAILED'; exit 0;
                }
              if ! jq -e '.status == "ahead" and .behind_by == 0' <<<"$preflight_compare" >/dev/null; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_LINEAGE_INVALID'
                exit 0
              fi

              preflight_jobs="$(curl --fail --silent --show-error \
                --header "$auth_header" --header "$accept_header" \
                "$api/actions/runs/$preflight_recovery_run_id/jobs?filter=latest&per_page=100")" || {
                  echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_RECOVERY_JOBS_READ_FAILED'; exit 0;
                }
              if ! jq -e '
                [.jobs[] | select(.name == "initial-bootstrap-recovery" and .conclusion == "success")] as $jobs
                | ($jobs | length) == 1
                and ([$jobs[0].steps[]? | select(
                  .name == "Deploy recovery-only Function version" and .conclusion == "skipped"
                )] | length) == 1
                and ([$jobs[0].steps[]? | select(
                  .name == "Invoke exact read-only recovery tag once" and .conclusion == "success"
                )] | length) == 1
              ' <<<"$preflight_jobs" >/dev/null; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_RECOVERY_PHASE_INVALID'
                exit 0
              fi

              preflight_artifacts="$(curl --fail --silent --show-error \
                --header "$auth_header" --header "$accept_header" \
                "$api/actions/runs/$preflight_recovery_run_id/artifacts?per_page=100")" || {
                  echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_ARTIFACTS_READ_FAILED'; exit 0;
                }
              preflight_artifact_id="$(jq -r --arg name "r1-initial-bootstrap-recovery-evidence-$preflight_recovery_run_id" '
                [.artifacts[] | select(.name == $name and .expired == false)]
                | if length == 1 then .[0].id else empty end
              ' <<<"$preflight_artifacts")"
              if [ -z "$preflight_artifact_id" ]; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_ARTIFACT_NOT_EXACT'
                exit 0
              fi
              preflight_zip="$RUNNER_TEMP/r1-autocontinue-preflight-recovery.zip"
              curl --fail --silent --show-error --location \
                --header "$auth_header" --header "$accept_header" \
                "$api/actions/artifacts/$preflight_artifact_id/zip" \
                --output "$preflight_zip" || {
                  echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_ARTIFACT_DOWNLOAD_FAILED'; exit 0;
                }
              preflight_classification="$RUNNER_TEMP/r1-autocontinue-preflight-classification.json"
              unzip -p "$preflight_zip" classification.json >"$preflight_classification" || {
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_CLASSIFICATION_MISSING'; exit 0;
              }
              if ! jq -e '
                .status == "PASS"
                and .code == "INITIAL_BOOTSTRAP_RECOVERY_CLASSIFIED"
                and .verdict == "RECOVERY_REQUIRED"
                and .reason == "STAGING_RUN_PRESENT"
              ' "$preflight_classification" >/dev/null; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_CLASSIFICATION_INVALID'
                exit 0
              fi
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREFLIGHT_RECOVERY_PROVEN'
            else
              rearm_mode="$(jq -r '.rearm' <<<"$marker")"
              if [ "$rearm_mode" = 'SOURCE_DRIFT_REBASE' ]; then
                if ! jq -e --arg test "$regression_test" '
                  $test == "tests/tooling/r1-initial-bootstrap-autocontinue-workflow.test.mjs"
                  and any(
                    .filename == "docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md"
                    and .status != "removed"
                  )
                ' <<<"$source_files" >/dev/null; then
                  echo 'R1_BOOTSTRAP_AUTOCONTINUE_SOURCE_DRIFT_EVIDENCE_MISSING'
                  exit 0
                fi
              elif ! jq -e --arg test "$regression_test" '
                any(.filename == $test and .status != "removed")
                and any(
                  (.filename | startswith("src/"))
                  or (.filename | startswith("scripts/"))
                  or (.filename | startswith(".github/workflows/r1-"))
                )
              ' <<<"$source_files" >/dev/null; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_ROOT_CAUSE_EVIDENCE_MISSING'
                exit 0
              fi
              recovery_state="$(jq -r '.recovery' <<<"$marker")"
              if [ "$recovery_state" = 'STAGING_RESUMABLE' ]; then
                allow_staging_resume='true'
              elif [ "$recovery_state" = 'STAGING_STALE_RETIREABLE' ]; then
                allow_stale_staging_retirement='true'
              fi
            fi
          fi

          tracking_issue="$(curl --fail --silent --show-error \
            --header "$auth_header" \
            --header "$accept_header" \
            "$api/issues/${tracking_issue_number}")" || {
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_TRACKING_ISSUE_READ_FAILED'
              exit 0
            }
          if ! jq -e '
            .state == "open"
            and .title == "R1 completion sprint: пробить первый COMMITTED shadow baseline"
            and (has("pull_request") | not)
          ' <<<"$tracking_issue" >/dev/null; then
            echo 'R1_BOOTSTRAP_AUTOCONTINUE_ISSUE_INACTIVE'
            exit 0
          fi

          existing="$(curl --fail --silent --show-error \
            --header "$auth_header" \
            --header "$accept_header" \
            "$api/actions/workflows/r1-initial-bootstrap-orchestrator.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$SOURCE_SHA" \
            '.workflow_runs | any(.head_sha == $sha)' \
            <<<"$existing" >/dev/null; then
            echo 'R1_BOOTSTRAP_AUTOCONTINUE_ALREADY_DISPATCHED'
            exit 0
          fi

          download_classification() {
            local run_id="$1"
            local artifact_name="$2"
            local destination="$3"
            local created_at_or_before="${4:-}"
            local artifacts artifact_id archive artifacts_file
            artifacts="$(curl --fail --silent --show-error \
              --header "$auth_header" \
              --header "$accept_header" \
              "$api/actions/runs/$run_id/artifacts?per_page=100")" || return 1
            if [ -n "$created_at_or_before" ]; then
              artifacts_file="$RUNNER_TEMP/r1-autocontinue-artifacts-$run_id.json"
              printf '%s' "$artifacts" > "$artifacts_file"
              artifact_id="$(node scripts/r1-autocontinue-evidence.mjs artifact-id-at-or-before \
                "$artifacts_file" "$artifact_name" "$created_at_or_before")" || return 1
            else
              artifact_id="$(jq -r --arg name "$artifact_name" '
                [.artifacts[] | select(.name == $name and .expired == false)]
                | if length == 1 then .[0].id else empty end' \
                <<<"$artifacts")"
            fi
            [ -n "$artifact_id" ] || return 1
            archive="$RUNNER_TEMP/r1-autocontinue-evidence-$run_id.zip"
            curl --fail --silent --show-error --location \
              --header "$auth_header" \
              --header "$accept_header" \
              "$api/actions/artifacts/$artifact_id/zip" \
              --output "$archive" || return 1
            unzip -p "$archive" classification.json > "$destination" || return 1
          }

          if [ "$source_is_r1" = 'true' ] && [ "$orchestrator_preflight" != 'true' ]; then
            observed_signature="$(jq -er '.observedSignature' <<<"$marker")"
            if [ "$(jq -r '.total_count' <<<"$existing")" -gt 100 ]; then
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_HISTORY_UNBOUNDED'
              exit 0
            fi

            latest_run_id="$(jq -r '
              [.workflow_runs[] | select(.status == "completed")]
              | sort_by(.created_at) | reverse | .[0].id // empty
            ' <<<"$existing")"
            latest_run_sha="$(jq -r --argjson run_id "${latest_run_id:-0}" '
              [.workflow_runs[] | select(.id == $run_id)] | .[0].head_sha // empty
            ' <<<"$existing")"
            if [ -z "$latest_run_id" ] || [ -z "$latest_run_sha" ]; then
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREVIOUS_EVIDENCE_MISSING'
              exit 0
            fi

            latest_orchestrator="$RUNNER_TEMP/r1-autocontinue-latest-orchestrator.json"
            if ! download_classification \
              "$latest_run_id" \
              "r1-initial-bootstrap-orchestrator-evidence-$latest_run_id" \
              "$latest_orchestrator"; then
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREVIOUS_EVIDENCE_MISSING'
              exit 0
            fi
            if ! jq -e --arg sha "$latest_run_sha" '.sourceSha == $sha' \
              "$latest_orchestrator" >/dev/null; then
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREVIOUS_EVIDENCE_INVALID'
              exit 0
            fi

            bootstrap_run_id="$(jq -r 'if (.bootstrapRunId | type) == "number" then .bootstrapRunId else empty end' \
              "$latest_orchestrator")"
            bootstrap_invoke_step="$(jq -r '.bootstrapInvokeStep // empty' "$latest_orchestrator")"
            if [ -n "$bootstrap_run_id" ] \
              && { [ "$bootstrap_invoke_step" = 'success' ] || [ "$bootstrap_invoke_step" = 'failure' ]; }; then
              latest_bootstrap="$RUNNER_TEMP/r1-autocontinue-latest-bootstrap.json"
              if ! download_classification \
                "$bootstrap_run_id" \
                "r1-initial-bootstrap-evidence-$bootstrap_run_id" \
                "$latest_bootstrap"; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREVIOUS_EVIDENCE_MISSING'
                exit 0
              fi
              if ! latest_signature="$(node scripts/r1-autocontinue-evidence.mjs signature-bootstrap "$latest_bootstrap")"; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREVIOUS_EVIDENCE_INVALID'
                exit 0
              fi
            elif [ -z "$bootstrap_invoke_step" ] \
              || [ "$bootstrap_invoke_step" = 'skipped' ] \
              || [ "$bootstrap_invoke_step" = 'NOT_REACHED' ]; then
              if ! latest_signature="$(node scripts/r1-autocontinue-evidence.mjs signature-orchestrator "$latest_orchestrator")"; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREVIOUS_EVIDENCE_INVALID'
                exit 0
              fi
            else
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_PREVIOUS_OUTCOME_UNCERTAIN'
              exit 0
            fi

            prior_root_cause_attempts=0
            while IFS=$'\t' read -r historical_run_id historical_sha historical_completed_at; do
              [ -n "$historical_run_id" ] || continue
              [ "$historical_sha" != "$SOURCE_SHA" ] || continue
              historical_prs="$(curl --fail --silent --show-error \
                --header "$auth_header" \
                --header "$accept_header" \
                "$api/commits/$historical_sha/pulls")" || {
                  echo 'R1_BOOTSTRAP_AUTOCONTINUE_HISTORY_READ_FAILED'
                  exit 0
                }
              historical_pr="$(jq -cer \
                --arg sha "$historical_sha" \
                --arg repo "$GITHUB_REPOSITORY" \
                --arg title_prefix "$r1_title_prefix" \
                '[.[] | select(
                  .merged_at != null
                  and .merge_commit_sha == $sha
                  and .base.ref == "main"
                  and .head.repo.full_name == $repo
                  and (.title | startswith($title_prefix))
                )] | if length == 1 then .[0] else empty end' \
                <<<"$historical_prs" || true)"
              [ -n "$historical_pr" ] || continue
              historical_body="$(jq -r '.body // ""' <<<"$historical_pr")"
              historical_matches="$(jq -Rn \
                --arg body "$historical_body" \
                --arg observed "Observed-Signature: $observed_signature" \
                --arg recovery "Recovery-State: $recovery_state" '
                ($body | split("\n")) as $lines
                | {
                    attempt: ([$lines[] | select(. == "Provider-Attempt: READY")] | length),
                    observed: ([$lines[] | select(. == $observed)] | length),
                    recovery: ([$lines[] | select(. == $recovery)] | length),
                    rearm: ([$lines[] | select(. == "Circuit-Rearm: ROOT_CAUSE_FIX")] | length)
                  }
              ')"
              if ! jq -e '.attempt == 1 and .observed == 1 and .recovery == 1 and .rearm == 1' \
                <<<"$historical_matches" >/dev/null; then
                continue
              fi

              historical_evidence="$RUNNER_TEMP/r1-autocontinue-history-$historical_run_id.json"
              if ! download_classification \
                "$historical_run_id" \
                "r1-initial-bootstrap-orchestrator-evidence-$historical_run_id" \
                "$historical_evidence"; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_HISTORY_EVIDENCE_MISSING'
                exit 0
              fi
              if ! jq -e --arg sha "$historical_sha" '
                .sourceSha == $sha
                and (.bootstrapRunId | type) == "number"
                and (.bootstrapInvokeStep | IN("success", "failure"))
              ' "$historical_evidence" >/dev/null; then
                historical_step="$(jq -r '.bootstrapInvokeStep // empty' "$historical_evidence")"
                if [ -z "$historical_step" ] \
                  || [ "$historical_step" = 'skipped' ] \
                  || [ "$historical_step" = 'NOT_REACHED' ]; then
                  continue
                fi
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_HISTORY_EVIDENCE_INVALID'
                exit 0
              fi

              historical_bootstrap_run_id="$(jq -er '.bootstrapRunId' "$historical_evidence")"
              historical_bootstrap="$RUNNER_TEMP/r1-autocontinue-history-bootstrap-$historical_bootstrap_run_id.json"
              if ! download_classification \
                "$historical_bootstrap_run_id" \
                "r1-initial-bootstrap-evidence-$historical_bootstrap_run_id" \
                "$historical_bootstrap" \
                "$historical_completed_at"; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_HISTORY_EVIDENCE_MISSING'
                exit 0
              fi
              if ! historical_signature="$(node scripts/r1-autocontinue-evidence.mjs signature-bootstrap "$historical_bootstrap")"; then
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_HISTORY_EVIDENCE_INVALID'
                exit 0
              fi
              if [ "$historical_signature" != "$observed_signature" ]; then
                continue
              fi

              prior_root_cause_attempts=$((prior_root_cause_attempts + 1))
              if [ "$prior_root_cause_attempts" -ge 2 ]; then
                break
              fi
            done < <(jq -r '
              [.workflow_runs[] | select(.status == "completed")]
              | sort_by(.created_at) | reverse
              | .[] | [.id, .head_sha, .updated_at] | @tsv
            ' <<<"$existing")

            decision="$(node scripts/r1-autocontinue-evidence.mjs decision \
              "$observed_signature" "$latest_signature" "$prior_root_cause_attempts")" || {
                echo 'R1_BOOTSTRAP_AUTOCONTINUE_DECISION_INVALID'
                exit 0
              }
            decision_code="$(jq -er '.code' <<<"$decision")"
            if [ "$decision_code" = 'BLOCKED_NEEDS_ROOT_CAUSE' ]; then
              echo 'BLOCKED_NEEDS_ROOT_CAUSE'
              exit 0
            fi
            if [ "$decision_code" != 'R1_BOOTSTRAP_AUTOCONTINUE_ATTEMPT_READY' ]; then
              echo "$decision_code"
              exit 0
            fi
          fi

          if [ "$source_is_r1" != 'true' ]; then
            source_commit="$(curl --fail --silent --show-error \
              --header "$auth_header" \
              --header "$accept_header" \
              "$api/commits/$SOURCE_SHA")"
            parent_sha="$(jq -er 'if (.parents | length) == 1 then .parents[0].sha else empty end' \
              <<<"$source_commit" || true)"
            if [ -z "$parent_sha" ]; then
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_NOT_ACTIVE_R1_SOURCE'
              exit 0
            fi

            interrupted_run_id="$(jq -r --arg sha "$parent_sha" \
              '[.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.created_at) | reverse | .[0].id // empty' \
              <<<"$existing")"
            if [ -z "$interrupted_run_id" ]; then
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_NOT_ACTIVE_R1_SOURCE'
              exit 0
            fi

            artifacts="$(curl --fail --silent --show-error \
              --header "$auth_header" \
              --header "$accept_header" \
              "$api/actions/runs/$interrupted_run_id/artifacts?per_page=100")"
            artifact_id="$(jq -r --arg name "r1-initial-bootstrap-orchestrator-evidence-$interrupted_run_id" \
              '[.artifacts[] | select(.name == $name and .expired == false)]
              | if length == 1 then .[0].id else empty end' \
              <<<"$artifacts")"
            if [ -z "$artifact_id" ]; then
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_INTERRUPTED_EVIDENCE_MISSING'
              exit 0
            fi

            evidence_zip="$RUNNER_TEMP/r1-interrupted-orchestrator.zip"
            curl --fail --silent --show-error --location \
              --header "$auth_header" \
              --header "$accept_header" \
              "$api/actions/artifacts/$artifact_id/zip" \
              --output "$evidence_zip"
            evidence="$(unzip -p "$evidence_zip" classification.json)"
            if ! jq -e \
              --arg parent "$parent_sha" \
              '.status == "STOP"
               and .code == "R1_BOOTSTRAP_ORCHESTRATOR_BOOTSTRAP_NON_SUCCESS"
               and .sourceSha == $parent
               and .readinessCode == "READINESS_READY"
               and .bootstrapConclusion == "failure"
               and .bootstrapInvokeStep == "skipped"
               and .postRecoveryVerdict == null
               and .postRecoveryReason == null
               and (.bootstrapRunId | type == "number")' \
              <<<"$evidence" >/dev/null; then
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_INTERRUPTED_EVIDENCE_UNSAFE'
              exit 0
            fi

            bootstrap_run_id="$(jq -er '.bootstrapRunId' <<<"$evidence")"
            bootstrap_jobs="$(curl --fail --silent --show-error \
              --header "$auth_header" \
              --header "$accept_header" \
              "$api/actions/runs/$bootstrap_run_id/jobs?filter=latest&per_page=100")"
            if ! jq -e \
              '[.jobs[].steps[]? | select(
                .name == "Re-verify exact current main before provider deployment"
                and .conclusion == "failure"
              )] | length == 1' \
              <<<"$bootstrap_jobs" >/dev/null \
              || ! jq -e \
                '[.jobs[].steps[]? | select(
                  .name == "Invoke exact initial bootstrap tag once"
                  and .conclusion == "skipped"
                )] | length == 1' \
                <<<"$bootstrap_jobs" >/dev/null; then
              echo 'R1_BOOTSTRAP_AUTOCONTINUE_INTERRUPTED_CHILD_NOT_MAIN_MOVE'
              exit 0
            fi

            echo 'R1_BOOTSTRAP_AUTOCONTINUE_RESUME_AFTER_PREINVOKE_MAIN_MOVE'
          fi

          current_sha="$(curl --fail --silent --show-error \
            --header "$auth_header" \
            --header "$accept_header" \
            "$api/branches/main" | jq -er '.commit.sha')"
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo 'R1_BOOTSTRAP_AUTOCONTINUE_MAIN_MOVED_BEFORE_DISPATCH'
            exit 0
          fi

          dispatch_payload="$(jq -cn \
            --arg ci_run_id "$SOURCE_CI_RUN_ID" \
            --arg resume "$allow_staging_resume" \
            --arg stale "$allow_stale_staging_retirement" \
            '{ref:"main", inputs:{ci_run_id:$ci_run_id, allow_staging_resume:$resume, allow_stale_staging_retirement:$stale}}')"
          curl --fail --silent --show-error \
            --request POST \
            --header "$auth_header" \
            --header "$accept_header" \
            --header 'Content-Type: application/json' \
            "$api/actions/workflows/r1-initial-bootstrap-orchestrator.yml/dispatches" \
            --data "$dispatch_payload"
          echo 'R1_BOOTSTRAP_AUTOCONTINUE_DISPATCHED'