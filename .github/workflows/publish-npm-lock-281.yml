name: Publish exact npm lock 281

on:
  push:
    branches:
      - transport/publish-npm-lock-281

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/tooling-reproducible-npm-lock
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Regenerate and publish exact lockfile tree
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_HEAD='241e2d49276b6caed8e01e80459498bd78765d61'
          EXPECTED_TREE='2f40dbbb9130e5d75801c0d7a34fd9bbdd01f942'
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git add package-lock.json
          git diff --cached --check
          test "$(git write-tree)" = "${EXPECTED_TREE}"
          npm ci --ignore-scripts --no-audit --no-fund
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'tooling: add reproducible npm lockfile'
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          git push origin HEAD:fix/tooling-reproducible-npm-lock
