name: R1 initial controlled rebuild

on:
  workflow_dispatch:
    inputs:
      tracking_issue:
        description: Open R1 WU7 authority Issue number
        required: true
        type: string
      expected_main_sha:
        description: Exact main SHA authorized for this attempt
        required: true
        type: string
      recovery_run_id:
        description: Exact successful read-only recovery run proving safe STAGING or VALIDATED continuation
        required: true
        type: string
      readiness_run_id:
        description: Exact successful readiness run proving READINESS_READY
        required: true
        type: string
      deploy_recovery_run_id:
        description: Optional exact successful deploy-recovery run proving an existing controlled tag is reusable
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  id-token: write

concurrency:
  group: r1-initial-controlled-rebuild
  cancel-in-progress: false

jobs:
  initial-controlled-rebuild:
    if: github.repository == 'kmephis-ai/PrihRash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FUNCTION_NAME: prihrash-r1-initial-bootstrap
      RUNTIME_SERVICE_ACCOUNT_NAME: prihrash-initial-bootstrap
      LOCKBOX_SECRET_NAME: prihrash-r1-initial-bootstrap
      OIDC_AUDIENCE: https://github.com/kmephis-ai
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      OIDC_SUBJECT: repo:kmephis-ai@310519475/PrihRash@1359286840:ref:refs/heads/main
      YC_FOLDER_ID: ${{ secrets.YC_R1_FOLDER_ID }}
      YC_WIF_SERVICE_ACCOUNT_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_WIF_SERVICE_ACCOUNT_ID }}
      YC_LOCKBOX_SECRET_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_LOCKBOX_SECRET_ID }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify immutable source and explicit WU7 authority boundary
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
          DEPLOY_RECOVERY_RUN_ID: ${{ inputs.deploy_recovery_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'kmephis-ai/PrihRash'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          test -n "$YC_FOLDER_ID"
          test -n "$YC_WIF_SERVICE_ACCOUNT_ID"
          test -n "$YC_LOCKBOX_SECRET_ID"
          [[ "$TRACKING_ISSUE" =~ ^[1-9][0-9]*$ ]] || { echo 'INITIAL_CONTROLLED_REBUILD_AUTHORITY_ISSUE_INVALID'; exit 1; }
          [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'INITIAL_CONTROLLED_REBUILD_RECOVERY_RUN_INVALID'; exit 1; }
          [[ "$READINESS_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'INITIAL_CONTROLLED_REBUILD_READINESS_RUN_INVALID'; exit 1; }
          if [ -n "$DEPLOY_RECOVERY_RUN_ID" ]; then
            [[ "$DEPLOY_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_RUN_INVALID'; exit 1; }
          fi

          tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-gates"
          mkdir -p "$tmp"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json'             "$api/branches/main" --output "$tmp/main.json"
          jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha and .protected == true' "$tmp/main.json" >/dev/null             || { echo 'INITIAL_CONTROLLED_REBUILD_MAIN_GATE_NOT_READY'; exit 1; }

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json'             "$api/issues/${TRACKING_ISSUE}" --output "$tmp/authority.json"
          jq -e '
            .state == "open"
            and (.title | startswith("R1 WU7:"))
            and (.body | contains("Provider-Authority: WU7_CONTROLLED_REBUILD"))
            and (.body | contains("Authority-Scope: PRODUCTION_YDB_INITIAL_SHADOW_ONLY"))
            and (.body | contains("Google-Authority: PRESERVED"))
            and (.body | contains("Cap-Increase: FORBIDDEN"))
            and (.body | contains("Timer-Cutover: FORBIDDEN"))
            and (.body | contains("Blind-Replay: FORBIDDEN"))
          ' "$tmp/authority.json" >/dev/null             || { echo 'INITIAL_CONTROLLED_REBUILD_AUTHORITY_MISSING'; exit 1; }

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json'             "$api/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" --output "$tmp/ci.json"
          jq -e --arg sha "$GITHUB_SHA" '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' "$tmp/ci.json" >/dev/null             || { echo 'INITIAL_CONTROLLED_REBUILD_EXACT_SHA_CI_MISSING'; exit 1; }

          for tuple in "recovery:${RECOVERY_RUN_ID}:R1 initial bootstrap recovery" "readiness:${READINESS_RUN_ID}:R1 Yandex readiness"; do
            IFS=: read -r kind run_id expected_name <<<"$tuple"
            curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json'               "$api/actions/runs/${run_id}" --output "$tmp/${kind}-run.json"
            jq -e --arg sha "$GITHUB_SHA" --arg name "$expected_name" '
              .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch"
              and .status == "completed" and .conclusion == "success" and .name == $name
            ' "$tmp/${kind}-run.json" >/dev/null               || { echo "INITIAL_CONTROLLED_REBUILD_${kind^^}_RUN_NOT_EXACT"; exit 1; }
          done

          if [ -n "$DEPLOY_RECOVERY_RUN_ID" ]; then
            curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json'               "$api/actions/runs/${DEPLOY_RECOVERY_RUN_ID}" --output "$tmp/deploy-recovery-run.json"
            jq -e --arg sha "$GITHUB_SHA" '
              .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch"
              and .status == "completed" and .conclusion == "success"
              and .name == "R1 initial controlled rebuild deploy recovery"
            ' "$tmp/deploy-recovery-run.json" >/dev/null               || { echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_RUN_NOT_EXACT'; exit 1; }
          fi

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json'             "$api/actions/runs?per_page=100" --output "$tmp/runs.json"
          jq -e --argjson self "$GITHUB_RUN_ID" '
            [.workflow_runs[]
             | select(.id != $self)
             | select(.status == "queued" or .status == "in_progress")
             | select(.name == "R1 initial shadow bootstrap"
                   or .name == "R1 initial bootstrap orchestrator"
                   or .name == "R1 initial controlled rebuild")]
            | length == 0
          ' "$tmp/runs.json" >/dev/null             || { echo 'INITIAL_CONTROLLED_REBUILD_WRITER_CONFLICT'; exit 1; }

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact-source invoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore verified exact-source artifact
        uses: ./.github/actions/restore-exact-source
        with:
          source-sha: ${{ github.sha }}
          github-token: ${{ github.token }}

      - name: Download exact recovery evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r1-initial-bootstrap-recovery-evidence-${{ inputs.recovery_run_id }}
          path: ${{ runner.temp }}/r1-wu7-prereq/recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.recovery_run_id }}

      - name: Download exact readiness evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r1-yandex-readiness-evidence-${{ inputs.readiness_run_id }}
          path: ${{ runner.temp }}/r1-wu7-prereq/readiness
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.readiness_run_id }}

      - name: Download exact deploy recovery evidence
        if: ${{ inputs.deploy_recovery_run_id != '' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: r1-initial-controlled-rebuild-deploy-recovery-evidence-${{ inputs.deploy_recovery_run_id }}
          path: ${{ runner.temp }}/r1-wu7-prereq/deploy-recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.deploy_recovery_run_id }}

      - name: Prove exact safe resumable recovery and READINESS_READY evidence
        shell: bash
        env:
          DEPLOY_RECOVERY_RUN_ID: ${{ inputs.deploy_recovery_run_id }}
        run: |
          set -euo pipefail
          recovery="$RUNNER_TEMP/r1-wu7-prereq/recovery/classification.json"
          readiness="$RUNNER_TEMP/r1-wu7-prereq/readiness/classification.json"
          jq -e '
            type == "object"
            and (keys | sort) == ["code","reason","status","verdict"]
            and .status == "PASS"
            and .code == "INITIAL_BOOTSTRAP_RECOVERY_CLASSIFIED"
            and .verdict == "RECOVERY_REQUIRED"
            and (.reason == "STAGING_RUN_PRESENT" or .reason == "VALIDATED_CURRENT_EMPTY_STAGING_ABSENT")
          ' "$recovery" >/dev/null || { echo 'INITIAL_CONTROLLED_REBUILD_RECOVERY_EVIDENCE_NOT_RESUMABLE'; exit 1; }
          jq -e '
            type == "object"
            and (keys | sort) == ["code","status"]
            and .status == "PASS"
            and .code == "READINESS_READY"
          ' "$readiness" >/dev/null || { echo 'INITIAL_CONTROLLED_REBUILD_READINESS_EVIDENCE_NOT_READY'; exit 1; }

          if [ -n "$DEPLOY_RECOVERY_RUN_ID" ]; then
            jq -e '
              .reason == "VALIDATED_CURRENT_EMPTY_STAGING_ABSENT"
            ' "$recovery" >/dev/null || { echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_YDB_STATE_NOT_SAFE'; exit 1; }

            deploy_recovery="$RUNNER_TEMP/r1-wu7-prereq/deploy-recovery/classification.json"
            jq -e '
              type == "object"
              and (keys | sort) == ["code","reason","status","verdict"]
              and .status == "PASS"
              and .code == "INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_CLASSIFIED"
              and .verdict == "APPLIED"
              and .reason == "EXACT_ACTIVE_TAG"
            ' "$deploy_recovery" >/dev/null || { echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_RECOVERY_EVIDENCE_NOT_APPLIED'; exit 1; }
          fi
      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/yc"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$install_dir"
          yc_bin="$(find "$install_dir" -type f -name yc -perm -u+x -print -quit)"
          test -n "$yc_bin"
          printf '%s\n' "$(dirname "$yc_bin")" >> "$GITHUB_PATH"
          "$yc_bin" version >/dev/null

      - name: Exchange GitHub OIDC token for short-lived Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-auth"
          mkdir -p "$tmp"
          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value | @uri')"

          if ! oidc_status="$(curl --silent --show-error \
            --output "$tmp/oidc.json" \
            --write-out '%{http_code}' \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" \
            2>"$tmp/oidc.err")"; then
            echo 'INITIAL_CONTROLLED_REBUILD_OIDC_REQUEST_FAILED'
            exit 1
          fi
          case "$oidc_status" in
            2??) ;;
            *)
              echo 'INITIAL_CONTROLLED_REBUILD_OIDC_REQUEST_FAILED'
              exit 1
              ;;
          esac
          if ! oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' "$tmp/oidc.json" 2>/dev/null)"; then
            echo 'INITIAL_CONTROLLED_REBUILD_OIDC_REQUEST_FAILED'
            exit 1
          fi
          echo "::add-mask::${oidc_token}"

          token_payload="${oidc_token#*.}"
          token_payload="${token_payload%%.*}"
          token_payload="${token_payload//-/+}"
          token_payload="${token_payload//_/\/}"
          case "$((${#token_payload} % 4))" in
            0) ;;
            2) token_payload="${token_payload}==" ;;
            3) token_payload="${token_payload}=" ;;
            *)
              echo 'INITIAL_CONTROLLED_REBUILD_OIDC_CLAIMS_INVALID'
              exit 1
              ;;
          esac
          if ! printf '%s' "$token_payload" | base64 --decode >"$tmp/claims.json" 2>"$tmp/claims.err"; then
            echo 'INITIAL_CONTROLLED_REBUILD_OIDC_CLAIMS_INVALID'
            exit 1
          fi
          if ! jq -e --arg expected "$OIDC_ISSUER" '.iss == $expected' "$tmp/claims.json" >/dev/null 2>&1; then
            echo 'INITIAL_CONTROLLED_REBUILD_OIDC_ISSUER_MISMATCH'
            exit 1
          fi
          if ! jq -e --arg expected "$OIDC_AUDIENCE" '(.aud == $expected) or ((.aud | type) == "array" and (.aud | length) == 1 and .aud[0] == $expected)' "$tmp/claims.json" >/dev/null 2>&1; then
            echo 'INITIAL_CONTROLLED_REBUILD_OIDC_AUDIENCE_MISMATCH'
            exit 1
          fi
          if ! jq -e --arg expected "$OIDC_SUBJECT" '.sub == $expected' "$tmp/claims.json" >/dev/null 2>&1; then
            echo 'INITIAL_CONTROLLED_REBUILD_OIDC_SUBJECT_MISMATCH'
            exit 1
          fi

          if ! iam_status="$(curl --silent --show-error \
            --output "$tmp/iam.json" \
            --write-out '%{http_code}' \
            --request POST https://auth.yandex.cloud/oauth/token \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_WIF_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${oidc_token}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            2>"$tmp/iam.err")"; then
            echo 'INITIAL_CONTROLLED_REBUILD_WIF_EXCHANGE_FAILED'
            exit 1
          fi
          case "$iam_status" in
            2??) ;;
            *)
              wif_error="$(jq -r '.error // empty' "$tmp/iam.json" 2>/dev/null || true)"
              case "$wif_error" in
                invalid_request) echo 'INITIAL_CONTROLLED_REBUILD_WIF_INVALID_REQUEST' ;;
                invalid_grant) echo 'INITIAL_CONTROLLED_REBUILD_WIF_INVALID_GRANT' ;;
                invalid_target) echo 'INITIAL_CONTROLLED_REBUILD_WIF_INVALID_TARGET' ;;
                unauthorized_client) echo 'INITIAL_CONTROLLED_REBUILD_WIF_UNAUTHORIZED_CLIENT' ;;
                unsupported_grant_type) echo 'INITIAL_CONTROLLED_REBUILD_WIF_UNSUPPORTED_GRANT_TYPE' ;;
                *) echo 'INITIAL_CONTROLLED_REBUILD_WIF_EXCHANGE_FAILED' ;;
              esac
              exit 1
              ;;
          esac
          if ! iam_token="$(jq -er '.access_token | select(type == "string" and length > 0)' "$tmp/iam.json" 2>/dev/null)"; then
            echo 'INITIAL_CONTROLLED_REBUILD_WIF_EXCHANGE_FAILED'
            exit 1
          fi
          echo "::add-mask::${iam_token}"
          printf 'YC_IAM_TOKEN=%s\n' "$iam_token" >> "$GITHUB_ENV"

      - name: Fail closed if dedicated provider boundary is unsafe
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-provider"
          mkdir -p "$tmp"

          if ! yc serverless function get --name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/function.json" 2>"$tmp/function.err"; then
            echo 'INITIAL_CONTROLLED_REBUILD_FUNCTION_RESOLUTION_FAILED'
            exit 1
          fi
          if ! function_id="$(jq -er '.id | select(type == "string" and length > 0)' "$tmp/function.json" 2>/dev/null)"; then
            echo 'INITIAL_CONTROLLED_REBUILD_FUNCTION_METADATA_INVALID'
            exit 1
          fi

          if ! yc serverless function list-access-bindings --id "$function_id" \
            --format json --retry 0 --no-user-output >"$tmp/bindings.json" 2>"$tmp/bindings.err"; then
            echo 'INITIAL_CONTROLLED_REBUILD_FUNCTION_BINDINGS_READ_FAILED'
            exit 1
          fi
          if jq -e '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject.id] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'INITIAL_CONTROLLED_REBUILD_FUNCTION_PUBLIC'
            exit 1
          fi

          if ! yc serverless trigger list --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/triggers.json" 2>"$tmp/triggers.err"; then
            echo 'INITIAL_CONTROLLED_REBUILD_TRIGGER_LIST_FAILED'
            exit 1
          fi
          if jq -e --arg id "$function_id" '.. | strings | select(. == $id)' "$tmp/triggers.json" >/dev/null; then
            echo 'INITIAL_CONTROLLED_REBUILD_FUNCTION_TRIGGER_PRESENT'
            exit 1
          fi

          if ! runtime_sa_json="$(yc iam service-account get --name "$RUNTIME_SERVICE_ACCOUNT_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output 2>"$tmp/runtime-sa.err")"; then
            echo 'INITIAL_CONTROLLED_REBUILD_RUNTIME_SA_RESOLUTION_FAILED'
            exit 1
          fi
          if ! runtime_sa_id="$(jq -er '.id | select(type == "string" and length > 0)' <<<"$runtime_sa_json" 2>/dev/null)"; then
            echo 'INITIAL_CONTROLLED_REBUILD_RUNTIME_SA_METADATA_INVALID'
            exit 1
          fi

          echo "::add-mask::${YC_LOCKBOX_SECRET_ID}"
          if ! secret_http="$(curl --silent --show-error \
            --output "$tmp/secret.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            "https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${YC_LOCKBOX_SECRET_ID}" \
            2>"$tmp/secret.err")"; then
            echo 'INITIAL_CONTROLLED_REBUILD_LOCKBOX_REST_TRANSPORT_FAILED'
            exit 1
          fi
          case "$secret_http" in
            2??) ;;
            401) echo 'INITIAL_CONTROLLED_REBUILD_LOCKBOX_REST_AUTH_FAILED'; exit 1 ;;
            403) echo 'INITIAL_CONTROLLED_REBUILD_LOCKBOX_REST_PERMISSION_DENIED'; exit 1 ;;
            404) echo 'INITIAL_CONTROLLED_REBUILD_LOCKBOX_REST_NOT_FOUND'; exit 1 ;;
            *) echo 'INITIAL_CONTROLLED_REBUILD_LOCKBOX_REST_UNEXPECTED_STATUS'; exit 1 ;;
          esac
          if ! jq -e \
            --arg expected_id "$YC_LOCKBOX_SECRET_ID" \
            --arg expected_name "$LOCKBOX_SECRET_NAME" \
            --arg expected_folder_id "$YC_FOLDER_ID" \
            '(.id == $expected_id) and (.name == $expected_name) and (.folderId == $expected_folder_id) and (.status == "ACTIVE")' \
            "$tmp/secret.json" >/dev/null 2>&1; then
            echo 'INITIAL_CONTROLLED_REBUILD_LOCKBOX_SECRET_METADATA_INVALID'
            exit 1
          fi
          secret_id="$YC_LOCKBOX_SECRET_ID"
          if ! secret_version_id="$(jq -er '.currentVersion.id | select(type == "string" and length > 0)' "$tmp/secret.json" 2>/dev/null)"; then
            echo 'INITIAL_CONTROLLED_REBUILD_LOCKBOX_VERSION_RESOLUTION_FAILED'
            exit 1
          fi

          echo "::add-mask::${function_id}"
          echo "::add-mask::${runtime_sa_id}"
          echo "::add-mask::${secret_id}"
          echo "::add-mask::${secret_version_id}"
          {
            printf 'PRIHRASH_YC_FUNCTION_ID=%s\n' "$function_id"
            printf 'PRIHRASH_YC_FUNCTION_SA_ID=%s\n' "$runtime_sa_id"
            printf 'PRIHRASH_LOCKBOX_SECRET_ID=%s\n' "$secret_id"
            printf 'PRIHRASH_LOCKBOX_VERSION_ID=%s\n' "$secret_version_id"
          } >> "$GITHUB_ENV"

      - name: Re-verify exact current main before provider deployment
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" \
            | jq -er '.commit.sha')"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo 'INITIAL_CONTROLLED_REBUILD_MAIN_MOVED_BEFORE_DEPLOY'
            exit 1
          fi

      - name: Deploy initial-controlled-rebuild-only Function version
        if: ${{ inputs.deploy_recovery_run_id == '' }}
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-deploy"
          mkdir -p "$tmp"
          if ! yc serverless function version create \
            --function-id "$PRIHRASH_YC_FUNCTION_ID" \
            --runtime nodejs22 \
            --entrypoint index.initialControlledRebuildHandler \
            --memory 256m \
            --execution-timeout 600s \
            --source-path .artifacts/yandex-initial-controlled-rebuild-function \
            --service-account-id "$PRIHRASH_YC_FUNCTION_SA_ID" \
            --async-max-retries 0 \
            --async-service-account-id "$YC_WIF_SERVICE_ACCOUNT_ID" \
            --tags r1-initial-controlled-rebuild \
            --metadata-options gce-http-endpoint=enabled,aws-v1-http-endpoint=disabled \
            --no-logging \
            --secret "environment-variable=PRIHRASH_GOOGLE_SPREADSHEET_ID,id=${PRIHRASH_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_spreadsheet_id" \
            --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_EMAIL,id=${PRIHRASH_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_service_account_email" \
            --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY,id=${PRIHRASH_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_service_account_private_key" \
            --secret "environment-variable=PRIHRASH_YDB_CONNECTION_STRING,id=${PRIHRASH_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=ydb_connection_string" \
            --secret "environment-variable=PRIHRASH_INITIAL_BOOTSTRAP_PRIVATE_HISTORICAL_EVIDENCE,id=${PRIHRASH_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=initial_bootstrap_private_historical_evidence" \
            --format json --retry 0 --no-user-output >"$tmp/version.json" 2>"$tmp/version.err"; then
            echo 'INITIAL_CONTROLLED_REBUILD_DEPLOY_FAILED'
            exit 1
          fi

      - name: Re-verify private trigger-free boundary
        shell: bash
        env:
          DEPLOY_RECOVERY_RUN_ID: ${{ inputs.deploy_recovery_run_id }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-postflight"
          mkdir -p "$tmp"

          if ! yc serverless function list-access-bindings --id "$PRIHRASH_YC_FUNCTION_ID" \
            --format json --retry 0 --no-user-output >"$tmp/bindings.json" 2>"$tmp/bindings.err"; then
            echo 'INITIAL_CONTROLLED_REBUILD_POSTFLIGHT_FUNCTION_BINDINGS_READ_FAILED'
            exit 1
          fi
          if jq -e '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject.id] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'INITIAL_CONTROLLED_REBUILD_POSTFLIGHT_FUNCTION_PUBLIC'
            exit 1
          fi

          if ! yc serverless trigger list --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/triggers.json" 2>"$tmp/triggers.err"; then
            echo 'INITIAL_CONTROLLED_REBUILD_POSTFLIGHT_TRIGGER_LIST_FAILED'
            exit 1
          fi
          if jq -e --arg id "$PRIHRASH_YC_FUNCTION_ID" '.. | strings | select(. == $id)' "$tmp/triggers.json" >/dev/null; then
            echo 'INITIAL_CONTROLLED_REBUILD_POSTFLIGHT_FUNCTION_TRIGGER_PRESENT'
            exit 1
          fi

          if [ -n "$DEPLOY_RECOVERY_RUN_ID" ]; then
            if ! yc serverless function version list --function-id "$PRIHRASH_YC_FUNCTION_ID"               --format json --retry 0 --no-user-output >"$tmp/versions.json" 2>"$tmp/versions.err"; then
              echo 'INITIAL_CONTROLLED_REBUILD_POSTFLIGHT_VERSION_LIST_FAILED'
              exit 1
            fi
            matching="$(jq --arg tag 'r1-initial-controlled-rebuild' '[.[]? | select((.tags | type) == "array" and (.tags | index($tag)) != null)] | length' "$tmp/versions.json")"
            [ "$matching" = "1" ] || { echo 'INITIAL_CONTROLLED_REBUILD_POSTFLIGHT_TAG_NOT_EXACT'; exit 1; }
            jq -e --arg tag 'r1-initial-controlled-rebuild' --arg async_sa "$YC_WIF_SERVICE_ACCOUNT_ID" '
              [.[]? | select((.tags | type) == "array" and (.tags | index($tag)) != null)][0] as $v
              | ($v.runtime == "nodejs22")
                and ($v.entrypoint == "index.initialControlledRebuildHandler")
                and ($v.status == "ACTIVE")
                and (($v.async_invocation_config | type) == "object")
                and (($v.async_invocation_config.retries_count | tostring) == "0")
                and ($v.async_invocation_config.service_account_id == $async_sa)
                and (($v.async_invocation_config.success_target.ymq_target // null) == null)
                and (($v.async_invocation_config.failure_target.ymq_target // null) == null)
            ' "$tmp/versions.json" >/dev/null || {
              echo 'INITIAL_CONTROLLED_REBUILD_POSTFLIGHT_ASYNC_TAG_NOT_EXACT'
              exit 1
            }
          fi

      - name: Re-verify exact current main before controlled rebuild invocation
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" \
            | jq -er '.commit.sha')"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo 'INITIAL_CONTROLLED_REBUILD_MAIN_MOVED_BEFORE_INVOKE'
            exit 1
          fi

      - name: Start exact controlled rebuild tag asynchronously once
        id: controlled-invoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PRIHRASH_YANDEX_INITIAL_CONTROLLED_REBUILD_FUNCTION_ID="$PRIHRASH_YC_FUNCTION_ID"
          export PRIHRASH_INITIAL_CONTROLLED_REBUILD_INVOKE_MODE=async
          tmp="$RUNNER_TEMP/r1-initial-controlled-rebuild-invoke.log"
          evidence_dir="$RUNNER_TEMP/r1-initial-controlled-rebuild-evidence"
          candidate="$evidence_dir/classification.tmp"
          mkdir -p "$evidence_dir"

          set +e
          npm run initial-controlled-rebuild:invoke | tee "$tmp"
          invoke_status="${PIPESTATUS[0]}"
          set -e

          if ! tail -n 1 "$tmp" | jq -c -e '
            select(type == "object")
            | . as $r
            | select(
                (($r.status == "PASS" and $r.code == "INITIAL_CONTROLLED_REBUILD_ASYNC_ACCEPTED" and (keys | sort) == ["code","status"])
                or ($r.status == "PASS" and $r.code == "INITIAL_CONTROLLED_REBUILD_COMMITTED" and (keys | sort) == ["code","status"])
                or ($r.status == "NOOP" and $r.code == "INITIAL_CONTROLLED_REBUILD_BASELINE_EXISTS" and (keys | sort) == ["code","status"])
                or ($r.status == "STOP" and $r.code == "INITIAL_CONTROLLED_REBUILD_RECOVERY_REQUIRED"
                    and (keys | sort) == ["code","recoveryReason","status"]
                    and (.recoveryReason | IN(
                      "VALIDATION_TRANSITION_OUTCOME_UNKNOWN","SETUP_STATE_AMBIGUOUS","SETUP_OUTCOME_NOT_APPLIED",
                      "SETUP_OUTCOME_AMBIGUOUS","STAGING_MATERIALIZATION_INCOMPLETE","SWAP_OUTCOME_NOT_APPLIED",
                      "SWAP_OUTCOME_AMBIGUOUS","COMMIT_MARKER_PENDING","COMMIT_MARKER_OUTCOME_AMBIGUOUS",
                      "POST_SWAP_VERIFICATION_MISMATCH","POST_COMMIT_VERIFICATION_MISMATCH")))
                or ($r.status == "STOP" and $r.code == "INITIAL_CONTROLLED_REBUILD_VALIDATION_BLOCKED"
                    and (keys | sort) == ["blockers","code","status"]
                    and (.blockers | type) == "array" and (.blockers | length) > 0 and (.blockers | length) <= 32)
                or ($r.status == "FAIL" and $r.code == "INITIAL_CONTROLLED_REBUILD_RUNTIME_FAILED"
                    and (keys | sort) == ["code","jobCode","phase","status"]
                    and (.jobCode | IN("SOURCE_READ_FAILED","YDB_CLIENT_CREATE_FAILED","SCHEME_CLIENT_CREATE_FAILED","REFERENCE_READ_FAILED","APPLICATION_FAILED","POST_COMMIT_RECONCILIATION_MISMATCH","YDB_CLIENT_CLOSE_FAILED","CONFIG_INVALID","UNCAUGHT","MODULE_LOAD_FAILED","HANDLER_UNCAUGHT"))))
            )
          ' > "$candidate"; then
            printf '%s\n' '{"status":"FAIL","code":"INITIAL_CONTROLLED_REBUILD_INVOKE_OUTPUT_INVALID"}' > "$candidate"
            invoke_status=2
          fi
          mv "$candidate" "$evidence_dir/classification.json"
          rm -f "$tmp"
          exit "$invoke_status"

      - name: Publish enum-only controlled rebuild evidence
        if: ${{ always() && (steps.controlled-invoke.outcome == 'success' || steps.controlled-invoke.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-initial-controlled-rebuild-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/r1-initial-controlled-rebuild-evidence/classification.json
          if-no-files-found: error
          retention-days: 30

      - name: Require exact async acceptance only
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/r1-initial-controlled-rebuild-evidence/classification.json"
          test -f "$evidence" || { echo 'INITIAL_CONTROLLED_REBUILD_EVIDENCE_MISSING'; exit 1; }
          jq -e 'type == "object" and (keys | sort) == ["code","status"] and .status == "PASS" and .code == "INITIAL_CONTROLLED_REBUILD_ASYNC_ACCEPTED"'             "$evidence" >/dev/null || { echo 'INITIAL_CONTROLLED_REBUILD_ASYNC_NOT_ACCEPTED'; exit 1; }
          echo 'INITIAL_CONTROLLED_REBUILD_ASYNC_ACCEPTED_RECOVERY_REQUIRED'
