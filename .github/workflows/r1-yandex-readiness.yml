name: R1 Yandex readiness

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: r1-yandex-readiness
  cancel-in-progress: false

jobs:
  readiness:
    if: github.repository == 'kmephis-ai/PrihRash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUNCTION_NAME: prihrash-r1-readiness
      RUNTIME_SERVICE_ACCOUNT_NAME: prihrash-backend
      LOCKBOX_SECRET_NAME: prihrash-r1-readiness
      OIDC_AUDIENCE: https://github.com/kmephis-ai
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      OIDC_SUBJECT: repo:kmephis-ai@310519475/PrihRash@1359286840:ref:refs/heads/main
      YC_FOLDER_ID: ${{ secrets.YC_R1_FOLDER_ID }}
      YC_WIF_SERVICE_ACCOUNT_ID: ${{ secrets.YC_R1_WIF_SERVICE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify immutable source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'kmephis-ai/PrihRash'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$YC_FOLDER_ID"
          test -n "$YC_WIF_SERVICE_ACCOUNT_ID"

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify and package exact source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/yc"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$install_dir"
          yc_bin="$(find "$install_dir" -type f -name yc -perm -u+x -print -quit)"
          test -n "$yc_bin"
          printf '%s\n' "$(dirname "$yc_bin")" >> "$GITHUB_PATH"
          "$yc_bin" version >/dev/null

      - name: Exchange GitHub OIDC token for short-lived Yandex IAM token
        id: yandex-auth
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-auth"
          mkdir -p "$tmp"
          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value | @uri')"

          if ! oidc_status="$(curl --silent --show-error \
            --output "$tmp/oidc.json" \
            --write-out '%{http_code}' \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" \
            2>"$tmp/oidc.err")"; then
            echo 'READINESS_OIDC_REQUEST_FAILED'
            exit 1
          fi
          case "$oidc_status" in
            2??) ;;
            *)
              echo 'READINESS_OIDC_REQUEST_FAILED'
              exit 1
              ;;
          esac
          if ! oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' "$tmp/oidc.json" 2>/dev/null)"; then
            echo 'READINESS_OIDC_REQUEST_FAILED'
            exit 1
          fi
          echo "::add-mask::${oidc_token}"

          token_payload="${oidc_token#*.}"
          token_payload="${token_payload%%.*}"
          token_payload="${token_payload//-/+}"
          token_payload="${token_payload//_/\/}"
          case "$((${#token_payload} % 4))" in
            0) ;;
            2) token_payload="${token_payload}==" ;;
            3) token_payload="${token_payload}=" ;;
            *)
              echo 'READINESS_OIDC_CLAIMS_INVALID'
              exit 1
              ;;
          esac
          if ! printf '%s' "$token_payload" | base64 --decode >"$tmp/claims.json" 2>"$tmp/claims.err"; then
            echo 'READINESS_OIDC_CLAIMS_INVALID'
            exit 1
          fi
          if ! jq -e --arg expected "$OIDC_ISSUER" '.iss == $expected' "$tmp/claims.json" >/dev/null 2>&1; then
            echo 'READINESS_OIDC_ISSUER_MISMATCH'
            exit 1
          fi
          if ! jq -e --arg expected "$OIDC_AUDIENCE" '(.aud == $expected) or ((.aud | type) == "array" and (.aud | length) == 1 and .aud[0] == $expected)' "$tmp/claims.json" >/dev/null 2>&1; then
            echo 'READINESS_OIDC_AUDIENCE_MISMATCH'
            exit 1
          fi
          if ! jq -e --arg expected "$OIDC_SUBJECT" '.sub == $expected' "$tmp/claims.json" >/dev/null 2>&1; then
            echo 'READINESS_OIDC_SUBJECT_MISMATCH'
            exit 1
          fi

          if ! iam_status="$(curl --silent --show-error \
            --output "$tmp/iam.json" \
            --write-out '%{http_code}' \
            --request POST https://auth.yandex.cloud/oauth/token \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_WIF_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${oidc_token}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            2>"$tmp/iam.err")"; then
            echo 'READINESS_WIF_EXCHANGE_FAILED'
            exit 1
          fi
          case "$iam_status" in
            2??) ;;
            *)
              wif_error="$(jq -r '.error // empty' "$tmp/iam.json" 2>/dev/null || true)"
              case "$wif_error" in
                invalid_request) echo 'READINESS_WIF_INVALID_REQUEST' ;;
                invalid_grant) echo 'READINESS_WIF_INVALID_GRANT' ;;
                invalid_target) echo 'READINESS_WIF_INVALID_TARGET' ;;
                unauthorized_client) echo 'READINESS_WIF_UNAUTHORIZED_CLIENT' ;;
                unsupported_grant_type) echo 'READINESS_WIF_UNSUPPORTED_GRANT_TYPE' ;;
                *) echo 'READINESS_WIF_EXCHANGE_FAILED' ;;
              esac
              exit 1
              ;;
          esac
          if ! iam_token="$(jq -er '.access_token | select(type == "string" and length > 0)' "$tmp/iam.json" 2>/dev/null)"; then
            echo 'READINESS_WIF_EXCHANGE_FAILED'
            exit 1
          fi
          echo "::add-mask::${iam_token}"
          printf 'YC_IAM_TOKEN=%s\n' "$iam_token" >> "$GITHUB_ENV"

      - name: Fail closed if provider boundary is unsafe
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-provider"
          mkdir -p "$tmp"

          yc serverless function get --name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/function.json" 2>"$tmp/function.err" || {
              echo 'READINESS_PROVIDER_CONFIG_INVALID'
              exit 1
            }
          function_id="$(jq -er '.id | select(type == "string" and length > 0)' "$tmp/function.json")"

          yc serverless function list-access-bindings --id "$function_id" \
            --format json --retry 0 --no-user-output >"$tmp/bindings.json" 2>"$tmp/bindings.err" || {
              echo 'READINESS_PROVIDER_CONFIG_INVALID'
              exit 1
            }
          if jq -e '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject.id] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'READINESS_PROVIDER_CONFIG_INVALID'
            exit 1
          fi
          if ! jq -e --arg expected "$YC_WIF_SERVICE_ACCOUNT_ID" \
            '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject] | any(.type == "serviceAccount" and .id == $expected)' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'READINESS_PROVIDER_INVOKER_BINDING_MISSING'
            exit 1
          fi

          yc serverless trigger list --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/triggers.json" 2>"$tmp/triggers.err" || {
              echo 'READINESS_PROVIDER_CONFIG_INVALID'
              exit 1
            }
          if jq -e --arg id "$function_id" '.. | strings | select(. == $id)' "$tmp/triggers.json" >/dev/null; then
            echo 'READINESS_PROVIDER_CONFIG_INVALID'
            exit 1
          fi

          runtime_sa_json="$(yc iam service-account get --name "$RUNTIME_SERVICE_ACCOUNT_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output 2>"$tmp/runtime-sa.err")" || {
              echo 'READINESS_PROVIDER_CONFIG_INVALID'
              exit 1
            }
          runtime_sa_id="$(jq -er '.id | select(type == "string" and length > 0)' <<<"$runtime_sa_json")"

          secret_json="$(yc lockbox secret get --name "$LOCKBOX_SECRET_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output 2>"$tmp/secret.err")" || {
              echo 'READINESS_PROVIDER_CONFIG_INVALID'
              exit 1
            }
          secret_id="$(jq -er '.id | select(type == "string" and length > 0)' <<<"$secret_json")"
          secret_version_id="$(jq -er '(.current_version.id // .current_version_id // .currentVersion.id // .currentVersionId) | select(type == "string" and length > 0)' <<<"$secret_json")"

          echo "::add-mask::${function_id}"
          echo "::add-mask::${runtime_sa_id}"
          echo "::add-mask::${secret_id}"
          echo "::add-mask::${secret_version_id}"
          {
            printf 'PRIHRASH_YC_FUNCTION_ID=%s\n' "$function_id"
            printf 'PRIHRASH_YC_FUNCTION_SA_ID=%s\n' "$runtime_sa_id"
            printf 'PRIHRASH_LOCKBOX_SECRET_ID=%s\n' "$secret_id"
            printf 'PRIHRASH_LOCKBOX_VERSION_ID=%s\n' "$secret_version_id"
          } >> "$GITHUB_ENV"

      - name: Deploy readiness-only function version
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-deploy"
          mkdir -p "$tmp"
          if ! yc serverless function version create \
            --function-id "$PRIHRASH_YC_FUNCTION_ID" \
            --runtime nodejs22 \
            --entrypoint index.readinessHandler \
            --memory 128m \
            --execution-timeout 45s \
            --source-path .artifacts/yandex-scheduled-sync-function \
            --service-account-id "$PRIHRASH_YC_FUNCTION_SA_ID" \
            --tags r1-readiness \
            --metadata-options gce-http-endpoint=enabled,aws-v1-http-endpoint=disabled \
            --no-logging \
            --secret "environment-variable=PRIHRASH_GOOGLE_SPREADSHEET_ID,id=${PRIHRASH_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_spreadsheet_id" \
            --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_EMAIL,id=${PRIHRASH_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_service_account_email" \
            --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY,id=${PRIHRASH_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_service_account_private_key" \
            --secret "environment-variable=PRIHRASH_YDB_CONNECTION_STRING,id=${PRIHRASH_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=ydb_connection_string" \
            --format json --retry 0 --no-user-output >"$tmp/version.json" 2>"$tmp/version.err"; then
            echo 'READINESS_DEPLOY_FAILED'
            exit 1
          fi

      - name: Re-verify private trigger-free boundary
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-postflight"
          mkdir -p "$tmp"

          yc serverless function list-access-bindings --id "$PRIHRASH_YC_FUNCTION_ID" \
            --format json --retry 0 --no-user-output >"$tmp/bindings.json" 2>"$tmp/bindings.err" || {
              echo 'READINESS_PROVIDER_CONFIG_INVALID'
              exit 1
            }
          if jq -e '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject.id] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'READINESS_PROVIDER_CONFIG_INVALID'
            exit 1
          fi
          if ! jq -e --arg expected "$YC_WIF_SERVICE_ACCOUNT_ID" \
            '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject] | any(.type == "serviceAccount" and .id == $expected)' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'READINESS_PROVIDER_INVOKER_BINDING_MISSING'
            exit 1
          fi

          yc serverless trigger list --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/triggers.json" 2>"$tmp/triggers.err" || {
              echo 'READINESS_PROVIDER_CONFIG_INVALID'
              exit 1
            }
          if jq -e --arg id "$PRIHRASH_YC_FUNCTION_ID" '.. | strings | select(. == $id)' "$tmp/triggers.json" >/dev/null; then
            echo 'READINESS_PROVIDER_CONFIG_INVALID'
            exit 1
          fi

      - name: Invoke exact readiness tag
        id: readiness-invoke
        shell: bash
        run: |
          set -euo pipefail
          export PRIHRASH_YANDEX_READINESS_FUNCTION_ID="$PRIHRASH_YC_FUNCTION_ID"
          tmp="$RUNNER_TEMP/r1-readiness-invoke.log"
          evidence_dir="$RUNNER_TEMP/r1-yandex-readiness-evidence"
          candidate="$evidence_dir/classification.tmp"
          mkdir -p "$evidence_dir"

          set +e
          npm run readiness:invoke | tee "$tmp"
          invoke_status="${PIPESTATUS[0]}"
          set -e

          if ! tail -n 1 "$tmp" | jq -c -e '
            select(
              type == "object"
              and (
                ((keys | sort) == ["code", "status"] and .code != "READINESS_INVOKE_NONZERO_UNCLASSIFIED")
                or (
                  (keys | sort) == ["code", "outputShape", "status"]
                  and .code == "READINESS_INVOKE_NONZERO_UNCLASSIFIED"
                  and (.outputShape | type) == "string"
                  and (.outputShape | test("^STDOUT_(EMPTY|TEXT|JSON_OBJECT|JSON_ARRAY|JSON_STRING|JSON_NUMBER|JSON_BOOLEAN|JSON_NULL)__STDERR_(EMPTY|TEXT|JSON_OBJECT|JSON_ARRAY|JSON_STRING|JSON_NUMBER|JSON_BOOLEAN|JSON_NULL)$"))
                )
              )
              and (.code as $code | ([
                "READINESS_READY",
                "READINESS_CONFIG_INVALID",
                "READINESS_INVOKE_FAILED",
                "READINESS_INVOKE_OUTPUT_INVALID",
                "READINESS_INVOKE_NONZERO_UNCLASSIFIED",
                "READINESS_INVOKE_FUNCTION_TIMEOUT",
                "READINESS_INVOKE_MARKER_AMBIGUOUS",
                "READINESS_RUNTIME_CONFIG_INVALID",
                "READINESS_GOOGLE_SPREADSHEET_ID_INVALID",
                "READINESS_GOOGLE_CREDENTIALS_INVALID",
                "READINESS_GOOGLE_TOKEN_ACQUISITION_FAILED",
                "READINESS_GOOGLE_SHEETS_ACCESS_FAILED",
                "READINESS_GOOGLE_SHEETS_RESPONSE_INVALID",
                "READINESS_GOOGLE_SOURCE_METADATA_MISMATCH",
                "READINESS_GOOGLE_SOURCE_SHEET_MISSING",
                "READINESS_GOOGLE_SOURCE_SCHEMA_MISMATCH",
                "READINESS_GOOGLE_SOURCE_VALUE_UNSUPPORTED",
                "READINESS_GOOGLE_SOURCE_READ_FAILED",
                "READINESS_YDB_CLIENT_CREATE_FAILED",
                "READINESS_YDB_QUERY_HEALTH_READ_FAILED",
                "READINESS_YDB_MIGRATION_TABLE_RESOLUTION_FAILED",
                "READINESS_YDB_MIGRATION_TABLE_ACCESS_DENIED",
                "READINESS_YDB_MIGRATION_TABLE_READ_FAILED",
                "READINESS_YDB_MIGRATION_SCHEMA_READ_FAILED",
                "READINESS_YDB_MIGRATION_EVIDENCE_READ_FAILED",
                "READINESS_YDB_ACCOUNTS_SCHEMA_READ_FAILED",
                "READINESS_YDB_CATEGORIES_SCHEMA_READ_FAILED",
                "READINESS_YDB_INITIAL_BOOTSTRAP_IDENTITY_MANIFEST_SCHEMA_READ_FAILED",
                "READINESS_MALFORMED_SCHEMA_MIGRATION_EVIDENCE",
                "READINESS_MISSING_REQUIRED_SCHEMA_MIGRATION",
                "READINESS_UNEXPECTED_SCHEMA_MIGRATION",
                "READINESS_YDB_CLIENT_CLOSE_FAILED",
                "READINESS_RUNTIME_FAILED"
              ] | index($code)) != null)
              and (
                (.status == "PASS" and .code == "READINESS_READY")
                or (.status == "FAIL" and .code != "READINESS_READY")
              )
            )
            | if .code == "READINESS_INVOKE_NONZERO_UNCLASSIFIED"
              then {status, code, outputShape}
              else {status, code}
              end
          ' > "$candidate"; then
            rm -f "$candidate" "$tmp"
            echo 'READINESS_EVIDENCE_INVALID'
            exit 1
          fi
          mv "$candidate" "$evidence_dir/classification.json"
          rm -f "$tmp"
          exit "$invoke_status"

      - name: Publish enum-only readiness evidence
        if: ${{ always() && (steps.readiness-invoke.outcome == 'success' || steps.readiness-invoke.outcome == 'failure') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-yandex-readiness-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/r1-yandex-readiness-evidence/classification.json
          if-no-files-found: error
          retention-days: 1
