name: R1 630 post 35463356859 recovery

on:
  push:
    branches:
      - transport/r1-630-post-35463356859-recovery

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch mandatory exact-main read-only recovery
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 000eb38ebbf767ae11971ac62aed15562ac6c74f
          FAILED_RUN_ID: '35463356859'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'

          main="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/branches/main")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' <<<"$main" >/dev/null

          issue="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/issues/630")"
          jq -e '.state == "open" and (.title | startswith("R1 WU7:"))' <<<"$issue" >/dev/null

          failed="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/runs/$FAILED_RUN_ID")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .head_sha == $sha
            and .name == "R1 initial controlled rebuild"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "failure"
          ' <<<"$failed" >/dev/null

          active="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/runs?per_page=100")"
          if jq -e '
            .workflow_runs | any(
              (.status == "queued" or .status == "in_progress")
              and (.name == "R1 initial shadow bootstrap"
                   or .name == "R1 initial bootstrap orchestrator"
                   or .name == "R1 initial controlled rebuild")
            )
          ' <<<"$active" >/dev/null; then
            echo 'R1_630_POST_RECOVERY_WRITER_ACTIVE'
            exit 1
          fi

          existing="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          failed_updated="$(jq -er '.updated_at' <<<"$failed")"
          if jq -e --arg sha "$EXPECTED_MAIN_SHA" --arg after "$failed_updated" '
            .workflow_runs | any(.head_sha == $sha and .created_at > $after)
          ' <<<"$existing" >/dev/null; then
            echo 'R1_630_POST_RECOVERY_ALREADY_DISPATCHED'
            exit 0
          fi

          curl --fail --silent --show-error --request POST             --header "$auth_header"             --header "$accept_header"             --header 'X-GitHub-Api-Version: 2022-11-28'             "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/dispatches"             --data '{"ref":"main"}'
          echo 'R1_630_POST_RECOVERY_DISPATCHED'
