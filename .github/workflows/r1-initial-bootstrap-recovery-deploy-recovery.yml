name: R1 initial bootstrap recovery deploy recovery

on:
  workflow_dispatch:
    inputs:
      failed_run_id:
        description: Exact latest failed recovery run whose Function-version create outcome needs classification
        required: true
        type: string
      ci_run_id:
        description: Exact successful main CI run that triggered the guarded recovery autocontinue
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: r1-initial-bootstrap-writer
  cancel-in-progress: false

jobs:
  deploy-recovery:
    if: github.repository == 'kmephis-ai/PrihRash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FUNCTION_NAME: prihrash-r1-initial-bootstrap
      RUNTIME_SERVICE_ACCOUNT_NAME: prihrash-initial-bootstrap
      TARGET_TAG: r1-initial-bootstrap-recovery
      OIDC_AUDIENCE: https://github.com/kmephis-ai
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      OIDC_SUBJECT: repo:kmephis-ai@310519475/PrihRash@1359286840:ref:refs/heads/main
      YC_FOLDER_ID: ${{ secrets.YC_R1_FOLDER_ID }}
      YC_CLOUD_ID: ${{ secrets.YC_R1_CLOUD_ID }}
      YC_WIF_SERVICE_ACCOUNT_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_WIF_SERVICE_ACCOUNT_ID }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Prove exact failed deploy and read-only boundary
        id: failed_run
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          FAILED_RUN_ID: ${{ inputs.failed_run_id }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'kmephis-ai/PrihRash'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$FAILED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'RECOVERY_DEPLOY_RUN_ID_INVALID'; exit 1; }
          test -n "$YC_FOLDER_ID"
          test -n "$YC_WIF_SERVICE_ACCOUNT_ID"
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'RECOVERY_DEPLOY_CI_RUN_ID_INVALID'; exit 1; }
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-deploy-recovery-gates"
          mkdir -p "$tmp"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' \
            "$api/branches/main" --output "$tmp/main.json"
          jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha and .protected == true' "$tmp/main.json" >/dev/null || {
            echo 'RECOVERY_DEPLOY_MAIN_GATE_NOT_READY'; exit 1;
          }
          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs/${CI_RUN_ID}" --output "$tmp/ci-run.json"
          ci_run_evidence="$(node scripts/classify-github-ci-run.mjs "$tmp/ci-run.json" "$CI_RUN_ID" "$GITHUB_SHA")"
          [ "$ci_run_evidence" = 'CI_RUN_EXACT_SUCCESS' ] || {
            echo 'RECOVERY_DEPLOY_EXACT_CI_RUN_NOT_PROVEN'; exit 1;
          }

          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' \
            "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&status=failure&per_page=100" \
            --output "$tmp/failed-recovery-runs.json"
          latest_failed_run="$(jq -cer '
            [.workflow_runs[] | select(
              .name == "R1 initial bootstrap recovery"
              and .head_branch == "main"
              and .event == "workflow_dispatch"
              and .conclusion == "failure"
              and (.id | type == "number")
            )] | sort_by(.created_at, .id) | reverse | .[0] // empty
          ' "$tmp/failed-recovery-runs.json")" || {
            echo 'RECOVERY_DEPLOY_FAILED_RUN_MISSING'; exit 1;
          }
          selected_id="$(jq -er '.id' <<<"$latest_failed_run")"
          if [ "$FAILED_RUN_ID" != "$selected_id" ]; then
            echo 'RECOVERY_DEPLOY_FAILED_RUN_NOT_LATEST'; exit 1
          fi
          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs/${FAILED_RUN_ID}" --output "$tmp/failed-run.json"
          jq -e --argjson id "$FAILED_RUN_ID" '
            .id == $id and .name == "R1 initial bootstrap recovery"
            and .head_branch == "main" and .event == "workflow_dispatch"
            and .status == "completed" and .conclusion == "failure"
          ' "$tmp/failed-run.json" >/dev/null || { echo 'RECOVERY_DEPLOY_FAILED_RUN_NOT_EXACT'; exit 1; }
          failed_sha="$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' "$tmp/failed-run.json")"
          run_started_at="$(jq -er '.run_started_at | select(type == "string")' "$tmp/failed-run.json")"
          run_finished_at="$(jq -er '.updated_at | select(type == "string")' "$tmp/failed-run.json")"
          curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs/${FAILED_RUN_ID}/jobs?filter=latest&per_page=100" --output "$tmp/failed-jobs.json"
          jq -e '
            [.jobs[] | select(.name == "initial-bootstrap-recovery")] as $jobs
            | ($jobs | length) == 1
            and ([$jobs[0].steps[]? | select(.name == "Deploy recovery-only Function version" and .conclusion == "failure")] | length) == 1
            and ([$jobs[0].steps[]? | select(.name == "Invoke exact read-only recovery tag once" and .conclusion == "skipped")] | length) == 1
          ' "$tmp/failed-jobs.json" >/dev/null || { echo 'RECOVERY_DEPLOY_FAILURE_PHASE_NOT_PROVEN'; exit 1; }
          jq -e --argjson failed_id "$FAILED_RUN_ID" --argjson self_id "$GITHUB_RUN_ID" '
            [.workflow_runs[] | select(.id != $self_id and (.status == "queued" or .status == "in_progress"))
              | select(.name == "R1 initial bootstrap orchestrator" or .name == "R1 initial shadow bootstrap"
                or .name == "R1 initial bootstrap recovery")]
            | length == 0
          ' <(curl --fail --silent --show-error --header "$auth_header" --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs?per_page=100") >/dev/null || { echo 'RECOVERY_DEPLOY_WRITER_CONFLICT'; exit 1; }
          printf 'failed_sha=%s\nrun_started_at=%s\nrun_finished_at=%s\n' \
            "$failed_sha" "$run_started_at" "$run_finished_at" >> "$GITHUB_OUTPUT"

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/yc"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$install_dir"
          yc_bin="$(find "$install_dir" -type f -name yc -perm -u+x -print -quit)"
          test -n "$yc_bin"
          echo "$(dirname "$yc_bin")" >> "$GITHUB_PATH"
          "$yc_bin" version >/dev/null

      - name: Exchange GitHub OIDC token for short-lived Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-deploy-recovery-auth"
          mkdir -p "$tmp"
          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value | @uri')"
          curl --fail --silent --show-error --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" --output "$tmp/oidc.json"
          oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' "$tmp/oidc.json")"
          echo "::add-mask::${oidc_token}"
          token_payload="${oidc_token#*.}"; token_payload="${token_payload%%.*}"
          token_payload="${token_payload//-/+}"; token_payload="${token_payload//_/\/}"
          case "$((${#token_payload} % 4))" in 0) ;; 2) token_payload="${token_payload}==" ;; 3) token_payload="${token_payload}=" ;; *) echo 'RECOVERY_DEPLOY_OIDC_CLAIMS_INVALID'; exit 1 ;; esac
          printf '%s' "$token_payload" | base64 --decode >"$tmp/claims.json"
          jq -e --arg iss "$OIDC_ISSUER" --arg aud "$OIDC_AUDIENCE" --arg sub "$OIDC_SUBJECT" '
            .iss == $iss and ((.aud == $aud) or ((.aud | type) == "array" and (.aud | length) == 1 and .aud[0] == $aud)) and .sub == $sub
          ' "$tmp/claims.json" >/dev/null || { echo 'RECOVERY_DEPLOY_OIDC_CLAIMS_INVALID'; exit 1; }
          curl --fail --silent --show-error --request POST https://auth.yandex.cloud/oauth/token \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_WIF_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${oidc_token}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            --output "$tmp/iam.json"
          iam_token="$(jq -er '.access_token | select(type == "string" and length > 0)' "$tmp/iam.json")"
          echo "::add-mask::${iam_token}"
          printf 'YC_IAM_TOKEN=%s\n' "$iam_token" >> "$GITHUB_ENV"

      - name: Classify failed recovery Function version creation read-only
        shell: bash
        env:
          RUN_STARTED_AT: ${{ steps.failed_run.outputs.run_started_at }}
          RUN_FINISHED_AT: ${{ steps.failed_run.outputs.run_finished_at }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-deploy-recovery-provider"
          evidence_dir="$RUNNER_TEMP/r1-initial-bootstrap-deploy-recovery-evidence"
          mkdir -p "$tmp" "$evidence_dir"
          functions_api='https://serverless-functions.api.cloud.yandex.net/functions/v1/functions'
          function_filter="name=\"${FUNCTION_NAME}\""
          set +e
          function_http="$(curl --silent --show-error --get --connect-timeout 5 --max-time 15 --max-filesize 1048576 \
            --output "$tmp/functions.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            --header 'Accept: application/json' \
            --data-urlencode "folderId=${YC_FOLDER_ID}" \
            --data-urlencode 'pageSize=100' \
            --data-urlencode "filter=${function_filter}" \
            "$functions_api" 2>"$tmp/functions-rest.err")"
          function_curl_exit=$?
          set -e
          if [ "$function_curl_exit" -ne 0 ]; then
            case "$function_curl_exit" in
              28) echo 'RECOVERY_DEPLOY_FUNCTION_LIST_TIMEOUT' ;;
              63) echo 'RECOVERY_DEPLOY_FUNCTION_LIST_RESPONSE_TOO_LARGE' ;;
              *) echo 'RECOVERY_DEPLOY_FUNCTION_LIST_REST_TRANSPORT_FAILED' ;;
            esac
            exit 1
          fi
          case "$function_http" in
            2??) ;;
            401) echo 'RECOVERY_DEPLOY_FUNCTION_LIST_REST_AUTH_FAILED'; exit 1 ;;
            403) echo 'RECOVERY_DEPLOY_FUNCTION_LIST_PERMISSION_DENIED'; exit 1 ;;
            404) echo 'RECOVERY_DEPLOY_FUNCTION_LIST_REST_NOT_FOUND'; exit 1 ;;
            *) echo 'RECOVERY_DEPLOY_FUNCTION_LIST_REST_UNEXPECTED_STATUS'; exit 1 ;;
          esac
          function_match_count="$(jq -er --arg name "$FUNCTION_NAME" '
            if type == "object"
              and ((.functions // []) | type == "array")
              and ((.nextPageToken // "") | type == "string")
              and ((.nextPageToken // "") == "")
            then [(.functions // [])[]? | select(.name == $name)] | length
            else empty end
          ' "$tmp/functions.json")" || { echo 'RECOVERY_DEPLOY_FUNCTION_LIST_METADATA_INVALID'; exit 1; }
          case "$function_match_count" in
            1) ;;
            0) echo 'RECOVERY_DEPLOY_FUNCTION_NOT_FOUND'; exit 1 ;;
            *) echo 'RECOVERY_DEPLOY_FUNCTION_NOT_UNIQUE'; exit 1 ;;
          esac
          function_id="$(jq -er --arg name "$FUNCTION_NAME" '
            [(.functions // [])[]? | select(.name == $name and (.id | type == "string") and (.id | length > 0))]
            | if length == 1 then .[0].id else empty end
          ' "$tmp/functions.json")" || { echo 'RECOVERY_DEPLOY_FUNCTION_METADATA_INVALID'; exit 1; }
          function_status="$(jq -er --arg name "$FUNCTION_NAME" '
            [(.functions // [])[]? | select(.name == $name and (.status | type == "string"))]
            | if length == 1 then .[0].status else empty end
          ' "$tmp/functions.json")" || { echo 'RECOVERY_DEPLOY_FUNCTION_STATUS_INVALID'; exit 1; }
          [ "$function_status" = 'ACTIVE' ] || { echo 'RECOVERY_DEPLOY_FUNCTION_NOT_ACTIVE'; exit 1; }
          echo "::add-mask::${function_id}"

          runtime_sa="$(yc iam service-account get --name "$RUNTIME_SERVICE_ACCOUNT_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output 2>"$tmp/runtime-sa.err" | jq -er '.id | select(type == "string" and length > 0)')" || {
              echo 'RECOVERY_DEPLOY_RUNTIME_SA_RESOLUTION_FAILED'; exit 1;
            }
          echo "::add-mask::${runtime_sa}"

          encoded_function_id="$(jq -rn --arg id "$function_id" '$id | @uri')"
          set +e
          bindings_http="$(curl --silent --show-error --get --connect-timeout 5 --max-time 15 --max-filesize 1048576 \
            --output "$tmp/function-bindings.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            --header 'Accept: application/json' \
            --data-urlencode 'pageSize=1000' \
            "https://serverless-functions.api.cloud.yandex.net/functions/v1/functions/${encoded_function_id}:listAccessBindings" \
            2>"$tmp/function-bindings-rest.err")"
          bindings_curl_exit=$?
          set -e
          set +e
          bindings_result="$(node scripts/classify-yandex-function-access-bindings.mjs \
            "$bindings_curl_exit" "$bindings_http" "$tmp/function-bindings.json" \
            "$YC_WIF_SERVICE_ACCOUNT_ID" "$runtime_sa")"
          bindings_classifier_exit=$?
          set -e
          if [ -z "$bindings_result" ] || ! jq -e '
            type == "object"
            and (.status | IN("PASS", "STOP"))
            and (.code | type == "string" and test("^FUNCTION_BINDINGS_[A-Z0-9_]+$"))
            and (.publicInvoker | IN("PRESENT", "ABSENT", "UNCLASSIFIED"))
            and (.runtimeInvoker | IN("PRESENT", "ABSENT", "UNCLASSIFIED"))
            and (.wifInvoker | IN("PRESENT", "ABSENT", "UNCLASSIFIED"))
            and (.wifEditor | IN("PRESENT", "ABSENT", "UNCLASSIFIED"))
            and (keys | sort) == ["code", "publicInvoker", "runtimeInvoker", "status", "wifEditor", "wifInvoker"]
          ' <<<"$bindings_result" >/dev/null; then
            echo 'RECOVERY_DEPLOY_FUNCTION_BINDINGS_CLASSIFIER_INVALID'; exit 1
          fi
          if [ "$bindings_classifier_exit" -ne 0 ] || [ "$(jq -r '.status' <<<"$bindings_result")" != 'PASS' ]; then
            jq -r '.code' <<<"$bindings_result"
            exit 1
          fi
          [ "$(jq -r '.publicInvoker' <<<"$bindings_result")" = 'ABSENT' ] || {
            echo 'RECOVERY_DEPLOY_FUNCTION_PUBLIC'; exit 1;
          }
          [ "$(jq -r '.wifInvoker' <<<"$bindings_result")" = 'PRESENT' ] || {
            echo 'RECOVERY_DEPLOY_INVOKER_BINDING_MISSING'; exit 1;
          }

          set +e
          triggers_http="$(curl --silent --show-error --get --connect-timeout 5 --max-time 15 --max-filesize 1048576 \
            --output "$tmp/triggers.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            --header 'Accept: application/json' \
            --data-urlencode "folderId=${YC_FOLDER_ID}" \
            --data-urlencode 'pageSize=1000' \
            'https://serverless-triggers.api.cloud.yandex.net/triggers/v1/triggers' \
            2>"$tmp/triggers-rest.err")"
          triggers_curl_exit=$?
          set -e
          set +e
          triggers_result="$(node scripts/classify-yandex-trigger-list.mjs \
            "$triggers_curl_exit" "$triggers_http" "$tmp/triggers.json" "$function_id")"
          triggers_classifier_exit=$?
          set -e
          if [ -z "$triggers_result" ] || ! jq -e '
            type == "object"
            and (.status | IN("PASS", "STOP"))
            and (.code | type == "string" and test("^TRIGGER_LIST_[A-Z0-9_]+$"))
            and (.targetFunction | IN("PRESENT", "ABSENT", "UNCLASSIFIED"))
            and (keys | sort) == ["code", "status", "targetFunction"]
          ' <<<"$triggers_result" >/dev/null; then
            echo 'RECOVERY_DEPLOY_TRIGGER_LIST_CLASSIFIER_INVALID'; exit 1
          fi
          if [ "$triggers_classifier_exit" -ne 0 ] || [ "$(jq -r '.status' <<<"$triggers_result")" != 'PASS' ]; then
            jq -r '.code' <<<"$triggers_result"
            exit 1
          fi
          if [ "$(jq -r '.targetFunction' <<<"$triggers_result")" = 'PRESENT' ]; then
            echo 'RECOVERY_DEPLOY_FUNCTION_TRIGGER_PRESENT'; exit 1
          fi
          versions_api='https://serverless-functions.api.cloud.yandex.net/functions/v1/versions'
          set +e
          versions_http="$(curl --silent --show-error --get --connect-timeout 5 --max-time 15 --max-filesize 1048576 \
            --output "$tmp/versions-rest.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            --header 'Accept: application/json' \
            --data-urlencode "functionId=${function_id}" \
            --data-urlencode 'pageSize=1000' \
            "$versions_api" 2>"$tmp/versions-rest.err")"
          versions_curl_exit=$?
          set -e
          if [ "$versions_curl_exit" -ne 0 ]; then
            case "$versions_curl_exit" in
              28) echo 'RECOVERY_DEPLOY_VERSION_LIST_TIMEOUT' ;;
              63) echo 'RECOVERY_DEPLOY_VERSION_LIST_RESPONSE_TOO_LARGE' ;;
              *) echo 'RECOVERY_DEPLOY_VERSION_LIST_REST_TRANSPORT_FAILED' ;;
            esac
            exit 1
          fi
          case "$versions_http" in
            2??) ;;
            401) echo 'RECOVERY_DEPLOY_VERSION_LIST_REST_AUTH_FAILED'; exit 1 ;;
            403) echo 'RECOVERY_DEPLOY_VERSION_LIST_PERMISSION_DENIED'; exit 1 ;;
            404) echo 'RECOVERY_DEPLOY_VERSION_LIST_REST_NOT_FOUND'; exit 1 ;;
            *) echo 'RECOVERY_DEPLOY_VERSION_LIST_REST_UNEXPECTED_STATUS'; exit 1 ;;
          esac
          if ! jq -e '
            type == "object"
            and ((.versions // []) | type == "array")
            and ((.nextPageToken // "") | type == "string")
            and ((.nextPageToken // "") == "")
          ' "$tmp/versions-rest.json" >/dev/null; then
            echo 'RECOVERY_DEPLOY_VERSION_LIST_METADATA_INVALID'
            exit 1
          fi
          jq -c '(.versions // [])' "$tmp/versions-rest.json" >"$tmp/versions.json"

          operations_api="https://serverless-functions.api.cloud.yandex.net/functions/v1/functions/${encoded_function_id}/operations"
          set +e
          operations_http="$(curl --silent --show-error --get --connect-timeout 5 --max-time 15 --max-filesize 1048576 \
            --output "$tmp/operations-rest.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            --header 'Accept: application/json' \
            --data-urlencode 'pageSize=1000' \
            "$operations_api" 2>"$tmp/operations-rest.err")"
          operations_curl_exit=$?
          set -e
          if [ "$operations_curl_exit" -ne 0 ]; then
            case "$operations_curl_exit" in
              28) echo 'RECOVERY_DEPLOY_OPERATION_LIST_TIMEOUT' ;;
              63) echo 'RECOVERY_DEPLOY_OPERATION_LIST_RESPONSE_TOO_LARGE' ;;
              *) echo 'RECOVERY_DEPLOY_OPERATION_LIST_REST_TRANSPORT_FAILED' ;;
            esac
            exit 1
          fi
          case "$operations_http" in
            2??) ;;
            401) echo 'RECOVERY_DEPLOY_OPERATION_LIST_REST_AUTH_FAILED'; exit 1 ;;
            403) echo 'RECOVERY_DEPLOY_OPERATION_LIST_PERMISSION_DENIED'; exit 1 ;;
            404) echo 'RECOVERY_DEPLOY_OPERATION_LIST_REST_NOT_FOUND'; exit 1 ;;
            *) echo 'RECOVERY_DEPLOY_OPERATION_LIST_REST_UNEXPECTED_STATUS'; exit 1 ;;
          esac
          if ! jq -e '
            type == "object"
            and ((.operations // []) | type == "array")
            and ((.nextPageToken // "") | type == "string")
            and ((.nextPageToken // "") == "")
          ' "$tmp/operations-rest.json" >/dev/null; then
            echo 'RECOVERY_DEPLOY_OPERATION_LIST_METADATA_INVALID'
            exit 1
          fi
          jq -c '(.operations // [])' "$tmp/operations-rest.json" >"$tmp/operations.json"

          tagged_version_api='https://serverless-functions.api.cloud.yandex.net/functions/v1/versions:byTag'
          set +e
          tagged_http="$(curl --silent --show-error --get --connect-timeout 5 --max-time 15 --max-filesize 1048576 \
            --output "$tmp/tagged-version-rest.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            --header 'Accept: application/json' \
            --data-urlencode "functionId=${function_id}" \
            --data-urlencode "tag=${TARGET_TAG}" \
            "$tagged_version_api" 2>"$tmp/tagged-version-rest.err")"
          tagged_curl_exit=$?
          set -e
          case "$tagged_http" in
            2??)
              if [ "$tagged_curl_exit" -eq 0 ]; then
                cp "$tmp/tagged-version-rest.json" "$tmp/tagged-version.json"
              else
                printf '{}\n' >"$tmp/tagged-version.json"
              fi
              ;;
            *) printf '{}\n' >"$tmp/tagged-version.json" ;;
          esac
          tag_history_api="https://serverless-functions.api.cloud.yandex.net/functions/v1/functions/${function_id}:tagHistory"
          tag_history_status='READY'
          if ! curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            --header 'Accept: application/json' \
            --data-urlencode "tag=${TARGET_TAG}" \
            --data-urlencode 'pageSize=1000' \
            "$tag_history_api" --output "$tmp/tag-history.json" 2>"$tmp/tag-history.err"; then
            tag_history_status='RECOVERY_TAG_HISTORY_READ_FAILED'
            printf '{}\n' >"$tmp/tag-history.json"
          fi
          if [ "$tag_history_status" != 'READY' ]; then
            evidence="$tag_history_status"
          elif ! evidence="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
            "$tmp/versions.json" "$tmp/operations.json" "$tmp/tagged-version.json" "$tmp/tag-history.json" \
            "$RUN_STARTED_AT" "$RUN_FINISHED_AT" "$YC_WIF_SERVICE_ACCOUNT_ID" "$runtime_sa")"; then
            evidence='DIAGNOSTIC_FAILED'
          fi

          audit_trail_evidence='AUDIT_TRAIL_LIST_READ_FAILED'
          audit_event_evidence='AUDIT_EVENT_READ_NOT_ATTEMPTED'
          audit_trails_api='https://audittrails.api.cloud.yandex.net/audit-trails/v1/trails'
          if [ -z "$YC_CLOUD_ID" ]; then
            audit_trail_evidence='AUDIT_TRAIL_CLOUD_SCOPE_CONFIG_INVALID'
          else
            cloud_id="$YC_CLOUD_ID"
            echo "::add-mask::${cloud_id}"
            trail_response="$tmp/target-folder-audit-trails.json"
            trail_list_http='000'
            if trail_list_http="$(curl --silent --show-error --output "$trail_response" \
              --write-out '%{http_code}' --get \
              --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
              --header 'Accept: application/json' \
              --data-urlencode "folderId=${YC_FOLDER_ID}" \
              --data-urlencode 'pageSize=1000' \
              "$audit_trails_api" 2>"$tmp/target-folder-audit-trails.err")"; then
              case "$trail_list_http" in
                2??)
                  if ! audit_trail_evidence="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
                    --audit-folder-trails "$trail_response" "$cloud_id" "$YC_FOLDER_ID" \
                    "$RUN_FINISHED_AT" "$tmp/audit-log-group-id")"; then
                    audit_trail_evidence='AUDIT_TRAIL_CLASSIFIER_FAILED'
                  fi
                  ;;
                *) audit_trail_evidence="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
                  --audit-trail-http-status "$trail_list_http")" ;;
              esac
            else
              audit_trail_evidence='AUDIT_TRAIL_LIST_READ_FAILED'
            fi
          fi

          case "$audit_trail_evidence" in
            AUDIT_TRAIL_METADATA_INVALID|AUDIT_TRAIL_LIST_INCOMPLETE|AUDIT_TRAIL_SOURCE_NOT_CONFIGURED|AUDIT_TRAIL_SOURCE_NOT_ACTIVE|AUDIT_TRAIL_SOURCE_AMBIGUOUS|AUDIT_TRAIL_CLOUD_LOGGING_SOURCE_PRESENT|AUDIT_TRAIL_OBJECT_STORAGE_SOURCE_PRESENT|AUDIT_TRAIL_SOURCE_UNSUPPORTED|AUDIT_TRAIL_SOURCE_CREATED_AFTER_TARGET|AUDIT_TRAIL_CONFIGURATION_CHANGED_AFTER_TARGET|AUDIT_TRAIL_SOURCE_OPEN_FAILED|AUDIT_TRAIL_LIST_READ_FAILED|AUDIT_TRAIL_AUTHENTICATION_REQUIRED|AUDIT_TRAIL_LIST_PERMISSION_DENIED|AUDIT_TRAIL_CLOUD_SCOPE_CONFIG_INVALID|AUDIT_TRAIL_FOLDER_LIST_READ_FAILED|AUDIT_TRAIL_FOLDER_LIST_PERMISSION_DENIED|AUDIT_TRAIL_FOLDER_LIST_INCOMPLETE|AUDIT_TRAIL_FOLDER_LIST_RESPONSE_INVALID|AUDIT_TRAIL_FOLDER_LIST_JSON_INVALID|AUDIT_TRAIL_FOLDER_LIST_INPUT_INVALID|AUDIT_TRAIL_FOLDER_ENTRY_INVALID|AUDIT_TRAIL_FOLDER_ID_INVALID|AUDIT_TRAIL_FOLDER_CLOUD_ID_MISSING|AUDIT_TRAIL_FOLDER_METADATA_INVALID|AUDIT_TRAIL_FOLDER_CLOUD_ID_MISMATCH|AUDIT_TRAIL_FOLDER_LIST_AMBIGUOUS|AUDIT_TRAIL_FOLDER_STATUS_MISSING|AUDIT_TRAIL_FOLDER_STATUS_UNSUPPORTED|AUDIT_TRAIL_TARGET_FOLDER_NOT_FOUND|AUDIT_TRAIL_TARGET_FOLDER_NOT_ACTIVE|AUDIT_TRAIL_SOURCE_NOT_COVERING_TARGET|AUDIT_TRAIL_COVERAGE_UNPROVEN|AUDIT_TRAIL_CLOUD_COVERAGE_INPUT_INVALID|AUDIT_TRAIL_TRAIL_LIST_RESPONSE_INVALID|AUDIT_TRAIL_TRAIL_LIST_ROOT_INVALID|AUDIT_TRAIL_TRAILS_FIELD_INVALID|AUDIT_TRAIL_TRAIL_PAGE_TOKEN_INVALID|AUDIT_TRAIL_TRAIL_LIST_COUNT_MISMATCH|AUDIT_TRAIL_TRAIL_JSON_INVALID|AUDIT_TRAIL_TRAIL_LIST_INPUT_INVALID|AUDIT_TRAIL_TRAIL_ENTRY_INVALID|AUDIT_TRAIL_TRAIL_FOLDER_ID_MISSING|AUDIT_TRAIL_TRAIL_FOLDER_MISMATCH|AUDIT_TRAIL_TRAIL_CLOUD_ID_MISSING|AUDIT_TRAIL_TRAIL_CLOUD_ID_MISMATCH|AUDIT_TRAIL_TRAIL_STATUS_MISSING|AUDIT_TRAIL_TRAIL_STATUS_UNSUPPORTED|AUDIT_TRAIL_TRAIL_TIMESTAMPS_INVALID|AUDIT_TRAIL_TRAIL_DESTINATION_INVALID|AUDIT_TRAIL_TRAIL_DESTINATION_UNPROVEN|AUDIT_TRAIL_CLOUD_CLASSIFIER_INTERNAL_ERROR|AUDIT_TRAIL_CLASSIFIER_FAILED) ;;
            *) echo 'RECOVERY_AUDIT_TRAIL_CLASSIFIER_OUTPUT_INVALID'; exit 1 ;;
          esac

          if [ "$audit_trail_evidence" = 'AUDIT_TRAIL_CLOUD_LOGGING_SOURCE_PRESENT' ]; then
            audit_log_group_id="$(cat "$tmp/audit-log-group-id")"
            echo "::add-mask::${audit_log_group_id}"
            audit_filter="json_payload.eventType = \"yandex.cloud.audit.serverless.functions.CreateFunctionVersion\" AND json_payload.details.functionId = \"${function_id}\""
            if ! yc logging read --group-id "$audit_log_group_id" \
              --since "$RUN_STARTED_AT" --until "$RUN_FINISHED_AT" --limit 1000 \
              --max-response-size 10485760 --filter "$audit_filter" \
              --format json --retry 0 --no-user-output \
              >"$tmp/audit-events.json" 2>"$tmp/audit-events.err"; then
              if grep -Eqi 'PermissionDenied|permission denied|PERMISSION_DENIED|forbidden' "$tmp/audit-events.err"; then
                audit_event_evidence='AUDIT_LOG_READ_PERMISSION_DENIED'
              else
                audit_event_evidence='AUDIT_LOG_READ_FAILED'
              fi
            elif ! audit_event_evidence="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
              --audit-events "$tmp/audit-events.json" "$tmp/versions.json" "$function_id" \
              "$YC_WIF_SERVICE_ACCOUNT_ID" "$runtime_sa" "$RUN_STARTED_AT" "$RUN_FINISHED_AT")"; then
              audit_event_evidence='AUDIT_LOG_CLASSIFIER_FAILED'
            fi
          fi

          case "$audit_event_evidence" in
            AUDIT_EVENT_READ_NOT_ATTEMPTED|AUDIT_LOG_READ_FAILED|AUDIT_LOG_READ_PERMISSION_DENIED|AUDIT_LOG_LIST_INCOMPLETE|AUDIT_LOG_METADATA_INVALID|AUDIT_LOG_CLASSIFIER_FAILED|AUDIT_CREATE_EVENT_NOT_OBSERVED|AUDIT_CREATE_EVENT_AMBIGUOUS|AUDIT_CREATE_EVENT_WRITER_MISMATCH|AUDIT_CREATE_EVENT_IN_PROGRESS|AUDIT_CREATE_EVENT_CANCELLED|AUDIT_CREATE_EVENT_FAILED|AUDIT_CREATE_EVENT_VERSION_NOT_OBSERVED|AUDIT_CREATE_EVENT_VERSION_METADATA_UNPROVEN|EXACT_RECOVERY_VERSION_CREATED) ;;
            *) echo 'RECOVERY_AUDIT_EVENT_CLASSIFIER_OUTPUT_INVALID'; exit 1 ;;
          esac
          audit_source_decision="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
            --audit-source-decision "$audit_trail_evidence" "$audit_event_evidence")"
          case "$audit_source_decision" in
            EXISTING_APPLICABLE_AUDIT_SOURCE|NO_APPLICABLE_PREEXISTING_AUDIT_SOURCE|SOURCE_EVIDENCE_UNUSABLE|SOURCE_EVIDENCE_AMBIGUOUS) ;;
            *) echo 'RECOVERY_AUDIT_SOURCE_DECISION_INVALID'; exit 1 ;;
          esac

          case "$evidence" in
            DEPLOYMENT_OUTCOME_UNCLASSIFIED|CREATE_OPERATION_AMBIGUOUS|CREATE_OPERATION_IN_PROGRESS|CREATE_OPERATION_FAILED|CREATED_VERSION_NOT_PROVEN|EXACT_RECOVERY_VERSION_CREATED|RECOVERY_TAGGED_VERSION_CANDIDATE_PRESENT|RECOVERY_TAGGED_VERSION_NOT_OBSERVED_IN_WINDOW|RECOVERY_TAGGED_VERSION_AMBIGUOUS|RECOVERY_TAGGED_VERSION_METADATA_UNPROVEN) ;;
            DIAGNOSTIC_FAILED|RECOVERY_DEPLOY_INPUT_INVALID|RECOVERY_VERSION_ENTRY_INVALID|RECOVERY_VERSION_TAGS_INVALID|RECOVERY_VERSION_TIMESTAMP_INVALID|RECOVERY_METADATA_JSON_INVALID|RECOVERY_CLASSIFIER_INTERNAL_ERROR|RECOVERY_TAG_HISTORY_READ_FAILED|RECOVERY_TAG_HISTORY_METADATA_INVALID|RECOVERY_TAG_HISTORY_INCOMPLETE|RECOVERY_TAG_HISTORY_AMBIGUOUS|RECOVERY_TAG_HISTORY_VERSION_NOT_OBSERVED|RECOVERY_TAG_HISTORY_VERSION_CANDIDATE_PRESENT|RECOVERY_UNTAGGED_VERSION_CANDIDATE_PRESENT|RECOVERY_UNTAGGED_VERSION_AMBIGUOUS|RECOVERY_UNTAGGED_VERSION_METADATA_UNPROVEN|RECOVERY_VERSION_LIST_INCOMPLETE|RECOVERY_OPERATION_LIST_INCOMPLETE) ;;
            *) echo 'RECOVERY_DEPLOY_CLASSIFIER_OUTPUT_INVALID'; exit 1 ;;
          esac
          jq -cn --arg evidence "$evidence" --arg audit_trail "$audit_trail_evidence" \
            --arg audit_source_decision "$audit_source_decision" \
            --arg audit_event "$audit_event_evidence" \
            '{stagingFunctionDeployEvidence:$evidence,auditTrailSourceEvidence:$audit_trail,auditSourceDecision:$audit_source_decision,auditCreateFunctionVersionEvidence:$audit_event}' \
            >"$evidence_dir/function-deploy.json"
          cat "$evidence_dir/function-deploy.json"

      - name: Re-assert exact current main after read-only provider classification
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(curl --fail --silent --show-error --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -er '.commit.sha')"
          test "$current_sha" = "$GITHUB_SHA" || { echo 'RECOVERY_DEPLOY_MAIN_MOVED'; exit 1; }

      - name: Publish enum-only deploy classification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-initial-bootstrap-recovery-deploy-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/r1-initial-bootstrap-deploy-recovery-evidence/*.json
          if-no-files-found: error
          retention-days: 30
