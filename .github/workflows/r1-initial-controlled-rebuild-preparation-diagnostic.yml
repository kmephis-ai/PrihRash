name: R1 initial controlled rebuild preparation diagnostic

on:
  workflow_dispatch:
    inputs:
      tracking_issue:
        description: Open R1 WU7 diagnostic Issue number
        required: true
        type: string
      expected_main_sha:
        description: Exact main SHA authorized for read-only diagnostic
        required: true
        type: string
      controlled_run_id:
        description: Consumed controlled run proving PREPARATION / RECONCILIATION_READ
        required: true
        type: string
      recovery_run_id:
        description: Fresh exact-main recovery run proving resumable STAGING
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: read
  id-token: write

concurrency:
  group: r1-initial-bootstrap-writer
  cancel-in-progress: false

jobs:
  preparation-diagnostic:
    if: github.repository == 'kmephis-ai/PrihRash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUNCTION_NAME: prihrash-r1-initial-bootstrap
      RUNTIME_SERVICE_ACCOUNT_NAME: prihrash-initial-bootstrap
      OIDC_AUDIENCE: https://github.com/kmephis-ai
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      OIDC_SUBJECT: repo:kmephis-ai@310519475/PrihRash@1359286840:ref:refs/heads/main
      YC_FOLDER_ID: ${{ secrets.YC_R1_FOLDER_ID }}
      YC_WIF_SERVICE_ACCOUNT_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_WIF_SERVICE_ACCOUNT_ID }}
      YC_LOCKBOX_SECRET_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_LOCKBOX_SECRET_ID }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify exact-main read-only preparation diagnostic boundary
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          CONTROLLED_RUN_ID: ${{ inputs.controlled_run_id }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$EXPECTED_MAIN_SHA" = "$GITHUB_SHA"
          [[ "$TRACKING_ISSUE" =~ ^[1-9][0-9]*$ ]]
          [[ "$CONTROLLED_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          h="Authorization: Bearer ${GH_API_TOKEN}"
          tmp="$RUNNER_TEMP/preparation-diagnostic-gates"; mkdir -p "$tmp"

          curl --fail --silent --show-error -H "$h" -H 'Accept: application/vnd.github+json' "$api/branches/main" -o "$tmp/main.json"
          jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha and .protected == true' "$tmp/main.json" >/dev/null             || { echo PREPARATION_DIAGNOSTIC_MAIN_GATE_NOT_READY; exit 1; }

          curl --fail --silent --show-error -H "$h" -H 'Accept: application/vnd.github+json' "$api/issues/${TRACKING_ISSUE}" -o "$tmp/issue.json"
          jq -e '
            .state == "open"
            and (.title | startswith("R1 WU7 diagnostic:"))
            and (.body | contains("Provider-Authority: NOT_AUTHORIZED"))
            and (.body | contains("Expected-Transition: READ_ONLY_PREPARATION_DIAGNOSTIC_SURFACE_ONLY"))
            and (.body | contains("Blind-Replay: FORBIDDEN"))
            and (.body | contains("Google-Authority: PRESERVED"))
          ' "$tmp/issue.json" >/dev/null || { echo PREPARATION_DIAGNOSTIC_ISSUE_NOT_READY; exit 1; }

          curl --fail --silent --show-error -H "$h" -H 'Accept: application/vnd.github+json'             "$api/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100" -o "$tmp/ci.json"
          jq -e --arg sha "$GITHUB_SHA" '.workflow_runs | any(.head_sha == $sha and .conclusion == "success")' "$tmp/ci.json" >/dev/null             || { echo PREPARATION_DIAGNOSTIC_EXACT_SHA_CI_MISSING; exit 1; }

          read_run() {
            local run_id="$1" output="$2"
            curl --fail --silent --show-error -H "$h" -H 'Accept: application/vnd.github+json'               "$api/actions/runs/${run_id}" -o "$output"
          }
          download_evidence() {
            local run_id="$1" expected_name="$2" output_dir="$3"
            mkdir -p "$output_dir"
            curl --fail --silent --show-error -H "$h" -H 'Accept: application/vnd.github+json'               "$api/actions/runs/${run_id}/artifacts?per_page=100" -o "$output_dir/artifacts.json"
            artifact_id="$(jq -er --arg name "$expected_name" '[.artifacts[]|select(.name==$name and .expired==false)] | if length==1 then .[0].id else empty end' "$output_dir/artifacts.json")"               || { echo PREPARATION_DIAGNOSTIC_EVIDENCE_ARTIFACT_MISSING; exit 1; }
            curl --fail --silent --show-error --location -H "$h" -H 'Accept: application/vnd.github+json'               "$api/actions/artifacts/${artifact_id}/zip" -o "$output_dir/evidence.zip"
            unzip -q "$output_dir/evidence.zip" -d "$output_dir/unpacked"
            test -f "$output_dir/unpacked/classification.json"               || { echo PREPARATION_DIAGNOSTIC_EVIDENCE_FILE_MISSING; exit 1; }
          }

          read_run "$CONTROLLED_RUN_ID" "$tmp/controlled.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .name == "R1 initial controlled rebuild"
            and .head_branch == "main"
            and .head_sha == $sha
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "failure"
          ' "$tmp/controlled.json" >/dev/null || { echo PREPARATION_DIAGNOSTIC_CONTROLLED_RUN_INVALID; exit 1; }
          download_evidence "$CONTROLLED_RUN_ID" "r1-initial-controlled-rebuild-evidence-${CONTROLLED_RUN_ID}" "$tmp/controlled-evidence"
          jq -e '
            type == "object"
            and (keys | sort) == ["bootstrapPhase","code","jobCode","phase","status"]
            and .status == "FAIL"
            and .code == "INITIAL_CONTROLLED_REBUILD_RUNTIME_FAILED"
            and .jobCode == "APPLICATION_FAILED"
            and .phase == "PREPARATION"
            and .bootstrapPhase == "RECONCILIATION_READ"
          ' "$tmp/controlled-evidence/unpacked/classification.json" >/dev/null             || { echo PREPARATION_DIAGNOSTIC_CONTROLLED_EVIDENCE_INVALID; exit 1; }

          read_run "$RECOVERY_RUN_ID" "$tmp/recovery.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .name == "R1 initial bootstrap recovery"
            and .head_branch == "main"
            and .head_sha == $sha
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "success"
          ' "$tmp/recovery.json" >/dev/null || { echo PREPARATION_DIAGNOSTIC_RECOVERY_RUN_INVALID; exit 1; }
          download_evidence "$RECOVERY_RUN_ID" "r1-initial-bootstrap-recovery-evidence-${RECOVERY_RUN_ID}" "$tmp/recovery-evidence"
          jq -e '
            type == "object"
            and (keys | sort) == ["code","reason","status","verdict"]
            and .status == "PASS"
            and .code == "INITIAL_BOOTSTRAP_RECOVERY_CLASSIFIED"
            and .verdict == "RECOVERY_REQUIRED"
            and .reason == "STAGING_RUN_PRESENT"
          ' "$tmp/recovery-evidence/unpacked/classification.json" >/dev/null             || { echo PREPARATION_DIAGNOSTIC_RECOVERY_EVIDENCE_INVALID; exit 1; }

          curl --fail --silent --show-error -H "$h" -H 'Accept: application/vnd.github+json' "$api/actions/runs?per_page=100" -o "$tmp/runs.json"
          jq -e --argjson self "$GITHUB_RUN_ID" '
            [.workflow_runs[]
              | select(.id != $self)
              | select(.status == "queued" or .status == "in_progress")
              | select(
                  .name == "R1 initial shadow bootstrap"
                  or .name == "R1 initial bootstrap orchestrator"
                  or .name == "R1 initial controlled rebuild"
                  or .name == "R1 initial controlled rebuild swap recovery"
                )
            ] | length == 0
          ' "$tmp/runs.json" >/dev/null || { echo PREPARATION_DIAGNOSTIC_WRITER_CONFLICT; exit 1; }

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact-source invoke dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore verified exact-source artifact
        uses: ./.github/actions/restore-exact-source
        with:
          source-sha: ${{ github.sha }}
          github-token: ${{ github.token }}

      - name: Build read-only diagnostic package
        run: |
          npm run build --silent
          npm run package:initial-controlled-rebuild:from-build --silent

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yc"
          curl --fail --silent --show-error --location             https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz             -o "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc"
          yc_bin="$(find "$RUNNER_TEMP/yc" -type f -name yc -perm -u+x -print -quit)"
          test -n "$yc_bin"
          echo "$(dirname "$yc_bin")" >> "$GITHUB_PATH"

      - name: Exchange exact GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/preparation-diagnostic-auth"; mkdir -p "$tmp"
          aud="$(jq -rn --arg v "$OIDC_AUDIENCE" '$v|@uri')"
          curl --fail --silent --show-error             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${aud}" -o "$tmp/oidc.json"
          oidc="$(jq -er '.value|select(type=="string" and length>0)' "$tmp/oidc.json")"
          echo "::add-mask::$oidc"
          payload="${oidc#*.}"; payload="${payload%%.*}"; payload="${payload//-/+}"; payload="${payload//_/\/}"
          case "$(("${#payload}"%4))" in 2) payload="${payload}==";; 3) payload="${payload}=";; 0);; *) exit 1;; esac
          printf %s "$payload" | base64 --decode > "$tmp/claims.json"
          jq -e --arg iss "$OIDC_ISSUER" --arg aud "$OIDC_AUDIENCE" --arg sub "$OIDC_SUBJECT"             '.iss==$iss and .aud==$aud and .sub==$sub' "$tmp/claims.json" >/dev/null             || { echo PREPARATION_DIAGNOSTIC_OIDC_CLAIMS_INVALID; exit 1; }
          curl --fail --silent --show-error -X POST https://auth.yandex.cloud/oauth/token             -H 'Content-Type: application/x-www-form-urlencoded'             --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange'             --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token'             --data-urlencode "audience=${YC_WIF_SERVICE_ACCOUNT_ID}"             --data-urlencode "subject_token=${oidc}"             --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token'             -o "$tmp/iam.json"
          token="$(jq -er '.access_token|select(type=="string" and length>0)' "$tmp/iam.json")"
          echo "::add-mask::$token"
          echo "YC_IAM_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Resolve private diagnostic deployment boundary
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/preparation-diagnostic-provider"; mkdir -p "$tmp"
          yc serverless function get --name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID"             --format json --retry 0 --no-user-output > "$tmp/fn.json"
          fid="$(jq -er '.id' "$tmp/fn.json")"; echo "::add-mask::$fid"
          yc serverless function list-access-bindings --id "$fid"             --format json --retry 0 --no-user-output > "$tmp/bindings.json"
          jq -e '[.[]?|select((.role_id//.roleId)=="functions.functionInvoker")|.subject.id]|any(.=="allUsers" or .=="allAuthenticatedUsers")|not'             "$tmp/bindings.json" >/dev/null || { echo PREPARATION_DIAGNOSTIC_FUNCTION_PUBLIC; exit 1; }
          jq -e --arg id "$YC_WIF_SERVICE_ACCOUNT_ID"             '[.[]?|select((.role_id//.roleId)=="functions.functionInvoker")|.subject]|any(.type=="serviceAccount" and .id==$id)'             "$tmp/bindings.json" >/dev/null || { echo PREPARATION_DIAGNOSTIC_WIF_INVOKER_MISSING; exit 1; }
          sa="$(yc iam service-account get --name "$RUNTIME_SERVICE_ACCOUNT_NAME" --folder-id "$YC_FOLDER_ID"             --format json --retry 0 --no-user-output | jq -er '.id')"
          echo "::add-mask::$sa"
          curl --fail --silent --show-error             -H "Authorization: Bearer ${YC_IAM_TOKEN}"             "https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${YC_LOCKBOX_SECRET_ID}"             -o "$tmp/secret.json"
          ver="$(jq -er '.currentVersion.id' "$tmp/secret.json")"
          echo "::add-mask::$ver"
          echo "FID=$fid" >> "$GITHUB_ENV"
          echo "RUNTIME_SA=$sa" >> "$GITHUB_ENV"
          echo "LOCKBOX_VER=$ver" >> "$GITHUB_ENV"

      - name: Re-verify exact main before diagnostic deployment
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${GH_API_TOKEN}"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -er '.commit.sha')"
          test "$sha" = "$GITHUB_SHA" || { echo PREPARATION_DIAGNOSTIC_MAIN_MOVED; exit 1; }

      - name: Deploy preparation-diagnostic-only Function version
        shell: bash
        run: |
          set -euo pipefail
          yc serverless function version create             --function-id "$FID"             --runtime nodejs22             --entrypoint index.initialControlledRebuildPreparationDiagnosticHandler             --memory 1g             --execution-timeout 600s             --source-path .artifacts/yandex-initial-controlled-rebuild-function             --service-account-id "$RUNTIME_SA"             --tags r1-initial-controlled-rebuild-preparation-diagnostic             --metadata-options gce-http-endpoint=enabled,aws-v1-http-endpoint=disabled             --secret "environment-variable=PRIHRASH_GOOGLE_SPREADSHEET_ID,id=${YC_LOCKBOX_SECRET_ID},version-id=${LOCKBOX_VER},key=google_spreadsheet_id"             --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_EMAIL,id=${YC_LOCKBOX_SECRET_ID},version-id=${LOCKBOX_VER},key=google_service_account_email"             --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY,id=${YC_LOCKBOX_SECRET_ID},version-id=${LOCKBOX_VER},key=google_service_account_private_key"             --secret "environment-variable=PRIHRASH_YDB_CONNECTION_STRING,id=${YC_LOCKBOX_SECRET_ID},version-id=${LOCKBOX_VER},key=ydb_connection_string"             --secret "environment-variable=PRIHRASH_INITIAL_BOOTSTRAP_PRIVATE_HISTORICAL_EVIDENCE,id=${YC_LOCKBOX_SECRET_ID},version-id=${LOCKBOX_VER},key=initial_bootstrap_private_historical_evidence"             --no-logging             --format json --retry 0 --no-user-output >/dev/null

      - name: Re-verify exact main before diagnostic invoke
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(curl --fail --silent --show-error             -H "Authorization: Bearer ${GH_API_TOKEN}"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -er '.commit.sha')"
          test "$sha" = "$GITHUB_SHA" || { echo PREPARATION_DIAGNOSTIC_MAIN_MOVED_BEFORE_INVOKE; exit 1; }

      - name: Invoke read-only preparation diagnostic once
        shell: bash
        run: |
          set -euo pipefail
          raw="$RUNNER_TEMP/preparation-diagnostic-result.raw"
          if ! yc serverless function invoke             --id "$FID"             --tag r1-initial-controlled-rebuild-preparation-diagnostic             --data '{}'             --format json --retry 0 --no-user-output > "$raw"; then
            echo PREPARATION_DIAGNOSTIC_INVOKE_FAILED
            exit 1
          fi
          result="$(jq -cer 'if type=="string" then fromjson else . end' "$raw")"
          safe="$RUNNER_TEMP/preparation-diagnostic-evidence"
          mkdir -p "$safe"

          if printf '%s\n' "$result" | jq -e '
            type=="object"
            and .status=="PASS"
            and .code=="INITIAL_CONTROLLED_REBUILD_PREPARATION_READY"
            and (keys|sort)==["code","status"]
          ' >/dev/null; then
            printf '%s\n' "$result" | jq -c '{status,code}' > "$safe/classification.json"
            echo PREPARATION_DIAGNOSTIC_READY
            exit 0
          fi

          if printf '%s\n' "$result" | jq -e '
            type=="object"
            and .status=="FAIL"
            and .code=="INITIAL_CONTROLLED_REBUILD_PREPARATION_FAILED"
            and (.bootstrapPhase==null or (.bootstrapPhase|type=="string"))
            and (.failureCode|type=="string" and length>0 and length<=96 and test("^[A-Z0-9_]+$"))
            and (keys|sort)==["bootstrapPhase","code","failureCode","status"]
          ' >/dev/null; then
            printf '%s\n' "$result" | jq -c '{status,code,bootstrapPhase,failureCode}' > "$safe/classification.json"
            echo PREPARATION_DIAGNOSTIC_FAILED_BOUNDED
            exit 0
          fi

          if printf '%s\n' "$result" | jq -e '
            type=="object"
            and .status=="NOOP"
            and .code=="INITIAL_CONTROLLED_REBUILD_BASELINE_EXISTS"
            and (keys|sort)==["code","status"]
          ' >/dev/null; then
            printf '%s\n' "$result" | jq -c '{status,code}' > "$safe/classification.json"
            echo PREPARATION_DIAGNOSTIC_BASELINE_EXISTS
            exit 0
          fi

          if printf '%s\n' "$result" | jq -e '
            type=="object"
            and .status=="STOP"
            and .code=="INITIAL_CONTROLLED_REBUILD_VALIDATION_BLOCKED"
            and (.blockers|type=="array" and length>0 and length<=32)
            and (keys|sort)==["blockers","code","status"]
          ' >/dev/null; then
            printf '%s\n' "$result" | jq -c '{status,code,blockers}' > "$safe/classification.json"
            echo PREPARATION_DIAGNOSTIC_VALIDATION_BLOCKED
            exit 0
          fi

          echo PREPARATION_DIAGNOSTIC_RESULT_INVALID
          exit 1

      - name: Upload privacy-safe preparation diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-initial-controlled-rebuild-preparation-diagnostic-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/preparation-diagnostic-evidence/classification.json
          if-no-files-found: ignore
          retention-days: 7
