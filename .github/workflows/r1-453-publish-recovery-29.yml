name: R1 453 publish recovery 29 transport

on:
  push:
    branches:
      - r1-453-rebind-recovery-29

permissions:
  contents: write

jobs:
  publish-local-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 3

      - name: Apply exact locally verified patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "ae0bf553577d50acdf5120ba8dd36c15cd32d6fe"
          git apply --check .transport/r1-453-recovery-29.patch
          git apply .transport/r1-453-recovery-29.patch
          npm run privacy
          npm run lint
          node --test tests/tooling/initial-bootstrap-recovery-workflow.test.mjs
          git diff --check
          rm -f .transport/r1-453-recovery-29.patch
          rmdir .transport 2>/dev/null || true
          rm -f .github/workflows/r1-453-publish-recovery-29.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "R1 #453: rebind recovery to bootstrap 29"
          git push origin HEAD:${GITHUB_REF_NAME}
