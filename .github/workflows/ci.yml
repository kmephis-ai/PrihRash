name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove manually dispatched CI targets the protected current main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'kmephis-ai/PrihRash'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" \
            --output "$RUNNER_TEMP/current-main.json"
          jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha and .protected == true' \
            "$RUNNER_TEMP/current-main.json" >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Bind provider packages to exact main SHA
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: node scripts/exact-source-artifact.mjs create "$GITHUB_SHA"
      - name: Publish exact-source provider artifact
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-exact-source-${{ github.sha }}
          path: |
            .artifacts/exact-source-manifest.json
            .artifacts/yandex-scheduled-sync-function/
            .artifacts/yandex-schema-bootstrap-function/
            .artifacts/yandex-schema-upgrade-003-function/
            .artifacts/yandex-schema-upgrade-004-function/
            .artifacts/yandex-initial-bootstrap-function/
            .artifacts/yandex-initial-bootstrap-recovery-function/
            .artifacts/yandex-initial-bootstrap-stale-validated-terminalization-function/
            .artifacts/yandex-initial-controlled-rebuild-function/
            .artifacts/yandex-wu7-temporary-throttling-function/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: true
