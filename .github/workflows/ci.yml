name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Bind provider packages to exact main SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/exact-source-artifact.mjs create "$GITHUB_SHA"
      - name: Publish exact-source provider artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-exact-source-${{ github.sha }}
          path: .artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
