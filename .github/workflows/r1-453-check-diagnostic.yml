name: R1 #453 check diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'r1-453-filter-bootstrap-month-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Capture canonical check
        id: check
        shell: bash
        run: |
          set +e
          npm run check >"$RUNNER_TEMP/check.log" 2>&1
          status=$?
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1-453-check-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/check.log
          retention-days: 1
      - name: Preserve canonical result
        if: steps.check.outputs.status != '0'
        run: exit 1
