name: Publish R1 Revision Budget Patch

on:
  push:
    branches:
      - transport/r1-453-mirror-6728-20260917

permissions:
  contents: write

env:
  BASE_SHA: 6728b1ffacdc1c9ef692b56d80edf4653aa6e476
  TARGET_BRANCH: fix/r1-453-revision-runtime-budget
  EXPECTED_TREE: f54aed287c242d5a5b1f9d768f55e73872424553

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact locally verified patch
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          printf '%s' "$PATCH_B64" | base64 -d | gunzip > "$RUNNER_TEMP/r1.patch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am "$RUNNER_TEMP/r1.patch"
          git diff HEAD^ --check
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
