name: Publish exact local R3A 392 commit

on:
  push:
    branches:
      - transport/r3a-392-publish-20260910-0636

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Reproduce and publish exact local commit
        env:
          SOURCE_SHA: fe23648d4c86878ae8671b40da807da2776d509a
          TARGET_BRANCH: r3a/392-durable-expense-draft
          EXPECTED_COMMIT: cadb05020a7050a807709866ebf85dcc01040314
          EXPECTED_TREE: a6c630e8e90ade2321fe86354f8ae954671456c9
          PATCH_B64: 
        run: |
          set -euo pipefail
          git fetch origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/local.patch
          git am --committer-date-is-author-date /tmp/local.patch
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --check "$SOURCE_SHA" "$EXPECTED_COMMIT"
          git push origin "$EXPECTED_COMMIT:refs/heads/$TARGET_BRANCH"
