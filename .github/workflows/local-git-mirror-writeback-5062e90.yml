name: Local Git Mirror Writeback 5062e90

on:
  push:
    branches:
      - mirror-20260915-e5083b4

permissions:
  contents: write

env:
  SOURCE_SHA: e5083b4bb0c4a80ef1c7beb540e6c7c28ba2222a
  TARGET_BRANCH: fix/r1-453-classify-function-bad-gateway
  PATCH_PATH: tools/local-git-mirror/writeback-5062e90.patch
  EXPECTED_TREE: 9ab23c9bb4e6209ae18269e572b86e0bb89b7f5e

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact local patch and publish target branch
        shell: bash
        run: |
          set -euo pipefail
          cp "$PATCH_PATH" "$RUNNER_TEMP/writeback.patch"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git switch --detach "$SOURCE_SHA"
          git switch -c "$TARGET_BRANCH"
          git apply --check "$RUNNER_TEMP/writeback.patch"
          git apply "$RUNNER_TEMP/writeback.patch"
          git diff --check
          git add \
            .github/workflows/r1-initial-shadow-bootstrap.yml \
            scripts/invoke-yandex-initial-bootstrap.mjs \
            tests/integration/yandex-initial-bootstrap-invoker-output-shape.test.mjs \
            tests/tooling/r1-initial-shadow-bootstrap-workflow.test.mjs
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '4'
          git config user.name 'OpenAI PrihRash Agent'
          git config user.email 'noreply@openai.com'
          git commit -m 'R1 #453: classify Cloud Functions 502 transport'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
