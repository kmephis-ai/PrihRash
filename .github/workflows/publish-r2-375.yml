name: Publish R2

on:
  push:
    branches:
      - transport/r2-publish-375

permissions:
  contents: write

env:
  EXPECTED_BASE: c4d170b7b8d5193a4b9bcba6784ea1dd1b325723
  EXPECTED_TREE: 59417b16edff657cfb34822937e4344e0d0e9a5b
  TARGET_BRANCH: r2/375-note-visibility
  PATCH_GZIP_SHA256: e20a75ad3f6832f54abfc9d79ca15a9b8eb0f64b2e662a41c91f8b4f6a14b690
  PATCH_B64: 

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Publish exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${REMOTE_MAIN}" = "${EXPECTED_BASE}"
          if git ls-remote --exit-code origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "target branch already exists" >&2
            exit 1
          fi

          git checkout --detach --quiet "${EXPECTED_BASE}"
          printf '%s' "${PATCH_B64}" | base64 --decode > /tmp/r2.patch.gz
          test "$(sha256sum /tmp/r2.patch.gz | awk '{print $1}')" = "${PATCH_GZIP_SHA256}"
          gunzip -c /tmp/r2.patch.gz > /tmp/r2.patch
          git apply --index /tmp/r2.patch
          test "$(git write-tree)" = "${EXPECTED_TREE}"

          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git commit -m $'R2: show canonical note in Reader\n\nCloses #375.'
          test "$(git rev-parse HEAD^1)" = "${EXPECTED_BASE}"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
