name: Dependency Cache Bootstrap

on:
  push:
    branches:
      - agent/dependency-cache-bootstrap-279

permissions:
  contents: read

env:
  SOURCE_SHA: c0b00250bc824bda720f303a31805afebcf8b50f
  DEPENDENCY_ARTIFACT_NAME: dependency-cache-279-c0b00250

jobs:
  build-offline-cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and prove exact dependency cache
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git checkout --detach --quiet "${SOURCE_SHA}"
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

          rm -rf dependency-cache dependency-artifact node_modules
          mkdir -p dependency-cache dependency-artifact

          npm ci --ignore-scripts --no-audit --no-fund --cache "${PWD}/dependency-cache"
          rm -rf node_modules dependency-cache/_logs

          npm ci --offline --ignore-scripts --no-audit --no-fund --cache "${PWD}/dependency-cache"
          npm run check
          rm -rf node_modules dependency-cache/_logs

          tar -czf dependency-artifact/npm-cache.tar.gz -C dependency-cache .

          LOCK_SHA256="$(sha256sum package-lock.json | awk '{print $1}')"
          PACKAGE_SHA256="$(sha256sum package.json | awk '{print $1}')"
          CACHE_SHA256="$(sha256sum dependency-artifact/npm-cache.tar.gz | awk '{print $1}')"
          NODE_VERSION="$(node --version)"
          NPM_VERSION="$(npm --version)"
          NODE_MAJOR="$(node -p 'process.versions.node.split(".")[0]')"
          NPM_MAJOR="$(npm --version | cut -d. -f1)"
          NODE_PLATFORM="$(node -p 'process.platform')"
          NODE_ARCH="$(node -p 'process.arch')"

          cat > dependency-artifact/manifest.json <<JSON
          {
            "schema_version": 1,
            "source_repository": "${GITHUB_REPOSITORY}",
            "source_sha": "${SOURCE_SHA}",
            "package_lock_sha256": "${LOCK_SHA256}",
            "package_json_sha256": "${PACKAGE_SHA256}",
            "cache_archive_sha256": "${CACHE_SHA256}",
            "node_version": "${NODE_VERSION}",
            "node_major": ${NODE_MAJOR},
            "npm_version": "${NPM_VERSION}",
            "npm_major": ${NPM_MAJOR},
            "platform": "${NODE_PLATFORM}",
            "arch": "${NODE_ARCH}"
          }
          JSON

      - name: Upload dependency cache artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.DEPENDENCY_ARTIFACT_NAME }}
          path: dependency-artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
