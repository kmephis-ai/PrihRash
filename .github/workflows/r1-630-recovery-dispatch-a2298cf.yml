name: R1 630 recovery dispatch a2298cf

on:
  push:
    branches:
      - transport/r1-630-a2298cf

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-main read-only recovery once
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: a2298cfc6a3d7e0dcba20603cf243a8a008d0f0f
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GH_API_TOKEN}"
          accept='Accept: application/vnd.github+json'

          main="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/branches/main")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' <<<"$main" >/dev/null
          issue="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/issues/630")"
          jq -e '.state == "open" and (.title | startswith("R1 WU7:"))' <<<"$issue" >/dev/null

          active="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/runs?per_page=100")"
          if jq -e '.workflow_runs | any((.status=="queued" or .status=="in_progress") and (.name=="R1 initial shadow bootstrap" or .name=="R1 initial bootstrap orchestrator" or .name=="R1 initial controlled rebuild"))' <<<"$active" >/dev/null; then
            echo 'R1_630_RECOVERY_WRITER_ACTIVE'; exit 1
          fi

          existing="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$EXPECTED_MAIN_SHA" '.workflow_runs | any(.head_sha == $sha)' <<<"$existing" >/dev/null; then
            echo 'R1_630_RECOVERY_ALREADY_DISPATCHED'; exit 0
          fi

          curl --fail --silent --show-error --request POST             --header "$auth" --header "$accept" --header 'X-GitHub-Api-Version: 2022-11-28'             "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/dispatches"             --data '{"ref":"main"}'
          echo 'R1_630_RECOVERY_DISPATCHED'
