name: R1 #448 verified tree transport

on:
  push:
    branches:
      - ai/r1-448-publish-20260912-2127

permissions:
  contents: write

env:
  SOURCE_SHA: 22b32caa98578651119efefd2927f8517e4c7715
  EXPECTED_TREE: e2480ba9051ab3dc4267790aba4c48ed953c17ff
  TARGET_BRANCH: ai/r1-448-schema-v3
  EXPECTED_TARGET_OLD_SHA: 22b32caa98578651119efefd2927f8517e4c7715
  PATCH_SHA256: 29f28fdba020f09b07aa72efd20df8040f60224b09bee895b5effa7ca76db7ab
  PATCH_BYTES: '101482'

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct exact local patch
        shell: bash
        run: |
          set -euo pipefail
          ROOT="tools/local-git-mirror/r1-448-publish"
          NORMALIZED="$RUNNER_TEMP/r1-448-normalized"
          PATCH_B64="$RUNNER_TEMP/r1-448.patch.gz.b64"
          PATCH_GZ="$RUNNER_TEMP/r1-448.patch.gz"
          PATCH="$RUNNER_TEMP/r1-448.patch"
          mkdir -p "$NORMALIZED"

          head -c 8000 "$ROOT/patch.00" > "$NORMALIZED/patch.00"
          head -c 8000 "$ROOT/patch.01" > "$NORMALIZED/patch.01"
          head -c 8000 "$ROOT/patch.02" > "$NORMALIZED/patch.02"
          cat "$ROOT/p03.0" "$ROOT/p03.1" "$ROOT/p03.2" "$ROOT/p03.3" > "$NORMALIZED/patch.03"

          echo "a2a287190fa8e99d60804d0a533f3a1001b019b87b16e1f527aee411e20b88cc  $ROOT/p03.0" | sha256sum --check --status
          echo "77bd8bfd89b6e12f5dd4f416d8622354a0a4304dd43a6d81029d77cc77ee3523  $ROOT/p03.1" | sha256sum --check --status
          echo "56156e87c3bf3b0e579a28278fe30c5bcc59fb52374ff55ea843e0d3e95935ed  $ROOT/p03.2" | sha256sum --check --status
          echo "40f74af7655694adf3d3666d39c06d76ce25010db2046d271c46c70196bfcf48  $ROOT/p03.3" | sha256sum --check --status

          echo "184994e3e84adedd9c4b3c2ff281f599c0cad95b4c276f6b1d64b4f4ee51895a  $NORMALIZED/patch.00" | sha256sum --check --status
          echo "63b33b2b2f996a1b6d11c4c762effb6780cb4d5487e959a39fc02f996f7ff8c5  $NORMALIZED/patch.01" | sha256sum --check --status
          echo "e27d4df2f3d7180efd498b73d01e844c2dcb075ea5108bf59e7a08bf8f6b62bd  $NORMALIZED/patch.02" | sha256sum --check --status
          echo "c0db348fbb2c92627e3f89f7685c0ad1fa3d21036455db00fa8f392d0f2a0e9f  $NORMALIZED/patch.03" | sha256sum --check --status

          cat "$NORMALIZED/patch.00" "$NORMALIZED/patch.01" "$NORMALIZED/patch.02" "$NORMALIZED/patch.03" > "$PATCH_B64"
          base64 --decode "$PATCH_B64" > "$PATCH_GZ"
          gzip --decompress --stdout "$PATCH_GZ" > "$PATCH"
          test "$(wc -c < "$PATCH" | tr -d ' ')" = "$PATCH_BYTES"
          echo "$PATCH_SHA256  $PATCH" | sha256sum --check --status

      - name: Apply verified local commit to exact main
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/r1-448.patch"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git checkout --detach --quiet "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git am "$PATCH"
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"

      - name: Verify target branch has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          test "$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")" = "$EXPECTED_TARGET_OLD_SHA"

      - name: Publish verified tree with lease
        shell: bash
        run: |
          set -euo pipefail
          git push \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${EXPECTED_TARGET_OLD_SHA}" \
            origin "HEAD:refs/heads/${TARGET_BRANCH}"

      - name: Verify remote tree
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote --heads origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test -n "$REMOTE_SHA"
          git fetch --quiet origin "$REMOTE_SHA"
          test "$(git rev-parse "${REMOTE_SHA}^{tree}")" = "$EXPECTED_TREE"
          test "$(git rev-parse "${REMOTE_SHA}^")" = "$SOURCE_SHA"
          echo "PUBLISH_READY tree=${EXPECTED_TREE}"
