name: Local Git Publish R3A 424

on:
  push:
    branches:
      - ai/publish-r3a-424-20260910-1820

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and publish exact local commit
        shell: bash
        env:
          BASE_SHA: fd285c75441a18811910179791041e7e97ad928c
          PATCH_SHA: 772f973a1fa0bc8995e0a5ebb874dcae6a533355
          PATCH_TREE: a2c7940cadcfb404c61da69c0b3ece802c8134ea
          TARGET_BRANCH: r3a/424-expense-payer-preview
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git bundle verify transport/r3a424-patch.bundle
          git fetch transport/r3a424-patch.bundle refs/heads/r3a/424-expense-payer-preview:refs/remotes/local-patch/source
          test "$(git rev-parse refs/remotes/local-patch/source)" = "${PATCH_SHA}"
          test "$(git rev-parse "${PATCH_SHA}^")" = "${BASE_SHA}"
          test "$(git rev-parse "${PATCH_SHA}^{tree}")" = "${PATCH_TREE}"
          EXPECTED_FILES=$'docs/R3A_PREVIEW_WRITER.md\ntests/integration/r2-safe-ui-preview.test.mjs\nweb/preview-writer-delivery.mjs\nweb/preview-writer-outbox.mjs\nweb/preview-writer.mjs'
          test "$(git diff --name-only "${BASE_SHA}" "${PATCH_SHA}")" = "${EXPECTED_FILES}"
          git worktree add --detach /tmp/r3a424-publish-check "${PATCH_SHA}"
          cd /tmp/r3a424-publish-check
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          git diff --check "${BASE_SHA}" "${PATCH_SHA}"
          cd "${GITHUB_WORKSPACE}"
          git push origin "${PATCH_SHA}:refs/heads/${TARGET_BRANCH}"
