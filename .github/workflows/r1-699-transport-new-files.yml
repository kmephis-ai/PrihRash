name: R1 699 transport new files

on:
  push:
    branches:
      - agent/r1-699-production-gate-c

permissions:
  contents: write
  issues: read

jobs:
  publish:
    if: github.repository == 'kmephis-ai/PrihRash'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Materialize exact reviewed new files and retire transport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: '5752913961'
          ARCHIVE_SHA256: 11b1f16cf5872a884419f41ef67b7351c2e7405e7e6040225ce56b86b108e842
          WORKFLOW_BLOB: 345f686c8fa3f720cc5db8347a2ef02937c8f20f
          TEST_BLOB: 30d02da41ee69c2fcc423caa31128ef00f22bcdf
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'agent/r1-699-production-gate-c'
          tmp="$RUNNER_TEMP/r1-699-transport"
          mkdir -p "$tmp"
          curl --fail --silent --show-error             -H "Authorization: Bearer ${GH_TOKEN}"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}"             -o "$tmp/comment.json"
          jq -er '.body' "$tmp/comment.json"             | sed -n '/^PAYLOAD-BEGIN$/,/^PAYLOAD-END$/p'             | sed '1d;$d'             | tr -d '\n'             | base64 --decode > "$tmp/payload.tgz"
          test "$(sha256sum "$tmp/payload.tgz" | awk '{print $1}')" = "$ARCHIVE_SHA256"

          mapfile -t entries < <(tar -tzf "$tmp/payload.tgz" | sort)
          test "${#entries[@]}" -eq 2
          test "${entries[0]}" = '.github/workflows/r1-initial-bootstrap-gate-c.yml'
          test "${entries[1]}" = 'tests/tooling/r1-initial-bootstrap-gate-c-workflow.test.mjs'
          tar -xzf "$tmp/payload.tgz"

          test "$(git hash-object .github/workflows/r1-initial-bootstrap-gate-c.yml)" = "$WORKFLOW_BLOB"
          test "$(git hash-object tests/tooling/r1-initial-bootstrap-gate-c-workflow.test.mjs)" = "$TEST_BLOB"

          rm .github/workflows/r1-699-transport-new-files.yml
          git add .github/workflows/r1-699-transport-new-files.yml             .github/workflows/r1-initial-bootstrap-gate-c.yml             tests/tooling/r1-initial-bootstrap-gate-c-workflow.test.mjs
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = '.github/workflows/r1-699-transport-new-files.yml .github/workflows/r1-initial-bootstrap-gate-c.yml tests/tooling/r1-initial-bootstrap-gate-c-workflow.test.mjs '

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R1 #699: publish exact Gate C workflow and regression guard'
          git push origin "HEAD:${GITHUB_REF_NAME}"
