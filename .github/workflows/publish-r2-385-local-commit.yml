name: Publish exact local R2 385 commit

on:
  push:
    branches:
      - transport/r2-385-publish-20260909-1444

permissions:
  contents: write

env:
  SOURCE_SHA: 8e43210e3644d3111de94132d0520e30b2368438
  TARGET_BRANCH: r2/385-payer-label
  EXPECTED_TREE: 34f4d8a8f7461db4824c060f167f04dfa321d558
  EXPECTED_COMMIT: f4fb502b475005c00355a76e8f2151b9a4c9f2a9

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply and verify exact local commit
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${SOURCE_SHA}"
          test "$(git rev-parse refs/remotes/origin/${TARGET_BRANCH})" = "${SOURCE_SHA}"
          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git checkout -B "${TARGET_BRANCH}" "${SOURCE_SHA}"
          cat > /tmp/r2-385.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/r2-385.patch.gz.b64 | gzip -d > /tmp/r2-385.patch
          git am --committer-date-is-author-date /tmp/r2-385.patch
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          git diff --check "${SOURCE_SHA}" "${EXPECTED_COMMIT}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
