name: Local Git Apply R1 545

on:
  push:
    branches:
      - local-git-mirror/r1-545-20260916-0430

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: r1-545-provider-attempt-hardening
          fetch-depth: 0
      - name: Apply exact non-workflow diff
        shell: bash
        env:
          EXPECTED_BASE: d428fe04bb2bdfe355c4c6dcbfe844a121d8becf
          EXPECTED_HEAD: 31823e6764f0f1d3c22206fdb98b21b02fab9cb2
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip -d > "$RUNNER_TEMP/r1-545.patch"
          git apply --index "$RUNNER_TEMP/r1-545.patch"
          git config user.name 'OpenAI'
          git config user.email 'openai@example.invalid'
          GIT_AUTHOR_DATE='2026-09-16T04:36:45Z' GIT_COMMITTER_DATE='2026-09-16T04:36:45Z' git commit -m 'R1 #545: harden provider attempt evidence boundary'
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git push origin "HEAD:refs/heads/r1-545-provider-attempt-hardening"
