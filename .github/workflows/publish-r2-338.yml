name: Publish R2 #338 exact local commit

on:
  push:
    branches:
      - transport/r2-refresh-20260908-2156
    paths:
      - .github/workflows/publish-r2-338.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 68817fb75f76c775700b51d5b389c8002f5850e5
          fetch-depth: 0
      - name: Verify base, apply exact patch and publish branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse FETCH_HEAD)" = "68817fb75f76c775700b51d5b389c8002f5850e5"
          cat > /tmp/r2-338.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 -d /tmp/r2-338.patch.gz.b64 | gzip -d > /tmp/r2-338.patch
          git apply --index --whitespace=error-all /tmp/r2-338.patch
          test "$(git write-tree)" = "334e739c150f1caeffdd72e8d1e2c6e9c27a8981"
          git config user.name 'kmephis-ai'
          git config user.email 'kmephis@gmail.com'
          git commit -m 'R2: manual Reader refresh and recovery' -m 'Closes #338.'
          test "$(git rev-parse HEAD^{tree})" = "334e739c150f1caeffdd72e8d1e2c6e9c27a8981"
          git push origin HEAD:refs/heads/r2/338-manual-refresh
