name: Transport R1 453 verified publish

on:
  push:
    branches:
      - transport/r1-453-publish-20260917

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: 2c05645bc8532159fbc920f67bc11fff31e6693c
      EXPECTED_TREE: 198e9ed239d83485d24d290e7c9f286f39db5451
      TARGET_BRANCH: fix/r1-453-retirement-cause-classification
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply exact verified local patch and publish feature branch
        shell: bash
        run: |
          set -euo pipefail
          patch_file="$RUNNER_TEMP/r1-453.patch"
          cp .transport/r1-453-retirement-cause.patch "$patch_file"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git reset --hard "$SOURCE_SHA"
          git clean -fdx
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git apply --index "$patch_file"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'OpenAI Agent'
          git config user.email 'agent@users.noreply.github.com'
          git commit -m 'R1 #453: preserve stale-retirement failure cause'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
