name: TEST_PRIVATE controlled rebuild smoke

# Owner-authorized R1.7 provider evidence rerun trigger: 2026-09-07.
# Owner confirmed TEST_PRIVATE connection + service-account JSON secrets configured; rerun trigger 2.
# Owner corrected TEST_PRIVATE service-account JSON secret; rerun trigger 3.
# Harness cleanup/diagnostics fix merged; rerun trigger 4.
# Create-case substage evidence added; rerun trigger 5.
# Explicit YDB Uuid binding added; rerun trigger 6.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-private-controlled-rebuild-smoke.yml

permissions:
  contents: read

concurrency:
  group: prihrash-test-private-controlled-rebuild-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: synthetic controlled rebuild provider evidence
    runs-on: ubuntu-latest
    environment: TEST_PRIVATE
    timeout-minutes: 10
    env:
      PRIHRASH_TEST_PRIVATE_SCOPE: TEST_PRIVATE
      TEST_PRIVATE_YDB_CONNECTION_STRING: ${{ secrets.TEST_PRIVATE_YDB_CONNECTION_STRING }}
      YDB_ACCESS_TOKEN_CREDENTIALS: ${{ secrets.TEST_PRIVATE_YDB_ACCESS_TOKEN }}
      TEST_PRIVATE_YDB_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.TEST_PRIVATE_YDB_SERVICE_ACCOUNT_KEY_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install TEST_PRIVATE runtime-only YDB helpers
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @ydbjs/query@6.3.0 @ydbjs/auth@6.3.1 @ydbjs/auth-yandex-cloud@0.2.0 @ydbjs/value@6.0.8

      - name: Build exact main sources
        run: npm run build

      - name: Run synthetic TEST_PRIVATE controlled rebuild smoke
        run: node scripts/test-private-controlled-rebuild-smoke.mjs
