name: R1 #755 read-only recovery dispatch

on:
  push:
    branches:
      - transport/r1-755-readonly-recovery-2406967

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-main controlled-preparation read-only recovery once
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 2406967f4caff002b20445ec1c5f2b5a23904f0a
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'
          main_sha="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/branches/main" | jq -er '.commit.sha')"
          test "$main_sha" = "$EXPECTED_MAIN_SHA" || { echo 'R1_755_DISPATCH_MAIN_MOVED'; exit 1; }

          for workflow in r1-initial-bootstrap-orchestrator.yml r1-initial-shadow-bootstrap.yml r1-initial-controlled-rebuild.yml; do
            runs="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/workflows/$workflow/runs?branch=main&per_page=100" || true)"
            if [ -n "$runs" ] && jq -e --arg sha "$EXPECTED_MAIN_SHA" '.workflow_runs | any(.head_sha == $sha and (.status == "queued" or .status == "in_progress"))' <<<"$runs" >/dev/null 2>&1; then
              echo 'R1_755_DISPATCH_WRITER_ACTIVE'
              exit 1
            fi
          done

          existing="$(curl --fail --silent --show-error --header "$auth_header" --header "$accept_header" "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$EXPECTED_MAIN_SHA" '.workflow_runs | any(.head_sha == $sha)' <<<"$existing" >/dev/null; then
            echo 'R1_755_DISPATCH_ALREADY_EXISTS'
            exit 0
          fi

          curl --fail --silent --show-error \
            --request POST \
            --header "$auth_header" \
            --header "$accept_header" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/dispatches" \
            --data '{"ref":"main","inputs":{"controlled_preparation_only":"true"}}'
          echo 'R1_755_READ_ONLY_RECOVERY_DISPATCHED'
