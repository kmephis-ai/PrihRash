name: R1 owner recovery command bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: r1-owner-recovery-command-bridge
  cancel-in-progress: false

jobs:
  dispatch-recovery:
    if: >-
      github.repository == 'kmephis-ai/PrihRash'
      && github.event.issue.number == 453
      && github.event.issue.state == 'open'
      && github.actor == 'kmephis-ai'
      && github.event.comment.user.login == 'kmephis-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_API_TOKEN: ${{ github.token }}
      COMMENT_BODY: ${{ github.event.comment.body }}
    steps:
      - name: Dispatch exact-main read-only recovery only
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'

          target_sha="$(jq -Rn --arg body "$COMMENT_BODY" '
            ($body | split("\n")) as $lines
            | if (
                ($lines | length) == 2
                and $lines[0] == "R1-COMMAND: RECOVERY"
                and ($lines[1] | test("^Main-SHA: [0-9a-f]{40}$"))
              )
              then ($lines[1] | sub("^Main-SHA: "; ""))
              else empty
              end
          ')"
          if [ -z "$target_sha" ]; then
            echo 'R1_OWNER_RECOVERY_COMMAND_INVALID'
            exit 0
          fi

          main_sha="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/branches/main" | jq -er '.commit.sha')"
          if [ "$main_sha" != "$target_sha" ]; then
            echo 'R1_OWNER_RECOVERY_COMMAND_MAIN_MOVED'
            exit 0
          fi

          issue_state="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/issues/453" | jq -er '.state')"
          if [ "$issue_state" != 'open' ]; then
            echo 'R1_OWNER_RECOVERY_COMMAND_ISSUE_INACTIVE'
            exit 0
          fi

          ci_runs="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=20")"
          if ! jq -e --arg sha "$target_sha" '
            .workflow_runs
            | any(.head_sha == $sha and .status == "completed" and .conclusion == "success")
          ' <<<"$ci_runs" >/dev/null; then
            echo 'R1_OWNER_RECOVERY_COMMAND_CI_NOT_GREEN'
            exit 0
          fi

          for workflow in r1-initial-bootstrap-orchestrator.yml r1-initial-shadow-bootstrap.yml; do
            active="$(curl --fail --silent --show-error               --header "$auth_header"               --header "$accept_header"               "$api/actions/workflows/$workflow/runs?branch=main&per_page=100")"
            if jq -e '.workflow_runs | any(.status != "completed")' <<<"$active" >/dev/null; then
              echo 'R1_OWNER_RECOVERY_COMMAND_WRITER_ACTIVE'
              exit 0
            fi
          done

          recovery_runs="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$target_sha" '
            .workflow_runs | any(.head_sha == $sha)
          ' <<<"$recovery_runs" >/dev/null; then
            echo 'R1_OWNER_RECOVERY_COMMAND_ALREADY_DISPATCHED'
            exit 0
          fi

          current_sha="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/branches/main" | jq -er '.commit.sha')"
          if [ "$current_sha" != "$target_sha" ]; then
            echo 'R1_OWNER_RECOVERY_COMMAND_MAIN_MOVED_BEFORE_DISPATCH'
            exit 0
          fi

          curl --fail --silent --show-error             --request POST             --header "$auth_header"             --header "$accept_header"             --header 'X-GitHub-Api-Version: 2022-11-28'             "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/dispatches"             --data '{"ref":"main"}'
          echo 'R1_OWNER_RECOVERY_COMMAND_DISPATCHED'
