name: Local Git Publish R1 441 Provider Diagnostics

on:
  push:
    branches:
      - ai/r1-441-provider-diag-publish-20260911

permissions:
  contents: write

env:
  SOURCE_SHA: 927a2af9a79033778812342a607ea32d0dba4fcf
  TARGET_BRANCH: r1-441-provider-gate-diagnostics
  EXPECTED_TREE: 9bcc9ac4cb294d37d1cd5e7a9bd9be42b1c811bd
  PATCH_SHA256: a9f7edd52a5915421c441e56c1d2540fe5c0202f3e7a1888ed397d12cecef530

jobs:
  publish-exact-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply exact local patch and publish guarded tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$SOURCE_SHA"
          git checkout -B "$TARGET_BRANCH" "$SOURCE_SHA"

          cat > /tmp/r1.patch.b64 <<'PATCH_B64'
          
          PATCH_B64
          tr -d '[:space:]' </tmp/r1.patch.b64 | base64 --decode >/tmp/r1.patch
          test "$(sha256sum /tmp/r1.patch | awk '{print $1}')" = "$PATCH_SHA256"
          git apply --check /tmp/r1.patch
          git apply /tmp/r1.patch
          git diff --check
          test "$(git diff --name-only)" = '.github/workflows/r1-ydb-schema-bootstrap.yml'
          git add .github/workflows/r1-ydb-schema-bootstrap.yml
          test "$(git write-tree)" = "$EXPECTED_TREE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R1 #441: localize schema bootstrap provider gate'
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
