name: Publish exact local R2 383 commit

on:
  push:
    branches:
      - transport/r2-383-publish-20260909-1415

permissions:
  contents: write

env:
  SOURCE_SHA: d800389460e4da04f62635ffe0674c37c907013f
  TARGET_BRANCH: r2/383-browser-invariants
  EXPECTED_COMMIT: ab32e43a28c6ea49a983e72ded7434f52f0e053d
  EXPECTED_TREE: 71902d2a974e90effb5c328834bd6cd53bfcca57

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply and verify exact local commit
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          test "$(git rev-parse refs/remotes/origin/main)" = "${SOURCE_SHA}"
          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git checkout -B "${TARGET_BRANCH}" "${SOURCE_SHA}"
          cat > /tmp/r2-383.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/r2-383.patch.gz.b64 | gzip -d > /tmp/r2-383.patch
          git am --committer-date-is-author-date /tmp/r2-383.patch
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          git diff --check "${SOURCE_SHA}" HEAD
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
