name: Publish R2 #373 exact tree

on:
  push:
    branches:
      - transport/r2-publish-373-20260909-1140

permissions:
  contents: write

env:
  SOURCE_SHA: 10646e2a26df66148b22e70c8d0ee95eb3a878af
  EXPECTED_TREE: 1de1d4212c19f239aa0b9c9cd3eee49c0fd5b8f7
  FEATURE_BRANCH: r2/373-month-label
  PATCH_GZ_SHA256: 8f1c5a24462c9e848ce0164e118995df9e0b3fcbd1e6f8a63f9e973b0d6effef
  PATCH_GZ_B64: 

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Publish exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "${SOURCE_SHA}"
          git checkout --detach "${SOURCE_SHA}"

          printf '%s' "${PATCH_GZ_B64}" | base64 -d > /tmp/r2-373.patch.gz
          echo "${PATCH_GZ_SHA256}  /tmp/r2-373.patch.gz" | sha256sum -c -
          gzip -dc /tmp/r2-373.patch.gz > /tmp/r2-373.patch
          git apply --index /tmp/r2-373.patch

          ACTUAL_TREE="$(git write-tree)"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"

          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git commit -m 'R2: keep month precision coarse in Reader' -m 'Closes #373.'
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"

          git push origin "HEAD:refs/heads/${FEATURE_BRANCH}"
