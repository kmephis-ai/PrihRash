name: Local Git Publish R3A 422

on:
  push:
    branches:
      - ai/publish-r3a-422-20260910-1800

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and publish exact local commit
        shell: bash
        env:
          BASE_SHA: 038e7de549a2f0a77fcba735df00963caa1f75dd
          PATCH_SHA: 125331dd3d8789907702e951e5bdc458b6a27e2d
          PATCH_TREE: f1b5f06cf9cfc1191572503683c44f5b8221cec6
          TARGET_BRANCH: r3a/422-expense-paid-by-member
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"
          git cat-file -e "${BASE_SHA}^{commit}"
          git bundle verify transport/r3a422-patch.bundle
          git fetch transport/r3a422-patch.bundle refs/heads/r3a/422-expense-paid-by-member:refs/remotes/local-patch/source
          test "$(git rev-parse refs/remotes/local-patch/source)" = "${PATCH_SHA}"
          test "$(git rev-parse "${PATCH_SHA}^")" = "${BASE_SHA}"
          test "$(git rev-parse "${PATCH_SHA}^{tree}")" = "${PATCH_TREE}"
          EXPECTED_FILES=$'docs/R3A_WRITER_API.md\nsrc/writer/idempotentExpenseCreate.ts\ntests/domain/idempotent-expense-create.test.mjs\ntests/domain/writer-expense-create-api.test.mjs'
          test "$(git diff --name-only "${BASE_SHA}" "${PATCH_SHA}")" = "${EXPECTED_FILES}"
          git worktree add --detach /tmp/r3a422-publish-check "${PATCH_SHA}"
          cd /tmp/r3a422-publish-check
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          git diff --check "${BASE_SHA}" "${PATCH_SHA}"
          cd "${GITHUB_WORKSPACE}"
          git push origin "${PATCH_SHA}:refs/heads/${TARGET_BRANCH}"
