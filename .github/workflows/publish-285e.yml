name: Publish verified TEST_PRIVATE overload backoff

on:
  push:
    branches:
      - transport/publish-285e

permissions:
  contents: write

env:
  BASE_SHA: 31684ca696951df509954a9f9324bb613c5f6ab4
  TARGET_BRANCH: fix/r1-test-private-overloaded-backoff
  PATCH_B64:  

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply byte-exact verified harness patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          printf '%s' "${PATCH_B64}" | base64 -d > /tmp/verified.patch
          git apply --check /tmp/verified.patch
          git apply /tmp/verified.patch
          git diff --check
          git config user.name 'kmephis-ai'
          git config user.email 'kmephis@gmail.com'
          git add scripts/test-private-controlled-rebuild-smoke.mjs
          git commit -m 'R1: bound TEST_PRIVATE overload retries'
          git push origin "HEAD:${TARGET_BRANCH}"
