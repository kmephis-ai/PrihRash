name: R1 initial bootstrap recovery

on:
  workflow_dispatch:
    inputs:
      surface_only:
        description: Classify durable surface only, without staging diagnostics
        required: false
        type: boolean
        default: false
      controlled_preparation_only:
        description: Re-run controlled preparation read-only under the exact controlled YDB timeout envelope
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: r1-initial-bootstrap-writer
  cancel-in-progress: false

jobs:
  initial-bootstrap-recovery:
    if: github.repository == 'kmephis-ai/PrihRash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUNCTION_NAME: prihrash-r1-initial-bootstrap
      RECOVERY_SURFACE_ONLY: ${{ inputs.surface_only && '1' || '0' }}
      RECOVERY_CONTROLLED_PREPARATION_ONLY: ${{ inputs.controlled_preparation_only && '1' || '0' }}
      RUNTIME_SERVICE_ACCOUNT_NAME: prihrash-initial-bootstrap
      LOCKBOX_SECRET_NAME: prihrash-r1-initial-bootstrap
      OIDC_AUDIENCE: https://github.com/kmephis-ai
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      OIDC_SUBJECT: repo:kmephis-ai@310519475/PrihRash@1359286840:ref:refs/heads/main
      YC_FOLDER_ID: ${{ secrets.YC_R1_FOLDER_ID }}
      YC_WIF_SERVICE_ACCOUNT_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_WIF_SERVICE_ACCOUNT_ID }}
      YC_LOCKBOX_SECRET_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_LOCKBOX_SECRET_ID }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify immutable recovery source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'kmephis-ai/PrihRash'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$YC_FOLDER_ID"
          test -n "$YC_WIF_SERVICE_ACCOUNT_ID"
          test -n "$YC_LOCKBOX_SECRET_ID"
          if [ "$RECOVERY_SURFACE_ONLY" = "1" ] && [ "$RECOVERY_CONTROLLED_PREPARATION_ONLY" = "1" ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_MODE_CONFLICT'
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact-source invoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore verified exact-source artifact
        uses: ./.github/actions/restore-exact-source
        with:
          source-sha: ${{ github.sha }}
          github-token: ${{ github.token }}

      - name: Require exact current main and dynamically proven failed bootstrap attempt
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-gates"
          mkdir -p "$tmp"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"

          curl --fail --silent --show-error --header "$auth_header" \
            --header 'Accept: application/vnd.github+json' \
            "$api/branches/main" --output "$tmp/main.json" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_MAIN_GATE_READ_FAILED'
              exit 1
            }
          if ! jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha and .protected == true' \
            "$tmp/main.json" >/dev/null 2>&1; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_MAIN_GATE_NOT_READY'
            exit 1
          fi

          curl --fail --silent --show-error --header "$auth_header" \
            --header 'Accept: application/vnd.github+json' \
            "$api/actions/workflows/r1-initial-shadow-bootstrap.yml/runs?branch=main&event=workflow_dispatch&status=failure&per_page=100" \
            --output "$tmp/bootstrap-runs.json" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_BOOTSTRAP_HISTORY_READ_FAILED'
              exit 1
            }
          if ! target="$(jq -cer '
            [.workflow_runs[] | select(
              .name == "R1 initial shadow bootstrap"
              and .head_branch == "main"
              and .event == "workflow_dispatch"
              and .conclusion == "failure"
              and (.id | type == "number")
              and (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
              and (.created_at | type == "string")
            )]
            | sort_by(.created_at, .id)
            | reverse
            | if length > 0 then .[0] else empty end
          ' "$tmp/bootstrap-runs.json")" || [ -z "$target" ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FAILED_ATTEMPT_MISSING'
            exit 1
          fi
          selected_run_id="$(jq -er '.id' <<<"$target")"
          selected_run_sha="$(jq -er '.head_sha' <<<"$target")"

          curl --fail --silent --show-error --header "$auth_header" \
            --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs/${selected_run_id}" \
            --output "$tmp/bootstrap-run.json" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_BOOTSTRAP_RUN_READ_FAILED'
              exit 1
            }
          if ! jq -e \
            --argjson expected_id "$selected_run_id" \
            --arg expected_sha "$selected_run_sha" \
            '.id == $expected_id
              and .name == "R1 initial shadow bootstrap"
              and .head_sha == $expected_sha
              and .head_branch == "main"
              and .event == "workflow_dispatch"
              and .conclusion == "failure"' \
            "$tmp/bootstrap-run.json" >/dev/null 2>&1; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FAILED_ATTEMPT_MISSING'
            exit 1
          fi

          curl --fail --silent --show-error --header "$auth_header" \
            --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs/${selected_run_id}/jobs?filter=latest&per_page=100" \
            --output "$tmp/bootstrap-jobs.json" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_BOOTSTRAP_RUN_READ_FAILED'
              exit 1
            }
          if ! jq -e '
            [.jobs[] | select(.name == "initial-shadow-bootstrap")] as $jobs
            | ($jobs | length) == 1
            and ([
              $jobs[0].steps[]? | select(
                .name == "Invoke exact initial bootstrap tag once"
                and .conclusion == "failure"
              )
            ] | length) == 1
          ' "$tmp/bootstrap-jobs.json" >/dev/null 2>&1; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_INVOKE_FAILURE_NOT_PROVEN'
            exit 1
          fi

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/yc"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$install_dir"
          yc_bin="$(find "$install_dir" -type f -name yc -perm -u+x -print -quit)"
          test -n "$yc_bin"
          printf '%s\n' "$(dirname "$yc_bin")" >> "$GITHUB_PATH"
          "$yc_bin" version >/dev/null

      - name: Exchange GitHub OIDC token for short-lived Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-auth"
          mkdir -p "$tmp"
          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value | @uri')"

          if ! oidc_status="$(curl --silent --show-error \
            --output "$tmp/oidc.json" \
            --write-out '%{http_code}' \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" \
            2>"$tmp/oidc.err")"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_REQUEST_FAILED'
            exit 1
          fi
          case "$oidc_status" in
            2??) ;;
            *) echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_REQUEST_FAILED'; exit 1 ;;
          esac
          if ! oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' "$tmp/oidc.json" 2>/dev/null)"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_REQUEST_FAILED'
            exit 1
          fi
          echo "::add-mask::${oidc_token}"

          token_payload="${oidc_token#*.}"
          token_payload="${token_payload%%.*}"
          token_payload="${token_payload//-/+}"
          token_payload="${token_payload//_/\/}"
          case "$((${#token_payload} % 4))" in
            0) ;;
            2) token_payload="${token_payload}==" ;;
            3) token_payload="${token_payload}=" ;;
            *) echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_CLAIMS_INVALID'; exit 1 ;;
          esac
          if ! printf '%s' "$token_payload" | base64 --decode >"$tmp/claims.json" 2>"$tmp/claims.err"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_CLAIMS_INVALID'
            exit 1
          fi
          jq -e --arg expected "$OIDC_ISSUER" '.iss == $expected' "$tmp/claims.json" >/dev/null 2>&1 || {
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_ISSUER_MISMATCH'; exit 1;
          }
          jq -e --arg expected "$OIDC_AUDIENCE" '(.aud == $expected) or ((.aud | type) == "array" and (.aud | length) == 1 and .aud[0] == $expected)' "$tmp/claims.json" >/dev/null 2>&1 || {
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_AUDIENCE_MISMATCH'; exit 1;
          }
          jq -e --arg expected "$OIDC_SUBJECT" '.sub == $expected' "$tmp/claims.json" >/dev/null 2>&1 || {
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_SUBJECT_MISMATCH'; exit 1;
          }

          if ! iam_status="$(curl --silent --show-error \
            --output "$tmp/iam.json" \
            --write-out '%{http_code}' \
            --request POST https://auth.yandex.cloud/oauth/token \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_WIF_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${oidc_token}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            2>"$tmp/iam.err")"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_WIF_EXCHANGE_FAILED'
            exit 1
          fi
          case "$iam_status" in
            2??) ;;
            *) echo 'INITIAL_BOOTSTRAP_RECOVERY_WIF_EXCHANGE_FAILED'; exit 1 ;;
          esac
          if ! iam_token="$(jq -er '.access_token | select(type == "string" and length > 0)' "$tmp/iam.json" 2>/dev/null)"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_WIF_EXCHANGE_FAILED'
            exit 1
          fi
          echo "::add-mask::${iam_token}"
          printf 'YC_IAM_TOKEN=%s\n' "$iam_token" >> "$GITHUB_ENV"

      - name: Fail closed if dedicated provider boundary is unsafe
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-provider"
          mkdir -p "$tmp"

          yc serverless function get --name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/function.json" 2>"$tmp/function.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_RESOLUTION_FAILED'; exit 1;
            }
          function_id="$(jq -er '.id | select(type == "string" and length > 0)' "$tmp/function.json")"

          yc serverless function list-access-bindings --id "$function_id" \
            --format json --retry 0 --no-user-output >"$tmp/bindings.json" 2>"$tmp/bindings.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_BINDINGS_READ_FAILED'; exit 1;
            }
          if jq -e '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject.id] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_PUBLIC'
            exit 1
          fi
          if ! jq -e --arg expected "$YC_WIF_SERVICE_ACCOUNT_ID" \
            '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject] | any(.type == "serviceAccount" and .id == $expected)' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_INVOKER_BINDING_MISSING'
            exit 1
          fi

          yc serverless trigger list --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/triggers.json" 2>"$tmp/triggers.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_TRIGGER_LIST_FAILED'; exit 1;
            }
          if jq -e --arg id "$function_id" '.. | strings | select(. == $id)' "$tmp/triggers.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_TRIGGER_PRESENT'
            exit 1
          fi

          runtime_sa_json="$(yc iam service-account get --name "$RUNTIME_SERVICE_ACCOUNT_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output 2>"$tmp/runtime-sa.err")" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_RUNTIME_SA_RESOLUTION_FAILED'; exit 1;
            }
          runtime_sa_id="$(jq -er '.id | select(type == "string" and length > 0)' <<<"$runtime_sa_json")"

          echo "::add-mask::${YC_LOCKBOX_SECRET_ID}"
          if ! secret_http="$(curl --silent --show-error \
            --output "$tmp/secret.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            "https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${YC_LOCKBOX_SECRET_ID}" \
            2>"$tmp/secret.err")"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_REST_TRANSPORT_FAILED'
            exit 1
          fi
          case "$secret_http" in
            2??) ;;
            401) echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_REST_AUTH_FAILED'; exit 1 ;;
            403) echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_REST_PERMISSION_DENIED'; exit 1 ;;
            404) echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_REST_NOT_FOUND'; exit 1 ;;
            *) echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_REST_UNEXPECTED_STATUS'; exit 1 ;;
          esac
          if ! jq -e \
            --arg expected_id "$YC_LOCKBOX_SECRET_ID" \
            --arg expected_name "$LOCKBOX_SECRET_NAME" \
            --arg expected_folder_id "$YC_FOLDER_ID" \
            '(.id == $expected_id) and (.name == $expected_name) and (.folderId == $expected_folder_id) and (.status == "ACTIVE")' \
            "$tmp/secret.json" >/dev/null 2>&1; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_SECRET_METADATA_INVALID'
            exit 1
          fi
          secret_version_id="$(jq -er '.currentVersion.id | select(type == "string" and length > 0)' "$tmp/secret.json")" || {
            echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_VERSION_RESOLUTION_FAILED'
            exit 1
          }

          echo "::add-mask::${function_id}"
          echo "::add-mask::${runtime_sa_id}"
          echo "::add-mask::${secret_version_id}"
          {
            printf 'PRIHRASH_YC_FUNCTION_ID=%s\n' "$function_id"
            printf 'PRIHRASH_YC_FUNCTION_SA_ID=%s\n' "$runtime_sa_id"
            printf 'PRIHRASH_LOCKBOX_VERSION_ID=%s\n' "$secret_version_id"
          } >> "$GITHUB_ENV"

      - name: Re-verify exact current main before recovery deployment
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -er '.commit.sha')"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_MAIN_MOVED_BEFORE_DEPLOY'
            exit 1
          fi

      - name: Deploy recovery-only Function version
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-deploy"
          mkdir -p "$tmp"
          if ! yc serverless function version create \
            --function-id "$PRIHRASH_YC_FUNCTION_ID" \
            --runtime nodejs22 \
            --entrypoint index.initialBootstrapRecoveryHandler \
            --memory 1g \
            --execution-timeout 150s \
            --environment "PRIHRASH_R1_RECOVERY_SURFACE_ONLY=${RECOVERY_SURFACE_ONLY}" \
            --environment "PRIHRASH_R1_RECOVERY_CONTROLLED_PREPARATION_ONLY=${RECOVERY_CONTROLLED_PREPARATION_ONLY}" \
            --source-path .artifacts/yandex-initial-bootstrap-recovery-function \
            --service-account-id "$PRIHRASH_YC_FUNCTION_SA_ID" \
            --tags r1-initial-bootstrap-recovery \
            --metadata-options gce-http-endpoint=enabled,aws-v1-http-endpoint=disabled \
            --no-logging \
            --secret "environment-variable=PRIHRASH_GOOGLE_SPREADSHEET_ID,id=${YC_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_spreadsheet_id" \
            --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_EMAIL,id=${YC_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_service_account_email" \
            --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY,id=${YC_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_service_account_private_key" \
            --secret "environment-variable=PRIHRASH_YDB_CONNECTION_STRING,id=${YC_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=ydb_connection_string" \
            --secret "environment-variable=PRIHRASH_INITIAL_BOOTSTRAP_PRIVATE_HISTORICAL_EVIDENCE,id=${YC_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=initial_bootstrap_private_historical_evidence" \
            --format json --retry 0 --no-user-output >"$tmp/version.json" 2>"$tmp/version.err"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_DEPLOY_FAILED'
            exit 1
          fi

      - name: Re-verify private trigger-free recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-postflight"
          mkdir -p "$tmp"
          yc serverless function list-access-bindings --id "$PRIHRASH_YC_FUNCTION_ID" \
            --format json --retry 0 --no-user-output >"$tmp/bindings.json" 2>"$tmp/bindings.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_BINDINGS_READ_FAILED'; exit 1;
            }
          if jq -e '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject.id] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_PUBLIC'
            exit 1
          fi
          if ! jq -e --arg expected "$YC_WIF_SERVICE_ACCOUNT_ID" \
            '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject] | any(.type == "serviceAccount" and .id == $expected)' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_INVOKER_BINDING_MISSING'
            exit 1
          fi
          yc serverless trigger list --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/triggers.json" 2>"$tmp/triggers.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_TRIGGER_LIST_FAILED'; exit 1;
            }
          if jq -e --arg id "$PRIHRASH_YC_FUNCTION_ID" '.. | strings | select(. == $id)' "$tmp/triggers.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_TRIGGER_PRESENT'
            exit 1
          fi

      - name: Re-assert exact current main before read-only recovery invoke
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -er '.commit.sha')"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_MAIN_MOVED_BEFORE_INVOKE'
            exit 1
          fi

      - name: Invoke exact read-only recovery tag once
        shell: bash
        run: |
          set -euo pipefail
          export PRIHRASH_YANDEX_INITIAL_BOOTSTRAP_FUNCTION_ID="$PRIHRASH_YC_FUNCTION_ID"
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-invoke.log"
          evidence_dir="$RUNNER_TEMP/r1-initial-bootstrap-recovery-evidence"
          mkdir -p "$evidence_dir"
          diagnostics="$RUNNER_TEMP/r1-recovery-diagnostics.log"
          npm run initial-bootstrap-recovery:invoke 2> "$diagnostics" | tee "$tmp"
          cat "$diagnostics" >&2
          tail -n 1 "$tmp" | jq -c -e '
            select(
              type == "object"
              and (keys | sort) == ["code", "reason", "status", "verdict"]
              and .status == "PASS"
              and .code == "INITIAL_BOOTSTRAP_RECOVERY_CLASSIFIED"
            )
          ' > "$evidence_dir/classification.json" || {
            echo 'INITIAL_BOOTSTRAP_RECOVERY_EVIDENCE_INVALID'
            exit 1
          }
          if jq -e '.reason == "VALIDATED_CURRENT_EMPTY_STAGING_NONEMPTY"' "$evidence_dir/classification.json" >/dev/null; then
            source_evidence="$(sed -n 's/^R1_VALIDATED_SOURCE_EVIDENCE=//p' "$diagnostics")"
            gate_blocker="$(sed -n 's/^R1_STALE_VALIDATED_GATE_BLOCKER=//p' "$diagnostics")"
            case "$source_evidence" in
              AUTHORITATIVE_SNAPSHOT_MATCH|AUTHORITATIVE_SNAPSHOT_DIGEST_MISMATCH|AUTHORITATIVE_SNAPSHOT_PREFIX_PRESERVED|AUTHORITATIVE_SNAPSHOT_INSERTIONS_ONLY|AUTHORITATIVE_ROW_COUNT_MISMATCH|AUTHORITATIVE_BINDING_MISMATCH|VALIDATED_METADATA_INVALID|VALIDATED_SOURCE_DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_VALIDATED_SOURCE_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$gate_blocker" in
              COMMITTED_BASELINE_PRESENT|VALIDATED_RUN_NOT_UNIQUE|VALIDATED_RUN_METADATA_INVALID|SOURCE_DRIFT_NOT_PROVEN|HISTORICAL_CONTEXT_NOT_PROVEN|CURRENT_STATE_NOT_EMPTY|STAGING_CANDIDATE_NOT_EXACT|SWAP_NOT_PROVEN_NOT_APPLIED|IN_FLIGHT_PROVIDER_MUTATION_UNKNOWN|SINGLE_WRITER_EXCLUSION_NOT_PROVEN) ;;
              *) echo INITIAL_BOOTSTRAP_STALE_VALIDATED_GATE_BLOCKER_INVALID; exit 1 ;;
            esac
            jq -cn --arg evidence "$source_evidence" '{validatedSourceEvidence:$evidence}' > "$evidence_dir/validated-source.json"
            jq -cn --arg blocker "$gate_blocker" '{staleValidatedRecoveryGate:{status:"BLOCKED",blocker:$blocker}}' > "$evidence_dir/gate-a.json"
            cat "$evidence_dir/validated-source.json"
            cat "$evidence_dir/gate-a.json"
          fi
          if [ "$RECOVERY_CONTROLLED_PREPARATION_ONLY" = "1" ]; then
            prep_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_EVIDENCE=//p' "$diagnostics")"
            retry_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_RETRY_EVIDENCE=//p' "$diagnostics")"
            query_error_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_QUERY_ERROR_EVIDENCE=//p' "$diagnostics")"
            grpc_status_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_GRPC_STATUS_EVIDENCE=//p' "$diagnostics")"
            phase_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_PHASE_EVIDENCE=//p' "$diagnostics")"
            metadata_scan_cost_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_METADATA_SCAN_COST_EVIDENCE=//p' "$diagnostics")"
            reference_read_stage_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_REFERENCE_READ_STAGE_EVIDENCE=//p' "$diagnostics")"
            reconciliation_read_stage_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_RECONCILIATION_READ_STAGE_EVIDENCE=//p' "$diagnostics")"
            case "$prep_evidence" in
              READY|BASELINE_EXISTS|VALIDATION_BLOCKED|YDB_QUERY_TIMEOUT|YDB_DATA_SDK_SHAPE_INVALID|YDB_DATA_PARAMETER_VALUE_INVALID|YDB_DATA_PARAMETER_TYPE_UNSUPPORTED|YDB_DATA_TIMESTAMP_PRECISION_UNSUPPORTED|YDB_DATA_QUERY_EXECUTION_FAILED|YDB_DATA_QUERY_EXECUTION_YDB_BAD_REQUEST|YDB_DATA_QUERY_EXECUTION_YDB_UNAUTHORIZED|YDB_DATA_QUERY_EXECUTION_YDB_INTERNAL_ERROR|YDB_DATA_QUERY_EXECUTION_YDB_ABORTED|YDB_DATA_QUERY_EXECUTION_YDB_UNAVAILABLE|YDB_DATA_QUERY_EXECUTION_YDB_OVERLOADED|YDB_DATA_QUERY_EXECUTION_YDB_SCHEME_ERROR|YDB_DATA_QUERY_EXECUTION_YDB_GENERIC_ERROR|YDB_DATA_QUERY_EXECUTION_YDB_BAD_SESSION|YDB_DATA_QUERY_EXECUTION_YDB_PRECONDITION_FAILED|YDB_DATA_QUERY_EXECUTION_YDB_ALREADY_EXISTS|YDB_DATA_QUERY_EXECUTION_YDB_NOT_FOUND|YDB_DATA_QUERY_EXECUTION_YDB_SESSION_EXPIRED|YDB_DATA_QUERY_EXECUTION_YDB_CANCELLED|YDB_DATA_QUERY_EXECUTION_YDB_UNDETERMINED|YDB_DATA_QUERY_EXECUTION_YDB_UNSUPPORTED|YDB_DATA_QUERY_EXECUTION_YDB_SESSION_BUSY|YDB_DATA_QUERY_EXECUTION_YDB_EXTERNAL_ERROR|YDB_DATA_CLIENT_CONFIG_INVALID|DURABLE_RECONCILIATION_FAILURE|REVISION_EVIDENCE_FAILURE|PRIVATE_EVIDENCE_FAILURE|APPLICATION_MULTIPLE_INCOMPLETE_RUNS|APPLICATION_BOOTSTRAP_OBSERVATION_INVALID|APPLICATION_RESUME_RUN_COUNTERS_MISMATCH|APPLICATION_RESUME_COUNTER_REFINEMENT_CONFLICT|APPLICATION_SNAPSHOT_EVIDENCE_MISSING|APPLICATION_SNAPSHOT_EVIDENCE_AMBIGUOUS|APPLICATION_SNAPSHOT_EVIDENCE_MISMATCH|APPLICATION_CURRENT_STATE_NOT_EMPTY|APPLICATION_PROMOTION_PREFLIGHT_DRIFT|APPLICATION_CONTROLLED_CONTINUATION_RUN_MISSING|APPLICATION_CONTROLLED_CONTINUATION_RUN_STATE_INVALID|APPLICATION_CONTROLLED_CONTINUATION_ROUTE_NOT_REQUIRED|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$retry_evidence" in
              UNOBSERVED|NO_RETRY|RETRIED|NON_RETRYABLE|EXHAUSTED|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_RETRY_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$query_error_evidence" in
              UNOBSERVED|ABORT_TIMEOUT|YDB_STATUS|GRPC_STATUS|CLIENT_ERROR|OTHER|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_QUERY_ERROR_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$grpc_status_evidence" in
              UNOBSERVED|CANCELLED|UNKNOWN|INVALID_ARGUMENT|DEADLINE_EXCEEDED|NOT_FOUND|ALREADY_EXISTS|PERMISSION_DENIED|RESOURCE_EXHAUSTED|FAILED_PRECONDITION|ABORTED|OUT_OF_RANGE|UNIMPLEMENTED|INTERNAL|UNAVAILABLE|DATA_LOSS|UNAUTHENTICATED|NON_GRPC|UNRECOGNIZED|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_GRPC_STATUS_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$phase_evidence" in
              UNOBSERVED|ADMISSION_READ|CURRENT_STATE_PREFLIGHT|FRESH_CONTEXT_PREPARATION|FRESH_METADATA_PREPARATION|FRESH_CLAIM_WRITE|RESUME_CONTEXT_READ|RESUME_IDENTITY_MANIFEST_READ|RESUME_SNAPSHOT_READ|RESUME_CONTEXT_PREPARATION|REVISION_EVIDENCE_PREPARATION|REVISION_EVIDENCE_WRITE|LINEAGE_PREPARATION|COUNTER_REFINEMENT_PREPARATION|COUNTER_REFINEMENT_WRITE|RECONCILIATION_READ|VALIDATION_EVALUATION|CURRENT_PLAN_PREPARATION|CURRENT_WRITE_PREPARATION|PRE_PROMOTION_PREFLIGHT|VALIDATION_WRITE_PREPARATION|VALIDATION_TRANSITION_WRITE|PROMOTION_WRITE|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_PHASE_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$metadata_scan_cost_evidence" in
              UNOBSERVED|LT_10_RU|GE_10_LT_3000_RU|GE_3000_RU|STATS_UNAVAILABLE|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_METADATA_SCAN_COST_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$reference_read_stage_evidence" in
              UNOBSERVED|ACCOUNTS_READ|CATEGORIES_READ|VIKA_MEMBER_READ|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_REFERENCE_READ_STAGE_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$reconciliation_read_stage_evidence" in
              UNOBSERVED|REVISION_METADATA_SCAN|REVISION_PAYLOAD_BATCH|REVISION_COLLISION_READ|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_RECONCILIATION_READ_STAGE_EVIDENCE_INVALID; exit 1 ;;
            esac
            jq -cn --arg evidence "$prep_evidence" '{stagingControlledPreparationEvidence:$evidence}' > "$evidence_dir/controlled-preparation.json"
            jq -cn --arg evidence "$retry_evidence" '{stagingControlledPreparationRetryEvidence:$evidence}' > "$evidence_dir/controlled-preparation-retry.json"
            jq -cn --arg evidence "$query_error_evidence" '{stagingControlledPreparationQueryErrorEvidence:$evidence}' > "$evidence_dir/controlled-preparation-query-error.json"
            jq -cn --arg evidence "$grpc_status_evidence" '{stagingControlledPreparationGrpcStatusEvidence:$evidence}' > "$evidence_dir/controlled-preparation-grpc-status.json"
            jq -cn --arg evidence "$phase_evidence" '{stagingControlledPreparationPhaseEvidence:$evidence}' > "$evidence_dir/controlled-preparation-phase.json"
            jq -cn --arg evidence "$metadata_scan_cost_evidence" '{stagingControlledPreparationMetadataScanCostEvidence:$evidence}' > "$evidence_dir/controlled-preparation-metadata-scan-cost.json"
            jq -cn --arg evidence "$reference_read_stage_evidence" '{stagingControlledPreparationReferenceReadStageEvidence:$evidence}' > "$evidence_dir/controlled-preparation-reference-read-stage.json"
            jq -cn --arg evidence "$reconciliation_read_stage_evidence" '{stagingControlledPreparationReconciliationReadStageEvidence:$evidence}' > "$evidence_dir/controlled-preparation-reconciliation-read-stage.json"
            cat "$evidence_dir/controlled-preparation.json"
            cat "$evidence_dir/controlled-preparation-retry.json"
            cat "$evidence_dir/controlled-preparation-query-error.json"
            cat "$evidence_dir/controlled-preparation-grpc-status.json"
            cat "$evidence_dir/controlled-preparation-phase.json"
            cat "$evidence_dir/controlled-preparation-metadata-scan-cost.json"
            cat "$evidence_dir/controlled-preparation-reference-read-stage.json"
            cat "$evidence_dir/controlled-preparation-reconciliation-read-stage.json"
          fi
          rm -f "$tmp" "$diagnostics"

      - name: Publish enum-only recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-initial-bootstrap-recovery-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/r1-initial-bootstrap-recovery-evidence/*.json
          if-no-files-found: error
          retention-days: 30
