name: R1 initial bootstrap recovery

on:
  workflow_dispatch:
    inputs:
      surface_only:
        description: Classify durable surface only, without staging diagnostics
        required: false
        type: boolean
        default: false
      controlled_preparation_only:
        description: Re-run controlled preparation read-only under the exact controlled YDB timeout envelope
        required: false
        type: boolean
        default: false
      staging_revision_cardinality_only:
        description: Read only the bounded coarse STAGING revision-cardinality bucket
        required: false
        type: boolean
        default: false
      causal_bootstrap_run_id:
        description: Optional exact failed bootstrap child run whose start time bounds STAGING lineage evidence
        required: false
        type: string
        default: ''
      reuse_deploy_attempt_run_id:
        description: Exact successful create-only recovery deployment to reuse without creating another Function version
        required: false
        type: string
        default: ''
      reuse_failed_recovery_run_id:
        description: Exact latest failed recovery run that authorized the reused create-only version
        required: false
        type: string
        default: ''
      reuse_source_pr_number:
        description: Exact merged R1 PR authorizing the read-only reuse probe
        required: false
        type: string
        default: ''
      audit_source_permission_probe:
        description: Allow one exact-scope temporary read-only source-binding classification for this reuse
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: r1-initial-bootstrap-writer
  cancel-in-progress: false

jobs:
  initial-bootstrap-recovery:
    if: github.repository == 'kmephis-ai/PrihRash' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FUNCTION_NAME: prihrash-r1-initial-bootstrap
      RECOVERY_SURFACE_ONLY: ${{ inputs.surface_only && '1' || '0' }}
      RECOVERY_CONTROLLED_PREPARATION_ONLY: ${{ inputs.controlled_preparation_only && '1' || '0' }}
      RECOVERY_REVISION_CARDINALITY_ONLY: ${{ inputs.staging_revision_cardinality_only && '1' || '0' }}
      CAUSAL_BOOTSTRAP_RUN_ID: ${{ inputs.causal_bootstrap_run_id }}
      REUSE_DEPLOY_ATTEMPT_RUN_ID: ${{ inputs.reuse_deploy_attempt_run_id }}
      REUSE_FAILED_RECOVERY_RUN_ID: ${{ inputs.reuse_failed_recovery_run_id }}
      REUSE_SOURCE_PR_NUMBER: ${{ inputs.reuse_source_pr_number }}
      AUDIT_SOURCE_PERMISSION_PROBE: ${{ inputs.audit_source_permission_probe && '1' || '0' }}
      RUNTIME_SERVICE_ACCOUNT_NAME: prihrash-initial-bootstrap
      LOCKBOX_SECRET_NAME: prihrash-r1-initial-bootstrap
      OIDC_AUDIENCE: https://github.com/kmephis-ai
      OIDC_ISSUER: https://token.actions.githubusercontent.com
      OIDC_SUBJECT: repo:kmephis-ai@310519475/PrihRash@1359286840:ref:refs/heads/main
      YC_FOLDER_ID: ${{ secrets.YC_R1_FOLDER_ID }}
      YC_CLOUD_ID: ${{ secrets.YC_R1_CLOUD_ID }}
      YC_WIF_SERVICE_ACCOUNT_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_WIF_SERVICE_ACCOUNT_ID }}
      YC_LOCKBOX_SECRET_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_LOCKBOX_SECRET_ID }}

    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify immutable recovery source boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_REPOSITORY" = 'kmephis-ai/PrihRash'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$YC_FOLDER_ID"
          test -n "$YC_WIF_SERVICE_ACCOUNT_ID"
          test -n "$YC_LOCKBOX_SECRET_ID"
          recovery_mode_count=$((RECOVERY_SURFACE_ONLY + RECOVERY_CONTROLLED_PREPARATION_ONLY + RECOVERY_REVISION_CARDINALITY_ONLY))
          reuse_field_count=0
          [ -n "$REUSE_DEPLOY_ATTEMPT_RUN_ID" ] && reuse_field_count=$((reuse_field_count + 1))
          [ -n "$REUSE_FAILED_RECOVERY_RUN_ID" ] && reuse_field_count=$((reuse_field_count + 1))
          [ -n "$REUSE_SOURCE_PR_NUMBER" ] && reuse_field_count=$((reuse_field_count + 1))
          if [ "$reuse_field_count" -ne 0 ] && [ "$reuse_field_count" -ne 3 ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_INPUT_INCOMPLETE'; exit 1
          fi
          if [ "$reuse_field_count" -eq 3 ] && { [ "$recovery_mode_count" -ne 0 ] || [ -n "$CAUSAL_BOOTSTRAP_RUN_ID" ]; }; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_MODE_CONFLICT'; exit 1
          fi
          if [ "$reuse_field_count" -eq 3 ] && [ -z "$YC_CLOUD_ID" ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_AUDIT_CLOUD_ID_MISSING'; exit 1
          fi
          if [ "$AUDIT_SOURCE_PERMISSION_PROBE" = '1' ] && [ "$reuse_field_count" -ne 3 ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_AUDIT_SOURCE_PERMISSION_INPUT_INCOMPLETE'; exit 1
          fi
          if [ -n "$REUSE_DEPLOY_ATTEMPT_RUN_ID" ]; then
            [[ "$REUSE_DEPLOY_ATTEMPT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_RUN_ID_INVALID'; exit 1; }
            [[ "$REUSE_FAILED_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_FAILED_RUN_ID_INVALID'; exit 1; }
            [[ "$REUSE_SOURCE_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_PR_NUMBER_INVALID'; exit 1; }
          fi
          if [ "$recovery_mode_count" -gt 1 ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_MODE_CONFLICT'
            exit 1
          fi
          if [ -n "$CAUSAL_BOOTSTRAP_RUN_ID" ]; then
            [[ "$CAUSAL_BOOTSTRAP_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_CAUSAL_RUN_ID_INVALID'
              exit 1
            }
            if [ "$recovery_mode_count" -ne 0 ]; then
              echo 'INITIAL_BOOTSTRAP_RECOVERY_CAUSAL_LINEAGE_MODE_CONFLICT'
              exit 1
            fi
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact-source invoke dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Restore verified exact-source artifact
        uses: ./.github/actions/restore-exact-source
        with:
          source-sha: ${{ github.sha }}
          github-token: ${{ github.token }}

      - name: Require exact current main and dynamically proven failed bootstrap attempt
        id: recovery_prerequisites
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          CAUSAL_BOOTSTRAP_RUN_ID: ${{ inputs.causal_bootstrap_run_id }}
          REUSE_DEPLOY_ATTEMPT_RUN_ID: ${{ inputs.reuse_deploy_attempt_run_id }}
          REUSE_FAILED_RECOVERY_RUN_ID: ${{ inputs.reuse_failed_recovery_run_id }}
          REUSE_SOURCE_PR_NUMBER: ${{ inputs.reuse_source_pr_number }}
          AUDIT_SOURCE_PERMISSION_PROBE: ${{ inputs.audit_source_permission_probe && '1' || '0' }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-gates"
          mkdir -p "$tmp"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"

          curl --fail --silent --show-error --header "$auth_header" \
            --header 'Accept: application/vnd.github+json' \
            "$api/branches/main" --output "$tmp/main.json" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_MAIN_GATE_READ_FAILED'
              exit 1
            }
          if ! jq -e --arg sha "$GITHUB_SHA" '.commit.sha == $sha and .protected == true' \
            "$tmp/main.json" >/dev/null 2>&1; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_MAIN_GATE_NOT_READY'
            exit 1
          fi

          curl --fail --silent --show-error --header "$auth_header" \
            --header 'Accept: application/vnd.github+json' \
            "$api/actions/workflows/r1-initial-shadow-bootstrap.yml/runs?branch=main&event=workflow_dispatch&status=failure&per_page=100" \
            --output "$tmp/bootstrap-runs.json" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_BOOTSTRAP_HISTORY_READ_FAILED'
              exit 1
            }
          if ! target="$(jq -cer '
            [.workflow_runs[] | select(
              .name == "R1 initial shadow bootstrap"
              and .head_branch == "main"
              and .event == "workflow_dispatch"
              and .conclusion == "failure"
              and (.id | type == "number")
              and (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
              and (.created_at | type == "string")
            )]
            | sort_by(.created_at, .id)
            | reverse
            | if length > 0 then .[0] else empty end
          ' "$tmp/bootstrap-runs.json")" || [ -z "$target" ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FAILED_ATTEMPT_MISSING'
            exit 1
          fi
          selected_run_id="$(jq -er '.id' <<<"$target")"
          selected_run_sha="$(jq -er '.head_sha' <<<"$target")"
          if [ -n "$CAUSAL_BOOTSTRAP_RUN_ID" ] && [ "$CAUSAL_BOOTSTRAP_RUN_ID" != "$selected_run_id" ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_CAUSAL_RUN_NOT_LATEST_FAILED_CHILD'
            exit 1
          fi

          curl --fail --silent --show-error --header "$auth_header" \
            --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs/${selected_run_id}" \
            --output "$tmp/bootstrap-run.json" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_BOOTSTRAP_RUN_READ_FAILED'
              exit 1
            }
          if ! jq -e \
            --argjson expected_id "$selected_run_id" \
            --arg expected_sha "$selected_run_sha" \
            '.id == $expected_id
              and .name == "R1 initial shadow bootstrap"
              and .head_sha == $expected_sha
              and .head_branch == "main"
              and .event == "workflow_dispatch"
              and .conclusion == "failure"' \
            "$tmp/bootstrap-run.json" >/dev/null 2>&1; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FAILED_ATTEMPT_MISSING'
            exit 1
          fi
          if [ -n "$CAUSAL_BOOTSTRAP_RUN_ID" ]; then
            selected_run_started_at="$(jq -er '.run_started_at | select(type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]{3})?Z$"))' "$tmp/bootstrap-run.json")" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_CAUSAL_RUN_START_TIME_INVALID'
              exit 1
            }
            printf 'causal_bootstrap_started_at=%s\n' "$selected_run_started_at" >> "$GITHUB_OUTPUT"
          fi

          curl --fail --silent --show-error --header "$auth_header" \
            --header 'Accept: application/vnd.github+json' \
            "$api/actions/runs/${selected_run_id}/jobs?filter=latest&per_page=100" \
            --output "$tmp/bootstrap-jobs.json" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_BOOTSTRAP_RUN_READ_FAILED'
              exit 1
            }
          if ! jq -e '
            [.jobs[] | select(.name == "initial-shadow-bootstrap")] as $jobs
            | ($jobs | length) == 1
            and ([
              $jobs[0].steps[]? | select(
                .name == "Invoke exact initial bootstrap tag once"
                and .conclusion == "failure"
              )
            ] | length) == 1
          ' "$tmp/bootstrap-jobs.json" >/dev/null 2>&1; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_INVOKE_FAILURE_NOT_PROVEN'
            exit 1
          fi

          if [ -n "$REUSE_DEPLOY_ATTEMPT_RUN_ID" ]; then
            [[ "$REUSE_DEPLOY_ATTEMPT_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_RUN_ID_INVALID'; exit 1;
            }
            [[ "$REUSE_FAILED_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_FAILED_RUN_ID_INVALID'; exit 1;
            }
            [[ "$REUSE_SOURCE_PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_PR_NUMBER_INVALID'; exit 1;
            }

            source_failed_run="$(curl --fail --silent --show-error --header "$auth_header" \
              --header 'Accept: application/vnd.github+json' "$api/actions/runs/${REUSE_FAILED_RECOVERY_RUN_ID}")" || {
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_FAILED_RUN_READ_FAILED'; exit 1;
              }
            if ! jq -e --argjson id "$REUSE_FAILED_RECOVERY_RUN_ID" '[. | select(
              .id == $id and .name == "R1 initial bootstrap recovery" and .head_branch == "main"
              and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "failure"
              and (.workflow_id | type == "number")
              and (.created_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
              and (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
            )] | length == 1' <<<"$source_failed_run" >/dev/null; then
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_FAILED_RUN_NOT_EXACT'; exit 1;
            fi
            source_workflow_id="$(jq -er '.workflow_id' <<<"$source_failed_run")"
            source_failed_sha="$(jq -er '.head_sha' <<<"$source_failed_run")"
            source_failed_created_at="$(jq -er '.created_at' <<<"$source_failed_run")"
            [ "$source_failed_sha" != "$GITHUB_SHA" ] || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_FAILED_RUN_SAME_SHA'; exit 1;
            }
            source_failed_jobs="$(curl --fail --silent --show-error --header "$auth_header" \
              --header 'Accept: application/vnd.github+json' \
              "$api/actions/runs/${REUSE_FAILED_RECOVERY_RUN_ID}/jobs?filter=latest&per_page=100")"
            if ! jq -e '
              [.jobs[] | select(.name == "initial-bootstrap-recovery")] as $jobs
              | ($jobs | length) == 1
              and $jobs[0].conclusion == "failure"
              and (
                ([$jobs[0].steps[]? | select(.name == "Verify exact accepted recovery Function version for reuse")] | length) == 0
                or (([$jobs[0].steps[]? | select(.name == "Verify exact accepted recovery Function version for reuse")] | length) == 1
                  and ([$jobs[0].steps[]? | select(.name == "Verify exact accepted recovery Function version for reuse" and .conclusion == "skipped")] | length) == 1)
              )
              and ([$jobs[0].steps[]? | select(.name == "Deploy recovery-only Function version" and .conclusion == "failure")] | length) == 1
              and ([$jobs[0].steps[]? | select(.name == "Invoke exact read-only recovery tag once" and .conclusion == "skipped")] | length) == 1
            ' <<<"$source_failed_jobs" >/dev/null; then
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_FAILED_PHASE_NOT_PROVEN'; exit 1;
            fi

            recovery_history="$(curl --fail --silent --show-error --get --header "$auth_header" \
              --header 'Accept: application/vnd.github+json' \
              "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs" \
              --data-urlencode 'branch=main' --data-urlencode 'event=workflow_dispatch' \
              --data-urlencode "created=${source_failed_created_at}..*" \
              --data-urlencode 'sort=created' --data-urlencode 'direction=desc' \
              --data-urlencode 'per_page=2')"
            if ! jq -e --argjson self "$GITHUB_RUN_ID" '
              (.total_count | type == "number" and . >= 2)
              and (.workflow_runs | length == 2)
              and .workflow_runs[0].id == $self
              and ([.workflow_runs[] | select(.id == $self)] | length) == 1
              and ([.workflow_runs[] | select(.id != $self)] | length) == 1
            ' <<<"$recovery_history" >/dev/null; then
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_RECOVERY_HISTORY_INCOMPLETE'; exit 1;
            fi
            latest_history_decision="$(jq -r --arg created "$source_failed_created_at" --argjson id "$REUSE_FAILED_RECOVERY_RUN_ID" '
              .workflow_runs[1] as $latest
              | if ($latest.created_at | type) != "string"
                  or ($latest.created_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") | not)
                  or ($latest.id | type) != "number" then "UNCLASSIFIED"
                elif $latest.created_at > $created or ($latest.created_at == $created and $latest.id > $id)
                then ("NEWER:" + ($latest.id|tostring))
                elif $latest.id == $id and $latest.created_at == $created then "SOURCE_ONLY"
                else "UNCLASSIFIED" end
            ' <<<"$recovery_history")"
            newer_run_id=''
            case "$latest_history_decision" in
              SOURCE_ONLY) ;;
              NEWER:*) newer_run_id="${latest_history_decision#NEWER:}" ;;
              *) echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_RECOVERY_HISTORY_INCOMPLETE'; exit 1 ;;
            esac
            if [ -n "$newer_run_id" ]; then
              newer_run="$(curl --fail --silent --show-error --header "$auth_header" \
                --header 'Accept: application/vnd.github+json' "$api/actions/runs/${newer_run_id}")" || {
                  echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_INTERVENING_RUN_READ_FAILED'; exit 1;
                }
              if ! jq -e --argjson id "$newer_run_id" --argjson workflow_id "$source_workflow_id" \
                --arg current_sha "$GITHUB_SHA" --arg source_sha "$source_failed_sha" \
                --arg source_created "$source_failed_created_at" --argjson source_id "$REUSE_FAILED_RECOVERY_RUN_ID" '
                .id == $id and .workflow_id == $workflow_id and .name == "R1 initial bootstrap recovery"
                and .head_branch == "main" and .event == "workflow_dispatch"
                and .status == "completed" and .conclusion == "failure"
                and (.created_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
                and (.created_at > $source_created or (.created_at == $source_created and .id > $source_id))
                and .head_sha != $current_sha and .head_sha != $source_sha
                and (.head_sha | test("^[0-9a-f]{40}$"))
              ' <<<"$newer_run" >/dev/null; then
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_INTERVENING_RUN_NOT_EXACT'; exit 1;
              fi
              newer_jobs="$(curl --fail --silent --show-error --header "$auth_header" \
                --header 'Accept: application/vnd.github+json' \
                "$api/actions/runs/${newer_run_id}/jobs?filter=latest&per_page=100")"
              if ! jq -e '
                [.jobs[] | select(.name == "initial-bootstrap-recovery" and .conclusion == "failure"
                  and (
                    (([.steps[]? | select(.name == "Verify exact accepted recovery Function version for reuse" and .conclusion == "failure")] | length) == 1
                      and ([.steps[]? | select(.name == "Deploy recovery-only Function version" and .conclusion == "skipped")] | length) == 1)
                    or
                    (([.steps[]? | select(.name == "Verify exact accepted recovery Function version for reuse" and .conclusion == "skipped")] | length) == 1
                      and ([.steps[]? | select(.name == "Deploy recovery-only Function version" and .conclusion == "failure")] | length) == 1)
                  )
                  and ([.steps[]? | select(.name == "Invoke exact read-only recovery tag once" and .conclusion == "skipped")] | length) == 1)]
                | length == 1
              ' <<<"$newer_jobs" >/dev/null; then
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_INTERVENING_PHASE_NOT_PROVEN'; exit 1;
              fi
            fi

            current_source_pr="$(curl --fail --silent --show-error --header "$auth_header" \
              --header 'Accept: application/vnd.github+json' \
              "$api/pulls/${REUSE_SOURCE_PR_NUMBER}")" || {
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_PR_READ_FAILED'; exit 1;
              }
            if ! jq -e --argjson number "$REUSE_SOURCE_PR_NUMBER" --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .number == $number and .merged_at != null and .merge_commit_sha == $sha
              and .base.ref == "main" and .head.repo.full_name == $repo
              and (.title | test("^R1 #[1-9][0-9]*:"))
            ' <<<"$current_source_pr" >/dev/null; then
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_PR_NOT_EXACT'; exit 1;
            fi
            authorization_issue_number="$(jq -er '.title | capture("^R1 #(?<number>[1-9][0-9]*):").number' <<<"$current_source_pr")"
            authorization_issue_state="$(curl --fail --silent --show-error --header "$auth_header" \
              --header 'Accept: application/vnd.github+json' \
              "$api/issues/${authorization_issue_number}" | jq -er '.state')" || {
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_ISSUE_READ_FAILED'; exit 1;
              }
            [ "$authorization_issue_state" = 'open' ] || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_ISSUE_INACTIVE'; exit 1;
            }
            source_pr_body="$(jq -r '.body // ""' <<<"$current_source_pr")"
            source_pr_marker="$(jq -Rn --arg body "$source_pr_body" --arg failed_id "$REUSE_FAILED_RECOVERY_RUN_ID" --arg version_id "$REUSE_DEPLOY_ATTEMPT_RUN_ID" --arg permission_probe "$AUDIT_SOURCE_PERMISSION_PROBE" '
              def exact_line($prefix): ($body | split("\n") | map(select(startswith($prefix))));
              (exact_line("Provider-Attempt: ")) as $attempt
              | (exact_line("Recovery-Probe: ")) as $probe
              | (exact_line("Expected-Transition: ")) as $expected
              | (exact_line("Recovery-State: ")) as $state
              | (exact_line("Recovery-Run-ID: ")) as $failed_run
              | (exact_line("Recovery-Version-Run-ID: ")) as $version_run
              | (exact_line("Recovery-Classification-Run-ID: ")) as $classification_run
              | (exact_line("Observed-Signature: ")) as $observed
              | (exact_line("Circuit-Rearm: ")) as $rearm
              | (exact_line("Authority-Scope: ")) as $authority
              | (exact_line("Regression-Test: ")) as $test
              | {
                valid: (
                ($permission_probe == "1"
                  and $attempt == ["Provider-Attempt: READY"]
                  and ($probe | length) == 0
                  and $expected == ["Expected-Transition: TEMPORARY_AUDIT_SOURCE_READ_AND_CLASSIFY"]
                   and $state == ["Recovery-State: STAGING_PRESENT_UNCLASSIFIED"]
                   and $failed_run == [("Recovery-Run-ID: " + $failed_id)]
                   and $version_run == [("Recovery-Version-Run-ID: " + $version_id)]
                   and (($classification_run | length) == 0 or (($classification_run | length) == 1
                     and ($classification_run[0] | test("^Recovery-Classification-Run-ID: [1-9][0-9]*$"))))
                   and $observed == ["Observed-Signature: INITIAL_BOOTSTRAP_RECOVERY_REUSE/AUDIT_TRAIL_LIST_PERMISSION_DENIED/SOURCE_EVIDENCE_UNUSABLE"]
                  and $rearm == ["Circuit-Rearm: ROOT_CAUSE_FIX"]
                  and $authority == ["Authority-Scope: TEMPORARY_AUDIT_VIEWER_AT_EXACT_FOLDER_AND_LOGGING_READER_AT_EXACT_CLOUD_LOG_GROUP"]
                  and $test == ["Regression-Test: tests/tooling/r1-initial-bootstrap-recovery-autocontinue-workflow.test.mjs"])
                or
                ($permission_probe != "1"
                  and $attempt == ["Provider-Attempt: NOT_AUTHORIZED"]
                  and $probe == ["Recovery-Probe: READY"]
                  and $expected == ["Expected-Transition: READ_ONLY_EXACT_REVISION_CLASSIFICATION"]
                  and $state == ["Recovery-State: STAGING_PRESENT_UNCLASSIFIED"]
                   and $failed_run == [("Recovery-Run-ID: " + $failed_id)]
                   and $version_run == [("Recovery-Version-Run-ID: " + $version_id)]
                   and (($classification_run | length) == 0 or (($classification_run | length) == 1
                     and ($classification_run[0] | test("^Recovery-Classification-Run-ID: [1-9][0-9]*$"))))
                   and ($observed | length) == 0
                  and ($rearm | length) == 0
                  and ($authority | length) == 0
                  and $test == ["Regression-Test: tests/tooling/r1-initial-bootstrap-recovery-autocontinue-workflow.test.mjs"])
               )
                ,
                classificationRunId: (if ($classification_run | length) == 1
                  and ($classification_run[0] | test("^Recovery-Classification-Run-ID: ([1-9][0-9]*)$"))
                  then ($classification_run[0] | sub("^Recovery-Classification-Run-ID: "; "")) else null end)
              }
            ')"
            if [ "$(jq -r '.valid' <<<"$source_pr_marker")" != 'true' ]; then
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_SOURCE_PR_AUTHORITY_INVALID'; exit 1;
            fi
            source_classification_run_id="$(jq -r '.classificationRunId // ""' <<<"$source_pr_marker")"
            if [ -n "$source_classification_run_id" ] \
              && { [ -z "$newer_run_id" ] || [ "$newer_run_id" != "$source_classification_run_id" ]; }; then
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_CLASSIFICATION_RUN_NOT_LATEST_PREDECESSOR'; exit 1;
            fi

            reuse_attempts="$(curl --fail --silent --show-error --header "$auth_header" \
              --header 'Accept: application/vnd.github+json' \
              "$api/actions/workflows/r1-initial-bootstrap-recovery-deploy-attempt.yml/runs?branch=main&event=workflow_dispatch&per_page=100")" || {
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_HISTORY_READ_FAILED'; exit 1;
              }
            if [ "$(jq '.workflow_runs | length' <<<"$reuse_attempts")" -ge 100 ]; then
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_HISTORY_INCOMPLETE'; exit 1;
            fi
            printf '%s\n' "$reuse_attempts" > "$tmp/reuse-attempts.json"
            printf '{"jobsByRun":[]}\n' > "$tmp/reuse-attempt-jobs.json"
            reuse_source_workflow_id="$(jq -er --argjson id "$REUSE_DEPLOY_ATTEMPT_RUN_ID" '
              [.workflow_runs[] | select(.id == $id) | .workflow_id] | unique
              | if length == 1 and (.[0] | type == "number") then .[0] else empty end
            ' <<<"$reuse_attempts")" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_WORKFLOW_ID_UNPROVEN'; exit 1;
            }
            reuse_attempt_ids="$(jq -er --arg expected "R1 recovery-only deploy attempt for failed run ${REUSE_FAILED_RECOVERY_RUN_ID}" '
              [.workflow_runs[] | select(.head_branch == "main" and .event == "workflow_dispatch"
                and .display_title == $expected)]
              | sort_by(.created_at,.id) | .[].id
            ' <<<"$reuse_attempts")" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_HISTORY_INVALID'; exit 1;
            }
            while IFS= read -r attempt_id; do
              [ -n "$attempt_id" ] || continue
              attempt_jobs_path="$tmp/reuse-attempt-${attempt_id}-jobs.json"
              curl --fail --silent --show-error --header "$auth_header" \
                --header 'Accept: application/vnd.github+json' \
                "$api/actions/runs/${attempt_id}/jobs?filter=latest&per_page=100" \
                --output "$attempt_jobs_path" || {
                  echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_HISTORY_READ_FAILED'; exit 1;
                }
              jq --argjson run_id "$attempt_id" --slurpfile run_jobs "$attempt_jobs_path" \
                '.jobsByRun += [{runId:$run_id,jobs:$run_jobs[0]}]' \
                "$tmp/reuse-attempt-jobs.json" > "$tmp/reuse-attempt-jobs-next.json"
              mv "$tmp/reuse-attempt-jobs-next.json" "$tmp/reuse-attempt-jobs.json"
            done <<<"$reuse_attempt_ids"
            reuse_source_state="$(node scripts/classify-r1-recovery-deploy-attempt-history.mjs reuse-source \
              "$tmp/reuse-attempts.json" "$tmp/reuse-attempt-jobs.json" "$GITHUB_SHA" \
              "$REUSE_DEPLOY_ATTEMPT_RUN_ID" "$REUSE_FAILED_RECOVERY_RUN_ID" "$reuse_source_workflow_id")" || {
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_HISTORY_CLASSIFIER_FAILED'; exit 1;
              }
            [ "$reuse_source_state" = 'RECOVERY_VERSION_REUSE_SOURCE_PROVEN' ] || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_SOURCE_NOT_PROVEN'; exit 1;
            }
            reuse_source_run="$(curl --fail --silent --show-error --header "$auth_header" \
              --header 'Accept: application/vnd.github+json' \
              "$api/actions/runs/${REUSE_DEPLOY_ATTEMPT_RUN_ID}")" || {
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_SOURCE_RUN_READ_FAILED'; exit 1;
              }
            reuse_source_sha="$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' <<<"$reuse_source_run")"
            jq -e --argjson id "$REUSE_DEPLOY_ATTEMPT_RUN_ID" --argjson workflow_id "$reuse_source_workflow_id" \
              --arg expected "R1 recovery-only deploy attempt for failed run ${REUSE_FAILED_RECOVERY_RUN_ID}" '
              .id==$id and .workflow_id==$workflow_id
              and .head_branch=="main" and .event=="workflow_dispatch"
              and .status=="completed" and .conclusion=="success" and .display_title==$expected
              and (.run_started_at | type=="string") and (.updated_at | type=="string")
            ' <<<"$reuse_source_run" >/dev/null || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_SOURCE_RUN_NOT_EXACT'; exit 1;
            }
            reuse_source_prs="$(curl --fail --silent --show-error --header "$auth_header" \
              --header 'Accept: application/vnd.github+json' \
              "$api/commits/${reuse_source_sha}/pulls")" || {
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_SOURCE_PR_READ_FAILED'; exit 1;
              }
            reuse_source_pr="$(jq -cer --arg sha "$reuse_source_sha" --arg repo "$GITHUB_REPOSITORY" '
              [.[] | select(.merged_at!=null and .merge_commit_sha==$sha and .base.ref=="main"
                and .head.repo.full_name==$repo and (.title|startswith("R1 #453:")))]
              | if length==1 then .[0] else empty end
            ' <<<"$reuse_source_prs")" || {
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_SOURCE_PR_NOT_EXACT'; exit 1;
              }
            jq -e --argjson number "$(jq -er '.number' <<<"$reuse_source_pr")" \
              --arg sha "$reuse_source_sha" --argjson expected_run "$REUSE_FAILED_RECOVERY_RUN_ID" '
              (.body // "" | split("\n")) as $lines
              | (.number==$number and .merge_commit_sha==$sha
                and ([$lines[] | select(.=="Provider-Attempt: READY")]|length)==1
                and ([$lines[] | select(.=="Observed-Signature: INITIAL_BOOTSTRAP_RECOVERY_DEPLOY_FAILED")]|length)==1
                and ([$lines[] | select(.=="Expected-Transition: RECOVERY_ONLY_FUNCTION_VERSION_CREATE_CLASSIFIED")]|length)==1
                and ([$lines[] | select(.=="Recovery-State: DEPLOYMENT_OUTCOME_UNCLASSIFIED")]|length)==1
                and ([$lines[] | select(.=="Circuit-Rearm: OWNER_AUTHORIZED_SINGLE_RECOVERY_DEPLOY")]|length)==1
                and ([$lines[] | select(.==("Recovery-Run-ID: "+($expected_run|tostring))) ]|length)==1
                and ([$lines[] | select(.=="Regression-Test: tests/tooling/initial-bootstrap-recovery-deploy-attempt-workflow.test.mjs")]|length)==1)
            ' <<<"$reuse_source_pr" >/dev/null || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_SOURCE_MARKER_INVALID'; exit 1;
            }
            reuse_started_at="$(jq -er '.run_started_at' <<<"$reuse_source_run")"
            reuse_finished_at="$(jq -er '.updated_at' <<<"$reuse_source_run")"
            printf 'reuse_source_started_at=%s\nreuse_source_finished_at=%s\nreuse_source_sha=%s\n' \
              "$reuse_started_at" "$reuse_finished_at" "$reuse_source_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Yandex Cloud CLI
        shell: bash
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/yc"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/yc.tar.gz"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$install_dir"
          yc_bin="$(find "$install_dir" -type f -name yc -perm -u+x -print -quit)"
          test -n "$yc_bin"
          printf '%s\n' "$(dirname "$yc_bin")" >> "$GITHUB_PATH"
          "$yc_bin" version >/dev/null

      - name: Exchange GitHub OIDC token for short-lived Yandex IAM token
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-auth"
          mkdir -p "$tmp"
          encoded_audience="$(jq -rn --arg value "$OIDC_AUDIENCE" '$value | @uri')"

          if ! oidc_status="$(curl --silent --show-error \
            --output "$tmp/oidc.json" \
            --write-out '%{http_code}' \
            --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}" \
            2>"$tmp/oidc.err")"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_REQUEST_FAILED'
            exit 1
          fi
          case "$oidc_status" in
            2??) ;;
            *) echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_REQUEST_FAILED'; exit 1 ;;
          esac
          if ! oidc_token="$(jq -er '.value | select(type == "string" and length > 0)' "$tmp/oidc.json" 2>/dev/null)"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_REQUEST_FAILED'
            exit 1
          fi
          echo "::add-mask::${oidc_token}"

          token_payload="${oidc_token#*.}"
          token_payload="${token_payload%%.*}"
          token_payload="${token_payload//-/+}"
          token_payload="${token_payload//_/\/}"
          case "$((${#token_payload} % 4))" in
            0) ;;
            2) token_payload="${token_payload}==" ;;
            3) token_payload="${token_payload}=" ;;
            *) echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_CLAIMS_INVALID'; exit 1 ;;
          esac
          if ! printf '%s' "$token_payload" | base64 --decode >"$tmp/claims.json" 2>"$tmp/claims.err"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_CLAIMS_INVALID'
            exit 1
          fi
          jq -e --arg expected "$OIDC_ISSUER" '.iss == $expected' "$tmp/claims.json" >/dev/null 2>&1 || {
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_ISSUER_MISMATCH'; exit 1;
          }
          jq -e --arg expected "$OIDC_AUDIENCE" '(.aud == $expected) or ((.aud | type) == "array" and (.aud | length) == 1 and .aud[0] == $expected)' "$tmp/claims.json" >/dev/null 2>&1 || {
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_AUDIENCE_MISMATCH'; exit 1;
          }
          jq -e --arg expected "$OIDC_SUBJECT" '.sub == $expected' "$tmp/claims.json" >/dev/null 2>&1 || {
            echo 'INITIAL_BOOTSTRAP_RECOVERY_OIDC_SUBJECT_MISMATCH'; exit 1;
          }

          if ! iam_status="$(curl --silent --show-error \
            --output "$tmp/iam.json" \
            --write-out '%{http_code}' \
            --request POST https://auth.yandex.cloud/oauth/token \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_WIF_SERVICE_ACCOUNT_ID}" \
            --data-urlencode "subject_token=${oidc_token}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            2>"$tmp/iam.err")"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_WIF_EXCHANGE_FAILED'
            exit 1
          fi
          case "$iam_status" in
            2??) ;;
            *) echo 'INITIAL_BOOTSTRAP_RECOVERY_WIF_EXCHANGE_FAILED'; exit 1 ;;
          esac
          if ! iam_token="$(jq -er '.access_token | select(type == "string" and length > 0)' "$tmp/iam.json" 2>/dev/null)"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_WIF_EXCHANGE_FAILED'
            exit 1
          fi
          echo "::add-mask::${iam_token}"
          printf 'YC_IAM_TOKEN=%s\n' "$iam_token" >> "$GITHUB_ENV"

      - name: Fail closed if dedicated provider boundary is unsafe
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-provider"
          mkdir -p "$tmp"

          yc serverless function get --name "$FUNCTION_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/function.json" 2>"$tmp/function.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_RESOLUTION_FAILED'; exit 1;
            }
          function_id="$(jq -er '.id | select(type == "string" and length > 0)' "$tmp/function.json")"

          yc serverless function list-access-bindings --id "$function_id" \
            --format json --retry 0 --no-user-output >"$tmp/bindings.json" 2>"$tmp/bindings.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_BINDINGS_READ_FAILED'; exit 1;
            }
          if jq -e '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject.id] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_PUBLIC'
            exit 1
          fi
          if ! jq -e --arg expected "$YC_WIF_SERVICE_ACCOUNT_ID" \
            '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject] | any(.type == "serviceAccount" and .id == $expected)' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_INVOKER_BINDING_MISSING'
            exit 1
          fi

          yc serverless trigger list --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/triggers.json" 2>"$tmp/triggers.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_TRIGGER_LIST_FAILED'; exit 1;
            }
          if jq -e --arg id "$function_id" '.. | strings | select(. == $id)' "$tmp/triggers.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_TRIGGER_PRESENT'
            exit 1
          fi

          runtime_sa_json="$(yc iam service-account get --name "$RUNTIME_SERVICE_ACCOUNT_NAME" --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output 2>"$tmp/runtime-sa.err")" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_RUNTIME_SA_RESOLUTION_FAILED'; exit 1;
            }
          runtime_sa_id="$(jq -er '.id | select(type == "string" and length > 0)' <<<"$runtime_sa_json")"

          echo "::add-mask::${YC_LOCKBOX_SECRET_ID}"
          if ! secret_http="$(curl --silent --show-error \
            --output "$tmp/secret.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            "https://lockbox.api.cloud.yandex.net/lockbox/v1/secrets/${YC_LOCKBOX_SECRET_ID}" \
            2>"$tmp/secret.err")"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_REST_TRANSPORT_FAILED'
            exit 1
          fi
          case "$secret_http" in
            2??) ;;
            401) echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_REST_AUTH_FAILED'; exit 1 ;;
            403) echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_REST_PERMISSION_DENIED'; exit 1 ;;
            404) echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_REST_NOT_FOUND'; exit 1 ;;
            *) echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_REST_UNEXPECTED_STATUS'; exit 1 ;;
          esac
          if ! jq -e \
            --arg expected_id "$YC_LOCKBOX_SECRET_ID" \
            --arg expected_name "$LOCKBOX_SECRET_NAME" \
            --arg expected_folder_id "$YC_FOLDER_ID" \
            '(.id == $expected_id) and (.name == $expected_name) and (.folderId == $expected_folder_id) and (.status == "ACTIVE")' \
            "$tmp/secret.json" >/dev/null 2>&1; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_SECRET_METADATA_INVALID'
            exit 1
          fi
          secret_version_id="$(jq -er '.currentVersion.id | select(type == "string" and length > 0)' "$tmp/secret.json")" || {
            echo 'INITIAL_BOOTSTRAP_RECOVERY_LOCKBOX_VERSION_RESOLUTION_FAILED'
            exit 1
          }

          echo "::add-mask::${function_id}"
          echo "::add-mask::${runtime_sa_id}"
          echo "::add-mask::${secret_version_id}"
          {
            printf 'PRIHRASH_YC_FUNCTION_ID=%s\n' "$function_id"
            printf 'PRIHRASH_YC_FUNCTION_SA_ID=%s\n' "$runtime_sa_id"
            printf 'PRIHRASH_LOCKBOX_VERSION_ID=%s\n' "$secret_version_id"
          } >> "$GITHUB_ENV"

      - name: Re-verify exact current main before recovery deployment
        if: inputs.reuse_deploy_attempt_run_id == ''
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -er '.commit.sha')"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_MAIN_MOVED_BEFORE_DEPLOY'
            exit 1
          fi

      - name: Verify exact accepted recovery Function version for reuse
        id: reuse-version
        if: inputs.reuse_deploy_attempt_run_id != ''
        shell: bash
        env:
          RUN_STARTED_AT: ${{ steps.recovery_prerequisites.outputs.reuse_source_started_at }}
          RUN_FINISHED_AT: ${{ steps.recovery_prerequisites.outputs.reuse_source_finished_at }}
          OPERATION_CREATOR_SERVICE_ACCOUNT_ID: ${{ secrets.YC_R1_INITIAL_BOOTSTRAP_WIF_SERVICE_ACCOUNT_ID }}
          RUNTIME_SERVICE_ACCOUNT_ID: ${{ env.PRIHRASH_YC_FUNCTION_SA_ID }}
          YC_CLOUD_ID: ${{ secrets.YC_R1_CLOUD_ID }}
          AUDIT_SOURCE_TEMPORARY_READ: ${{ inputs.audit_source_permission_probe && '1' || '0' }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-reuse-version"
          mkdir -p "$tmp"
          reuse_status='RECOVERY_REUSE_CLASSIFIER_FAILED'
          version_evidence='RECOVERY_REUSE_CLASSIFIER_NOT_RUN'
          operation_list_evidence='RECOVERY_REUSE_OPERATION_LIST_NOT_ATTEMPTED'
          operations_read='false'
          tag_history_evidence='RECOVERY_REUSE_TAG_HISTORY_NOT_ATTEMPTED'
          audit_trail_evidence='RECOVERY_REUSE_AUDIT_NOT_ATTEMPTED'
          audit_source_decision='RECOVERY_REUSE_AUDIT_NOT_ATTEMPTED'
          audit_event_evidence='RECOVERY_REUSE_AUDIT_NOT_ATTEMPTED'
          audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_NOT_REQUESTED'
          logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_NOT_REQUESTED'
          binding_retirement_evidence='RECOVERY_REUSE_TEMP_AUDIT_BINDINGS_NOT_REQUIRED'
          temporary_audit_viewer_added='false'
          temporary_logging_reader_added='false'
          classify_binding() {
            node scripts/classify-r1-temporary-audit-source-binding.mjs "$1" "$2" "$YC_WIF_SERVICE_ACCOUNT_ID"
          }
          read_folder_bindings() {
            yc resource-manager folder list-access-bindings --id "$YC_FOLDER_ID" \
              --format json --retry 0 --no-user-output >"$tmp/folder-bindings.json" \
              2>"$tmp/folder-bindings.err"
          }
          ensure_folder_audit_viewer() {
            local state
            if ! yc resource-manager folder add-access-binding --help >/dev/null 2>&1 \
              || ! yc resource-manager folder remove-access-binding --help >/dev/null 2>&1; then
              audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_CLI_COMMAND_UNAVAILABLE'
              return 1
            fi
            if ! read_folder_bindings; then
              audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_BINDING_LIST_FAILED'
              return 1
            fi
            state="$(classify_binding "$tmp/folder-bindings.json" 'audit-trails.viewer')" || state='READ_BINDING_RESPONSE_INVALID'
            case "$state" in
              EXACT_READ_BINDING_PRESENT)
                audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_PREEXISTING'
                return 0
                ;;
              EXACT_READ_BINDING_ABSENT) ;;
              *)
                audit_viewer_binding_evidence="RECOVERY_REUSE_TEMP_AUDIT_VIEWER_${state}"
                return 1
                ;;
            esac
            temporary_audit_viewer_added='true'
            if yc resource-manager folder add-access-binding --id "$YC_FOLDER_ID" \
              --role audit-trails.viewer --subject "serviceAccount:${YC_WIF_SERVICE_ACCOUNT_ID}" \
              --format json --retry 0 --no-user-output \
              >"$tmp/folder-binding-add.json" 2>"$tmp/folder-binding-add.err"; then
              audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_ADD_ACCEPTED'
            else
              audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_ADD_FAILED'
              if read_folder_bindings; then
                state="$(classify_binding "$tmp/folder-bindings.json" 'audit-trails.viewer')" || state='READ_BINDING_RESPONSE_INVALID'
                if [ "$state" = 'EXACT_READ_BINDING_PRESENT' ]; then
                  audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_ADD_OUTCOME_UNCLASSIFIED'
                elif [ "$state" != 'EXACT_READ_BINDING_ABSENT' ]; then
                  audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_ADD_OUTCOME_UNCLASSIFIED'
                fi
              else
                audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_ADD_OUTCOME_UNCLASSIFIED'
              fi
              return 1
            fi
            if ! read_folder_bindings; then
              audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_READBACK_FAILED'
              return 1
            fi
            state="$(classify_binding "$tmp/folder-bindings.json" 'audit-trails.viewer')" || state='READ_BINDING_RESPONSE_INVALID'
            if [ "$state" != 'EXACT_READ_BINDING_PRESENT' ]; then
              audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_READBACK_UNPROVEN'
              return 1
            fi
            audit_viewer_binding_evidence='RECOVERY_REUSE_TEMP_AUDIT_VIEWER_ADDED_VERIFIED'
          }
          ensure_exact_log_group_reader() {
            local state
            if ! yc logging group add-access-binding --help >/dev/null 2>&1 \
              || ! yc logging group remove-access-binding --help >/dev/null 2>&1; then
              logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_CLI_COMMAND_UNAVAILABLE'
              return 1
            fi
            if ! read_log_bindings; then
              logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_BINDING_LIST_FAILED'
              return 1
            fi
            state="$(classify_binding "$tmp/log-group-bindings.json" 'logging.reader')" || state='READ_BINDING_RESPONSE_INVALID'
            case "$state" in
              EXACT_READ_BINDING_PRESENT)
                logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_PREEXISTING'
                return 0
                ;;
              EXACT_READ_BINDING_ABSENT) ;;
              *)
                logging_reader_binding_evidence="RECOVERY_REUSE_TEMP_LOGGING_READER_${state}"
                return 1
                ;;
            esac
            temporary_logging_reader_added='true'
            if yc logging group add-access-binding --id "$audit_log_group_id" \
              --role logging.reader --subject "serviceAccount:${YC_WIF_SERVICE_ACCOUNT_ID}" \
              --format json --retry 0 --no-user-output \
              >"$tmp/log-group-binding-add.json" 2>"$tmp/log-group-binding-add.err"; then
              logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_ADD_ACCEPTED'
            else
              logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_ADD_FAILED'
              if read_log_bindings; then
                state="$(classify_binding "$tmp/log-group-bindings.json" 'logging.reader')" || state='READ_BINDING_RESPONSE_INVALID'
                if [ "$state" = 'EXACT_READ_BINDING_PRESENT' ]; then
                  logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_ADD_OUTCOME_UNCLASSIFIED'
                elif [ "$state" != 'EXACT_READ_BINDING_ABSENT' ]; then
                  logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_ADD_OUTCOME_UNCLASSIFIED'
                fi
              else
                logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_ADD_OUTCOME_UNCLASSIFIED'
              fi
              return 1
            fi
            if ! read_log_bindings; then
              logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_READBACK_FAILED'
              return 1
            fi
            state="$(classify_binding "$tmp/log-group-bindings.json" 'logging.reader')" || state='READ_BINDING_RESPONSE_INVALID'
            if [ "$state" != 'EXACT_READ_BINDING_PRESENT' ]; then
              logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_READBACK_UNPROVEN'
              return 1
            fi
            logging_reader_binding_evidence='RECOVERY_REUSE_TEMP_LOGGING_READER_ADDED_VERIFIED'
          }
          cleanup_temp_bindings() {
            local failed='false' state
            if [ "$temporary_logging_reader_added" = 'true' ]; then
              yc logging group remove-access-binding --id "$audit_log_group_id" \
                --role logging.reader --subject "serviceAccount:${YC_WIF_SERVICE_ACCOUNT_ID}" \
                --format json --retry 0 --no-user-output \
                >"$tmp/log-group-binding-remove.json" 2>"$tmp/log-group-binding-remove.err" || true
              if read_log_bindings; then
                state="$(classify_binding "$tmp/log-group-bindings.json" 'logging.reader')" || state='READ_BINDING_RESPONSE_INVALID'
                if [ "$state" != 'EXACT_READ_BINDING_ABSENT' ]; then failed='true'; fi
              else
                failed='true'
              fi
            fi
            if [ "$temporary_audit_viewer_added" = 'true' ]; then
              yc resource-manager folder remove-access-binding --id "$YC_FOLDER_ID" \
                --role audit-trails.viewer --subject "serviceAccount:${YC_WIF_SERVICE_ACCOUNT_ID}" \
                --format json --retry 0 --no-user-output \
                >"$tmp/folder-binding-remove.json" 2>"$tmp/folder-binding-remove.err" || true
              if read_folder_bindings; then
                state="$(classify_binding "$tmp/folder-bindings.json" 'audit-trails.viewer')" || state='READ_BINDING_RESPONSE_INVALID'
                if [ "$state" != 'EXACT_READ_BINDING_ABSENT' ]; then failed='true'; fi
              else
                failed='true'
              fi
            fi
            if [ "$failed" = 'true' ]; then
              binding_retirement_evidence='RECOVERY_REUSE_TEMP_AUDIT_BINDING_RETIREMENT_UNPROVEN'
              return 1
            fi
            if [ "$temporary_audit_viewer_added" = 'true' ] || [ "$temporary_logging_reader_added" = 'true' ]; then
              binding_retirement_evidence='RECOVERY_REUSE_TEMP_AUDIT_BINDINGS_RETIRED_VERIFIED'
            fi
            return 0
          }
          write_reuse_result() {
            local exit_code=$?
            trap - EXIT
            if ! cleanup_temp_bindings && [ "$exit_code" -eq 0 ]; then exit_code=1; fi
            enum_only() {
              case "$1" in
                EXACT_RECOVERY_VERSION_CREATED|CREATE_OPERATION_*|CREATED_VERSION_NOT_PROVEN|DEPLOYMENT_OUTCOME_UNCLASSIFIED|RECOVERY_*|DIAGNOSTIC_FAILED|AUDIT_EVENT_READ_NOT_ATTEMPTED|AUDIT_CREATE_EVENT_*|AUDIT_LOG_*|AUDIT_TRAIL_*|EXISTING_APPLICABLE_AUDIT_SOURCE|NO_APPLICABLE_PREEXISTING_AUDIT_SOURCE|SOURCE_EVIDENCE_UNUSABLE|SOURCE_EVIDENCE_AMBIGUOUS) printf '%s' "$1" ;;
                *) printf 'RECOVERY_REUSE_CLASSIFIER_OUTPUT_INVALID' ;;
              esac
            }
            if ! jq -cn \
              --arg reuse "$(enum_only "$reuse_status")" \
              --arg version "$(enum_only "$version_evidence")" \
              --arg operation_list "$(enum_only "$operation_list_evidence")" \
              --arg tag_history "$(enum_only "$tag_history_evidence")" \
              --arg audit_trail "$(enum_only "$audit_trail_evidence")" \
              --arg audit_decision "$(enum_only "$audit_source_decision")" \
              --arg audit_event "$(enum_only "$audit_event_evidence")" \
              --arg audit_viewer "$(enum_only "$audit_viewer_binding_evidence")" \
              --arg logging_reader "$(enum_only "$logging_reader_binding_evidence")" \
              --arg binding_retirement "$(enum_only "$binding_retirement_evidence")" \
              '{recoveryVersionReuse:$reuse,versionMetadataEvidence:$version,operationListEvidence:$operation_list,tagHistoryEvidence:$tag_history,auditTrailEvidence:$audit_trail,auditSourceDecision:$audit_decision,auditCreateEventEvidence:$audit_event,auditViewerBindingEvidence:$audit_viewer,loggingReaderBindingEvidence:$logging_reader,bindingRetirementEvidence:$binding_retirement}' \
              > "$tmp/classification.json"; then
              echo 'RECOVERY_REUSE_CLASSIFICATION_ARTIFACT_WRITE_FAILED'
              exit_code=1
            fi
            exit "$exit_code"
          }
          trap write_reuse_result EXIT

          reuse_status='RECOVERY_REUSE_VERSION_LIST_READ_FAILED'
          yc serverless function version list --function-id "$PRIHRASH_YC_FUNCTION_ID" --limit 1000 \
            --format json --retry 0 --no-user-output >"$tmp/versions.json" 2>"$tmp/versions.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_VERSION_LIST_FAILED'; exit 1;
            }
          operation_list_evidence='RECOVERY_REUSE_OPERATION_LIST_READ_FAILED'
          if yc serverless function list-operations --id "$PRIHRASH_YC_FUNCTION_ID" --limit 1000 \
            --format json --retry 0 --no-user-output >"$tmp/operations.json" 2>"$tmp/operations.err"; then
            operation_list_evidence='RECOVERY_REUSE_OPERATION_LIST_READ'
            operations_read='true'
          fi
          reuse_status='RECOVERY_REUSE_TAG_READ_FAILED'
          if ! yc serverless function version get-by-tag --function-id "$PRIHRASH_YC_FUNCTION_ID" \
            --tag r1-initial-bootstrap-recovery --format json-rest --retry 0 --no-user-output \
            >"$tmp/tagged-version.json" 2>"$tmp/tagged-version.err"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_TAG_READ_FAILED'; exit 1
          fi
          tag_history_evidence='RECOVERY_REUSE_TAG_HISTORY_READ_FAILED'
          tag_history_api="https://serverless-functions.api.cloud.yandex.net/functions/v1/functions/${PRIHRASH_YC_FUNCTION_ID}:tagHistory"
          if curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
            --header 'Accept: application/json' \
            --data-urlencode 'tag=r1-initial-bootstrap-recovery' \
            --data-urlencode 'pageSize=1000' \
            "$tag_history_api" --output "$tmp/tag-history.json" 2>"$tmp/tag-history.err"; then
            tag_history_evidence='RECOVERY_REUSE_TAG_HISTORY_READ'
          else
            printf '{"nextPageToken":"tag-history-read-failed"}\n' >"$tmp/tag-history.json"
          fi
          reuse_status='RECOVERY_REUSE_CLASSIFIER_FAILED'
          if [ "$operations_read" = 'true' ]; then
            reuse_evidence="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
              "$tmp/versions.json" "$tmp/operations.json" "$tmp/tagged-version.json" "$tmp/tag-history.json" \
              "$RUN_STARTED_AT" "$RUN_FINISHED_AT" "$OPERATION_CREATOR_SERVICE_ACCOUNT_ID" "$RUNTIME_SERVICE_ACCOUNT_ID")" || {
                echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_VERSION_CLASSIFICATION_FAILED'; exit 1;
              }
          else
            reuse_evidence='RECOVERY_REUSE_OPERATION_LIST_READ_FAILED'
          fi
          version_evidence="$reuse_evidence"
          if [ "$reuse_evidence" = 'EXACT_RECOVERY_VERSION_CREATED' ]; then
            reuse_status='EXACT_RECOVERY_VERSION_CREATED'
            printf 'reuse_status=%s\n' "$reuse_status" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$reuse_evidence" = 'CREATED_VERSION_NOT_PROVEN' ]; then
            reuse_status='RECOVERY_REUSE_VERSION_NOT_PROVEN'
            echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_VERSION_NOT_EXACT'
            exit 1
          fi
          case "$reuse_evidence" in
            CREATE_OPERATION_AMBIGUOUS|CREATE_OPERATION_IN_PROGRESS|CREATE_OPERATION_FAILED|RECOVERY_TAGGED_VERSION_CANDIDATE_PRESENT|RECOVERY_TAGGED_VERSION_NOT_OBSERVED_IN_WINDOW|RECOVERY_TAGGED_VERSION_AMBIGUOUS|RECOVERY_TAGGED_VERSION_METADATA_UNPROVEN|RECOVERY_TAG_HISTORY_METADATA_INVALID|RECOVERY_TAG_HISTORY_INCOMPLETE|RECOVERY_TAG_HISTORY_AMBIGUOUS|RECOVERY_TAG_HISTORY_VERSION_NOT_OBSERVED|RECOVERY_TAG_HISTORY_VERSION_CANDIDATE_PRESENT|RECOVERY_UNTAGGED_VERSION_CANDIDATE_PRESENT|RECOVERY_UNTAGGED_VERSION_AMBIGUOUS|RECOVERY_UNTAGGED_VERSION_METADATA_UNPROVEN|CREATED_VERSION_NOT_PROVEN|DEPLOYMENT_OUTCOME_UNCLASSIFIED|RECOVERY_REUSE_OPERATION_LIST_READ_FAILED|RECOVERY_REUSE_TAG_HISTORY_READ_FAILED) ;;
            *)
              reuse_status='RECOVERY_REUSE_VERSION_NOT_PROVEN'
              echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_VERSION_NOT_EXACT'; exit 1;
              ;;
          esac

          expected_reuse_version_id="$(jq -er '.id | select(type == "string" and length > 0)' "$tmp/tagged-version.json")" || {
            reuse_status='RECOVERY_REUSE_TAGGED_VERSION_ID_UNPROVEN'
            echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_TAGGED_VERSION_ID_UNPROVEN'; exit 1;
          }
          audit_trail_evidence='AUDIT_TRAIL_LIST_READ_FAILED'
          audit_source_permission_ready='true'
          if [ "$AUDIT_SOURCE_TEMPORARY_READ" = '1' ]; then
            if ! ensure_folder_audit_viewer; then
              audit_source_permission_ready='false'
              audit_trail_evidence='AUDIT_TRAIL_TEMPORARY_VIEWER_SETUP_FAILED'
            fi
          fi
          if [ "$audit_source_permission_ready" != 'true' ]; then
            :
          elif [ -z "$YC_CLOUD_ID" ]; then
            audit_trail_evidence='AUDIT_TRAIL_CLOUD_SCOPE_CONFIG_INVALID'
          else
            target_trail_response="$tmp/target-folder-audit-trails.json"
            target_trail_list_http='000'
            if target_trail_list_http="$(curl --silent --show-error --output "$target_trail_response" \
              --write-out '%{http_code}' --get \
              --header "Authorization: Bearer ${YC_IAM_TOKEN}" \
              --header 'Accept: application/json' \
              --data-urlencode "folderId=${YC_FOLDER_ID}" \
              --data-urlencode 'pageSize=1000' \
              'https://audittrails.api.cloud.yandex.net/audit-trails/v1/trails' \
              2>"$tmp/target-folder-audit-trails.err")"; then
              case "$target_trail_list_http" in
                2??)
                  audit_trail_evidence="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
                    --audit-folder-trails "$target_trail_response" "$YC_CLOUD_ID" "$YC_FOLDER_ID" \
                    "$RUN_FINISHED_AT" "$tmp/audit-log-group-id")" || \
                    audit_trail_evidence='AUDIT_TRAIL_CLASSIFIER_FAILED'
                  ;;
                *)
                  audit_trail_evidence="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
                    --audit-trail-http-status "$target_trail_list_http")"
                  ;;
              esac
            fi
          fi
          case "$audit_trail_evidence" in
            AUDIT_TRAIL_METADATA_INVALID|AUDIT_TRAIL_LIST_INCOMPLETE|AUDIT_TRAIL_SOURCE_NOT_CONFIGURED|AUDIT_TRAIL_SOURCE_NOT_ACTIVE|AUDIT_TRAIL_SOURCE_AMBIGUOUS|AUDIT_TRAIL_CLOUD_LOGGING_SOURCE_PRESENT|AUDIT_TRAIL_OBJECT_STORAGE_SOURCE_PRESENT|AUDIT_TRAIL_SOURCE_UNSUPPORTED|AUDIT_TRAIL_SOURCE_CREATED_AFTER_TARGET|AUDIT_TRAIL_CONFIGURATION_CHANGED_AFTER_TARGET|AUDIT_TRAIL_SOURCE_OPEN_FAILED|AUDIT_TRAIL_LIST_READ_FAILED|AUDIT_TRAIL_AUTHENTICATION_REQUIRED|AUDIT_TRAIL_LIST_PERMISSION_DENIED|AUDIT_TRAIL_CLOUD_SCOPE_CONFIG_INVALID|AUDIT_TRAIL_FOLDER_LIST_READ_FAILED|AUDIT_TRAIL_FOLDER_LIST_PERMISSION_DENIED|AUDIT_TRAIL_FOLDER_LIST_INCOMPLETE|AUDIT_TRAIL_FOLDER_LIST_RESPONSE_INVALID|AUDIT_TRAIL_FOLDER_LIST_JSON_INVALID|AUDIT_TRAIL_FOLDER_LIST_INPUT_INVALID|AUDIT_TRAIL_FOLDER_ENTRY_INVALID|AUDIT_TRAIL_FOLDER_ID_INVALID|AUDIT_TRAIL_FOLDER_CLOUD_ID_MISSING|AUDIT_TRAIL_FOLDER_METADATA_INVALID|AUDIT_TRAIL_FOLDER_CLOUD_ID_MISMATCH|AUDIT_TRAIL_FOLDER_LIST_AMBIGUOUS|AUDIT_TRAIL_FOLDER_STATUS_MISSING|AUDIT_TRAIL_FOLDER_STATUS_UNSUPPORTED|AUDIT_TRAIL_TARGET_FOLDER_NOT_FOUND|AUDIT_TRAIL_TARGET_FOLDER_NOT_ACTIVE|AUDIT_TRAIL_SOURCE_NOT_COVERING_TARGET|AUDIT_TRAIL_COVERAGE_UNPROVEN|AUDIT_TRAIL_CLOUD_COVERAGE_INPUT_INVALID|AUDIT_TRAIL_TRAIL_LIST_RESPONSE_INVALID|AUDIT_TRAIL_TRAIL_LIST_ROOT_INVALID|AUDIT_TRAIL_TRAILS_FIELD_INVALID|AUDIT_TRAIL_TRAIL_PAGE_TOKEN_INVALID|AUDIT_TRAIL_TRAIL_LIST_COUNT_MISMATCH|AUDIT_TRAIL_TRAIL_JSON_INVALID|AUDIT_TRAIL_TRAIL_LIST_INPUT_INVALID|AUDIT_TRAIL_TRAIL_ENTRY_INVALID|AUDIT_TRAIL_TRAIL_FOLDER_ID_MISSING|AUDIT_TRAIL_TRAIL_FOLDER_MISMATCH|AUDIT_TRAIL_TRAIL_CLOUD_ID_MISSING|AUDIT_TRAIL_TRAIL_CLOUD_ID_MISMATCH|AUDIT_TRAIL_TRAIL_STATUS_MISSING|AUDIT_TRAIL_TRAIL_STATUS_UNSUPPORTED|AUDIT_TRAIL_TRAIL_TIMESTAMPS_INVALID|AUDIT_TRAIL_TRAIL_DESTINATION_INVALID|AUDIT_TRAIL_TRAIL_DESTINATION_UNPROVEN|AUDIT_TRAIL_CLOUD_CLASSIFIER_INTERNAL_ERROR|AUDIT_TRAIL_CLASSIFIER_FAILED) ;;
            *) audit_trail_evidence='AUDIT_TRAIL_CLASSIFIER_FAILED' ;;
          esac

          audit_event_evidence='AUDIT_EVENT_READ_NOT_ATTEMPTED'
          audit_source_decision="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
            --audit-source-decision "$audit_trail_evidence" "$audit_event_evidence")"
          if [ "$audit_trail_evidence" = 'AUDIT_TRAIL_CLOUD_LOGGING_SOURCE_PRESENT' ]; then
            audit_log_group_id="$(cat "$tmp/audit-log-group-id")"
            echo "::add-mask::${audit_log_group_id}"
            audit_filter="json_payload.eventType = \"yandex.cloud.audit.serverless.functions.CreateFunctionVersion\" AND json_payload.details.functionId = \"${PRIHRASH_YC_FUNCTION_ID}\""
            logging_reader_ready='true'
            if [ "$AUDIT_SOURCE_TEMPORARY_READ" = '1' ] && ! ensure_exact_log_group_reader; then
              logging_reader_ready='false'
              audit_event_evidence='AUDIT_LOG_TEMPORARY_READER_SETUP_FAILED'
            fi
            if [ "$logging_reader_ready" != 'true' ]; then
              :
            elif ! yc logging read --group-id "$audit_log_group_id" \
              --since "$RUN_STARTED_AT" --until "$RUN_FINISHED_AT" --limit 1000 \
              --max-response-size 10485760 --filter "$audit_filter" \
              --format json --retry 0 --no-user-output \
              >"$tmp/audit-events.json" 2>"$tmp/audit-events.err"; then
              if grep -Eqi 'PermissionDenied|permission denied|PERMISSION_DENIED|forbidden' "$tmp/audit-events.err"; then
                audit_event_evidence='AUDIT_LOG_READ_PERMISSION_DENIED'
              else
                audit_event_evidence='AUDIT_LOG_READ_FAILED'
              fi
            else
              audit_event_evidence="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
                --audit-events "$tmp/audit-events.json" "$tmp/versions.json" "$PRIHRASH_YC_FUNCTION_ID" \
                "$OPERATION_CREATOR_SERVICE_ACCOUNT_ID" "$RUNTIME_SERVICE_ACCOUNT_ID" \
                "$RUN_STARTED_AT" "$RUN_FINISHED_AT" "$expected_reuse_version_id")"
            fi
            audit_source_decision="$(node scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs \
              --audit-source-decision "$audit_trail_evidence" "$audit_event_evidence")"
          fi
          case "$audit_event_evidence" in
            AUDIT_EVENT_READ_NOT_ATTEMPTED|AUDIT_LOG_READ_FAILED|AUDIT_LOG_READ_PERMISSION_DENIED|AUDIT_LOG_LIST_INCOMPLETE|AUDIT_LOG_METADATA_INVALID|AUDIT_LOG_CLASSIFIER_FAILED|AUDIT_CREATE_EVENT_NOT_OBSERVED|AUDIT_CREATE_EVENT_AMBIGUOUS|AUDIT_CREATE_EVENT_WRITER_MISMATCH|AUDIT_CREATE_EVENT_IN_PROGRESS|AUDIT_CREATE_EVENT_CANCELLED|AUDIT_CREATE_EVENT_FAILED|AUDIT_CREATE_EVENT_VERSION_NOT_OBSERVED|AUDIT_CREATE_EVENT_VERSION_METADATA_UNPROVEN|EXACT_RECOVERY_VERSION_CREATED) ;;
            *) audit_event_evidence='AUDIT_LOG_CLASSIFIER_FAILED' ;;
          esac
          case "$audit_source_decision" in
            EXISTING_APPLICABLE_AUDIT_SOURCE|NO_APPLICABLE_PREEXISTING_AUDIT_SOURCE|SOURCE_EVIDENCE_UNUSABLE|SOURCE_EVIDENCE_AMBIGUOUS) ;;
            *) audit_source_decision='SOURCE_EVIDENCE_UNUSABLE' ;;
          esac
          if [ "$audit_source_decision" = 'EXISTING_APPLICABLE_AUDIT_SOURCE' ] \
            && [ "$audit_event_evidence" = 'EXACT_RECOVERY_VERSION_CREATED' ] \
            && jq -e --arg expected_id "$expected_reuse_version_id" \
              --arg expected_runtime_sa "$RUNTIME_SERVICE_ACCOUNT_ID" '
                .id == $expected_id and .status == "ACTIVE" and .runtime == "nodejs22"
                and .entrypoint == "index.initialBootstrapRecoveryHandler"
                and .serviceAccountId == $expected_runtime_sa
              ' "$tmp/tagged-version.json" >/dev/null; then
            reuse_status='EXACT_RECOVERY_VERSION_CREATED'
            printf 'reuse_status=%s\n' "$reuse_status" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reuse_status='RECOVERY_REUSE_VERSION_NOT_PROVEN'
          echo 'INITIAL_BOOTSTRAP_RECOVERY_REUSE_VERSION_NOT_EXACT'
          exit 1

      - name: Deploy recovery-only Function version
        if: inputs.reuse_deploy_attempt_run_id == ''
        shell: bash
        env:
          CAUSAL_BOOTSTRAP_STARTED_AT: ${{ steps.recovery_prerequisites.outputs.causal_bootstrap_started_at }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-deploy"
          mkdir -p "$tmp"
          recovery_execution_timeout='150s'
          if [ "$RECOVERY_CONTROLLED_PREPARATION_ONLY" = '1' ]; then
            recovery_execution_timeout='600s'
          fi
          recovery_environment=(
            --environment "PRIHRASH_R1_RECOVERY_SURFACE_ONLY=${RECOVERY_SURFACE_ONLY}"
            --environment "PRIHRASH_R1_RECOVERY_CONTROLLED_PREPARATION_ONLY=${RECOVERY_CONTROLLED_PREPARATION_ONLY}"
            --environment "PRIHRASH_R1_RECOVERY_REVISION_CARDINALITY_ONLY=${RECOVERY_REVISION_CARDINALITY_ONLY}"
          )
          if [ -n "$CAUSAL_BOOTSTRAP_STARTED_AT" ]; then
            recovery_environment+=(
              --environment "PRIHRASH_R1_RECOVERY_CAUSAL_BOOTSTRAP_STARTED_AT=${CAUSAL_BOOTSTRAP_STARTED_AT}"
            )
          fi
          if ! yc serverless function version create \
            --function-id "$PRIHRASH_YC_FUNCTION_ID" \
            --runtime nodejs22 \
            --entrypoint index.initialBootstrapRecoveryHandler \
            --memory 1g \
            --execution-timeout "$recovery_execution_timeout" \
            "${recovery_environment[@]}" \
            --source-path .artifacts/yandex-initial-bootstrap-recovery-function \
            --service-account-id "$PRIHRASH_YC_FUNCTION_SA_ID" \
            --tags r1-initial-bootstrap-recovery \
            --metadata-options gce-http-endpoint=enabled,aws-v1-http-endpoint=disabled \
            --no-logging \
            --secret "environment-variable=PRIHRASH_GOOGLE_SPREADSHEET_ID,id=${YC_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_spreadsheet_id" \
            --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_EMAIL,id=${YC_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_service_account_email" \
            --secret "environment-variable=PRIHRASH_GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY,id=${YC_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=google_service_account_private_key" \
            --secret "environment-variable=PRIHRASH_YDB_CONNECTION_STRING,id=${YC_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=ydb_connection_string" \
            --secret "environment-variable=PRIHRASH_INITIAL_BOOTSTRAP_PRIVATE_HISTORICAL_EVIDENCE,id=${YC_LOCKBOX_SECRET_ID},version-id=${PRIHRASH_LOCKBOX_VERSION_ID},key=initial_bootstrap_private_historical_evidence" \
            --format json --retry 0 --no-user-output >"$tmp/version.json" 2>"$tmp/version.err"; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_DEPLOY_FAILED'
            exit 1
          fi

      - name: Re-verify private trigger-free recovery boundary
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-postflight"
          mkdir -p "$tmp"
          yc serverless function list-access-bindings --id "$PRIHRASH_YC_FUNCTION_ID" \
            --format json --retry 0 --no-user-output >"$tmp/bindings.json" 2>"$tmp/bindings.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_BINDINGS_READ_FAILED'; exit 1;
            }
          if jq -e '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject.id] | any(. == "allUsers" or . == "allAuthenticatedUsers")' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_PUBLIC'
            exit 1
          fi
          if ! jq -e --arg expected "$YC_WIF_SERVICE_ACCOUNT_ID" \
            '[.[]? | select((.role_id // .roleId) == "functions.functionInvoker") | .subject] | any(.type == "serviceAccount" and .id == $expected)' \
            "$tmp/bindings.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_INVOKER_BINDING_MISSING'
            exit 1
          fi
          yc serverless trigger list --folder-id "$YC_FOLDER_ID" \
            --format json --retry 0 --no-user-output >"$tmp/triggers.json" 2>"$tmp/triggers.err" || {
              echo 'INITIAL_BOOTSTRAP_RECOVERY_TRIGGER_LIST_FAILED'; exit 1;
            }
          if jq -e --arg id "$PRIHRASH_YC_FUNCTION_ID" '.. | strings | select(. == $id)' "$tmp/triggers.json" >/dev/null; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_FUNCTION_TRIGGER_PRESENT'
            exit 1
          fi

      - name: Re-assert exact current main before read-only recovery invoke
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_API_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/main" | jq -er '.commit.sha')"
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo 'INITIAL_BOOTSTRAP_RECOVERY_MAIN_MOVED_BEFORE_INVOKE'
            exit 1
          fi

      - name: Invoke exact read-only recovery tag once
        if: inputs.reuse_deploy_attempt_run_id == '' || steps.reuse-version.outputs.reuse_status == 'EXACT_RECOVERY_VERSION_CREATED'
        shell: bash
        run: |
          set -euo pipefail
          export PRIHRASH_YANDEX_INITIAL_BOOTSTRAP_FUNCTION_ID="$PRIHRASH_YC_FUNCTION_ID"
          tmp="$RUNNER_TEMP/r1-initial-bootstrap-recovery-invoke.log"
          evidence_dir="$RUNNER_TEMP/r1-initial-bootstrap-recovery-evidence"
          mkdir -p "$evidence_dir"
          diagnostics="$RUNNER_TEMP/r1-recovery-diagnostics.log"
          export RECOVERY_REVISION_CARDINALITY_ONLY
          export RECOVERY_CAUSAL_BOOTSTRAP_RUN_ID="$CAUSAL_BOOTSTRAP_RUN_ID"
          npm run initial-bootstrap-recovery:invoke 2> "$diagnostics" | tee "$tmp"
          cat "$diagnostics" >&2
          tail -n 1 "$tmp" | jq -c -e '
            select(
              type == "object"
              and (keys | sort) == ["code", "reason", "status", "verdict"]
              and .status == "PASS"
              and .code == "INITIAL_BOOTSTRAP_RECOVERY_CLASSIFIED"
            )
          ' > "$evidence_dir/classification.json" || {
            echo 'INITIAL_BOOTSTRAP_RECOVERY_EVIDENCE_INVALID'
            exit 1
          }
          if jq -e '.reason == "VALIDATED_CURRENT_EMPTY_STAGING_NONEMPTY"' "$evidence_dir/classification.json" >/dev/null; then
            source_evidence="$(sed -n 's/^R1_VALIDATED_SOURCE_EVIDENCE=//p' "$diagnostics")"
            gate_blocker="$(sed -n 's/^R1_STALE_VALIDATED_GATE_BLOCKER=//p' "$diagnostics")"
            case "$source_evidence" in
              AUTHORITATIVE_SNAPSHOT_MATCH|AUTHORITATIVE_SNAPSHOT_DIGEST_MISMATCH|AUTHORITATIVE_SNAPSHOT_PREFIX_PRESERVED|AUTHORITATIVE_SNAPSHOT_INSERTIONS_ONLY|AUTHORITATIVE_ROW_COUNT_MISMATCH|AUTHORITATIVE_BINDING_MISMATCH|VALIDATED_METADATA_INVALID|VALIDATED_SOURCE_DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_VALIDATED_SOURCE_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$gate_blocker" in
              COMMITTED_BASELINE_PRESENT|VALIDATED_RUN_NOT_UNIQUE|VALIDATED_RUN_METADATA_INVALID|SOURCE_DRIFT_NOT_PROVEN|HISTORICAL_CONTEXT_NOT_PROVEN|CURRENT_STATE_NOT_EMPTY|STAGING_CANDIDATE_NOT_EXACT|SWAP_NOT_PROVEN_NOT_APPLIED|IN_FLIGHT_PROVIDER_MUTATION_UNKNOWN|SINGLE_WRITER_EXCLUSION_NOT_PROVEN) ;;
              *) echo INITIAL_BOOTSTRAP_STALE_VALIDATED_GATE_BLOCKER_INVALID; exit 1 ;;
            esac
            jq -cn --arg evidence "$source_evidence" '{validatedSourceEvidence:$evidence}' > "$evidence_dir/validated-source.json"
            jq -cn --arg blocker "$gate_blocker" '{staleValidatedRecoveryGate:{status:"BLOCKED",blocker:$blocker}}' > "$evidence_dir/gate-a.json"
            cat "$evidence_dir/validated-source.json"
            cat "$evidence_dir/gate-a.json"
          fi
          if [ "$RECOVERY_CONTROLLED_PREPARATION_ONLY" = "1" ]; then
            prep_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_EVIDENCE=//p' "$diagnostics")"
            retry_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_RETRY_EVIDENCE=//p' "$diagnostics")"
            query_error_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_QUERY_ERROR_EVIDENCE=//p' "$diagnostics")"
            grpc_status_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_GRPC_STATUS_EVIDENCE=//p' "$diagnostics")"
            phase_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_PHASE_EVIDENCE=//p' "$diagnostics")"
            metadata_scan_cost_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_METADATA_SCAN_COST_EVIDENCE=//p' "$diagnostics")"
            revision_payload_batch_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_REVISION_PAYLOAD_BATCH_EVIDENCE=//p' "$diagnostics")"
            historical_revision_page_progress_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_HISTORICAL_REVISION_PAGE_PROGRESS_EVIDENCE=//p' "$diagnostics")"
            historical_revision_estimated_ru_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_HISTORICAL_REVISION_ESTIMATED_RU_EVIDENCE=//p' "$diagnostics")"
            reference_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_REFERENCE_EVIDENCE=//p' "$diagnostics")"
            reference_read_stage_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_REFERENCE_READ_STAGE_EVIDENCE=//p' "$diagnostics")"
            reconciliation_read_stage_evidence="$(sed -n 's/^R1_STAGING_CONTROLLED_PREPARATION_RECONCILIATION_READ_STAGE_EVIDENCE=//p' "$diagnostics")"
            case "$prep_evidence" in
              READY|BASELINE_EXISTS|VALIDATION_BLOCKED|YDB_QUERY_TIMEOUT|YDB_DATA_SDK_SHAPE_INVALID|YDB_DATA_PARAMETER_VALUE_INVALID|YDB_DATA_PARAMETER_TYPE_UNSUPPORTED|YDB_DATA_TIMESTAMP_PRECISION_UNSUPPORTED|YDB_DATA_QUERY_EXECUTION_FAILED|YDB_DATA_QUERY_EXECUTION_YDB_BAD_REQUEST|YDB_DATA_QUERY_EXECUTION_YDB_UNAUTHORIZED|YDB_DATA_QUERY_EXECUTION_YDB_INTERNAL_ERROR|YDB_DATA_QUERY_EXECUTION_YDB_ABORTED|YDB_DATA_QUERY_EXECUTION_YDB_UNAVAILABLE|YDB_DATA_QUERY_EXECUTION_YDB_OVERLOADED|YDB_DATA_QUERY_EXECUTION_YDB_SCHEME_ERROR|YDB_DATA_QUERY_EXECUTION_YDB_GENERIC_ERROR|YDB_DATA_QUERY_EXECUTION_YDB_BAD_SESSION|YDB_DATA_QUERY_EXECUTION_YDB_PRECONDITION_FAILED|YDB_DATA_QUERY_EXECUTION_YDB_ALREADY_EXISTS|YDB_DATA_QUERY_EXECUTION_YDB_NOT_FOUND|YDB_DATA_QUERY_EXECUTION_YDB_SESSION_EXPIRED|YDB_DATA_QUERY_EXECUTION_YDB_CANCELLED|YDB_DATA_QUERY_EXECUTION_YDB_UNDETERMINED|YDB_DATA_QUERY_EXECUTION_YDB_UNSUPPORTED|YDB_DATA_QUERY_EXECUTION_YDB_SESSION_BUSY|YDB_DATA_QUERY_EXECUTION_YDB_EXTERNAL_ERROR|YDB_DATA_CLIENT_CONFIG_INVALID|DURABLE_RECONCILIATION_FAILURE|REVISION_EVIDENCE_FAILURE|PRIVATE_EVIDENCE_FAILURE|APPLICATION_MULTIPLE_INCOMPLETE_RUNS|APPLICATION_BOOTSTRAP_OBSERVATION_INVALID|APPLICATION_RESUME_RUN_COUNTERS_MISMATCH|APPLICATION_RESUME_COUNTER_REFINEMENT_CONFLICT|APPLICATION_SNAPSHOT_EVIDENCE_MISSING|APPLICATION_SNAPSHOT_EVIDENCE_AMBIGUOUS|APPLICATION_SNAPSHOT_EVIDENCE_MISMATCH|APPLICATION_CURRENT_STATE_NOT_EMPTY|APPLICATION_PROMOTION_PREFLIGHT_DRIFT|APPLICATION_CONTROLLED_CONTINUATION_RUN_MISSING|APPLICATION_CONTROLLED_CONTINUATION_RUN_STATE_INVALID|APPLICATION_CONTROLLED_CONTINUATION_ROUTE_NOT_REQUIRED|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$retry_evidence" in
              UNOBSERVED|NO_RETRY|RETRIED|NON_RETRYABLE|EXHAUSTED|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_RETRY_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$query_error_evidence" in
              UNOBSERVED|ABORT_TIMEOUT|YDB_STATUS|GRPC_STATUS|CLIENT_ERROR|OTHER|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_QUERY_ERROR_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$grpc_status_evidence" in
              UNOBSERVED|CANCELLED|UNKNOWN|INVALID_ARGUMENT|DEADLINE_EXCEEDED|NOT_FOUND|ALREADY_EXISTS|PERMISSION_DENIED|RESOURCE_EXHAUSTED|FAILED_PRECONDITION|ABORTED|OUT_OF_RANGE|UNIMPLEMENTED|INTERNAL|UNAVAILABLE|DATA_LOSS|UNAUTHENTICATED|NON_GRPC|UNRECOGNIZED|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_GRPC_STATUS_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$phase_evidence" in
              UNOBSERVED|ADMISSION_READ|CURRENT_STATE_PREFLIGHT|FRESH_CONTEXT_PREPARATION|FRESH_METADATA_PREPARATION|FRESH_CLAIM_WRITE|RESUME_CONTEXT_READ|RESUME_IDENTITY_MANIFEST_READ|RESUME_SNAPSHOT_READ|RESUME_CONTEXT_PREPARATION|REVISION_EVIDENCE_PREPARATION|REVISION_EVIDENCE_WRITE|LINEAGE_PREPARATION|COUNTER_REFINEMENT_PREPARATION|COUNTER_REFINEMENT_WRITE|RECONCILIATION_READ|VALIDATION_EVALUATION|CURRENT_PLAN_PREPARATION|CURRENT_WRITE_PREPARATION|PRE_PROMOTION_PREFLIGHT|VALIDATION_WRITE_PREPARATION|VALIDATION_TRANSITION_WRITE|PROMOTION_WRITE|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_PHASE_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$metadata_scan_cost_evidence" in
              UNOBSERVED|LT_10_RU|GE_10_LT_3000_RU|GE_3000_RU|STATS_UNAVAILABLE|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_METADATA_SCAN_COST_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$revision_payload_batch_evidence" in
              UNOBSERVED|NO_PAYLOAD_BATCH|ALL_BATCHES_WITHIN_64_KIB|SINGLE_REVISION_EXCEEDS_64_KIB|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_REVISION_PAYLOAD_BATCH_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$historical_revision_page_progress_evidence" in
              UNOBSERVED|FIRST_PAGE|AFTER_ONE_PAGE|AFTER_TWO_TO_FOUR_PAGES|AFTER_FIVE_OR_MORE_PAGES|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_HISTORICAL_REVISION_PAGE_PROGRESS_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$historical_revision_estimated_ru_evidence" in
              UNOBSERVED|LT_10_RU|GE_10_RU|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_HISTORICAL_REVISION_ESTIMATED_RU_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$reference_evidence" in
              UNOBSERVED|REFERENCE_SNAPSHOT_VALIDATED|REFERENCE_READ_FAILED|REFERENCE_READER_MALFORMED_ACCOUNT_REFERENCE_EVIDENCE|REFERENCE_READER_MALFORMED_CATEGORY_REFERENCE_EVIDENCE|REFERENCE_READER_MALFORMED_VIKA_MEMBER_EVIDENCE|REFERENCE_READER_REFERENCE_SNAPSHOT_KIND_MISSING|REFERENCE_READER_REFERENCE_SNAPSHOT_KIND_UNKNOWN|REFERENCE_READER_VIKA_MEMBER_NOT_FOUND|REFERENCE_READER_DUPLICATE_VIKA_MEMBER_EVIDENCE|REFERENCE_RESOLVER_INVALID_ACCOUNT_ID|REFERENCE_RESOLVER_INVALID_CATEGORY_ID|REFERENCE_RESOLVER_INVALID_VIKA_MEMBER_ID|REFERENCE_RESOLVER_INVALID_ACCOUNT_CURRENCY|REFERENCE_RESOLVER_DUPLICATE_ACCOUNT_SOURCE_KEY|REFERENCE_RESOLVER_DUPLICATE_ACCOUNT_TARGET_ID|REFERENCE_RESOLVER_DUPLICATE_CATEGORY_SOURCE_KEY|REFERENCE_RESOLVER_DUPLICATE_CATEGORY_TARGET_ID|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_REFERENCE_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$reference_read_stage_evidence" in
              UNOBSERVED|REFERENCE_SNAPSHOT_READ|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_REFERENCE_READ_STAGE_EVIDENCE_INVALID; exit 1 ;;
            esac
            case "$reconciliation_read_stage_evidence" in
              UNOBSERVED|REVISION_METADATA_SCAN|REVISION_PAYLOAD_BATCH|REVISION_COLLISION_READ|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_CONTROLLED_PREPARATION_RECONCILIATION_READ_STAGE_EVIDENCE_INVALID; exit 1 ;;
            esac
            jq -cn --arg evidence "$prep_evidence" '{stagingControlledPreparationEvidence:$evidence}' > "$evidence_dir/controlled-preparation.json"
            jq -cn --arg evidence "$retry_evidence" '{stagingControlledPreparationRetryEvidence:$evidence}' > "$evidence_dir/controlled-preparation-retry.json"
            jq -cn --arg evidence "$query_error_evidence" '{stagingControlledPreparationQueryErrorEvidence:$evidence}' > "$evidence_dir/controlled-preparation-query-error.json"
            jq -cn --arg evidence "$grpc_status_evidence" '{stagingControlledPreparationGrpcStatusEvidence:$evidence}' > "$evidence_dir/controlled-preparation-grpc-status.json"
            jq -cn --arg evidence "$phase_evidence" '{stagingControlledPreparationPhaseEvidence:$evidence}' > "$evidence_dir/controlled-preparation-phase.json"
            jq -cn --arg evidence "$metadata_scan_cost_evidence" '{stagingControlledPreparationMetadataScanCostEvidence:$evidence}' > "$evidence_dir/controlled-preparation-metadata-scan-cost.json"
            jq -cn --arg evidence "$revision_payload_batch_evidence" '{stagingControlledPreparationRevisionPayloadBatchEvidence:$evidence}' > "$evidence_dir/controlled-preparation-revision-payload-batch.json"
            jq -cn --arg evidence "$historical_revision_page_progress_evidence" '{stagingControlledPreparationHistoricalRevisionPageProgressEvidence:$evidence}' > "$evidence_dir/controlled-preparation-historical-revision-page-progress.json"
            jq -cn --arg evidence "$historical_revision_estimated_ru_evidence" '{stagingControlledPreparationHistoricalRevisionEstimatedRuEvidence:$evidence}' > "$evidence_dir/controlled-preparation-historical-revision-estimated-ru.json"
            jq -cn --arg evidence "$reference_evidence" '{stagingControlledPreparationReferenceEvidence:$evidence}' > "$evidence_dir/controlled-preparation-reference-evidence.json"
            jq -cn --arg evidence "$reference_read_stage_evidence" '{stagingControlledPreparationReferenceReadStageEvidence:$evidence}' > "$evidence_dir/controlled-preparation-reference-read-stage.json"
            jq -cn --arg evidence "$reconciliation_read_stage_evidence" '{stagingControlledPreparationReconciliationReadStageEvidence:$evidence}' > "$evidence_dir/controlled-preparation-reconciliation-read-stage.json"
            cat "$evidence_dir/controlled-preparation.json"
            cat "$evidence_dir/controlled-preparation-retry.json"
            cat "$evidence_dir/controlled-preparation-query-error.json"
            cat "$evidence_dir/controlled-preparation-grpc-status.json"
            cat "$evidence_dir/controlled-preparation-phase.json"
            cat "$evidence_dir/controlled-preparation-metadata-scan-cost.json"
            cat "$evidence_dir/controlled-preparation-revision-payload-batch.json"
            cat "$evidence_dir/controlled-preparation-historical-revision-page-progress.json"
            cat "$evidence_dir/controlled-preparation-historical-revision-estimated-ru.json"
            cat "$evidence_dir/controlled-preparation-reference-evidence.json"
            cat "$evidence_dir/controlled-preparation-reference-read-stage.json"
            cat "$evidence_dir/controlled-preparation-reconciliation-read-stage.json"
          fi
          if [ -n "$RECOVERY_CAUSAL_BOOTSTRAP_RUN_ID" ] \
            && jq -e '.reason == "STAGING_RUN_PRESENT"' "$evidence_dir/classification.json" >/dev/null; then
            lineage_evidence="$(sed -n 's/^R1_STAGING_RUN_LINEAGE_EVIDENCE=//p' "$diagnostics")"
            case "$lineage_evidence" in
              STAGING_STARTED_AFTER_BOOTSTRAP_CHILD|STAGING_PREDATES_BOOTSTRAP_CHILD|STAGING_START_TIME_AMBIGUOUS|STAGING_RUN_CARDINALITY_INVALID|DIAGNOSTIC_FAILED) ;;
              *) echo 'INITIAL_BOOTSTRAP_STAGING_RUN_LINEAGE_EVIDENCE_INVALID'; exit 1 ;;
            esac
            jq -cn --arg evidence "$lineage_evidence" \
              '{stagingRunLineageEvidence:$evidence}' \
              > "$evidence_dir/staging-run-lineage.json"
            cat "$evidence_dir/staging-run-lineage.json"
          fi
          if [ "$RECOVERY_REVISION_CARDINALITY_ONLY" = "1" ]; then
            cardinality_evidence="$(sed -n 's/^R1_STAGING_REVISION_CARDINALITY_EVIDENCE=//p' "$diagnostics")"
            case "$cardinality_evidence" in
              LT_5000_RU|GE_5000_LT_5500_RU|GE_5500_LT_6000_RU|GE_6000_RU|DIAGNOSTIC_FAILED) ;;
              *) echo INITIAL_BOOTSTRAP_STAGING_REVISION_CARDINALITY_EVIDENCE_INVALID; exit 1 ;;
            esac
            jq -cn --arg evidence "$cardinality_evidence" \
              '{stagingRevisionCardinalityEvidence:$evidence}' \
              > "$evidence_dir/staging-revision-cardinality.json"
            cat "$evidence_dir/staging-revision-cardinality.json"
          fi
          rm -f "$tmp" "$diagnostics"

      - name: Publish enum-only recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-initial-bootstrap-recovery-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/r1-initial-bootstrap-recovery-evidence/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish enum-only accepted-version proof outcome
        if: always() && inputs.reuse_deploy_attempt_run_id != '' && steps.reuse-version.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r1-initial-bootstrap-recovery-reuse-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/r1-initial-bootstrap-recovery-reuse-version/classification.json
          if-no-files-found: error
          retention-days: 30
