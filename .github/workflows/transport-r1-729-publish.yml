name: R1 729 Publish Transport

on:
  push:
    branches:
      - transport/r1-729-publish-20260921

permissions:
  contents: write
  issues: read

env:
  SOURCE_SHA: 20326f76694e273cae955e55ebfcc59a9c43d45b
  EXPECTED_TREE: c355654e2bc85c449c45fe91d21cae414d05a12f
  TARGET_BRANCH: agent/r1-729-exact-ydb-get

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Publish exact local commit tree
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth="Authorization: Bearer $GH_API_TOKEN"
          accept="Accept: application/vnd.github+json"
          main_sha="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/branches/main" | jq -er '.commit.sha')"
          test "$main_sha" = "$SOURCE_SHA"
          issue_state="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/issues/729" | jq -er '.state')"
          test "$issue_state" = 'open'
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo 'R1_729_TARGET_BRANCH_EXISTS'
            exit 1
          fi
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          printf '%s' '' | base64 --decode | gzip --decompress > "$RUNNER_TEMP/r1-729.patch"
          git apply --index "$RUNNER_TEMP/r1-729.patch"
          actual_tree="$(git write-tree)"
          test "$actual_tree" = "$EXPECTED_TREE"
          git config user.name 'PrihRash Transport'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'R1 #729: resolve exact YDB target from private connection string'
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "R1_729_TRANSPORT_PUBLISHED=$EXPECTED_TREE"
