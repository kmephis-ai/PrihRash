name: transport deps 284
on:
  push:
    branches:
      - transport/deps-284
permissions:
  contents: read
jobs:
  build-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Package dependency artifact
        run: |
          mkdir -p deps-artifact
          sha256sum package-lock.json > deps-artifact/package-lock.sha256
          node --version > deps-artifact/node-version.txt
          npm --version > deps-artifact/npm-version.txt
          tar -czf deps-artifact/node_modules.tgz node_modules
          sha256sum deps-artifact/node_modules.tgz > deps-artifact/node_modules.tgz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: prihrash-deps-284
          path: deps-artifact
          retention-days: 1
