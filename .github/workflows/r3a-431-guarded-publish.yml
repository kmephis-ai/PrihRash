name: R3A 431 Guarded Publish

on:
  push:
    branches:
      - transport/r3a-431-publish-20260915

permissions:
  contents: write

env:
  SOURCE_SHA: 8b58b18ce15cc84fe8fcd989dfb2afedec6b8bb7
  TARGET_BRANCH: r3a/431-local-void-outbox
  EXPECTED_TREE: 0c837755d0097600e218f1e0a48cd8a9176872db
  PATCH_SHA256: 65d6d08ea084d17ace59cda4f0a60dc5b16165b806518b239e6af241d41c6881
  PATCH_B64: >-
    

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Apply exact guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${SOURCE_SHA}"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git checkout --detach "${SOURCE_SHA}"
          printf '%s' "${PATCH_B64}" | base64 -d | gzip -d > /tmp/r3a431.patch
          test "$(sha256sum /tmp/r3a431.patch | awk '{print $1}')" = "${PATCH_SHA256}"
          git apply --check /tmp/r3a431.patch
          git apply --index /tmp/r3a431.patch
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "docs/R3A_PREVIEW_WRITER.md tests/integration/r2-safe-ui-preview.test.mjs web/preview-transaction-void-delivery.mjs web/preview-writer-outbox.mjs "
          git diff --cached --check
          test "$(git write-tree)" = "${EXPECTED_TREE}"

      - name: Canonical verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          node --test tests/integration/r2-safe-ui-preview.test.mjs
          npm run check

      - name: Publish verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "${SOURCE_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R3A: add durable VOID outbox delivery proof'
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
