name: Publish R2

on:
  push:
    branches:
      - transport/r2-publish-379

permissions:
  contents: write

env:
  EXPECTED_BASE: 4e1c167dcdff8162c491caf6a99808b523281203
  EXPECTED_TREE: 89f06430ae17e1b20cbf37888964f5363c83c479
  TARGET_BRANCH: r2/379-captured-null
  PATCH_GZIP_SHA256: 1c3ca502eaa3434043804d131a050ec0523b4bd296aed2ecbc0284f09d8fe878
  PATCH_B64: 

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Publish exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_BASE="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${REMOTE_BASE}" = "${EXPECTED_BASE}"
          if git ls-remote --exit-code --heads origin "refs/heads/${TARGET_BRANCH}" >/dev/null 2>&1; then
            echo "Target branch already exists" >&2
            exit 1
          fi
          printf '%s' "${PATCH_B64}" | base64 -d > /tmp/r2.patch.gz
          printf '%s  %s\n' "${PATCH_GZIP_SHA256}" /tmp/r2.patch.gz | sha256sum -c -
          gzip -dc /tmp/r2.patch.gz > /tmp/r2.patch
          git checkout --detach "${EXPECTED_BASE}"
          git apply --index /tmp/r2.patch
          ACTUAL_TREE="$(git write-tree)"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"
          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git commit -m 'R2: support nullable capture time in Reader' -m 'Closes #379.'
          git branch "${TARGET_BRANCH}" HEAD
          git push origin "refs/heads/${TARGET_BRANCH}"
