name: Publish exact local R3A 390 commit

on:
  push:
    branches:
      - transport/r3a-390-publish-20260909-2225

permissions:
  contents: write

env:
  SOURCE_SHA: 47f01faee2f4b02dd5ed5a8ff3cbb81ac9ed27c4
  TARGET_BRANCH: r3a/390-quick-expense-outbox
  EXPECTED_COMMIT: f8558a47e288524c5843211be3140a9872d3fbd0
  EXPECTED_TREE: 33b8cda33dd7021a89bd5f8c90755af3646c3a9b

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Reproduce and publish exact local commit
        shell: bash
        run: |
          set -euo pipefail
          cp .github/transport/r3a-390.patch.gz.b64 /tmp/r3a-390.patch.gz.b64
          git fetch origin main "${TARGET_BRANCH}"
          test "$(git rev-parse origin/main)" = "${SOURCE_SHA}"
          test "$(git rev-parse origin/${TARGET_BRANCH})" = "${SOURCE_SHA}"
          git checkout -B "${TARGET_BRANCH}" "${SOURCE_SHA}"
          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          base64 -d /tmp/r3a-390.patch.gz.b64 | gzip -d > /tmp/r3a-390.patch
          git am --committer-date-is-author-date /tmp/r3a-390.patch
          test "$(git rev-parse HEAD)" = "${EXPECTED_COMMIT}"
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          git diff --check "${SOURCE_SHA}" HEAD
          git push origin HEAD:"refs/heads/${TARGET_BRANCH}"
