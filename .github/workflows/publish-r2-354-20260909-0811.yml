name: Publish R2 #354

on:
  push:
    branches:
      - transport/r2-publish-354-20260909-0811

permissions:
  contents: write

env:
  SOURCE_SHA: b364ca3ad25545b250229a7ffa4edad7e3272c56
  EXPECTED_TREE: a6c7a1eb649272c6f9189e1a891ad0e05301054b
  TARGET_BRANCH: r2/354-recovery-copy

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Verify base and publish exact tree
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${REMOTE_MAIN}" = "${SOURCE_SHA}"
          git checkout --detach "${SOURCE_SHA}"
          printf '%s' '' | base64 -d | gzip -d > /tmp/r2.patch
          git apply --check /tmp/r2.patch
          git apply /tmp/r2.patch
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"
          git config user.name kmephis-ai
          git config user.email kmephis@gmail.com
          git commit -m 'R2: actionable recovery copy for in-app refresh' -m 'Closes #354.'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
