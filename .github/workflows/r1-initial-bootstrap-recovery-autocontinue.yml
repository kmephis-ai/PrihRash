name: R1 initial bootstrap recovery autocontinue

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: r1-initial-bootstrap-recovery-autocontinue
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'kmephis-ai/PrihRash'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch guarded exact-main read-only recovery only for active R1 #453 source
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'

          main_sha="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/branches/main" | jq -er '.commit.sha')"
          if [ "$main_sha" != "$SOURCE_SHA" ]; then
            echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_MAIN_MOVED'
            exit 0
          fi

          associated_prs="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/commits/$SOURCE_SHA/pulls")"
          source_pr="$(jq -cer             --arg sha "$SOURCE_SHA"             --arg repo "$GITHUB_REPOSITORY"             '[.[] | select(
              .merged_at != null
              and .merge_commit_sha == $sha
              and .base.ref == "main"
              and .head.repo.full_name == $repo
            )] | if length == 1 then .[0] else empty end'             <<<"$associated_prs" || true)"
          if [ -z "$source_pr" ]; then
            echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_NOT_SINGLE_MERGED_MAIN_PR'
            exit 0
          fi
          if [ "$(jq -r '.title | startswith("R1 #453:")' <<<"$source_pr")" != 'true' ]; then
            echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_NOT_R1_453_SOURCE'
            exit 0
          fi

          source_pr_number="$(jq -er '.number' <<<"$source_pr")"
          source_pr_body="$(jq -r '.body // ""' <<<"$source_pr")"
          marker="$(jq -Rn --arg body "$source_pr_body" '
            def exact_line($prefix):
              ($body | split("\n") | map(select(startswith($prefix))));
            (exact_line("Recovery-Attempt: ")) as $recoveryAttempt
            | (exact_line("Provider-Attempt: ")) as $providerAttempt
            | (exact_line("Expected-Recovery-Evidence: ")) as $expected
            | (exact_line("Recovery-State: ")) as $state
            | (exact_line("Regression-Test: ")) as $test
            | {
                valid: (
                  $recoveryAttempt == ["Recovery-Attempt: READY"]
                  and $providerAttempt == ["Provider-Attempt: NOT_AUTHORIZED"]
                  and $expected == ["Expected-Recovery-Evidence: EXACT_CURRENT_RUN_CLASSIFICATION"]
                  and $state == ["Recovery-State: STAGING_RESUMABLE"]
                  and $test == ["Regression-Test: tests/tooling/r1-initial-bootstrap-recovery-autocontinue-workflow.test.mjs"]
                ),
                regressionTest: (if ($test | length) == 1 then ($test[0] | sub("^Regression-Test: "; "")) else null end)
              }
          ')"
          if [ "$(jq -r '.valid' <<<"$marker")" != 'true' ]; then
            echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_ATTEMPT_MARKER_INVALID'
            exit 0
          fi

          source_files="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/pulls/$source_pr_number/files?per_page=100")"
          if [ "$(jq 'length' <<<"$source_files")" -ge 100 ]; then
            echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_CHANGESET_UNBOUNDED'
            exit 0
          fi
          regression_test="$(jq -r '.regressionTest' <<<"$marker")"
          if ! jq -e --arg test "$regression_test" '
            any(.filename == ".github/workflows/r1-initial-bootstrap-recovery-autocontinue.yml" and .status != "removed")
            and any(.filename == $test and .status != "removed")
          ' <<<"$source_files" >/dev/null; then
            echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_CONTRACT_EVIDENCE_MISSING'
            exit 0
          fi

          issue_state="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/issues/453" | jq -er '.state')"
          if [ "$issue_state" != 'open' ]; then
            echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_ISSUE_INACTIVE'
            exit 0
          fi

          existing_recovery="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$SOURCE_SHA"             '.workflow_runs | any(.head_sha == $sha)'             <<<"$existing_recovery" >/dev/null; then
            echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_ALREADY_DISPATCHED'
            exit 0
          fi

          for workflow in r1-initial-bootstrap-orchestrator.yml r1-initial-shadow-bootstrap.yml; do
            active="$(curl --fail --silent --show-error               --header "$auth_header"               --header "$accept_header"               "$api/actions/workflows/$workflow/runs?branch=main&per_page=100")"
            if jq -e '.workflow_runs | any(.status == "queued" or .status == "in_progress")'               <<<"$active" >/dev/null; then
              echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_ACTIVE_WRITER'
              exit 0
            fi
          done

          current_sha="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/branches/main" | jq -er '.commit.sha')"
          if [ "$current_sha" != "$SOURCE_SHA" ]; then
            echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_MAIN_MOVED_BEFORE_DISPATCH'
            exit 0
          fi

          curl --fail --silent --show-error             --request POST             --header "$auth_header"             --header "$accept_header"             --header 'Content-Type: application/json'             "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/dispatches"             --data '{"ref":"main"}'
          echo 'R1_BOOTSTRAP_RECOVERY_AUTOCONTINUE_DISPATCHED'
