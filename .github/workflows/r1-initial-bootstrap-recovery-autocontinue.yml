name: R1 initial bootstrap recovery autocontinue

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: r1-initial-bootstrap-recovery-autocontinue
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.repository == 'kmephis-ai/PrihRash'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch guarded exact-main read-only recovery only
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_API_TOKEN}"
          accept_header='Accept: application/vnd.github+json'

          [[ "$SOURCE_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo 'R1_RECOVERY_AUTOCONTINUE_CI_RUN_ID_INVALID'; exit 0;
          }

          main_sha="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/branches/main" | jq -er '.commit.sha')"
          if [ "$main_sha" != "$SOURCE_SHA" ]; then
            echo 'R1_RECOVERY_AUTOCONTINUE_MAIN_MOVED'
            exit 0
          fi

          associated_prs="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/commits/$SOURCE_SHA/pulls")"
          source_pr="$(jq -cer             --arg sha "$SOURCE_SHA"             --arg repo "$GITHUB_REPOSITORY"             '[.[] | select(
              .merged_at != null
              and .merge_commit_sha == $sha
              and .base.ref == "main"
              and .head.repo.full_name == $repo
              and (.title | test("^R1 #[1-9][0-9]*:"))
            )] | if length == 1 then .[0] else empty end'             <<<"$associated_prs" || true)"
          if [ -z "$source_pr" ]; then
            echo 'R1_RECOVERY_AUTOCONTINUE_NOT_SINGLE_R1_PR'
            exit 0
          fi

          source_pr_body="$(jq -r '.body // ""' <<<"$source_pr")"
          marker="$(jq -Rn --arg body "$source_pr_body" '
            def exact_line($prefix):
              ($body | split("\n") | map(select(startswith($prefix))));
            (exact_line("Provider-Attempt: ")) as $attempt
            | (exact_line("Observed-Signature: ")) as $observed
            | (exact_line("Recovery-Probe: ")) as $probe
            | (exact_line("Expected-Transition: ")) as $expected
            | (exact_line("Recovery-State: ")) as $recovery
            | (exact_line("Recovery-Run-ID: ")) as $recovery_run
            | (exact_line("Recovery-Version-Run-ID: ")) as $recovery_version_run
            | (exact_line("Circuit-Rearm: ")) as $rearm
            | (exact_line("Regression-Test: ")) as $test
            | {
                valid: (
                  ((
                    $attempt == ["Provider-Attempt: NOT_AUTHORIZED"]
                    and $probe == ["Recovery-Probe: READY"]
                    and ($observed | length) == 0
                    and ($rearm | length) == 0
                    and (
                      ($expected == ["Expected-Transition: READ_ONLY_DURABLE_CLASSIFICATION"]
                        and $recovery == ["Recovery-State: UNKNOWN_AFTER_NON_SUCCESS"]
                        and ($recovery_run | length) == 0
                        and ($recovery_version_run | length) == 0)
                      or
                      ($expected == ["Expected-Transition: READ_ONLY_EXACT_REVISION_CLASSIFICATION"]
                        and ($recovery | length) == 1
                        and ($recovery_run | length) == 0
                        and ($recovery_version_run | length) == 0
                        and ($recovery[0] | IN(
                          "Recovery-State: EMPTY_DURABLE_STATE",
                          "Recovery-State: RESIDUAL_REFERENCE_STATE_MATCHES_AUTHORITATIVE",
                          "Recovery-State: STAGING_PRESENT_UNCLASSIFIED",
                          "Recovery-State: STAGING_RESUMABLE",
                          "Recovery-State: STAGING_STALE_RETIREABLE",
                          "Recovery-State: STALE_STAGING_RETIRED"
                        )))
                      or (
                        $expected == ["Expected-Transition: READ_ONLY_EXACT_REVISION_CLASSIFICATION"]
                        and $recovery == ["Recovery-State: STAGING_PRESENT_UNCLASSIFIED"]
                        and ($recovery_run | length) == 1
                        and ($recovery_run[0] | test("^Recovery-Run-ID: [1-9][0-9]*$"))
                        and ($recovery_version_run | length) == 1
                        and ($recovery_version_run[0] | test("^Recovery-Version-Run-ID: [1-9][0-9]*$"))
                      )
                      or (
                        $expected == ["Expected-Transition: READ_ONLY_FUNCTION_DEPLOY_CLASSIFICATION"]
                        and $recovery == ["Recovery-State: DEPLOYMENT_OUTCOME_UNCLASSIFIED"]
                        and ($recovery_run | length) == 1
                        and ($recovery_run[0] | test("^Recovery-Run-ID: [1-9][0-9]*$"))
                        and ($recovery_version_run | length) == 0
                      )
                    )
                  ) or (
                    $attempt == ["Provider-Attempt: READY"]
                    and ($probe | length) == 0
                    and $observed == ["Observed-Signature: INITIAL_BOOTSTRAP_RECOVERY_DEPLOY_FAILED"]
                    and $expected == ["Expected-Transition: RECOVERY_ONLY_FUNCTION_VERSION_CREATE_CLASSIFIED"]
                    and $recovery == ["Recovery-State: DEPLOYMENT_OUTCOME_UNCLASSIFIED"]
                    and $rearm == ["Circuit-Rearm: OWNER_AUTHORIZED_SINGLE_RECOVERY_DEPLOY"]
                    and $recovery_run == ["Recovery-Run-ID: 36341844854"]
                    and ($recovery_version_run | length) == 0
                  ))
                  and ($test | length) == 1
                  and ($test[0] | test("^Regression-Test: tests/[A-Za-z0-9_./-]+\\.test\\.mjs$"))
                ),
                surfaceOnly: ($expected == ["Expected-Transition: READ_ONLY_DURABLE_CLASSIFICATION"]
                  and $recovery == ["Recovery-State: UNKNOWN_AFTER_NON_SUCCESS"]),
                functionDeployRecovery: ($expected == ["Expected-Transition: READ_ONLY_FUNCTION_DEPLOY_CLASSIFICATION"]
                  and $recovery == ["Recovery-State: DEPLOYMENT_OUTCOME_UNCLASSIFIED"]
                  and ($recovery_run | length) == 1
                  and ($recovery_run[0] | test("^Recovery-Run-ID: ([1-9][0-9]*)$"))),
                recoveryVersionReuse: ($attempt == ["Provider-Attempt: NOT_AUTHORIZED"]
                  and $probe == ["Recovery-Probe: READY"]
                  and $expected == ["Expected-Transition: READ_ONLY_EXACT_REVISION_CLASSIFICATION"]
                  and $recovery == ["Recovery-State: STAGING_PRESENT_UNCLASSIFIED"]
                  and ($recovery_run | length) == 1
                  and ($recovery_run[0] | test("^Recovery-Run-ID: ([1-9][0-9]*)$"))
                  and ($recovery_version_run | length) == 1
                  and ($recovery_version_run[0] | test("^Recovery-Version-Run-ID: ([1-9][0-9]*)$"))),
                recoveryFunctionDeployAttempt: ($attempt == ["Provider-Attempt: READY"]
                  and $observed == ["Observed-Signature: INITIAL_BOOTSTRAP_RECOVERY_DEPLOY_FAILED"]
                  and $expected == ["Expected-Transition: RECOVERY_ONLY_FUNCTION_VERSION_CREATE_CLASSIFIED"]
                  and $recovery == ["Recovery-State: DEPLOYMENT_OUTCOME_UNCLASSIFIED"]
                  and $rearm == ["Circuit-Rearm: OWNER_AUTHORIZED_SINGLE_RECOVERY_DEPLOY"]
                  and $recovery_run == ["Recovery-Run-ID: 36341844854"]),
                recoveryRunId: (if ($recovery_run | length) == 1
                  and ($recovery_run[0] | test("^Recovery-Run-ID: [1-9][0-9]*$"))
                  then ($recovery_run[0] | sub("^Recovery-Run-ID: "; "")) else null end),
                recoveryVersionRunId: (if ($recovery_version_run | length) == 1
                  and ($recovery_version_run[0] | test("^Recovery-Version-Run-ID: [1-9][0-9]*$"))
                  then ($recovery_version_run[0] | sub("^Recovery-Version-Run-ID: "; "")) else null end),
                regressionTest: (if ($test | length) == 1
                  then ($test[0] | sub("^Regression-Test: "; "")) else null end)
              }
          ')"
          if [ "$(jq -r '.valid' <<<"$marker")" != 'true' ]; then
            echo 'R1_RECOVERY_AUTOCONTINUE_MARKER_INVALID'
            exit 0
          fi
          if [ "$(jq -r '.functionDeployRecovery' <<<"$marker")" = 'true' ]; then
            source_pr_number="$(jq -er '.number | select(type == "number")' <<<"$source_pr")"
            source_files="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/pulls/${source_pr_number}/files?per_page=100")" || {
                echo 'R1_RECOVERY_AUTOCONTINUE_PR_FILES_READ_FAILED'; exit 0;
              }
            if [ "$(jq 'length' <<<"$source_files")" -ge 100 ] || ! jq -e \
              --arg test "$(jq -er '.regressionTest' <<<"$marker")" '
                any(.[]; .filename == $test and .status != "removed")
                and any(.[]; .filename == "docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md" and .status != "removed")
                and (
                  any(.[]; .filename == ".github/workflows/r1-initial-bootstrap-recovery-autocontinue.yml" and .status != "removed")
                  or (
                    any(.[]; .filename == ".github/workflows/r1-initial-bootstrap-recovery-deploy-recovery.yml" and .status != "removed")
                    and any(.[]; .filename == "scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs" and .status != "removed")
                  )
                )
              ' <<<"$source_files" >/dev/null; then
              echo 'R1_RECOVERY_AUTOCONTINUE_DEPLOY_CLASSIFICATION_CHANGESET_INVALID'
              exit 0
            fi

            failed_run_id="$(jq -er '.recoveryRunId' <<<"$marker")"
            failed_recoveries="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&status=failure&per_page=100")" || {
                echo 'R1_RECOVERY_AUTOCONTINUE_DEPLOY_HISTORY_READ_FAILED'; exit 0;
              }
            latest_failed_id="$(jq -er '
              [.workflow_runs[] | select(
                .name == "R1 initial bootstrap recovery"
                and .head_branch == "main"
                and .event == "workflow_dispatch"
                and .conclusion == "failure"
                and (.id | type == "number")
              )] | sort_by(.created_at, .id) | reverse | .[0].id // empty
            ' <<<"$failed_recoveries" 2>/dev/null || true)"
            if [ -z "$latest_failed_id" ] || [ "$failed_run_id" != "$latest_failed_id" ]; then
              echo 'R1_RECOVERY_AUTOCONTINUE_DEPLOY_RUN_NOT_LATEST_FAILED'; exit 0
            fi
            failed_jobs="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/actions/runs/${failed_run_id}/jobs?filter=latest&per_page=100")" || {
                echo 'R1_RECOVERY_AUTOCONTINUE_DEPLOY_RUN_READ_FAILED'; exit 0;
              }
            if ! jq -e '
              [.jobs[] | select(.name == "initial-bootstrap-recovery")] as $jobs
              | ($jobs | length) == 1
              and ([$jobs[0].steps[]? | select(.name == "Deploy recovery-only Function version" and .conclusion == "failure")] | length) == 1
              and ([$jobs[0].steps[]? | select(.name == "Invoke exact read-only recovery tag once" and .conclusion == "skipped")] | length) == 1
            ' <<<"$failed_jobs" >/dev/null; then
              echo 'R1_RECOVERY_AUTOCONTINUE_DEPLOY_RUN_PHASE_NOT_PROVEN'; exit 0
            fi
          fi

          if [ "$(jq -r '.recoveryVersionReuse' <<<"$marker")" = 'true' ]; then
            source_pr_number="$(jq -er '.number | select(type == "number")' <<<"$source_pr")"
            source_files="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/pulls/${source_pr_number}/files?per_page=100")" || {
                echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_PR_FILES_READ_FAILED'; exit 0;
              }
            if [ "$(jq 'length' <<<"$source_files")" -ge 100 ] || ! jq -e \
              --arg test "$(jq -er '.regressionTest' <<<"$marker")" '
                any(.[]; .filename == $test and .status != "removed")
                and any(.[]; .filename == ".github/workflows/r1-initial-bootstrap-recovery.yml" and .status != "removed")
                and any(.[]; .filename == ".github/workflows/r1-initial-bootstrap-recovery-autocontinue.yml" and .status != "removed")
                and any(.[]; .filename == "scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs" and .status != "removed")
                and any(.[]; .filename == "tests/tooling/initial-bootstrap-recovery-deploy-classifier.test.mjs" and .status != "removed")
                and any(.[]; .filename == "tests/tooling/initial-bootstrap-recovery-workflow.test.mjs" and .status != "removed")
                and any(.[]; .filename == "tests/tooling/initial-bootstrap-recovery-deploy-recovery-workflow.test.mjs" and .status != "removed")
                and any(.[]; .filename == "tests/tooling/r1-initial-bootstrap-recovery-autocontinue-workflow.test.mjs" and .status != "removed")
                and any(.[]; .filename == "docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md" and .status != "removed")
                and any(.[]; .filename == "AGENTS.md" and .status != "removed")
                and any(.[]; .filename == "docs/R1_COMPLETION_SPRINT.md" and .status != "removed")
                and all(.[]; .filename | IN(
                  ".github/workflows/r1-initial-bootstrap-recovery.yml",
                  ".github/workflows/r1-initial-bootstrap-recovery-autocontinue.yml",
                  "scripts/classify-yandex-initial-bootstrap-recovery-deploy.mjs",
                  "tests/tooling/initial-bootstrap-recovery-workflow.test.mjs",
                  "tests/tooling/initial-bootstrap-recovery-deploy-recovery-workflow.test.mjs",
                  "tests/tooling/initial-bootstrap-recovery-deploy-classifier.test.mjs",
                  "tests/tooling/r1-initial-bootstrap-recovery-autocontinue-workflow.test.mjs",
                  "docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md",
                  "AGENTS.md",
                  "docs/R1_COMPLETION_SPRINT.md"
                ))
              ' <<<"$source_files" >/dev/null; then
              echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_CHANGESET_INVALID'
              exit 0
            fi
            failed_run_id="$(jq -er '.recoveryRunId' <<<"$marker")"
            source_reuse_run_id="$(jq -er '.recoveryVersionRunId' <<<"$marker")"
            source_failed_run="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/actions/runs/${failed_run_id}")" || {
                echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_FAILED_RUN_READ_FAILED'; exit 0;
              }
            if ! jq -e --argjson id "$failed_run_id" '[. | select(
              .id == $id and .name == "R1 initial bootstrap recovery" and .head_branch == "main"
              and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "failure"
              and (.workflow_id | type == "number")
              and (.created_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
              and (.head_sha | type == "string" and test("^[0-9a-f]{40}$"))
            )] | length == 1' <<<"$source_failed_run" >/dev/null; then
              echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_FAILED_RUN_NOT_EXACT'; exit 0
            fi
            source_workflow_id="$(jq -er '.workflow_id' <<<"$source_failed_run")"
            source_failed_sha="$(jq -er '.head_sha' <<<"$source_failed_run")"
            source_failed_created_at="$(jq -er '.created_at' <<<"$source_failed_run")"
            if [ "$source_failed_sha" = "$SOURCE_SHA" ]; then
              echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_FAILED_RUN_SAME_SHA'; exit 0
            fi
            source_failed_jobs="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/actions/runs/${failed_run_id}/jobs?filter=latest&per_page=100")" || {
                echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_FAILED_JOBS_READ_FAILED'; exit 0
              }
            if ! jq -e --argjson workflow_id "$source_workflow_id" '[.jobs[] | select(.name == "initial-bootstrap-recovery")] as $jobs
              | ($jobs|length)==1
              and $jobs[0].conclusion=="failure"
              and ([$jobs[0].steps[]?|select(.name=="Deploy recovery-only Function version" and .conclusion=="failure")]|length)==1
              and ([$jobs[0].steps[]?|select(.name=="Invoke exact read-only recovery tag once" and .conclusion=="skipped")]|length)==1
            ' <<<"$failed_jobs" >/dev/null; then
              echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_FAILED_PHASE_NOT_PROVEN'; exit 0
            fi
            recovery_history="$(curl --fail --silent --show-error --get \
              --header "$auth_header" --header "$accept_header" \
              "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs" \
              --data-urlencode 'branch=main' --data-urlencode 'event=workflow_dispatch' \
              --data-urlencode "created=${source_failed_created_at}..*" \
              --data-urlencode 'sort=created' --data-urlencode 'direction=desc' \
              --data-urlencode 'per_page=1')" || {
                echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_RECOVERY_HISTORY_READ_FAILED'; exit 0;
              }
            if ! jq -e '.total_count | type == "number" and . >= 1' <<<"$recovery_history" >/dev/null \
              || [ "$(jq '.workflow_runs | length' <<<"$recovery_history")" != '1' ]; then
              echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_RECOVERY_HISTORY_INVALID_OR_INCOMPLETE'; exit 0
            fi
            latest_history_decision="$(jq -r --arg created "$source_failed_created_at" --argjson id "$failed_run_id" '
              .workflow_runs[0] as $latest
              | if ($latest.created_at | type) != "string"
                  or ($latest.created_at | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$") | not)
                  or ($latest.id | type) != "number" then "UNCLASSIFIED"
                elif $latest.created_at > $created or ($latest.created_at == $created and $latest.id > $id)
                then ("NEWER:" + ($latest.id|tostring))
                elif $latest.id == $id and $latest.created_at == $created then "SOURCE_ONLY"
                else "UNCLASSIFIED" end
            ' <<<"$recovery_history")"
            newer_run_id=''
            case "$latest_history_decision" in
              SOURCE_ONLY) ;;
              NEWER:*) newer_run_id="${latest_history_decision#NEWER:}" ;;
              *) echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_RECOVERY_HISTORY_INCOMPLETE'; exit 0 ;;
            esac
            if [ -n "$newer_run_id" ]; then
              newer_run="$(curl --fail --silent --show-error \
                --header "$auth_header" --header "$accept_header" "$api/actions/runs/${newer_run_id}")" || {
                  echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_INTERVENING_RECOVERY_RUN_READ_FAILED'; exit 0
              }
              if ! jq -e --argjson id "$newer_run_id" --argjson workflow_id "$source_workflow_id" \
                --arg current_sha "$SOURCE_SHA" --arg source_sha "$source_failed_sha" \
                --arg source_created "$source_failed_created_at" --argjson source_id "$failed_run_id" '
                .id==$id and .workflow_id==$workflow_id and .name=="R1 initial bootstrap recovery"
                and .head_branch=="main" and .event=="workflow_dispatch"
                and .status=="completed" and .conclusion=="failure"
                and (.created_at|type=="string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
                and (.created_at>$source_created or (.created_at==$source_created and .id>$source_id))
                and .head_sha!=$current_sha and .head_sha!=$source_sha
                and (.head_sha|test("^[0-9a-f]{40}$"))
              ' <<<"$newer_run" >/dev/null; then
                echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_INTERVENING_RECOVERY_RUN_NOT_EXACT'; exit 0
              fi
              newer_jobs="$(curl --fail --silent --show-error \
                --header "$auth_header" --header "$accept_header" \
                "$api/actions/runs/${newer_run_id}/jobs?filter=latest&per_page=100")" || {
                  echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_INTERVENING_RECOVERY_JOBS_READ_FAILED'; exit 0
                }
              if ! jq -e '
                [.jobs[] | select(.name=="initial-bootstrap-recovery" and .conclusion=="failure"
                  and ([.steps[]? | select(.name=="Verify exact accepted recovery Function version for reuse" and .conclusion=="failure")] | length)==1
                  and ([.steps[]? | select(.name=="Deploy recovery-only Function version" and .conclusion=="skipped")] | length)==1
                  and ([.steps[]? | select(.name=="Invoke exact read-only recovery tag once" and .conclusion=="skipped")] | length)==1)]
                | length==1
              ' <<<"$newer_jobs" >/dev/null; then
                echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_INTERVENING_RECOVERY_PHASE_NOT_PROVEN'; exit 0
              fi
            fi
            reuse_attempts="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/actions/workflows/r1-initial-bootstrap-recovery-deploy-attempt.yml/runs?branch=main&event=workflow_dispatch&per_page=100")" || {
                echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_SOURCE_RUN_READ_FAILED'; exit 0;
              }
            if [ "$(jq '.workflow_runs | length' <<<"$reuse_attempts")" -ge 100 ]; then
              echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_SOURCE_HISTORY_INCOMPLETE'; exit 0
            fi
            jq -e --argjson id "$source_reuse_run_id" --arg expected \
              "R1 recovery-only deploy attempt for failed run ${failed_run_id}" '
              [.workflow_runs[] | select(.id==$id and (.workflow_id|type=="number")
                and .head_branch=="main" and .event=="workflow_dispatch"
                and .status=="completed" and .conclusion=="success" and .display_title==$expected)]
              | length==1
            ' <<<"$reuse_attempts" >/dev/null || {
              echo 'R1_RECOVERY_AUTOCONTINUE_REUSE_SOURCE_RUN_NOT_EXACT'; exit 0;
            }
          fi

          if [ "$(jq -r '.recoveryFunctionDeployAttempt' <<<"$marker")" = 'true' ]; then
            failed_run_id="$(jq -er '.recoveryRunId' <<<"$marker")"
            attempts_for_failed_run="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/actions/workflows/r1-initial-bootstrap-recovery-deploy-attempt.yml/runs?branch=main&event=workflow_dispatch&per_page=100")" || {
                echo 'R1_RECOVERY_DEPLOY_ATTEMPT_HISTORY_READ_FAILED'; exit 0;
              }
            if [ "$(jq '.workflow_runs | length' <<<"$attempts_for_failed_run")" -ge 100 ]; then
              echo 'R1_RECOVERY_DEPLOY_ATTEMPT_HISTORY_INCOMPLETE'; exit 0
            fi
            prior_attempts="$(jq -c --arg expected "R1 recovery-only deploy attempt for failed run ${failed_run_id}" '
              [.workflow_runs[] | select(.head_branch == "main" and .event == "workflow_dispatch"
                and .display_title == $expected)]
            ' <<<"$attempts_for_failed_run")"
            prior_attempt_count="$(jq 'length' <<<"$prior_attempts")"
            if [ "$prior_attempt_count" -gt 1 ]; then
              echo 'R1_RECOVERY_DEPLOY_ATTEMPT_HISTORY_AMBIGUOUS'; exit 0
            fi
            if [ "$prior_attempt_count" = '1' ]; then
              prior_attempt_id="$(jq -er '.[0].id | select(type == "number")' <<<"$prior_attempts")"
              prior_attempt_sha="$(jq -er '.[0].head_sha | select(type == "string")' <<<"$prior_attempts")"
              prior_attempt_status="$(jq -er '.[0].status | select(type == "string")' <<<"$prior_attempts")"
              if [ "$prior_attempt_sha" = "$SOURCE_SHA" ]; then
                echo 'R1_RECOVERY_DEPLOY_ATTEMPT_SAME_SHA_REPLAY_FORBIDDEN'; exit 0
              fi
              if [ "$prior_attempt_status" != 'completed' ]; then
                echo 'R1_RECOVERY_DEPLOY_ATTEMPT_ALREADY_ACTIVE_OR_UNCLASSIFIED'; exit 0
              fi
              prior_attempt_jobs="$(curl --fail --silent --show-error \
                --header "$auth_header" --header "$accept_header" \
                "$api/actions/runs/${prior_attempt_id}/jobs?filter=latest&per_page=100")" || {
                  echo 'R1_RECOVERY_DEPLOY_ATTEMPT_PRIOR_PHASE_READ_FAILED'; exit 0;
                }
              if ! jq -e '
                [.jobs[] | select(.name == "deploy-only-attempt")] as $jobs
                | ($jobs | length) == 1
                and ([$jobs[0].steps[]? | select(
                  .name == "Create exactly one read-only recovery Function version without invoking it"
                  and .conclusion == "skipped"
                )] | length) == 1
              ' <<<"$prior_attempt_jobs" >/dev/null; then
                echo 'R1_RECOVERY_DEPLOY_ATTEMPT_ALREADY_CONSUMED_OR_UNCLASSIFIED'; exit 0
              fi
            fi
            source_pr_number="$(jq -er '.number | select(type == "number")' <<<"$source_pr")"
            source_files="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/pulls/${source_pr_number}/files?per_page=100")" || {
                echo 'R1_RECOVERY_DEPLOY_ATTEMPT_PR_FILES_READ_FAILED'; exit 0;
              }
            if [ "$(jq 'length' <<<"$source_files")" -ge 100 ] || ! jq -e '
              any(.[]; .filename == ".github/workflows/r1-initial-bootstrap-recovery-deploy-attempt.yml" and .status != "removed")
              and any(.[]; .filename == ".github/workflows/r1-initial-bootstrap-recovery-autocontinue.yml" and .status != "removed")
              and any(.[]; .filename == "scripts/classify-yandex-initial-bootstrap-recovery-deploy-attempt.mjs" and .status != "removed")
              and any(.[]; .filename == "tests/tooling/initial-bootstrap-recovery-deploy-attempt-workflow.test.mjs" and .status != "removed")
              and any(.[]; .filename == "tests/tooling/initial-bootstrap-recovery-deploy-attempt-classifier.test.mjs" and .status != "removed")
                and any(.[]; .filename == "tests/tooling/r1-initial-bootstrap-recovery-autocontinue-workflow.test.mjs" and .status != "removed")
                and any(.[]; .filename == "docs/R1_INITIAL_SHADOW_BOOTSTRAP_RUNBOOK.md" and .status != "removed")
                and any(.[]; .filename == "AGENTS.md" and .status != "removed")
                and any(.[]; .filename == "docs/R1_COMPLETION_SPRINT.md" and .status != "removed")
                and all(.[]; (.filename | startswith("src/")) | not)
                and all(.[]; (.filename | IN(
                  "package.json",
                  "package-lock.json",
                  "tsconfig.json",
                  "tsconfig.build.json",
                  "scripts/package-yandex-initial-bootstrap-recovery-function.mjs",
                  "scripts/verify-yandex-initial-bootstrap-recovery-package.mjs"
                )) | not)
            ' <<<"$source_files" >/dev/null; then
              echo 'R1_RECOVERY_DEPLOY_ATTEMPT_CHANGESET_INVALID'
              exit 0
            fi

            failed_recoveries="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/runs?branch=main&event=workflow_dispatch&status=failure&per_page=100")" || {
                echo 'R1_RECOVERY_DEPLOY_ATTEMPT_HISTORY_READ_FAILED'; exit 0;
              }
            latest_failed_id="$(jq -er '
              [.workflow_runs[] | select(.name == "R1 initial bootstrap recovery" and .head_branch == "main"
                and .event == "workflow_dispatch" and .conclusion == "failure" and (.id | type == "number"))]
              | sort_by(.created_at,.id) | reverse | .[0].id // empty
            ' <<<"$failed_recoveries" 2>/dev/null || true)"
            if [ -z "$latest_failed_id" ] || [ "$failed_run_id" != "$latest_failed_id" ]; then
              echo 'R1_RECOVERY_DEPLOY_ATTEMPT_RUN_NOT_LATEST_FAILED'; exit 0
            fi
            failed_jobs="$(curl --fail --silent --show-error \
              --header "$auth_header" --header "$accept_header" \
              "$api/actions/runs/${failed_run_id}/jobs?filter=latest&per_page=100")" || {
                echo 'R1_RECOVERY_DEPLOY_ATTEMPT_RUN_READ_FAILED'; exit 0;
              }
            if ! jq -e '
              [.jobs[] | select(.name == "initial-bootstrap-recovery")] as $jobs
              | ($jobs | length) == 1
              and ([$jobs[0].steps[]? | select(.name == "Deploy recovery-only Function version" and .conclusion == "failure")] | length) == 1
              and ([$jobs[0].steps[]? | select(.name == "Invoke exact read-only recovery tag once" and .conclusion == "skipped")] | length) == 1
            ' <<<"$failed_jobs" >/dev/null; then
              echo 'R1_RECOVERY_DEPLOY_ATTEMPT_PHASE_NOT_PROVEN'; exit 0
            fi
          fi

          tracking_issue_number="$(jq -er '.title | capture("^R1 #(?<number>[1-9][0-9]*):").number' <<<"$source_pr")"
          issue_state="$(curl --fail --silent --show-error \
            --header "$auth_header" --header "$accept_header" \
            "$api/issues/${tracking_issue_number}" | jq -er '.state')"
          if [ "$issue_state" != 'open' ]; then
            echo 'R1_RECOVERY_AUTOCONTINUE_ISSUE_INACTIVE'
            exit 0
          fi

          writer_active='false'
          for workflow in r1-initial-bootstrap-orchestrator.yml r1-initial-shadow-bootstrap.yml r1-initial-bootstrap-recovery.yml r1-initial-bootstrap-recovery-deploy-recovery.yml r1-initial-bootstrap-recovery-deploy-attempt.yml; do
            writer_runs="$(curl --fail --silent --show-error               --header "$auth_header"               --header "$accept_header"               "$api/actions/workflows/$workflow/runs?branch=main&per_page=100")"
            if jq -e --arg sha "$SOURCE_SHA" '
              .workflow_runs | any(
                .head_sha == $sha
                and (.status == "queued" or .status == "in_progress")
              )
            ' <<<"$writer_runs" >/dev/null; then
              writer_active='true'
              break
            fi
          done
          if [ "$writer_active" = 'true' ]; then
            echo 'R1_RECOVERY_AUTOCONTINUE_WRITER_ACTIVE'
            exit 0
          fi

          recovery_workflow='r1-initial-bootstrap-recovery.yml'
          if [ "$(jq -r '.functionDeployRecovery' <<<"$marker")" = 'true' ]; then
            recovery_workflow='r1-initial-bootstrap-recovery-deploy-recovery.yml'
          elif [ "$(jq -r '.recoveryFunctionDeployAttempt' <<<"$marker")" = 'true' ]; then
            recovery_workflow='r1-initial-bootstrap-recovery-deploy-attempt.yml'
          fi
          existing="$(curl --fail --silent --show-error             --header "$auth_header"             --header "$accept_header"             "$api/actions/workflows/$recovery_workflow/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$SOURCE_SHA" '
            .workflow_runs | any(.head_sha == $sha)
          ' <<<"$existing" >/dev/null; then
            echo 'R1_RECOVERY_AUTOCONTINUE_ALREADY_DISPATCHED'
            exit 0
          fi

          dispatch_payload='{"ref":"main"}'
          if [ "$(jq -r '.surfaceOnly' <<<"$marker")" = 'true' ]; then
            dispatch_payload='{"ref":"main","inputs":{"surface_only":"true"}}'
          elif [ "$(jq -r '.functionDeployRecovery' <<<"$marker")" = 'true' ]; then
            failed_run_id="$(jq -er '.recoveryRunId' <<<"$marker")"
            dispatch_payload="$(jq -cn --arg run_id "$failed_run_id" --arg ci_run_id "$SOURCE_CI_RUN_ID" \
              '{ref:"main",inputs:{failed_run_id:$run_id,ci_run_id:$ci_run_id}}')"
          elif [ "$(jq -r '.recoveryFunctionDeployAttempt' <<<"$marker")" = 'true' ]; then
            failed_run_id="$(jq -er '.recoveryRunId' <<<"$marker")"
            source_pr_number="$(jq -er '.number | select(type == "number")' <<<"$source_pr")"
            dispatch_payload="$(jq -cn --arg run_id "$failed_run_id" --arg ci_run_id "$SOURCE_CI_RUN_ID" --arg pr_number "$source_pr_number" \
              '{ref:"main",inputs:{failed_run_id:$run_id,ci_run_id:$ci_run_id,source_pr_number:$pr_number}}')"
          elif [ "$(jq -r '.recoveryVersionReuse' <<<"$marker")" = 'true' ]; then
            failed_run_id="$(jq -er '.recoveryRunId' <<<"$marker")"
            reuse_run_id="$(jq -er '.recoveryVersionRunId' <<<"$marker")"
            source_pr_number="$(jq -er '.number | select(type == "number")' <<<"$source_pr")"
            dispatch_payload="$(jq -cn --arg failed_run_id "$failed_run_id" --arg reuse_run_id "$reuse_run_id" --arg pr_number "$source_pr_number" \
              '{ref:"main",inputs:{reuse_deploy_attempt_run_id:$reuse_run_id,reuse_failed_recovery_run_id:$failed_run_id,reuse_source_pr_number:$pr_number}}')"
          fi
          curl --fail --silent --show-error             --request POST             --header "$auth_header"             --header "$accept_header"             --header 'X-GitHub-Api-Version: 2022-11-28'             "$api/actions/workflows/$recovery_workflow/dispatches"             --data "$dispatch_payload"
          echo 'R1_RECOVERY_AUTOCONTINUE_DISPATCHED'
