name: R1 630 88a58d2 readiness dispatch

on:
  push:
    branches:
      - transport/r1-630-88a58d2-readiness

permissions:
  actions: write
  contents: read
  issues: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch fresh exact-main readiness
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 88a58d21c356f09a0beb421152c86ba8886981cf
          RECOVERY_RUN_ID: '35491486738'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GH_API_TOKEN}"
          accept='Accept: application/vnd.github+json'
          main="$(curl --fail --silent --show-error -H "$auth" -H "$accept" "$api/branches/main")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha==$sha and .protected==true' <<<"$main" >/dev/null
          recovery="$(curl --fail --silent --show-error -H "$auth" -H "$accept" "$api/actions/runs/$RECOVERY_RUN_ID")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.head_sha==$sha and .head_branch=="main" and .name=="R1 initial bootstrap recovery" and .event=="workflow_dispatch" and .status=="completed" and .conclusion=="success"' <<<"$recovery" >/dev/null
          all="$(curl --fail --silent --show-error -H "$auth" -H "$accept" "$api/actions/runs?per_page=100")"
          if jq -e '.workflow_runs|any((.status=="queued" or .status=="in_progress") and (.name=="R1 initial shadow bootstrap" or .name=="R1 initial bootstrap orchestrator" or .name=="R1 initial controlled rebuild"))' <<<"$all" >/dev/null; then
            echo R1_630_READINESS_WRITER_ACTIVE
            exit 1
          fi
          curl --fail --silent --show-error -X POST -H "$auth" -H "$accept" -H 'X-GitHub-Api-Version: 2022-11-28' "$api/actions/workflows/r1-yandex-readiness.yml/dispatches" --data '{"ref":"main"}'
          echo R1_630_READINESS_DISPATCHED
