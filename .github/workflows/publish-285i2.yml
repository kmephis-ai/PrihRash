name: Publish TEST_PRIVATE tri-state script only

on:
  push:
    branches:
      - transport/publish-285i2

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish exact script patch
        shell: bash
        run: |
          set -euo pipefail
          target='fix/r1-test-private-reuse-tri-state-fixture'
          expected_base='e784dad63f559d17582b43ef5abab3fb545922fb'
          expected_script_blob='75f8188e6cb3d5b631fec9b62175f2c0bb320b8f'
          git fetch origin "$target"
          git checkout -B publish-target "origin/$target"
          test "$(git rev-parse HEAD)" = "$expected_base"
          printf '%s' '' | base64 -d | gzip -d > /tmp/285i-script.patch
          git apply --check /tmp/285i-script.patch
          git apply /tmp/285i-script.patch
          test "$(git hash-object scripts/test-private-controlled-rebuild-smoke.mjs)" = "$expected_script_blob"
          git diff --check
          git config user.name 'kmephis-ai'
          git config user.email 'kmephis@gmail.com'
          git add scripts/test-private-controlled-rebuild-smoke.mjs
          git commit -m 'R1: reuse TEST_PRIVATE tri-state fixture'
          git push origin HEAD:"$target"
