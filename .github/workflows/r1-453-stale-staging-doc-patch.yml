name: R1 453 stale STAGING contract doc patch

# Stage-specific branch-only writer. It self-retires together with its exact section file
# in the same commit that updates the canonical migration contract.
on:
  push:
    branches:
      - r1-453-stale-staging-retirement-contract
    paths:
      - .github/workflows/r1-453-stale-staging-doc-patch.yml

permissions:
  contents: write

jobs:
  patch-doc:
    if: github.repository == 'kmephis-ai/PrihRash'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Apply exact canonical contract insertion and retire temporary writer
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/r1-453-stale-staging-retirement-contract'
          test "$(git hash-object docs/MIGRATION_CONTRACT.md)" = '5c65bddb6489c761425d3890cfe72581b8aeb6f4'
          test "$(git hash-object .github/r1-453-stale-staging-contract-section.md)" = 'aef45c5de06bb509466559855aac85ec401fa2a2'
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/MIGRATION_CONTRACT.md')
          section_path = Path('.github/r1-453-stale-staging-contract-section.md')
          text = path.read_text()
          section = section_path.read_text()
          marker = '### Controlled rebuild scheme outcome recovery\n'
          if text.count(marker) != 1:
              raise SystemExit('R1_STALE_STAGING_DOC_MARKER_INVALID')
          if section.splitlines()[0] in text:
              raise SystemExit('R1_STALE_STAGING_DOC_ALREADY_PATCHED')
          path.write_text(text.replace(marker, section + marker, 1))
          PY
          actual="$(git hash-object docs/MIGRATION_CONTRACT.md)"
          echo "R1_DOC_PATCHED_HASH=${actual}"
          test "$actual" = 'e77f8c4a64fcde2b21056c008844f8fd38ba1b0c'
          git rm .github/workflows/r1-453-stale-staging-doc-patch.yml
          git rm .github/r1-453-stale-staging-contract-section.md
          git add docs/MIGRATION_CONTRACT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R1 #453: закрепить stale STAGING retirement contract'
          git push origin HEAD:r1-453-stale-staging-retirement-contract
