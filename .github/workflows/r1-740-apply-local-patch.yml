name: R1 740 Apply Local Patch

on:
  push:
    branches:
      - agent/r1-740-redundant-snapshot-read

permissions:
  contents: write

env:
  SOURCE_SHA: 3f464b5e2da62553cecfc501316c9f386c3dae55

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source and apply exact local diff
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          git diff --quiet "$SOURCE_SHA" -- . ':(exclude).github/workflows/r1-740-apply-local-patch.yml'
          cat > /tmp/r1-740.patch.gz.b64 <<'B64'

B64
          base64 -d /tmp/r1-740.patch.gz.b64 | gzip -d > /tmp/r1-740.patch
          git apply --check /tmp/r1-740.patch
          git apply /tmp/r1-740.patch
          rm .github/workflows/r1-740-apply-local-patch.yml
          git diff --check
          git config user.name "OpenAI PrihRash Agent"
          git config user.email "openai-agent@users.noreply.github.com"
          git add -A
          git commit -m "R1 #740: collapse redundant resume snapshot read"
          git push origin "HEAD:agent/r1-740-redundant-snapshot-read"
