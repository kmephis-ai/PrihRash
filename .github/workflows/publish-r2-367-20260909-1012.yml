name: Publish R2

on:
  push:
    branches:
      - transport/r2-publish-367-20260909-1012

permissions:
  contents: write

env:
  EXPECTED_BASE: 5747bf9f07a1e464842f314e14c9a9fbb221f562
  EXPECTED_TREE: a0f2ff943dfcc54b0a513c45a9ee02b17124f452
  PRODUCT_BRANCH: r2/367-filter-layout
  PATCH_SHA256: bf8d08bde79cf1959366ab1c2e6c24bb5f7a1c5588cb938421cce681e9d037c9
  GZIP_SHA256: 74bc08136f209e90b8094a1d26147c3fa433e5f0855c100cb8d16edf99aeed37

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Verify base and publish exact tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "${EXPECTED_BASE}"
          git checkout --detach --quiet "${EXPECTED_BASE}"

          cat > /tmp/feature.patch.gz.b64 <<'PAYLOAD'
          
PAYLOAD
          base64 -d /tmp/feature.patch.gz.b64 > /tmp/feature.patch.gz
          test "$(sha256sum /tmp/feature.patch.gz | awk '{print $1}')" = "${GZIP_SHA256}"
          gunzip -c /tmp/feature.patch.gz > /tmp/feature.patch
          test "$(sha256sum /tmp/feature.patch | awk '{print $1}')" = "${PATCH_SHA256}"

          git apply --index /tmp/feature.patch
          git diff --cached --check
          test "$(git write-tree)" = "${EXPECTED_TREE}"

          git config user.name 'PrihRash AI'
          git config user.email 'ai@localhost'
          git commit -m 'R2: keep Reader filters readable on tablet widths' -m 'Closes #367.'
          test "$(git rev-parse HEAD^{tree})" = "${EXPECTED_TREE}"
          git push origin "HEAD:refs/heads/${PRODUCT_BRANCH}"
