name: Apply Migration Contract v2 Transform

on:
  push:
    branches:
      - r1/raw-payload-v2-decoder

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
      - name: Apply deterministic normative transform and remove transport files
        shell: bash
        run: |
          set -euo pipefail
          python tools/tmp_migration_contract_v2_transform.py
          rm tools/tmp_migration_contract_v2_transform.py
          rm tools/tmp-migration-contract-v2.patch
          rm .github/workflows/tmp-apply-migration-contract-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MIGRATION_CONTRACT.md tools/tmp_migration_contract_v2_transform.py tools/tmp-migration-contract-v2.patch .github/workflows/tmp-apply-migration-contract-v2.yml
          git diff --cached --check
          git commit -m "docs(r1): define raw payload v2 decoder contract (#49)"
          git push origin HEAD:r1/raw-payload-v2-decoder
