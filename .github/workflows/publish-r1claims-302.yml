name: Publish R1 claims patch

on:
  push:
    branches:
      - agent/transport-publish-r1claims-302-20260908a

permissions:
  contents: write

env:
  BASE_SHA: 8f66906ebc5a219bfd066b966d1ac60cc41fdd42
  TARGET_BRANCH: agent/r1-wif-claims-302
  PATCH_B64: 

jobs:
  publish:
    if: github.repository == 'kmephis-ai/PrihRash'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Apply exact local patch and publish target branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${BASE_SHA}^{commit}")" = "$BASE_SHA"
          remote_target="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_target" = "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          printf '%s' "$PATCH_B64" | base64 --decode | gzip -d > /tmp/r1claims.patch
          git apply --check /tmp/r1claims.patch
          git apply /tmp/r1claims.patch
          node --test tests/tooling/r1-yandex-readiness-workflow.test.mjs
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r1-yandex-readiness.yml docs/R1_YANDEX_READINESS_RUNBOOK.md tests/tooling/r1-yandex-readiness-workflow.test.mjs
          git commit -m 'R1 #302: локализовать WIF claim и OAuth отказ'
          git push origin HEAD:"refs/heads/${TARGET_BRANCH}"
