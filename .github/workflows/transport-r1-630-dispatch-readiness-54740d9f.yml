name: R1 630 Dispatch Recovery 54740d9f

on:
  push:
    branches:
      - transport/r1-630-dispatch-readiness-54740d9f

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch exact-main recovery
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 54740d9ff0acdd3b3e010be1e1eafe4b679c06bf
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GH_TOKEN}"
          accept="Accept: application/vnd.github+json"
          current="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/commits/main" | jq -er '.sha')"
          test "$current" = "$EXPECTED_MAIN_SHA"
          active="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/runs?branch=main&status=in_progress&per_page=100" | jq '[.workflow_runs[] | select(.name | test("^R1 "))] | length')"
          test "$active" = "0"
          curl --fail --silent --show-error --request POST             --header "$auth" --header "$accept" --header 'X-GitHub-Api-Version: 2022-11-28'             "$api/actions/workflows/r1-initial-bootstrap-recovery.yml/dispatches"             --data '{"ref":"main","inputs":{"surface_only":"false"}}'
          echo R1_630_RECOVERY_DISPATCHED
