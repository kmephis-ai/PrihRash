name: Publish R2 #357

on:
  push:
    branches:
      - transport/r2-publish-357-20260909-0823

permissions:
  contents: write

env:
  SOURCE_SHA: 01ec978eb08b770c730ea9b0e6fb2023833662c1
  EXPECTED_TREE: 08f645863faab72ec050c4be4c953092978903d6
  TARGET_BRANCH: r2/357-honest-reader-header

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Verify base and publish exact tree
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "${REMOTE_MAIN}" = "${SOURCE_SHA}"
          git checkout --detach "${SOURCE_SHA}"
          printf '%s' '' | base64 -d | gzip -d > /tmp/r2.patch
          git apply --check /tmp/r2.patch
          git apply /tmp/r2.patch
          git add -A
          ACTUAL_TREE="$(git write-tree)"
          test "${ACTUAL_TREE}" = "${EXPECTED_TREE}"
          git config user.name kmephis-ai
          git config user.email kmephis@gmail.com
          git commit -m 'R2: honest read-only Reader header' -m 'Closes #357.'
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
