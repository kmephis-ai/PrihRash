name: R1 630 acb40fb controlled dispatch

on:
  push:
    branches:
      - transport/r1-630-acb40fb-controlled

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch second and final automatic root-cause attempt
        shell: bash
        env:
          GH_API_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: acb40fb81befc548939f72146df729d27d591cbe
          RECOVERY_RUN_ID: '35469248064'
          READINESS_RUN_ID: '35469493736'
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: Bearer ${GH_API_TOKEN}"
          accept='Accept: application/vnd.github+json'

          main="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/branches/main")"
          jq -e --arg sha "$EXPECTED_MAIN_SHA" '.commit.sha == $sha and .protected == true' <<<"$main" >/dev/null

          issue="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/issues/630")"
          jq -e '
            .state == "open"
            and (.title | startswith("R1 WU7:"))
            and (.body | contains("Provider-Authority: WU7_CONTROLLED_REBUILD"))
            and (.body | contains("Authority-Scope: PRODUCTION_YDB_INITIAL_SHADOW_ONLY"))
            and (.body | contains("Google-Authority: PRESERVED"))
            and (.body | contains("Cap-Increase: FORBIDDEN"))
            and (.body | contains("Timer-Cutover: FORBIDDEN"))
            and (.body | contains("Blind-Replay: FORBIDDEN"))
          ' <<<"$issue" >/dev/null

          pr="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/pulls/660")"
          jq -e '
            .state == "closed"
            and .merged == true
            and (.body | contains("Provider-Attempt: READY"))
            and (.body | contains("Observed-Signature: INITIAL_CONTROLLED_REBUILD_INVOKE_FAILED/VALIDATED_CURRENT_EMPTY_STAGING_EMPTY"))
            and (.body | contains("Expected-Transition: INITIAL_CONTROLLED_REBUILD_COMMITTED"))
            and (.body | contains("Recovery-State: STAGING_RESUMABLE"))
            and (.body | contains("Circuit-Rearm: ROOT_CAUSE_FIX"))
            and (.body | contains("Regression-Test: tests/migration-simulation/initial-controlled-rebuild-staging-executor.test.mjs"))
          ' <<<"$pr" >/dev/null

          for tuple in "$RECOVERY_RUN_ID:R1 initial bootstrap recovery" "$READINESS_RUN_ID:R1 Yandex readiness"; do
            IFS=: read -r run_id expected_name <<<"$tuple"
            run="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/runs/$run_id")"
            jq -e --arg sha "$EXPECTED_MAIN_SHA" --arg name "$expected_name" '
              .head_sha == $sha
              and .head_branch == "main"
              and .event == "workflow_dispatch"
              and .status == "completed"
              and .conclusion == "success"
              and .name == $name
            ' <<<"$run" >/dev/null
          done

          all="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/runs?per_page=100")"
          if jq -e '
            .workflow_runs | any(
              (.status == "queued" or .status == "in_progress")
              and (.name == "R1 initial shadow bootstrap"
                   or .name == "R1 initial bootstrap orchestrator"
                   or .name == "R1 initial controlled rebuild")
            )
          ' <<<"$all" >/dev/null; then
            echo 'R1_630_CONTROLLED_WRITER_ACTIVE'
            exit 1
          fi

          existing="$(curl --fail --silent --show-error --header "$auth" --header "$accept" "$api/actions/runs?branch=main&event=workflow_dispatch&per_page=100")"
          if jq -e --arg sha "$EXPECTED_MAIN_SHA" '
            .workflow_runs | any(.head_sha == $sha and .name == "R1 initial controlled rebuild")
          ' <<<"$existing" >/dev/null; then
            echo 'R1_630_CONTROLLED_ALREADY_DISPATCHED'
            exit 0
          fi

          payload="$(jq -cn             --arg issue '630'             --arg sha "$EXPECTED_MAIN_SHA"             --arg recovery "$RECOVERY_RUN_ID"             --arg readiness "$READINESS_RUN_ID"             '{ref:"main",inputs:{tracking_issue:$issue,expected_main_sha:$sha,recovery_run_id:$recovery,readiness_run_id:$readiness}}')"

          curl --fail --silent --show-error --request POST             --header "$auth"             --header "$accept"             --header 'X-GitHub-Api-Version: 2022-11-28'             --header 'Content-Type: application/json'             "$api/actions/workflows/r1-initial-controlled-rebuild.yml/dispatches"             --data "$payload"

          echo 'R1_630_CONTROLLED_SECOND_ATTEMPT_DISPATCHED'
